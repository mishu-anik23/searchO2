<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>searchO2 Learning Hub</title>
<meta name="description" content="Learn how searchO2 works: buildings, plants, concepts, how-to guides, help and feedback.">
<link rel="icon" type="image/svg+xml" href="../public/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/" aria-label="searchO2 Learning Hub, home">
      <span class="brand-mark" aria-hidden="true">🌿</span>
      <span>searchO2<small>Learning Hub</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Hub sections"></nav>
    <div class="go-wrap">
      <a class="go" id="goBtn" href="../index.html"></a>
      <button class="go-change" id="goChange" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="picker" title="Change map">▾<span class="sr-only"> Change map</span></button>
      <div class="picker" id="picker" role="menu" aria-label="Choose your map" hidden></div>
    </div>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<div class="drawer" id="drawer" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="x" type="button" data-close aria-label="Close">✕</button>
    <div id="drawerBody"></div>
  </div>
</div>

<footer>
  searchO2 is an educational simulation for ages 8 and up. No loot boxes, no open chat.
  <a href="../index.html">Back to the game</a>
</footer>

<script src="data/content.js"></script>
<script src="hub.js"></script>
</body>
</html>
