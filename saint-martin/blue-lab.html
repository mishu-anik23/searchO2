<style>
:root{
  --navy:#0A1926;--deep:#050F17;--teal:#00E5FF;--cyan:#00B0FF;--emerald:#00E676;--lime:#76FF03;
  --amber:#FFB300;--gold:#FFD54F;--coral:#FF5252;--pink:#FF4081;--sand:#F4EBD9;--card-bg:rgba(10,25,38,0.92);
  --border-cyan:rgba(0,229,255,0.35);--border-emerald:rgba(0,230,118,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--deep);font-family:'Nunito',sans-serif;color:#E0F7FA}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#island-zone,#outer-zone,#dive-zone{position:absolute;top:0;left:0;width:100%;height:100%}
#outer-zone,#dive-zone{display:none}

/* HUD Overlay */
.hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* Top Scoreboard */
.scoreboard{
  position:absolute;top:14px;left:18px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:auto;max-width:calc(100% - 340px);
}
.sb-chip{
  background:rgba(10,25,38,0.88);backdrop-filter:blur(8px);border:1px solid var(--border-cyan);
  border-radius:18px;padding:5px 11px;font-size:0.75rem;font-weight:800;display:flex;align-items:center;gap:5px;
  color:#ECEFF1;box-shadow:0 3px 10px rgba(0,0,0,0.45);cursor:pointer;transition:transform 0.15s,border-color 0.15s;
}
.sb-chip:hover{transform:translateY(-1.5px);border-color:var(--teal)}
.sb-chip .v{color:var(--teal);font-family:'JetBrains Mono',monospace;font-weight:800}
.sb-chip.shi .v{color:var(--emerald)}
.sb-chip.do .v{color:#40C4FF}
.sb-chip.power .v{color:var(--gold)}
.sb-chip.xp .v{color:#E040FB}

/* Top Corner Navigation */
.corner-nav{position:absolute;top:14px;right:18px;display:flex;gap:7px;pointer-events:auto;z-index:20}
.chip-btn{
  background:rgba(10,25,38,0.92);backdrop-filter:blur(8px);border:1.2px solid var(--teal);color:#FFFFFF;
  border-radius:20px;padding:6px 13px;font-size:0.78rem;font-weight:800;display:flex;align-items:center;gap:6px;
  cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(0,229,255,0.25);transition:all 0.15s ease;
}
.chip-btn:hover{transform:scale(1.05);background:rgba(0,229,255,0.18);box-shadow:0 6px 18px rgba(0,229,255,0.4)}
.chip-btn.green{border-color:var(--emerald);box-shadow:0 4px 14px rgba(0,230,118,0.25)}
.chip-btn.green:hover{background:rgba(0,230,118,0.2)}
.chip-btn.gold{border-color:var(--gold);box-shadow:0 4px 14px rgba(255,213,79,0.25)}
.chip-btn.gold:hover{background:rgba(255,213,79,0.2)}
.chip-btn.pink{border-color:var(--pink);box-shadow:0 4px 14px rgba(255,64,129,0.25)}
.chip-btn.pink:hover{background:rgba(255,64,129,0.2)}

/* Task Capsule */
.task-capsule{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);pointer-events:auto;
  background:rgba(10,25,38,0.94);backdrop-filter:blur(10px);border:1.5px solid var(--teal);
  border-radius:28px;padding:8px 20px;display:flex;align-items:center;gap:12px;
  box-shadow:0 6px 24px rgba(0,229,255,0.3);cursor:pointer;transition:transform 0.15s;
}
.task-capsule:hover{transform:translateX(-50%) scale(1.02)}
.task-capsule .pulse{width:10px;height:10px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald);animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%{transform:scale(0.9);opacity:0.7}50%{transform:scale(1.3);opacity:1}100%{transform:scale(0.9);opacity:0.7}}
.task-capsule .txt{font-size:0.84rem;font-weight:700;color:#ECEFF1}
.task-capsule .txt b{color:var(--teal)}
.task-capsule .roadmap-btn{background:none;border:none;color:var(--gold);font-size:1.1rem;cursor:pointer;padding-left:4px}

/* Floating Drawer Menu */
.float-menu{
  position:absolute;top:62px;right:18px;width:320px;background:rgba(8,20,32,0.96);backdrop-filter:blur(12px);
  border:1.5px solid var(--border-cyan);border-radius:16px;padding:14px;pointer-events:auto;display:none;
  box-shadow:0 12px 36px rgba(0,0,0,0.7);z-index:25;max-height:82vh;overflow-y:auto;
}
.float-menu.open{display:block}
.menu-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,229,255,0.2)}
.menu-title span{font-size:0.95rem;font-weight:900;color:var(--teal)}

/* Modal Dialogs */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,10,18,0.75);backdrop-filter:blur(6px);
  display:none;justify-content:center;align-items:center;z-index:100;pointer-events:auto;
}
.modal-overlay.open{display:flex}
.modal-card{
  background:rgba(10,25,40,0.97);border:1.6px solid var(--teal);border-radius:18px;padding:22px;
  width:92%;max-width:540px;max-height:88vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,0.85);color:#E0F7FA;
}
.modal-card.wide{max-width:820px}
.modal-card.large{max-width:960px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1.5px solid var(--border-cyan)}
.modal-hdr h3{font-size:1.15rem;font-weight:900;color:var(--teal);display:flex;align-items:center;gap:8px}
.btn-close{background:none;border:none;color:#90A4AE;font-size:1.3rem;cursor:pointer;line-height:1;transition:color 0.15s}
.btn-close:hover{color:#FFFFFF}

/* Buttons & Badges */
.btn{
  border:none;border-radius:10px;padding:9px 15px;font-size:0.82rem;font-weight:800;cursor:pointer;
  transition:all 0.15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{transform:translateY(-1.5px);filter:brightness(1.15)}
.btn-p{background:#0288D1;color:#FFF}
.btn-c{background:#00B0FF;color:#001E3C}
.btn-e{background:var(--emerald);color:#003314}
.btn-gold{background:var(--gold);color:#332200}
.btn-pink{background:var(--pink);color:#3E0018}
.btn-b{background:#263238;color:#ECEFF1;border:1px solid #455A64}
.btn-g{background:#37474F;color:#CFD8DC}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}

.card-box{
  background:rgba(15,35,55,0.7);border:1px solid rgba(0,229,255,0.2);border-radius:12px;padding:12px;margin:8px 0;
}
.card-box.marine{border-color:rgba(0,229,255,0.4);background:rgba(0,40,70,0.5)}
.card-box.alert{border-color:rgba(255,179,0,0.4);background:rgba(50,35,10,0.5)}
.card-box.pink{border-color:rgba(255,64,129,0.4);background:rgba(50,10,30,0.5)}
.card-box.green{border-color:rgba(0,230,118,0.4);background:rgba(10,50,25,0.5)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* Encyclopedia Tabs & Search */
.enc-tab-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.enc-tab{
  padding:7px 14px;border-radius:10px;font-size:0.78rem;font-weight:800;cursor:pointer;
  background:rgba(15,35,55,0.8);border:1px solid rgba(0,229,255,0.25);color:#B0BEC5;transition:all 0.15s;white-space:nowrap;
}
.enc-tab.active{background:var(--teal);color:#001E3C;border-color:var(--teal);box-shadow:0 0 12px rgba(0,229,255,0.4)}
.enc-search{
  width:100%;background:rgba(5,15,25,0.85);border:1.2px solid var(--border-cyan);border-radius:10px;
  padding:9px 14px;color:#FFF;font-size:0.85rem;margin-bottom:14px;font-family:'Nunito',sans-serif;outline:none;
}
.enc-search:focus{border-color:var(--teal);box-shadow:0 0 10px rgba(0,229,255,0.3)}

/* Toast */
.toast{
  position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,25,40,0.96);
  border:1.5px solid var(--teal);border-radius:12px;padding:9px 18px;font-size:0.84rem;font-weight:700;color:#FFF;
  box-shadow:0 8px 24px rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:all 0.25s ease;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Boat arrival animation scene */
#boat-tour{position:absolute;top:0;left:0;width:100%;height:100%;background:#021019;z-index:50;display:block}
.tour-overlay{
  position:absolute;bottom:35px;left:50%;transform:translateX(-50%);text-align:center;
  background:rgba(8,20,32,0.92);border:1.5px solid var(--teal);border-radius:16px;padding:16px 28px;
  box-shadow:0 8px 32px rgba(0,0,0,0.7);max-width:680px;width:90%;
}
.tour-overlay h2{font-size:1.4rem;font-weight:900;color:var(--teal);margin-bottom:6px}
.tour-overlay p{font-size:0.85rem;color:#B0BEC5;line-height:1.4;margin-bottom:12px}
</style>
</head>

window.waterCropBed=(idx)=>{
  state.cropBeds[idx].moisture=Math.min(100, state.cropBeds[idx].moisture+20);
  state.cropBeds[idx].progress=Math.min(100, state.cropBeds[idx].progress+15);
  if(state.cropBeds[idx].progress>=90) state.cropBeds[idx].harvestReady=true;
  grantXP({farming:4});
  toast('💧 Desal condensate applied to '+state.cropBeds[idx].name);
  openCropModal();
  refreshUI();
};

window.fertilizeCropBed=(idx)=>{
  state.cropBeds[idx].fertilized=true;
  state.cropBeds[idx].progress=Math.min(100, state.cropBeds[idx].progress+25);
  if(state.cropBeds[idx].progress>=90) state.cropBeds[idx].harvestReady=true;
  grantXP({farming:6});
  toast('🌿 Seaweed bio-compost applied (+25% growth)');
  openCropModal();
  refreshUI();
};

window.harvestCropBed=(idx)=>{
  const bed=state.cropBeds[idx];
  const c=FIELD_CROP_TYPES[bed.cropKey]||FIELD_CROP_TYPES.coastal_tomato;
  state.money+=c.yield;
  bed.progress=10;
  bed.harvestReady=false;
  bed.stage=1;
  state.storage.tomatoes+=15;
  grantXP({farming:10});
  toast('🧺 Harvested fresh '+c.label+' (+€'+c.yield+', +10 XP)');
  openCropModal();
  refreshUI();
};

window.sowCrop=(key)=>{
  const c=FIELD_CROP_TYPES[key];
  if(state.money<c.cost){toast('Need €'+c.cost+' to purchase seed stock');return}
  state.money-=c.cost;
  state.cropBeds[0].cropKey=key;
  state.cropBeds[0].progress=15;
  state.cropBeds[0].harvestReady=false;
  state.cropBeds[0].stage=1;
  grantXP({farming:8});
  toast('🌱 Sowed '+c.label+' ('+c.sciName+') in Quadrant 1');
  openCropModal();
  refreshUI();
};

      const wid=btn.getAttribute('data-wid');
      if(state.activeWorkers.includes(wid)){toast('Worker already assigned');return}
      const w=WORKER_ROSTER.find(x=>x.id===wid);
      if(state.money<w.hireCost){toast('Insufficient funds to hire '+w.name);return}
      state.money-=w.hireCost;
      state.workers++;

/* ================= 8. CANVAS RENDERING ENGINE (ISLANDMAP) ================= */
class IslandMap{
  constructor(c){
    this.canvas=c;this.ctx=c.getContext('2d');
    this.hasBg=false;this.bg=new Image();
    this.bg.onload=()=>this.hasBg=true;
    this.bg.src='bg-island.jpg';
    this.bg.onerror=()=>{this.bg.src='../public/saint-martin/bg-island.jpg'};
    this.resize();
    addEventListener('resize',()=>this.resize());
    c.addEventListener('click',e=>this.onClick(e));
    const loop=()=>{this.render();requestAnimationFrame(loop)};
    requestAnimationFrame(loop);
  }
  resize(){
    const d=Math.min(devicePixelRatio||1,2);
    this.canvas.width=innerWidth*d;this.canvas.height=innerHeight*d;
    this.W=innerWidth;this.H=innerHeight;
  }
  onClick(e){
    const r=this.canvas.getBoundingClientRect();
    const x=(e.clientX-r.left)/this.W, y=(e.clientY-r.top)/this.H;

    // Check hit on all 19 calibrated markers
    for(const s of SITES){
      if(Math.hypot(x-s.nx,y-s.ny)<0.048){
        if(s.action==='crop_field') openCropModal();
        else if(s.action==='flower_garden') openFlowerModal();
        else if(s.action==='garage') openGarageModal();
        else if(s.action==='crew') openLabourMarket();
        else if(s.action==='storage') openStorageModal();
        else if(s.action==='seafood') openSeafoodModal();
        else if(s.action==='desal') openDesalModal();
        else if(s.action==='salt') openSaltModal();
        else if(s.action==='seadash') openSeaDashboard();
        else if(s.action==='trade') openTradeModal();
        else if(s.action==='dive') enterDive();
        else if(s.action==='plot_dec1') openPlot('dec1.plot1');
        else if(s.action==='plot_dec2') openPlot('dec2.plot1');
        else openWhy(s);
        return;
      }
    }

    // Check subplots
    for(const [pid,def] of Object.entries(PLOT_DEFS)){
      if(Math.hypot(x-def.nx,y-def.ny)<0.035){openPlot(pid);return}
    }
  }

  render(){
    const ctx=this.ctx,d=Math.min(devicePixelRatio||1,2),W=this.W,H=this.H;
    ctx.setTransform(d,0,0,d,0,0);
    if(this.hasBg){
      const iw=this.bg.naturalWidth,ih=this.bg.naturalHeight,sc=Math.max(W/iw,H/ih);
      ctx.drawImage(this.bg,(W-iw*sc)/2,(H-ih*sc)/2,iw*sc,ih*sc);
    }else{
      const sea=ctx.createLinearGradient(0,0,0,H);sea.addColorStop(0,'#003366');sea.addColorStop(1,'#20b2aa');
      ctx.fillStyle=sea;ctx.fillRect(0,0,W,H);
    }

    // 1. Draw Rotated Vegetable Crop Field Bed [-45°] at (0.265, 0.288)
    this.drawVegetableCropField(ctx, W * 0.265, H * 0.288, 120, 60);

    // 2. Draw Decagonal Botanical Flower Garden at (0.297, 0.448)
    this.drawBotanicalFlowerGarden(ctx, W * 0.297, H * 0.448, 75, 45);

    // 3. Draw Decagon 1: Mangrove Fringe at (0.136, 0.344)
    this.drawDecagonFrame(ctx, W * 0.136, H * 0.344, W * 0.052, H * 0.060, '#00E676', 'Decagon 1: Mangrove Fringe');

    // 4. Draw Decagon 2: Agro-Canopy Orchard at (0.814, 0.324)
    this.drawDecagonFrame(ctx, W * 0.814, H * 0.324, W * 0.065, H * 0.075, '#FFB300', 'Decagon 2: Agro-Canopy Orchard');

    // 5. Draw 3D Podiums and Badges for all 19 markers
    const t=performance.now()*0.001;
    SITES.forEach((s,i)=>{
      const px=s.nx*W, py=s.ny*H;
      const bob=Math.sin(t*2.2+i*0.5)*3;
      const col=s.color||'#00E5FF';

      ctx.save();
      // 3D Isometric Base Podium
      ctx.beginPath();
      ctx.ellipse(px, py+6, 20, 10, 0, 0, Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.45)';
      ctx.fill();
      ctx.strokeStyle=col;
      ctx.lineWidth=1.5;
      ctx.stroke();

      // Pulse Ring
      const phase=((t*0.75+i*0.18)%1);
      ctx.beginPath();
      ctx.ellipse(px, py+6, 20+phase*14, 10+phase*7, 0, 0, Math.PI*2);
      ctx.strokeStyle=col;
      ctx.globalAlpha=(1-phase)*0.55;
      ctx.lineWidth=1.4;
      ctx.stroke();
      ctx.globalAlpha=1.0;

      // Vertical Glowing Stem
      ctx.beginPath();
      ctx.moveTo(px, py+6);
      ctx.lineTo(px, py-14+bob);
      ctx.strokeStyle=col;
      ctx.lineWidth=2.2;
      ctx.stroke();

      // 3D Sphere Head
      ctx.beginPath();
      ctx.arc(px, py-14+bob, 13, 0, Math.PI*2);
      ctx.fillStyle='rgba(10,25,38,0.95)';
      ctx.fill();
      ctx.strokeStyle=col;
      ctx.lineWidth=2;
      ctx.stroke();

      ctx.font='13px serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(s.icon, px, py-13+bob);

      // Bright Coloured Monospace Badge
      const titleText=s.title;
      const subText=s.sub;
      ctx.font='bold 9.5px Nunito, sans-serif';
      const tw1=ctx.measureText(titleText).width;
      ctx.font='800 8.5px monospace';
      const tw2=ctx.measureText(subText).width;
      const maxW=Math.max(tw1, tw2)+16;
      const pillH=26;
      const pillX=px-maxW/2;
      const pillY=py+18+bob;

      ctx.fillStyle='rgba(10,25,38,0.94)';
      ctx.strokeStyle=col;
      ctx.lineWidth=1.2;
      if(ctx.roundRect) ctx.roundRect(pillX, pillY, maxW, pillH, 6);
      else ctx.rect(pillX, pillY, maxW, pillH);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle='#FFFFFF';
      ctx.font='bold 9.5px Nunito, sans-serif';
      ctx.textAlign='center';
      ctx.fillText(titleText, px, pillY+10);

      ctx.fillStyle=col;
      ctx.font='800 8.5px monospace';
      ctx.fillText(subText, px, pillY+21);

      ctx.restore();
    });
  }

  drawVegetableCropField(ctx, cx, cy, w, h){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-45 * Math.PI / 180);

    // Bed border
    ctx.fillStyle='rgba(46, 125, 50, 0.28)';
    ctx.strokeStyle='#76FF03';
    ctx.lineWidth=2;
    if(ctx.roundRect) ctx.roundRect(-w/2, -h/2, w, h, 8);
    else ctx.rect(-w/2, -h/2, w, h);
    ctx.fill();
    ctx.stroke();

    // Furrow lines
    ctx.strokeStyle='rgba(118, 255, 3, 0.4)';
    ctx.lineWidth=1;
    for(let fy of [-h/4, 0, h/4]){
      ctx.beginPath();
      ctx.moveTo(-w/2+6, fy);
      ctx.lineTo(w/2-6, fy);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawBotanicalFlowerGarden(ctx, cx, cy, rx, ry){
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const ang=(i*2*Math.PI)/10-Math.PI/2;
      const x=cx+rx*Math.cos(ang), y=cy+ry*Math.sin(ang);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(233, 30, 99, 0.22)';
    ctx.strokeStyle='#FF4081';
    ctx.lineWidth=2.2;
    ctx.stroke();
    ctx.fill();
    ctx.restore();
  }

  drawDecagonFrame(ctx,cx,cy,rx,ry,col,lbl){
    ctx.save();
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const ang=(i*2*Math.PI)/10-Math.PI/2;
      const x=cx+rx*Math.cos(ang), y=cy+ry*Math.sin(ang);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle=col;
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle='#FFFFFF';
    ctx.font='bold 10px Nunito, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(lbl,cx,cy-ry-8);
    ctx.restore();
  }
}

/* Boat Canvas Animation */
function startBoat(){
  const canvas=document.getElementById('boat-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let t=0;
  function loop(){
    if(document.getElementById('boat-tour').style.display==='none')return;
    t+=0.02;
    canvas.width=innerWidth;canvas.height=innerHeight;
    const g=ctx.createLinearGradient(0,0,0,innerHeight);
    g.addColorStop(0,'#001a2e');g.addColorStop(0.5,'#003854');g.addColorStop(1,'#006064');
    ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);

    // Wave ripples
    ctx.strokeStyle='rgba(0,229,255,0.2)';
    ctx.lineWidth=2;
    for(let i=0;i<6;i++){
      ctx.beginPath();
      const wy=innerHeight*0.5+i*40;
      for(let x=0;x<innerWidth;x+=30){
        const y=wy+Math.sin(x*0.01+t+i)*8;
        if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* Outer Platform Canvas */
function startOuter(){
  const canvas=document.getElementById('outer-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  canvas.width=innerWidth;canvas.height=innerHeight;
  const g=ctx.createLinearGradient(0,0,0,innerHeight);
  g.addColorStop(0,'#0A1926');g.addColorStop(1,'#002830');
  ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.fillStyle='#FFF';ctx.font='bold 16px Nunito';ctx.textAlign='center';
  ctx.fillText('⛽ Offshore CNG Closed-Loop Research Rig (Bay of Bengal Outer Trench)', innerWidth/2, innerHeight/2);
}

/* Dive Zone Canvas */
function startDive(){
  const canvas=document.getElementById('dive-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let t=0;
  function loop(){
    if(!diveRunning || document.getElementById('dive-zone').style.display==='none')return;
    t+=0.02;
    canvas.width=innerWidth;canvas.height=innerHeight;
    const g=ctx.createLinearGradient(0,0,0,innerHeight);
    g.addColorStop(0,'#004D40');g.addColorStop(0.6,'#00251A');g.addColorStop(1,'#00100C');
    ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);

    // Coral Reef Silhouette & Light rays
    ctx.fillStyle='rgba(0,229,255,0.12)';
    for(let r=0;r<5;r++){
      ctx.beginPath();
      ctx.moveTo(innerWidth*0.2+r*80,0);
      ctx.lineTo(innerWidth*0.1+r*110,innerHeight);
      ctx.lineTo(innerWidth*0.15+r*110,innerHeight);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
