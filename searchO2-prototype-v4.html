// ================= PERSISTENCE =================
// Every action used to call storage.set() immediately (14 call sites) on top of a
// 15s auto-save interval. Rapid clicking (or several harvests finishing back-to-back)
// could fire many writes within the same second, which is the most likely cause of
// the "Internal server error" — the storage API is rate-limited. This coalesces
// everything into at most one write per ~3s, retries once on failure instead of
// silently dropping it, and never lets two writes overlap.
var saveTimer = null;
var savePending = false;
var saveInFlight = false;
function doSave(){
  if (!window.storage || !state) return;
  if (saveInFlight){ savePending = true; return; }
  saveInFlight = true;
  state.lastSaveReal = Date.now();
  window.storage.set('searchO2-save-v4', JSON.stringify(state)).then(function(){
    saveInFlight = false;
    if (savePending){ savePending = false; requestSave(); }
  }).catch(function(e){
    saveInFlight = false;
    console.error('Save failed, will retry shortly:', e);
    setTimeout(function(){ requestSave(); }, 6000);
  });
}
function requestSave(){
  savePending = true;
  if (saveTimer) return;
  saveTimer = setTimeout(function(){ saveTimer=null; savePending=false; doSave(); }, 3000);
}
window.addEventListener('beforeunload', function(){ if (window.storage && state) doSave(); });
function loadState(){
  if (!window.storage){ state = freshState(); afterLoad(); return; }
  window.storage.get('searchO2-save-v4').then(function(res){
    if (res && res.value){
      try{
        var loaded = JSON.parse(res.value);
        var elapsedReal = Date.now() - (loaded.lastSaveReal || Date.now());
        state = loaded;
        if (!state.storage) state.storage = { built:false, building:false, buildHours:0, capacity:0, stored:0, level:0, expanding:false, expandHours:0, warnedFull:false };
        if (state.storage.capacity===undefined) state.storage.capacity = state.storage.built ? STORAGE_BASE_CAPACITY : 0;
        if (state.storage.stored===undefined) state.storage.stored = 0;
        if (state.storage.level===undefined) state.storage.level = state.storage.built ? 1 : 0;
        if (state.storage.expanding===undefined) state.storage.expanding = false;
        if (state.storage.expandHours===undefined) state.storage.expandHours = 0;
        if (state.storage.warnedFull===undefined) state.storage.warnedFull = false;
        if (state.loan===undefined) state.loan = null;
        if (!state.buildings) state.buildings = { garden:{built:false,building:false,buildHours:0}, pond:{built:false,building:false,buildHours:0},
          coffee_shop:{built:false,building:false,buildHours:0}, juice_bar:{built:false,building:false,buildHours:0} };
        if (state.treesRemoved===undefined) state.treesRemoved = 0;
        state.plots.forEach(function(p){ if (p.zeroHealthStreakHours===undefined) p.zeroHealthStreakHours = 0; });
        if (state.buildings.garden.flowerType===undefined) state.buildings.garden.flowerType = null;
        if (state.buildings.pond.specialization===undefined) state.buildings.pond.specialization = null;
        ['garden','pond'].forEach(function(bk){
          var bb = state.buildings[bk];
          if (bb.freshness===undefined) bb.freshness = 100;
          if (bb.warnedLow===undefined) bb.warnedLow = false;
          if (bb.careAnimUntil===undefined) bb.careAnimUntil = 0;
        });
        nextWorkerId = 1 + state.workers.reduce(function(m,w){return Math.max(m,w.id);},0);
        if (elapsedReal > 5000){
          var before = { money: state.money, totalO2AllTime: state.totalO2AllTime };
          var gh = gameHoursFromReal(elapsedReal, state.speedFactor);
          gh = Math.min(gh, 24*4*30);
          advanceGame(gh);
          offlineSummary = {
            realMinutes: Math.round(elapsedReal/60000), gameHours: Math.round(gh*10)/10,
            moneyGained: Math.round((state.money-before.money)*100)/100,
            o2Gained: Math.round((state.totalO2AllTime-before.totalO2AllTime)*10)/10
          };
        }
      }catch(e){ console.error('Parse failed, starting fresh', e); state = freshState(); }
    } else { state = freshState(); }
    afterLoad();
  }).catch(function(e){ console.error('Load failed, starting fresh', e); state = freshState(); afterLoad(); });
}
function afterLoad(){
  lastRealTs = Date.now();
  buildToolStripOnce();
  buildSeasonChipOnce();
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.init();
  startLoop();
  render();
  startHintLoop();
  scheduleBirds();
}

// ================= CORE GAME LOGIC =================
function gameHoursFromReal(realMs, speedFactor){ return (realMs / REAL_MS_PER_GAME_HOUR_SPEC) * speedFactor; }
function currentSeason(){
  var cyclePos = state.gameHour % (SEASON_LEN_GAME_HOURS*4);
  var idx = Math.floor(cyclePos / SEASON_LEN_GAME_HOURS) % 4;
  return SEASONS[idx];
}
function forestBonus(){ return state.plots.filter(function(p){return p.status==='growing';}).length===PLOT_COUNT ? 0.10 : 0; }
function diversityBonus(){
  var types={}; state.plots.forEach(function(p){ if(p.treeType) types[p.treeType]=true; });
  return Object.keys(types).length>=2 ? 0.15 : 0;
}
function engineerBonus(){ return state.workers.some(function(w){return w.type==='engineer';}) ? 0.10 : 0; }
function visitorMagnetActive(){
  var b = state.buildings;
  return !!(b && b.garden.built && b.pond.built && (b.coffee_shop.built || b.juice_bar.built));
}
function farmReputation(){
  var rep = 0;
  if (state.buildings){
    BUILDING_ORDER.forEach(function(key){
      var b = state.buildings[key];
      if (!b || !b.built) return;
      var bonus = BUILDING_TYPES[key].reputationBonus;
      if ((key==='garden' || key==='pond') && b.freshness!==undefined) bonus *= (0.4 + 0.6*(b.freshness/100));
      rep += bonus;
    });
  }
  if (state.storage && state.storage.built) rep += 4;
  var growing = state.plots.filter(function(p){return p.status==='growing';});
  if (growing.length){
    var avgHealth = growing.reduce(function(s,p){return s+p.health;},0)/growing.length;
    rep += Math.round(avgHealth*0.15);
  }
  var species = {}; state.plots.forEach(function(p){ if (p.treeType) species[p.treeType]=true; });
  rep += Object.keys(species).length * 3;
  if (visitorMagnetActive()) rep += 10;
  rep -= state.demerits*2;
  return Math.max(0, Math.round(rep));
}
function workerOnPlot(plotId){
  var p = state.plots[plotId];
  if (!p.assignedWorker) return null;
  return state.workers.find(function(w){return w.id===p.assignedWorker;}) || null;
}
function pushReport(text){
  state.reports.unshift({ id: Date.now()+Math.random(), gameHour: Math.round(state.gameHour*10)/10, text: text });
  if (state.reports.length>25) state.reports.length = 25;
}
function plotKpi(p){
  if (!p.ageHours) return 100;
  return Math.max(0, Math.round(100*(1 - (p.downtimeHours/p.ageHours))));
}

function advanceGame(dh){
  if (dh<=0) return;
  var prevSeasonName = currentSeason().name;
  var totalMult = 1 + forestBonus() + diversityBonus() + engineerBonus();
  state.gameHour += dh;
  var nextSeason = currentSeason();
  if (nextSeason.name !== prevSeasonName && typeof SoundTrackEngine !== 'undefined'){
    SoundTrackEngine.playSFX('season', nextSeason.name);
  }
  var season = nextSeason;

  if (state.storage.building){
    state.storage.buildHours += dh;
    if (state.storage.buildHours >= STORAGE_BUILD_HOURS){
      state.storage.building=false; state.storage.built=true; state.storage.capacity=STORAGE_BASE_CAPACITY; state.storage.level=1;
      pushReport('🏚 Storage Room construction complete! Capacity: €'+state.storage.capacity+' of harvested value.');
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
    }
  }
  if (state.storage.expanding){
    state.storage.expandHours += dh;
    if (state.storage.expandHours >= STORAGE_EXPAND_HOURS){
      state.storage.expanding=false; state.storage.capacity += STORAGE_EXPAND_CAPACITY; state.storage.level += 1;
      pushReport('🏚 Storage expanded to level '+state.storage.level+'! New capacity: €'+state.storage.capacity+'.');
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
    }
  }

  BUILDING_ORDER.forEach(function(key){
    var b = state.buildings[key]; var def = BUILDING_TYPES[key];
    if (b.building){
      b.buildHours += dh;
      if (b.buildHours >= def.buildHours){
        b.building=false; b.built=true;
        pushReport(def.icon+' '+def.label+' construction complete! '+(def.category==='decorative' ? 'Reputation +'+def.reputationBonus+'.' : 'Ready to sell to visitors.'));
        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
        if (key==='garden') showNotification('🌷','Your Garden is ready — choose what to plant!','building',key);
        else if (key==='pond') showNotification('🪷','Your Pond is ready — choose Fish Farm or Duck Farm!','building',key);
        checkAchievements();
      }
    }
  });
  // Revenue buildings consume stored harvest and sell it to visitors at a markup —
  // this is the payoff loop for the Storage system: build it, stock it, then let a
  // shop turn that inventory into better money than manually selling at 1:1.
  if (state.storage.built && state.storage.stored > 0.01){
    var magnetMult = visitorMagnetActive() ? 1.2 : 1.0;
    ['coffee_shop','juice_bar'].forEach(function(key){
      var b = state.buildings[key]; if (!b.built) return;
      var def = BUILDING_TYPES[key];
      var take = Math.min(def.processRate*dh, state.storage.stored);
      if (take <= 0.001) return;
      state.storage.stored -= take;
      state.money += take * def.conversionRate * magnetMult;
    });
  }

  // Garden and Pond both need tending — freshness decays continuously once
  // planted/stocked. Garden's reputation bonus scales with it; Pond's actual
  // production (fish/duck sales into storage) only happens while it's fed.
  var garden = state.buildings.garden;
  if (garden.built && garden.flowerType){
    garden.freshness = Math.max(0, garden.freshness - dh*GARDEN_FRESHNESS_DECAY);
    if (garden.freshness < FRESHNESS_WARN_THRESHOLD && !garden.warnedLow){
      garden.warnedLow = true;
      pushReport('🌷 The garden is wilting from neglect — tend it to keep its reputation bonus.');
      showNotification('🥀','The garden needs tending — it\'s wilting.','building','garden');
    } else if (garden.freshness >= 60){ garden.warnedLow = false; }
  }
  var pond = state.buildings.pond;
  if (pond.built && pond.specialization){
    pond.freshness = Math.max(0, pond.freshness - dh*POND_FRESHNESS_DECAY);
    if (pond.freshness < FRESHNESS_WARN_THRESHOLD && !pond.warnedLow){
      pond.warnedLow = true;
      var pondSpecName = POND_SPECIALIZATIONS[pond.specialization].label;
      pushReport('🐟 The '+pondSpecName+' needs feeding — production has slowed.');
      showNotification('🍽️',pondSpecName+' needs feeding.','building','pond');
    } else if (pond.freshness >= 60){ pond.warnedLow = false; }
    if (state.storage.built && pond.freshness > 0){
      var spec = POND_SPECIALIZATIONS[pond.specialization];
      var freshMult = pond.freshness/100;
      var produced = spec.productRate * dh * freshMult;
      var room = Math.max(0, state.storage.capacity - state.storage.stored);
      state.storage.stored += Math.min(produced, room);
    }
  }

  state.plots.forEach(function(p){
    var w = workerOnPlot(p.id);

    if (p.status==='barren' || p.status==='ready'){
      p.weedHours += dh;
      if (p.weedHours >= OVERGROWN_THRESHOLD){ p.status='overgrown'; showNotification('🌿','Plot '+(p.id+1)+' is overgrown and needs clearing.','plot',p.id); }
    } else if (p.status==='clearing'){
      var clearMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : 1;
      p.taskHours += dh * clearMult;
      if (p.taskHours >= CLEAR_DURATION_HOURS){
        p.status='barren'; p.weedHours=0; p.taskHours=0;
        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
        pushReport('🌾 Plot '+(p.id+1)+' overgrowth cleared! Land is ready to dig.');
        showNotification('🌾', 'Plot '+(p.id+1)+' cleared — ready to dig!', 'plot', p.id);
      }
    } else if (p.status==='preparing'){
      var prepMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : 1;
      p.taskHours += dh * prepMult;
      if (p.taskHours >= PREP_DURATION_HOURS){
        p.status='ready'; p.weedHours=0; p.taskHours=0;
        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
        pushReport('🌱 Plot '+(p.id+1)+' soil preparation complete! Ready for planting.');
        showNotification('🌱', 'Plot '+(p.id+1)+' prepared — ready to plant!', 'plot', p.id);
      }
    } else if (p.status==='removing'){
      var remDef = TREE_TYPES[p.treeType]; var remCfg = REMOVE_CONFIG[remDef.category];
      var remMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : 1;
      p.taskHours += dh * remMult;
      if (p.taskHours >= remCfg.hours){
        var salvage = Math.round(remDef.cost * remCfg.salvagePct * 100)/100;
        state.money += salvage;
        state.treesRemoved = (state.treesRemoved||0) + 1;
        pushReport('🪓 Removed the dead '+remDef.label+' (#'+p.treeId+') from Plot '+(p.id+1)+'.'+(salvage>0?' Salvaged €'+salvage.toFixed(2)+' from the wood.':''));
        if (remCfg.vehicle) spawnVehicleAnimation(PLOT_LAYOUT[p.id]);
        p.status='barren'; p.treeType=null; p.treeId=null; p.growHours=0; p.taskHours=0; p.weedHours=0;
        p.health=100; p.ageHours=0; p.downtimeHours=0; p.zeroHealthStreakHours=0; p.pendingHarvest=0;
        checkAchievements();
      }
    } else if (p.status==='growing'){
      var def = TREE_TYPES[p.treeType];
      p.ageHours += dh;
      p.health = Math.max(0, p.health - dh*HEALTH_DECAY[def.category]);
      if (p.health<=0){
        p.downtimeHours += dh; // stopped producing oxygen entirely
        p.zeroHealthStreakHours += dh;
        if (p.zeroHealthStreakHours >= TREE_DRY_THRESHOLD_HOURS){
          p.status = 'dead';
          pushReport('💀 The '+def.label+' on Plot '+(p.id+1)+' (#'+p.treeId+') has dried out completely and needs to be removed before you can replant.');
          showNotification('💀', 'A tree on Plot '+(p.id+1)+' dried out and needs removing.', 'plot', p.id);
        }
      } else {
        p.zeroHealthStreakHours = 0;
        var healthMult = 0.5 + 0.5*(p.health/100);
        var growMult = (w && (w.type==='farmer'||w.type==='botanist')) ? WORKER_TYPES[w.type].mult : 1;
        var irrMult = p.accessories.irrigation ? 1.15 : 1;
        var fertMult = p.accessories.fertilizer ? 1.20 : 1;
        var growDh = dh * season.growth * growMult * irrMult * healthMult;
        p.growHours += growDh;
        var stageIdx = stageIndexFor(def, p.growHours);
        var o2Rate = def.o2AtStage[stageIdx];
        var o2Gain = o2Rate * dh * fertMult * healthMult;
        state.totalO2 += o2Gain; state.totalO2AllTime += o2Gain; p.o2Produced += o2Gain;
        state.money += o2Gain * O2_RATE * totalMult;
        var isFinalStage = stageIdx === def.stages.length-1;
        if (isFinalStage && def.lateBonus){
          var harvestAmt = def.lateBonus*dh*season.income*totalMult*healthMult;
          if (state.storage.built){ p.pendingHarvest = Math.min(150, p.pendingHarvest + harvestAmt); }
          else { state.money += harvestAmt * 0.5; } // spoilage penalty without storage
        }
      }
    }

    if (p.animal && state.gameHour >= p.animal.expiresAtHour){
      var a = ANIMALS.find(function(x){return x.key===p.animal.key;});
      state.money -= ANIMAL_PENALTY; state.demerits += 1;
      if (p.status==='preparing' || p.status==='clearing'){ p.taskHours = Math.max(0, p.taskHours-1); }
      pushReport('🐾 A '+a.name+' passed through Plot '+(p.id+1)+' unnoticed — minor setback (-€'+ANIMAL_PENALTY+', +1 demerit). '+a.fact);
      p.animal = null;
    }
  });

  var anyActive = state.plots.some(function(p){return p.animal;});
  if (!anyActive){
    var prob = 1 - Math.pow(1-ANIMAL_SPAWN_RATE, dh);
    if (Math.random() < prob){
      var eligible = state.plots.filter(function(p){ return ['barren','overgrown','preparing','clearing','ready'].indexOf(p.status)>=0; });
      if (eligible.length){
        var target = eligible[Math.floor(Math.random()*eligible.length)];
        var animal = ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
        target.animal = { key:animal.key, expiresAtHour: state.gameHour + ANIMAL_WINDOW_HOURS };
        showNotification(animal.emoji, animal.name+' spotted on Plot '+(target.id+1)+'!', 'plot', target.id);
      }
    }
  }

  var newDay = Math.floor(state.gameHour/24);
  if (newDay > state.lastPaidDay){
    var days = newDay - state.lastPaidDay;
    if (state.workers.length){
      var dailyWage = state.workers.reduce(function(s,w){return s+WORKER_TYPES[w.type].wage;},0);
      state.money -= dailyWage * days;
    }
    var buildingUpkeep = 0;
    BUILDING_ORDER.forEach(function(key){
      var b = state.buildings[key]; var def = BUILDING_TYPES[key];
      if (b.built && def.upkeep) buildingUpkeep += def.upkeep;
    });
    if (buildingUpkeep) state.money -= buildingUpkeep * days;
    if (state.loan){
      for (var di=0; di<days && state.loan; di++){
        if (state.loan.remainingBalance <= 0.01){
          pushReport('🏦 Loan fully repaid! Your farm is debt-free.');
          state.loan = null; break;
        }
        var installment = Math.min(state.loan.dailyInstallment, state.loan.remainingBalance);
        if (state.money >= installment){
          state.money -= installment; state.loan.remainingBalance -= installment; state.loan.daysPaid += 1;
        } else {
          var paid = Math.max(0, state.money);
          var shortfall = installment - paid;
          var penalty = shortfall * LOAN_PENALTY_RATE;
          state.money = 0;
          state.loan.remainingBalance = Math.max(0, state.loan.remainingBalance - paid + penalty);
          state.loan.missedPayments = (state.loan.missedPayments||0) + 1;
          state.demerits += 1;
          pushReport('⚠️ Missed a loan payment (€'+installment.toFixed(2)+' due) — €'+penalty.toFixed(2)+' penalty added to what you still owe, +1 demerit.');
        }
      }
    }
    state.plots.forEach(function(p){
      if (p.status==='growing'){
        var w2 = workerOnPlot(p.id);
        if (w2 && w2.type==='botanist'){
          var def2 = TREE_TYPES[p.treeType];
          var rec = p.health<40 ? 'Urgent: water and consider pruning soon.' : (p.health<70 ? 'Recommend watering this plot.' : 'Looking healthy — no action needed.');
          pushReport('📋 Botanist report — Plot '+(p.id+1)+' ('+def2.label+', #'+p.treeId+'): health '+Math.round(p.health)+'%, KPI '+plotKpi(p)+'%, stage "'+def2.stages[stageIndexFor(def2,p.growHours)].n+'". '+rec);
        }
        if (p.health<=0){
          state.money -= DEMERIT_FINE; state.demerits += 1;
          pushReport('⚠️ Plot '+(p.id+1)+' ('+TREE_TYPES[p.treeType].label+' #'+p.treeId+') produced no oxygen today — 0% health. -€'+DEMERIT_FINE+', +1 demerit.');
        }
      }
      if (p.status==='overgrown'){
        state.money -= DEMERIT_FINE; state.demerits += 1;
        pushReport('⚠️ Plot '+(p.id+1)+' remains overgrown and uncleared. -€'+DEMERIT_FINE+', +1 demerit.');
      }
    });
  }
  state.lastPaidDay = newDay;
}

function stageIndexFor(def, growHours){
  var acc=0;
  for (var i=0;i<def.stages.length;i++){ acc+=def.stages[i].h; if (growHours<acc) return i; }
  return def.stages.length-1;
}
function plotStageInfo(p){
  if (p.status!=='growing') return null;
  var def = TREE_TYPES[p.treeType];
  var idx = stageIndexFor(def, p.growHours);
  var acc=0; for (var i=0;i<idx;i++) acc+=def.stages[i].h;
  var into = p.growHours-acc, dur = def.stages[idx].h;
  var pct = dur>9000 ? 100 : Math.min(100, Math.round((into/dur)*100));
  return { def:def, idx:idx, name:def.stages[idx].n, pct:pct, isFinal: dur>9000 };
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(function(a){
    if (!state.achUnlocked[a.id] && a.check(state)){
      state.achUnlocked[a.id]=true;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('achieve');
    }
  });
}

// ================= ACTIONS =================
function startPrep(plotId){
  var p = state.plots[plotId]; if (p.status!=='barren') return;
  if (state.money < LABOR_COST) return;
  state.money -= LABOR_COST; p.status='preparing'; p.taskHours=0;
  render(); requestSave();
}
function startClear(plotId){
  var p = state.plots[plotId]; if (p.status!=='overgrown') return;
  if (state.money < CLEAR_COST) return;
  state.money -= CLEAR_COST; p.status='clearing'; p.taskHours=0;
  render(); requestSave();
}
function startRemoveTree(plotId){
  var p = state.plots[plotId]; if (p.status!=='dead') return;
  var def = TREE_TYPES[p.treeType]; var cfg = REMOVE_CONFIG[def.category];
  if (state.money < cfg.cost) return;
  state.money -= cfg.cost; p.status='removing'; p.taskHours=0;
  render(); requestSave();
}
function plantTree(plotId, type){
  var p = state.plots[plotId]; var def = TREE_TYPES[type];
  if (p.status!=='ready' || state.money<def.cost) return;
  state.money -= def.cost; p.status='growing'; p.treeType=type; p.treeId = state.nextTreeId++;
  p.growHours=0; p.health=100; p.o2Produced=0; p.ageHours=0; p.downtimeHours=0; p.pendingHarvest=0;
  state.treesPlanted += 1;
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('plant');
  checkAchievements(); closeModal(); requestSave();
}
function setSpeed(factor){ state.speedFactor = factor; requestSave(); render(); }

function hireWorker(type){
  state.workers.push({ id: nextWorkerId++, type: type, assignedPlot: null });
  checkAchievements(); render(); requestSave();
}
function fireWorker(workerId){
  var w = state.workers.find(function(x){return x.id===workerId;}); if (!w) return;
  if (w.assignedPlot!==null) state.plots[w.assignedPlot].assignedWorker=null;
  state.workers = state.workers.filter(function(x){return x.id!==workerId;});
  render(); requestSave();
}
function assignWorker(workerId, plotId){
  var w = state.workers.find(function(x){return x.id===workerId;}); var p = state.plots[plotId];
  if (!w || !p) return;
  if (w.assignedPlot!==null) state.plots[w.assignedPlot].assignedWorker=null;
  if (p.assignedWorker!==null){ var prev = state.workers.find(function(x){return x.id===p.assignedWorker;}); if (prev) prev.assignedPlot=null; }
  w.assignedPlot = plotId; p.assignedWorker = w.id;
  render(); requestSave();
}
function unassignWorker(plotId){
  var p = state.plots[plotId];
  if (p.assignedWorker!==null){ var w = state.workers.find(function(x){return x.id===p.assignedWorker;}); if (w) w.assignedPlot=null; p.assignedWorker=null; }
  render(); requestSave();
}
function buyAccessory(plotId, kind){
  var p = state.plots[plotId]; var acc = ACCESSORIES[kind];
  if (p.accessories[kind] || state.money<acc.cost) return;
  state.money -= acc.cost; p.accessories[kind]=true;
  render(); requestSave();
}
function waterPlot(plotId){
  var p = state.plots[plotId]; if (p.status!=='growing') return;
  var def = TREE_TYPES[p.treeType]; var cost = CARE_COST.water[def.category];
  if (state.money<cost) return;
  state.money -= cost; p.health = Math.min(100, p.health+30);

function prunePlot(plotId){
  var p = state.plots[plotId]; if (p.status!=='growing') return;

function startHarvest(plotId){

  if (!def || p.status!=='growing' || !def.lateBonus) return;

function scareAnimal(plotId){
  var p = state.plots[plotId]; if (!p.animal) return;

function startBuildStorage(){

function sellStorage(){

function expandStorageCost(){ return STORAGE_EXPAND_BASE_COST * Math.max(1, state.storage.level); }
function startExpandStorage(){

function startBuildBuilding(key){

function openModal(type, plotId){ activeModal = {type:type, plotId:plotId}; openPanel=null; render(); }
function closeModal(){
  if (activeModal && activeModal.type==='bank') bankruptcyDismissed = true;
  activeModal=null; render();
}
var bankruptcyDismissed = false;
var resetConfirmPending = false;
function checkBankruptcy(){
  if (!state) return;
  if (state.money >= BANKRUPTCY_TRIGGER){ bankruptcyDismissed = false; return; }
  if (state.loan) return; // already dealing with it
  if (bankruptcyDismissed) return;
  if (activeModal && activeModal.type==='bank') return;
  activeModal = {type:'bank', plotId:null};
  openPanel = null;
}
function takeLoan(key){
  if (state.loan) return;
  var o = LOAN_OPTIONS.find(function(x){return x.key===key;});
  if (!o) return;
  var totalOwed = o.principal * (1+o.rate);
  state.money += o.principal;
  state.loan = { key:o.key, label:o.label, principal:o.principal, rate:o.rate, termDays:o.termDays,
    totalOwed: totalOwed, dailyInstallment: totalOwed/o.termDays, remainingBalance: totalOwed, daysPaid:0, missedPayments:0 };
  pushReport('🏦 Took a '+o.label+' of €'+o.principal+'. Total repayment: €'+totalOwed.toFixed(2)+' over '+o.termDays+' days (€'+(totalOwed-o.principal).toFixed(2)+' interest).');
  bankruptcyDismissed = false;
  closeModal(); requestSave();
}
function repayLoanEarly(){
  if (!state.loan) return;
  var bal = state.loan.remainingBalance;
  if (state.money < bal) return;
  state.money -= bal;
  pushReport('✅ Paid off the remaining €'+bal.toFixed(2)+' loan balance early. Your farm is debt-free.');
  state.loan = null;
  render(); requestSave();
}
function resetFarm(){
  state = freshState();
  nextWorkerId = 1;
  bankruptcyDismissed = false;
  resetConfirmPending = false;
  activeModal = null; openPanel = null;
  hintQueue = [];
  lastRealTs = Date.now();
  var speedSel = document.getElementById('speedSel'); if (speedSel) speedSel.value = state.speedFactor;
  render(); requestSave();
}
function togglePanel(name){ openPanel = (openPanel===name) ? null : name; activeModal=null; render(); }

// ================= LOOP =================
function startLoop(){
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    var now=Date.now(); var realDelta = now-lastRealTs; lastRealTs=now;
    var dh = gameHoursFromReal(realDelta, state.speedFactor);
    advanceGame(dh); checkAchievements(); processHarvests(); checkBankruptcy(); render();
  }, 1000);
  setInterval(requestSave, 20000);
}
function processHarvests(){
  state.plots.forEach(function(p){
    if (p.harvesting && Date.now()-p.harvestStartReal >= 4000){
      var amt = p.harvestAmount||0;
      var room = Math.max(0, state.storage.capacity - state.storage.stored);
      var accepted = Math.min(amt, room);
      var lost = amt - accepted;
      state.storage.stored += accepted;
      state.harvestCount = (state.harvestCount||0)+1;
      if (lost > 0.01){
        pushReport('⚠️ Storage was full — €'+lost.toFixed(2)+' worth of '+TREE_TYPES[p.treeType].label+' from Plot '+(p.id+1)+' spoiled. Sell stock or expand storage.');
      } else {
        pushReport('🧺 Harvested €'+amt.toFixed(2)+' worth of '+TREE_TYPES[p.treeType].label+' from Plot '+(p.id+1)+' and moved it into storage.');
      }
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('harvest');
      p.pendingHarvest = Math.max(0, p.pendingHarvest-amt);
      p.harvesting=false; p.harvestAmount=0;
      spawnCarryAnimation(PLOT_LAYOUT[p.id], STORAGE_SPOT);
      checkAchievements();
    }
  });
  if (state.storage.built && state.storage.capacity>0){
    var ratio = state.storage.stored/state.storage.capacity;
    if (ratio >= STORAGE_WARN_RATIO && !state.storage.warnedFull){
      state.storage.warnedFull = true;
      pushReport('📦 Storage is over '+Math.round(STORAGE_WARN_RATIO*100)+'% full ('+Math.round(ratio*100)+'%). Sell some harvest or expand storage soon.');
      showNotification('📦','Storage is over '+Math.round(STORAGE_WARN_RATIO*100)+'% full — sell or expand.','storage',null);
    } else if (ratio < 0.6){ state.storage.warnedFull = false; }
  }
}

// educational hint toast
var hintQueue = [];
function refillHintQueue(){
  var facts = []; var seen = {};
  state.plots.forEach(function(p){ if (p.treeType && !seen[p.treeType]){ seen[p.treeType]=true; facts.push(TREE_TYPES[p.treeType].fact); } });
  facts = facts.concat(GENERIC_TIPS);
  for (var i=facts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=facts[i]; facts[i]=facts[j]; facts[j]=t; }
  hintQueue = facts;
}
function showNextHint(){
  if (!state) return;
  if (!hintQueue.length) refillHintQueue();
  var text = hintQueue.shift(); if (!text) return;
  var el = document.getElementById('hintToast'); if (!el) return;
  el.innerHTML = '<b>Did you know?</b><br>'+text;
  el.classList.add('show');
  clearTimeout(el._hideT);
  el._hideT = setTimeout(function(){ el.classList.remove('show'); }, 6500);
}

function scheduleBirds(){ spawnBird(); setTimeout(scheduleBirds, 9000+Math.random()*14000); }

// carry-to-storage basket animation, appended outside the render-replaced DOM

  el.style.position='fixed'; el.style.left=fx+'px'; el.style.top=fy+'px'; el.style.fontSize='22px'; el.style.zIndex='60';

  document.body.appendChild(el);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.left=tx+'px'; el.style.top=ty+'px'; }); });

}
// A truck hauls cut timber off the right edge of the field — used when removing
// larger dead trees that need vehicle transport rather than a hand-carried basket.
function spawnVehicleAnimation(fromLayout){
  var scene = document.querySelector('.field-scene'); if (!scene) return;
  var rect = scene.getBoundingClientRect();
  var fx = rect.left + rect.width*(fromLayout.left+fromLayout.w/2)/100;

// Task notification toasts — separate from the ambient educational hint toast. These
// fire on newly-triggered actionable events (dead tree, overgrown plot, wildlife,
// storage full) and auto-dismiss after ~9s if ignored, with a "View" shortcut straight
// to the relevant modal. Managed as direct DOM nodes (not part of render()'s innerHTML
// replacement) so they survive the 1s game tick without flickering or losing timers.
function showNotification(icon, text, actionType, actionArg){
  var stack = document.getElementById('notifStack'); if (!stack) return;
  var el = document.createElement('div');
  el.style.cssText = 'pointer-events:auto;background:var(--cream);border-radius:12px;padding:9px 11px;box-shadow:0 10px 26px rgba(0,0,0,0.28);font-size:0.76rem;display:flex;gap:8px;align-items:flex-start;color:var(--pine);';
  el.innerHTML = '<span style="font-size:1.05rem;">'+icon+'</span>'+
    '<div style="flex:1;">'+text+
      '<div style="margin-top:6px;display:flex;gap:6px;">'+
        '<button data-nv="1" style="background:#F0AC3D;border:none;border-radius:8px;padding:3px 10px;font-weight:800;font-size:0.7rem;cursor:pointer;color:#543A0F;">View</button>'+
        '<button data-nx="1" style="background:none;border:none;color:var(--pine-soft);font-weight:800;cursor:pointer;font-size:0.72rem;">Dismiss</button>'+
      '</div></div>';
  var timer = setTimeout(remove, 9000);
  function remove(){ clearTimeout(timer); if (el.parentNode) el.parentNode.removeChild(el); }
  el.querySelector('[data-nv]').onclick = function(){
    remove();
    if (actionType==='plot') openModal('plot', actionArg);
    else if (actionType==='bank') openModal('bank', null);
    else if (actionType==='storage') openModal('storage', null);
    else if (actionType==='building') openModal('building', actionArg);
  };
  el.querySelector('[data-nx]').onclick = remove;
  stack.appendChild(el);
  while (stack.children.length>3){ stack.removeChild(stack.firstChild); }
}

// ================= STATIC FIELD BACKGROUND =================
function fieldBackgroundSVG(){

// ================= WORKER / TOOL ART =================
function toolSvg(tool, working){
  var cls = working ? ' class="tool-swing"' : '';
  if (tool==='shovel') return '<g'+cls+'><rect x="0" y="0" width="4" height="20" fill="#B0B0B0"/><rect x="-4" y="18" width="12" height="8" rx="2" fill="#8A8A8A"/></g>';
  if (tool==='can') return '<g'+cls+'><rect x="-6" y="0" width="14" height="10" rx="3" fill="#5A8FBF"/><rect x="6" y="2" width="10" height="3" fill="#5A8FBF"/></g>';
  if (tool==='flask') return '<g'+cls+'><path d="M-3,0 L3,0 L5,14 Q0,18 -5,14 Z" fill="#7A5FA8" opacity="0.85"/></g>';
  if (tool==='chainsaw') return '<g'+cls+'><rect x="-2" y="4" width="18" height="6" rx="2" fill="#D9822B"/><rect x="14" y="0" width="4" height="14" rx="1" fill="#8A8A8A"/><rect x="-2" y="4" width="4" height="4" fill="#5A3A22"/></g>';
  if (tool==='saw') return '<g'+cls+'><rect x="-2" y="2" width="16" height="3" fill="#B0B0B0"/><path d="M-2,5 L1,8 L4,5 L7,8 L10,5 L13,8" stroke="#8A8A8A" stroke-width="1.4" fill="none"/><rect x="-4" y="0" width="4" height="6" rx="1" fill="#7A5334"/></g>';
  if (tool==='hand') return '';
  return '<g'+cls+'><circle r="7" fill="none" stroke="#3E6B8B" stroke-width="3"/><circle r="2" fill="#3E6B8B"/></g>';
}
function personSvg(type, working, x, y, basket, toolOverride){
  var wt = WORKER_TYPES[type] || WORKER_TYPES.farmer;
  var tool = toolOverride || wt.tool;
  return '<g transform="translate('+x+','+y+')" class="'+(working?'bob':'')+'">'+
    '<ellipse cx="0" cy="30" rx="12" ry="4" fill="rgba(0,0,0,0.15)"/>'+
    '<rect x="-7" y="4" width="14" height="20" rx="5" fill="'+wt.color+'"/>'+
    '<circle cx="0" cy="-4" r="8" fill="#F2C79B"/>'+
    '<rect x="-9" y="-11" width="18" height="6" rx="3" fill="'+wt.color+'"/>'+
    (basket ? '<text x="10" y="18" font-size="14">🧺</text>' : '<g transform="translate(9,6)">'+toolSvg(tool, working)+'</g>')+
  '</g>';
}
function drawCanopy(def, cx, cy, canopyR){
  var shape = def.shape, color = def.canopy;
  if (shape==='conifer'){
    return '<g fill="'+color+'">'+
      '<polygon points="'+cx+','+(cy-canopyR*1.5)+' '+(cx-canopyR*0.8)+','+(cy-canopyR*0.5)+' '+(cx+canopyR*0.8)+','+(cy-canopyR*0.5)+'"/>'+
      '<polygon points="'+cx+','+(cy-canopyR*1.0)+' '+(cx-canopyR*0.95)+','+(cy+canopyR*0.15)+' '+(cx+canopyR*0.95)+','+(cy+canopyR*0.15)+'"/>'+
      '<polygon points="'+cx+','+(cy-canopyR*0.5)+' '+(cx-canopyR*1.05)+','+cy+' '+(cx+canopyR*1.05)+','+cy+'"/>'+
    '</g>';
  }
  if (shape==='umbrella'){
    return '<g fill="'+color+'">'+
      '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(canopyR*1.35)+'" ry="'+(canopyR*0.42)+'"/>'+
      '<ellipse cx="'+cx+'" cy="'+(cy-canopyR*0.28)+'" rx="'+(canopyR*1.1)+'" ry="'+(canopyR*0.32)+'"/>'+
    '</g>';
  }
  if (shape==='tallRound'){
    return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(canopyR*0.72)+'" ry="'+(canopyR*1.2)+'" fill="'+color+'"/>';
  }
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+canopyR+'" fill="'+color+'"/>';
}
function drawDeadTreeShape(def){
  if (def.shape==='bush'){
    return '<ellipse cx="86" cy="86" rx="16" ry="12" fill="#A69B7A"/><ellipse cx="114" cy="86" rx="16" ry="12" fill="#A69B7A"/><ellipse cx="100" cy="78" rx="18" ry="13" fill="#A69B7A"/>';
  }
  var trunkH=42, canopyR=35;
  var deadDef = Object.assign({}, def, {canopy:'#A69B7A'});
  return '<rect x="94" y="'+(84-trunkH)+'" width="12" height="'+trunkH+'" rx="4" fill="#6E5B45"/>'+drawCanopy(deadDef, 100, 84-trunkH-canopyR*0.5, canopyR);
}

// ================= PLOT RENDERING =================
function plotSvg(p){
  var stageInfo = plotStageInfo(p);
  var w = workerOnPlot(p.id);
  var bed = '<ellipse cx="100" cy="90" rx="88" ry="48" fill="#7A5334"/><ellipse cx="100" cy="86" rx="88" ry="46" fill="#8B5A3C"/>';
  var tillLines=''; for (var i=-70;i<=70;i+=18){ tillLines += '<path d="M'+(100+i*0.9)+',48 Q'+(100+i)+',86 '+(100+i*0.9)+',124" stroke="#6E4429" stroke-width="2" fill="none" opacity="0.4"/>'; }

  var content='';
  var careActive = p.careAnimUntil && Date.now() < p.careAnimUntil;

  if (p.status==='barren' || p.status==='ready'){
    content = (p.status==='barren') ? tillLines : '<g><ellipse cx="100" cy="90" rx="18" ry="8" fill="#7A9B5F"/>'+
      '<circle cx="100" cy="55" r="15" fill="'+(Math.floor(Date.now()/500)%2 ? '#F0AC3D':'#F7CB74')+'" opacity="0.9"/>'+
      '<text x="100" y="61" font-size="16" text-anchor="middle" fill="#543A0F">+</text></g>';
    var weedPct = Math.min(1, p.weedHours/OVERGROWN_THRESHOLD);
    var tufts = Math.round(weedPct*6);
    for (var t=0;t<tufts;t++){
      var wx = 45 + (t*20) + (t%2)*6, wy = 100 + (t%3)*8;
      content += '<g transform="translate('+wx+','+wy+')" opacity="'+(0.4+weedPct*0.5)+'"><path d="M-4,6 Q-5,-4 -1,-9" stroke="#8FA84A" stroke-width="2" fill="none"/><path d="M0,6 Q0,-5 0,-11" stroke="#9FBF5E" stroke-width="2" fill="none"/><path d="M4,6 Q5,-4 1,-9" stroke="#8FA84A" stroke-width="2" fill="none"/></g>';
    }
  } else if (p.status==='overgrown'){
    content = tillLines + '<g opacity="0.9">'+
      '<path d="M60,110 Q50,80 65,60 Q55,85 70,100" stroke="#5C7A3E" stroke-width="4" fill="none"/>'+
      '<path d="M130,112 Q145,85 128,58 Q142,88 122,102" stroke="#4F6B33" stroke-width="4" fill="none"/>'+
      '<path d="M100,116 Q95,90 105,65" stroke="#6B8A47" stroke-width="4" fill="none"/>'+
      '<ellipse cx="65" cy="100" rx="16" ry="8" fill="#5C7A3E" opacity="0.6"/><ellipse cx="128" cy="100" rx="16" ry="8" fill="#4F6B33" opacity="0.6"/>'+
      '</g>';
  } else if (p.status==='preparing' || p.status==='clearing'){
    content = '<g opacity="0.7"><rect x="30" y="80" width="140" height="7" rx="3" fill="#5A3A22"/><rect x="30" y="95" width="140" height="7" rx="3" fill="#5A3A22"/></g>';
    if (w){
      content += personSvg('laborer', true, 150, 55);
      content += '<g class="dust" style="transform-origin:150px 90px;"><circle cx="150" cy="90" r="5" fill="#C9A374"/></g>';
    } else {
      content += '<g transform="translate(100,68)" class="bob">'+
        '<line x1="-12" y1="-18" x2="6" y2="10" stroke="#7A5334" stroke-width="3.5" stroke-linecap="round"/>'+
        '<polygon points="4,8 14,14 10,22 0,16" fill="#8A8A8A"/>'+
        '<circle cx="8" cy="20" r="3" fill="#6E4429"/>'+
      '</g>';
    }
  } else if (p.status==='dead'){
    var deadDefStatic = TREE_TYPES[p.treeType];
    content = drawDeadTreeShape(deadDefStatic) + '<text x="150" y="40" font-size="18">💀</text>';
  } else if (p.status==='removing'){
    var remTreeDef = TREE_TYPES[p.treeType]; var remCfg2 = REMOVE_CONFIG[remTreeDef.category];
    content = drawDeadTreeShape(remTreeDef);
    if (w && w.type==='laborer'){
      content += personSvg('laborer', true, 60, 55, false, remCfg2.tool);
      content += '<g class="dust" style="transform-origin:75px 82px;"><rect x="75" y="82" width="4" height="4" fill="#8A6A45"/></g>'+
                 '<g class="dust" style="transform-origin:85px 78px; animation-delay:0.4s;"><rect x="85" y="78" width="3" height="3" fill="#6E5B45"/></g>';
    }
  } else if (p.status==='growing'){
    var def = TREE_TYPES[p.treeType]; var idx = stageInfo.idx;
    var dead = p.health<=0;
    if (idx===0){
      content = '<ellipse cx="100" cy="88" rx="26" ry="10" fill="#5A3A22"/>'+
        '<g class="bob" style="transform-origin:100px 80px;">'+
          '<circle cx="100" cy="81" r="7" fill="#C8963E"/>'+
          '<path d="M100,80 Q106,70 109,66 Q103,71 100,80" fill="#79B25F"/>'+
          '<circle cx="100" cy="81" r="3.5" fill="#F0AC3D"/>'+
        '</g>'+
        '<g transform="translate(100,50)">'+
          '<rect x="-26" y="-10" width="52" height="20" rx="10" fill="rgba(251,246,236,0.92)" stroke="#79B25F" stroke-width="1.5"/>'+
          '<text x="0" y="4" font-size="10" text-anchor="middle" font-weight="800" fill="#2C4A32">🌱 Seed</text>'+
        '</g>';
    }
    else if (idx===1){ content = '<g class="'+(dead?'':'sway')+'"><rect x="97" y="60" width="6" height="26" fill="'+(dead?'#7A6A4E':'#588A46')+'"/><circle cx="100" cy="58" r="9" fill="'+(dead?'#A69B7A':'#79B25F')+'"/></g>'; }
    else if (def.shape==='bush'){
      var dots='';
      var dotsFromIdx = def.stages.length-1;
      if (def.dotColor && idx>=dotsFromIdx && !dead) dots = '<circle cx="86" cy="78" r="4" fill="'+def.dotColor+'"/><circle cx="112" cy="82" r="4" fill="'+def.dotColor+'"/><circle cx="100" cy="70" r="4" fill="'+def.dotColor+'"/>';
      var bc = dead ? '#A69B7A' : def.canopy;
      content = '<g class="'+(dead?'':'sway')+'" style="transform-origin:100px 86px;">'+
        '<ellipse cx="86" cy="86" rx="16" ry="12" fill="'+bc+'"/><ellipse cx="114" cy="86" rx="16" ry="12" fill="'+bc+'"/><ellipse cx="100" cy="78" rx="18" ry="13" fill="'+bc+'"/>'+
        dots + '</g>';
    } else {
      var trunkH = 42; var canopyR = 26 + Math.min(idx,3)*3;
      var dots2=''; var dotsFromIdx2 = def.stages.length-2;
      if (def.dotColor && idx>=dotsFromIdx2 && !dead) dots2 = '<circle cx="86" cy="42" r="4" fill="'+def.dotColor+'"/><circle cx="114" cy="38" r="4" fill="'+def.dotColor+'"/><circle cx="100" cy="26" r="4" fill="'+def.dotColor+'"/>';
      var barkMarks = def.barkMarks ? '<line x1="97" y1="55" x2="103" y2="52" stroke="#8A8578" stroke-width="1.5"/><line x1="96" y1="68" x2="102" y2="66" stroke="#8A8578" stroke-width="1.5"/>' : '';
      var defDrawn = dead ? Object.assign({}, def, {canopy:'#A69B7A'}) : def;
      content = '<g class="'+(dead?'':'sway')+'" style="transform-origin:100px 84px;">'+
        '<rect x="94" y="'+(84-trunkH)+'" width="12" height="'+trunkH+'" rx="4" fill="'+(def.trunk||'#7A5334')+'"/>'+ barkMarks +
        drawCanopy(defDrawn, 100, 84-trunkH-canopyR*0.5, canopyR) + dots2 + '</g>';
      if (def.o2AtStage[idx]>0 && !dead){
        content += '<g class="rise"><circle cx="72" cy="40" r="3.5" fill="#F0AC3D" opacity="0.8"/></g>'+
                   '<g class="rise2"><circle cx="128" cy="46" r="2.8" fill="#F0AC3D" opacity="0.7"/></g>';
      }
    }
    if (dead && idx>1){ content += '<text x="150" y="35" font-size="16">💤</text>'; }

    if (p.harvesting){
      var hpct = Math.min(100, Math.round((Date.now()-p.harvestStartReal)/4000*100));
      content += personSvg('farmer', true, 155, 60, true).replace('class="bob"','class="bob-fast"');
      content += '<g transform="translate(100,4)">'+
        '<circle r="14" fill="none" stroke="#00000022" stroke-width="5"/>'+
        '<circle r="14" fill="none" stroke="'+ 'var(--blue,#5A8FBF)' +'" stroke-width="5" stroke-dasharray="'+(2*Math.PI*14)+'" stroke-dashoffset="'+((2*Math.PI*14)-(2*Math.PI*14*hpct/100))+'" stroke-linecap="round" transform="rotate(-90)"/>'+
        '<text x="0" y="4" font-size="8" text-anchor="middle" fill="#2C4A32" font-weight="700">🧺'+hpct+'%</text></g>';
    } else if (w){
      content += personSvg(w.type, true, 158, 60);
    }

    if (careActive){
      if (p.careAnimType==='water'){
        content += '<g transform="translate(60,50)">'+personSvg('farmer', true, 0, 0)+'</g>';
        content += '<g class="drop" style="transform-origin:78px 62px;"><circle cx="78" cy="62" r="2.5" fill="#5A8FBF"/></g>'+
                   '<g class="drop" style="animation-delay:0.3s; transform-origin:84px 66px;"><circle cx="84" cy="66" r="2.2" fill="#5A8FBF"/></g>';
      } else if (p.careAnimType==='prune'){
        content += '<g transform="translate(60,50)">'+personSvg('laborer', true, 0, 0)+'</g>';
        content += '<g class="snip" style="transform-origin:82px 58px;"><path d="M78,54 L88,62 M88,54 L78,62" stroke="#8A8A8A" stroke-width="2.4" stroke-linecap="round"/></g>';
      }
    }
  }

  if (p.accessories && p.accessories.irrigation) content += '<text x="22" y="145" font-size="15">💧</text>';
  if (p.accessories && p.accessories.fertilizer) content += '<text x="44" y="145" font-size="15">🌾</text>';

  if (p.animal){
    var an = ANIMALS.find(function(x){return x.key===p.animal.key;});
    content += '<g class="critter-bounce" transform="translate(40,50)"><text x="0" y="0" font-size="26">'+an.emoji+'</text></g>';
    content += '<g class="pulse" transform="translate(40,24)"><circle r="9" fill="#E8785A"/><text x="0" y="4" font-size="11" text-anchor="middle" fill="white" font-weight="800">!</text></g>';
  }

  var progressPct=0;
  if (p.status==='preparing' || p.status==='clearing'){ var dur = p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS; progressPct = Math.min(100, Math.round((p.taskHours/dur)*100)); }
  else if (p.status==='removing'){ var remDur = REMOVE_CONFIG[TREE_TYPES[p.treeType].category].hours; progressPct = Math.min(100, Math.round((p.taskHours/remDur)*100)); }
  else if (p.status==='growing' && !p.harvesting && !stageInfo.isFinal) progressPct = stageInfo.pct;

  var ring='';
  if (progressPct>0 && progressPct<100){
    ring = '<g transform="translate(100,4)">'+
      '<circle r="14" fill="none" stroke="#00000022" stroke-width="5"/>'+
      '<circle r="14" fill="none" stroke="#F0AC3D" stroke-width="5" stroke-dasharray="'+(2*Math.PI*14)+'" stroke-dashoffset="'+((2*Math.PI*14)-(2*Math.PI*14*progressPct/100))+'" stroke-linecap="round" transform="rotate(-90)"/>'+
      '<text x="0" y="4" font-size="9" text-anchor="middle" fill="#2C4A32" font-weight="700">'+progressPct+'%</text></g>';
  }
  return '<svg viewBox="0 0 200 150">'+bed+content+ring+'</svg>';
}

function plotSpotHtml(p, layout){
  var stageInfo = plotStageInfo(p);
  var def = p.treeType ? TREE_TYPES[p.treeType] : null;
  var dur = p.status==='preparing' ? PREP_DURATION_HOURS : (p.status==='clearing' ? CLEAR_DURATION_HOURS : 0);
  var taskPct = dur > 0 ? Math.round(Math.min(100, (p.taskHours/dur)*100)) : 0;
  var remDur = p.status==='removing' && def ? REMOVE_CONFIG[def.category].hours : 0;
  var remPct = remDur > 0 ? Math.round(Math.min(100, (p.taskHours/remDur)*100)) : 0;

  var labelText = p.status==='barren' ? 'Plot '+(p.id+1) :
    p.status==='overgrown' ? '⚠️ Overgrown' :
    p.status==='preparing' ? '⛏️ Digging '+taskPct+'%' :
    p.status==='clearing' ? '🌿 Clearing '+taskPct+'%' :
    p.status==='dead' ? '💀 Dead #'+p.treeId :
    p.status==='removing' ? '🪓 Removing '+remPct+'%' :
    p.status==='ready' ? '✅ Ready to plant' :
    (p.health<=0 ? '💤 Stalled #'+p.treeId : stageInfo.name+' #'+p.treeId);

  var healthBar='';
  if (p.status==='preparing' || p.status==='clearing'){
    healthBar = '<div class="health-mini"><div class="fill" style="width:'+taskPct+'%;background:#F0AC3D;"></div></div>';
  } else if (p.status==='removing'){
    healthBar = '<div class="health-mini"><div class="fill" style="width:'+remPct+'%;background:#E8785A;"></div></div>';
  } else if (p.status==='growing'){
    var hColor = p.health>=70 ? '#6FA85A' : (p.health>=40 ? '#F0AC3D' : '#E8785A');
    healthBar = '<div class="health-mini"><div class="fill" style="width:'+p.health+'%;background:'+hColor+';"></div></div>';
  }
  return '<div class="plot-spot" style="top:'+layout.top+'%;left:'+layout.left+'%;width:'+layout.w+'%;height:'+layout.h+'%;" data-plot="'+p.id+'">'+
    '<div class="plot-label">'+(def?def.icon+' ':'')+labelText+'</div>'+ plotSvg(p) + healthBar +
    '<div class="plot-sub">'+ (p.assignedWorker!==null?'👷':'') + ((p.accessories&&(p.accessories.irrigation||p.accessories.fertilizer))?'🧰':'') + (p.pendingHarvest>0.5?'🧺':'') +'</div>'+
  '</div>';
}
function storageSpotHtml(){
  if (!state.storage.built && !state.storage.building) return '';
  var icon = state.storage.built ? '🏚️' : '🏗️';
  var label;
  if (state.storage.building){ label = 'Building '+Math.round(Math.min(100,(state.storage.buildHours/STORAGE_BUILD_HOURS)*100))+'%'; }
  else if (state.storage.expanding){ label = 'Expanding '+Math.round(Math.min(100,(state.storage.expandHours/STORAGE_EXPAND_HOURS)*100))+'%'; }
  else { label = '€'+Math.round(state.storage.stored)+' / €'+state.storage.capacity; }
  var fillPct = state.storage.built ? Math.min(100, Math.round((state.storage.stored/Math.max(1,state.storage.capacity))*100)) : 0;
  var fillColor = fillPct>=85 ? '#E8785A' : (fillPct>=60 ? '#F0AC3D' : '#6FA85A');
  return '<div class="plot-spot" style="top:'+STORAGE_SPOT.top+'%;left:'+STORAGE_SPOT.left+'%;width:'+STORAGE_SPOT.w+'%;height:'+STORAGE_SPOT.h+'%;" data-storage="1">'+
    '<div class="plot-label">'+label+'</div>'+
    '<svg viewBox="0 0 100 100" style="overflow:visible;"><text x="50" y="60" font-size="42" text-anchor="middle">'+icon+'</text></svg>'+
    (state.storage.built ? '<div class="health-mini"><div class="fill" style="width:'+fillPct+'%;background:'+fillColor+';"></div></div>' : '')+
  '</div>';
}

function drawGardenScene(flowerType){
  var f = flowerType ? FLOWER_TYPES[flowerType] : null;
  var c1 = f ? f.colors[0] : '#B7C4A9', c2 = f ? f.colors[1] : '#9FB58C';
  var s = '<svg viewBox="0 0 100 60" style="width:100%;height:100%;overflow:visible;">'+
    '<rect x="4" y="16" width="92" height="38" rx="8" fill="#6E4429"/>'+
    '<rect x="7" y="19" width="86" height="32" rx="7" fill="#7A5334"/>'+
    (function(){ var t=''; for (var x=10;x<94;x+=9){ t+='<path d="M'+x+',22 Q'+(x+2)+',36 '+x+',48" stroke="#6E4429" stroke-width="1.4" fill="none" opacity="0.35"/>'; } return t; })();
  var positions = [[16,30],[26,40],[36,26],[46,42],[56,28],[66,40],[76,26],[86,38],[21,46],[61,46],[41,32],[81,30]];
  positions.forEach(function(pos,i){
    var color = i%2===0?c1:c2;
    s += '<g class="sway" style="transform-origin:'+pos[0]+'px '+pos[1]+'px; animation-delay:'+(i*0.15)+'s;">'+
      '<rect x="'+(pos[0]-0.8)+'" y="'+(pos[1]-1)+'" width="1.6" height="9" fill="#4F8A45"/>'+
      '<circle cx="'+pos[0]+'" cy="'+(pos[1]-4)+'" r="4" fill="'+color+'"/>'+
      '<circle cx="'+pos[0]+'" cy="'+(pos[1]-4)+'" r="1.4" fill="#F0AC3D"/>'+
    '</g>';
  });
  s += '</svg>';
  return s;
}
function buildingSpotHtml(key){
  var b = state.buildings[key]; var def = BUILDING_TYPES[key]; var layout = VILLAGE_LAYOUT[key];
  var needsChoice = b.built && ((key==='garden' && !b.flowerType) || (key==='pond' && !b.specialization));
  var label = b.building ? Math.round(Math.min(100,(b.buildHours/def.buildHours)*100))+'%' :
    (needsChoice ? def.label+' — choose!' :
    (key==='garden' && b.built ? FLOWER_TYPES[b.flowerType].label :
    (key==='pond' && b.built ? POND_SPECIALIZATIONS[b.specialization].label : def.label)));
  var opacity = b.built ? 1 : (b.building ? 0.9 : 0.45);
  var inner;
  if (b.built && key==='pond' && b.specialization){ inner = drawPondScene(b.specialization); }
  else if (b.built && key==='garden' && b.flowerType){ inner = drawGardenScene(b.flowerType); }
  else if (needsChoice){ inner = '<div style="font-size:clamp(16px,2.2vw,24px);line-height:1;" class="pulse">❓</div>'; }
  else { inner = '<div style="font-size:clamp(18px,2.6vw,30px);line-height:1;">'+(b.building?'🏗️':def.icon)+'</div>'; }
  return '<div class="plot-spot" style="top:'+layout.top+'%;left:'+layout.left+'%;width:'+layout.w+'%;height:'+layout.h+'%;opacity:'+opacity+';display:flex;align-items:center;justify-content:center;background:rgba(251,246,236,0.35);border-radius:10px;overflow:hidden;" data-building="'+key+'">'+
    '<div class="plot-label">'+label+'</div>'+ inner +
  '</div>';
}
function villageSpotsHtml(){ return BUILDING_ORDER.map(buildingSpotHtml).join(''); }

  }

        '<input type="email" id="authEmail" placeholder="Email Address" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;margin-bottom:6px;font-size:0.8rem;box-sizing:border-box;">'+
        '<input type="password" id="authPassword" placeholder="Password" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;margin-bottom:6px;font-size:0.8rem;box-sizing:border-box;">'+

function modalHtml(){
  if (!activeModal) return '';
  if (activeModal.type==='storage') return storageModalHtml();
  if (activeModal.type==='bank') return bankModalHtml();
  if (activeModal.type==='building') return buildingModalHtml(activeModal.plotId);
  if (activeModal.type==='auth') return authModalHtml();
  var p = state.plots[activeModal.plotId];
  var def = p.treeType ? TREE_TYPES[p.treeType] : null;
  var stageInfo = plotStageInfo(p);
  var w = workerOnPlot(p.id);

  var html = '<div class="overlay" id="modalOverlay"><div class="modal">'+
    '<h2>'+(def?def.icon+' ':'')+'Plot '+(p.id+1)+(def?' — '+def.label+' <span style="font-size:0.7rem;color:var(--pine-soft);">#'+p.treeId+'</span>':'')+
    '<button class="close-modal" data-closemodal="1">✕</button></h2>';

  if (p.animal){
    var an = ANIMALS.find(function(x){return x.key===p.animal.key;});
    html += '<div class="animal-alert"><span class="em">'+an.emoji+'</span> <b>'+an.name+' spotted!</b><br>'+an.fact+
      '<button class="primary" data-scare="'+p.id+'">Scare Away (€'+SCARE_COST+')</button></div>';
  }

  if (p.status==='barren'){
    html += '<div class="sub">Empty land. Weeds build up over time if left untouched.</div>'+
      '<div class="row"><span>Weed level</span><span class="v">'+Math.round(Math.min(100,p.weedHours/OVERGROWN_THRESHOLD*100))+'%</span></div>'+
      '<button class="primary" data-prep="'+p.id+'" '+(state.money<LABOR_COST?'disabled':'')+'>Dig Land (€'+LABOR_COST+' · 3h)</button>';
  } else if (p.status==='overgrown'){
    html += '<div class="sub">This plot became overgrown from neglect and needs clearing before you can dig or plant.</div>'+
      '<button class="primary" data-clear="'+p.id+'" '+(state.money<CLEAR_COST?'disabled':'')+'>Clear Overgrowth (€'+CLEAR_COST+' · 2h)</button>';
  } else if (p.status==='preparing' || p.status==='clearing'){
    var dur = p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS;
    var pct = Math.round(Math.min(100,(p.taskHours/dur)*100));
    html += '<div class="sub">'+(p.status==='preparing'?'Digging in progress. Soil will be ready for planting once complete.':'Clearing overgrowth.')+'</div>'+
      '<div class="row"><span>Progress</span><span class="v">'+pct+'%</span></div>'+
      '<div class="healthbar" style="margin-bottom:12px;"><div class="fill" style="width:'+pct+'%;background:#F0AC3D;"></div></div>'+
      (w ? ('<div class="row"><span>Assisted by</span><span class="v">'+WORKER_TYPES[w.type].label+' (+50% speed)</span></div>'+
            '<button class="secondary" data-unassign="'+p.id+'" style="margin-top:6px;">Unassign Worker</button>')
         : (function(){
            var idleLaborers = state.workers.filter(function(x){return x.assignedPlot===null && x.type==='laborer';});
            if (!idleLaborers.length) return '<div class="empty-note">Tip: Hire a Laborer from the bottom tool strip to speed up digging by +50%.</div>';
            return '<div class="section"><h4>👷 Assign a Laborer (+50% speed)</h4>'+
              idleLaborers.map(function(iw){ return '<div class="worker-opt"><span>Laborer (idle)</span><button data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign</button></div>'; }).join('')+'</div>';
          })());
  } else if (p.status==='dead'){
    var remCfg = REMOVE_CONFIG[def.category];
    html += '<div class="sub">This '+def.label+' dried out completely after being neglected at 0% health for too long. It won\'t recover — it needs to be cut down before you can replant here.</div>'+
      '<div class="row"><span>Removal cost</span><span class="v">€'+remCfg.cost+'</span></div>'+
      '<div class="row"><span>Time needed</span><span class="v">'+remCfg.hours+'h'+(remCfg.vehicle?' + hauling':'')+'</span></div>'+
      (remCfg.salvagePct>0 ? '<div class="row"><span>Expected salvage</span><span class="v">≈€'+(remCfg.cost*remCfg.salvagePct).toFixed(2)+'</span></div>' : '')+
      '<button class="primary" data-removetree="'+p.id+'" '+(state.money<remCfg.cost?'disabled':'')+'>Cut down '+def.label+' (€'+remCfg.cost+')</button>'+
      '<div class="empty-note" style="margin-top:6px;">Assign a Laborer once removal starts to speed it up ('+remCfg.tool+(remCfg.vehicle?' + truck':'')+').</div>';
  } else if (p.status==='removing'){
    var remCfg2 = REMOVE_CONFIG[def.category];
    html += '<div class="sub">Cutting down the dead '+def.label+' with a '+remCfg2.tool+(remCfg2.vehicle?', then hauling it away by truck.':'.')+'</div>'+
      '<div class="row"><span>Progress</span><span class="v">'+Math.round(Math.min(100,(p.taskHours/remCfg2.hours)*100))+'%</span></div>'+
      (w ? '<div class="row"><span>Assisted by</span><span class="v">'+WORKER_TYPES[w.type].label+'</span></div>'
         : '<div class="empty-note">No worker assigned — this will take the full '+remCfg2.hours+'h. Assign a Laborer below to speed it up.</div>');
    var idleLaborers = state.workers.filter(function(x){return x.assignedPlot===null && x.type==='laborer';});
    if (!w && idleLaborers.length){
      html += idleLaborers.map(function(iw){ return '<div class="worker-opt"><span>Laborer (idle)</span><button data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign</button></div>'; }).join('');
    }
  } else if (p.status==='ready'){
    html += '<div class="sub">Soil is ready — but weeds will creep back if it sits unplanted too long. Every species from the blueprint\'s tree categories is available.</div>'+
      '<div class="row"><span>Weed level</span><span class="v">'+Math.round(Math.min(100,p.weedHours/OVERGROWN_THRESHOLD*100))+'%</span></div>';
    CATEGORY_ORDER.forEach(function(cat){
      html += '<div class="cat-head">'+cat+'</div><div class="grid2">';
      Object.keys(TREE_TYPES).forEach(function(k){
        var d = TREE_TYPES[k]; if (d.category!==cat) return;
        html += '<button class="plant-opt" data-plant="'+p.id+'" data-type="'+k+'" '+(state.money<d.cost?'disabled style="opacity:0.5;"':'')+'><span class="pn">'+d.icon+' '+d.label+'</span><span class="pc">€'+d.cost+'</span></button>';
      });
      html += '</div>';
    });
  } else if (p.status==='growing'){
    var hColor = p.health>=70 ? '#6FA85A' : (p.health>=40 ? '#F0AC3D' : '#E8785A');
    var kpi = plotKpi(p);
    html += '<div class="sub">'+def.category+' · stage: '+(p.health<=0?'stalled — no oxygen output':stageInfo.name)+'</div>'+
      '<div class="row"><span>Oxygen produced (this tree)</span><span class="v">'+p.o2Produced.toFixed(1)+' O₂</span></div>'+
      '<div class="row"><span>Health</span><span class="v">'+Math.round(p.health)+'%</span></div>'+
      '<div class="healthbar"><div class="fill" style="width:'+p.health+'%;background:'+hColor+';"></div></div>'+
      '<div class="kpi-box"><span class="big">'+kpi+'% KPI</span><br><span style="color:var(--pine-soft);">Efficiency = productive time ÷ total time since planting.'+
        (p.downtimeHours>0.05 ? (' Stalled '+p.downtimeHours.toFixed(1)+'h with 0% health so far.') : '')+'</span></div>';

    if (def.lateBonus){
      html += '<div class="section"><h4>🧺 Harvest</h4>'+
        '<div class="row"><span>Ready to harvest</span><span class="v">€'+p.pendingHarvest.toFixed(2)+'</span></div>'+
        (p.harvesting ? '<div class="empty-note">Farmer is picking… ('+Math.min(100,Math.round((Date.now()-p.harvestStartReal)/4000*100))+'%)</div>' :
          (p.pendingHarvest>0.5 ? ('<button class="primary" data-harvest="'+p.id+'" '+((!w||w.type!=='farmer')?'disabled':'')+'>Harvest now</button>'+
            ((!w||w.type!=='farmer')?'<div class="empty-note">Assign a Farmer below to harvest by hand.</div>':''))
          : '<div class="empty-note">Nothing ready yet.</div>'))+
        (!state.storage.built ? '<div class="empty-note">No Storage Room yet — half the value spoils automatically on each harvest. Build one from the Tasks panel.</div>'
          : '<div class="empty-note">Storage: €'+state.storage.stored.toFixed(0)+' / €'+state.storage.capacity+' — open the storage building to sell or expand.</div>')+
      '</div>';
    }

    html += '<div class="section"><h4>🩺 Care (real maintenance costs)</h4>'+
        '<button class="secondary" data-water="'+p.id+'" '+(state.money<CARE_COST.water[def.category]?'disabled':'')+'>💧 Water now — €'+CARE_COST.water[def.category]+' (+30 health)</button>'+
        (def.category!=='Vegetable' ? '<button class="secondary" data-prune="'+p.id+'" '+(state.money<CARE_COST.prune[def.category]?'disabled':'')+'>✂️ Prune now — €'+CARE_COST.prune[def.category]+' (+40 health)</button>' : '')+
      '</div>'+
      '<div class="section"><h4>🧰 Accessories</h4>'+
        Object.keys(ACCESSORIES).map(function(k){
          var acc = ACCESSORIES[k]; var owned = p.accessories[k];
          return '<div class="row"><span>'+acc.emoji+' '+acc.label+' <span style="color:var(--pine-soft);font-size:0.72rem;">('+acc.desc+')</span></span>'+
            (owned ? '<span class="v">✓ installed</span>' : '<button class="claim-btn" data-buyacc="'+k+'" data-buyplot="'+p.id+'" '+(state.money<acc.cost?'disabled':'')+'>€'+acc.cost+'</button>')+'</div>';
        }).join('')+
      '</div>'+
      '<div class="section"><h4>👷 Worker</h4>'+
        (w ? ('<div class="worker-opt"><span>'+WORKER_TYPES[w.type].label+' is assigned here</span><button data-unassign="'+p.id+'">Unassign</button></div>')
           : (function(){
              var idle = state.workers.filter(function(x){return x.assignedPlot===null && WORKER_TYPES[x.type].role==='grow';});
              if (!idle.length) return '<div class="empty-note">No idle Farmer/Botanist available — hire one from the tool strip below.</div>';
              return idle.map(function(iw){ return '<div class="worker-opt"><span>'+WORKER_TYPES[iw.type].label+' (idle)</span><button data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign</button></div>'; }).join('');
            })())+
      '</div>'+
      '<div class="section"><h4>💡 About this species</h4><div style="font-size:0.78rem;color:var(--pine-soft);">'+def.fact+'</div></div>';
  }

  html += '</div></div>';
  return html;
}

function panelHtml(){
  if (!openPanel) return '';
  if (openPanel==='tasks'){
    var rows=''; var any=false;
    if (!state.storage.built){
      any=true;
      if (state.storage.building){
        var spct = Math.round(Math.min(100,(state.storage.buildHours/STORAGE_BUILD_HOURS)*100));
        rows += '<div class="task-row"><div><div class="name">🏗 Building Storage Room</div><div class="meta">'+spct+'% done</div></div><button class="claim-btn" disabled>…</button></div>';
      } else {
        rows += '<div class="task-row"><div><div class="name">🏚 Build Storage Room</div><div class="meta">€'+STORAGE_COST+' · '+STORAGE_BUILD_HOURS+'h · stops harvest spoilage</div></div><button class="claim-btn" data-buildstorage="1" '+(state.money<STORAGE_COST?'disabled':'')+'>Build</button></div>';
      }

    } else {

      if (ratio >= STORAGE_WARN_RATIO){
        any=true;
        rows += '<div class="task-row"><div><div class="name">📦 Storage nearly full</div><div class="meta">€'+state.storage.stored.toFixed(0)+' / €'+state.storage.capacity+' — sell or expand</div></div><button class="claim-btn" data-sellstorage="1">Sell</button></div>';
      } else if (state.storage.stored > 0.5){
        any=true;
        rows += '<div class="task-row"><div><div class="name">🧺 Harvest waiting in storage</div><div class="meta">€'+state.storage.stored.toFixed(0)+' ready to sell</div></div><button class="claim-btn" data-sellstorage="1">Sell</button></div>';
      }
    }
    state.plots.forEach(function(p){
      if (p.status==='barren'){
        any=true; rows+='<div class="task-row"><div><div class="name">Plot '+(p.id+1)+' — Dig Land</div><div class="meta">€'+LABOR_COST+' · 3h</div></div><button class="claim-btn" data-prep="'+p.id+'">Start</button></div>';
      } else if (p.status==='overgrown'){
        any=true; rows+='<div class="task-row"><div><div class="name">Plot '+(p.id+1)+' — Clear Overgrowth</div><div class="meta">€'+CLEAR_COST+' · 2h</div></div><button class="claim-btn" data-clear="'+p.id+'">Clear</button></div>';
      } else if (p.status==='preparing' || p.status==='clearing'){
        any=true; var dur=p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS; var pct=Math.round(Math.min(100,(p.taskHours/dur)*100));
        rows+='<div class="task-row"><div><div class="name">Plot '+(p.id+1)+' — '+(p.status==='preparing'?'Digging Soil':'Clearing Weeds')+'</div><div class="meta">'+pct+'% done · '+(p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS)+'h</div></div><button class="claim-btn" disabled style="opacity:0.8;font-weight:800;">'+pct+'%</button></div>';
      } else if (p.status==='ready'){
        any=true;
        rows+='<div class="task-row" style="background:rgba(46,125,50,0.08);border-left:3px solid #2E7D32;"><div><div class="name">✅ Plot '+(p.id+1)+' — Dig Complete</div><div class="meta">Soil ready · Select seed to plant</div></div><button class="claim-btn active" data-openplot="'+p.id+'" style="background:var(--forest,#2C4A32);color:#FFF;">Plant</button></div>';
      } else if (p.status==='growing' && p.pendingHarvest >= 0.5 && !p.harvesting){
        any=true; var defH = TREE_TYPES[p.treeType];
        rows+='<div class="task-row"><div><div class="name">🧺 Plot '+(p.id+1)+' — Harvest '+defH.label+'</div><div class="meta">€'+p.pendingHarvest.toFixed(2)+' ripe harvest waiting</div></div><button class="claim-btn" data-openplot="'+p.id+'" style="background:#5A8FBF;color:#FFF;">Harvest</button></div>';
      } else if (p.status==='growing' && p.health < 60){
        any=true; var defW = TREE_TYPES[p.treeType];
        rows+='<div class="task-row"><div><div class="name">💧 Plot '+(p.id+1)+' — Care for '+defW.label+'</div><div class="meta">Health at '+Math.round(p.health)+'% · Water needed</div></div><button class="claim-btn" data-openplot="'+p.id+'" style="background:#E8785A;color:#FFF;">Care</button></div>';
      } else if (p.status==='dead'){
        any=true; var deadDef=TREE_TYPES[p.treeType]; var remCfg3=REMOVE_CONFIG[deadDef.category];
        rows+='<div class="task-row"><div><div class="name">💀 Plot '+(p.id+1)+' — Remove Dead '+deadDef.label+'</div><div class="meta">€'+remCfg3.cost+' · '+remCfg3.hours+'h · needs a Laborer</div></div><button class="claim-btn" data-removetree="'+p.id+'" '+(state.money<remCfg3.cost?'disabled':'')+'>Remove</button></div>';
      } else if (p.status==='removing'){
        any=true; var remDef2=TREE_TYPES[p.treeType]; var remCfg4=REMOVE_CONFIG[remDef2.category]; var rpct=Math.round(Math.min(100,(p.taskHours/remCfg4.hours)*100));
        rows+='<div class="task-row"><div><div class="name">🪓 Plot '+(p.id+1)+' — Cutting down '+remDef2.label+'</div><div class="meta">'+rpct+'% done'+(p.assignedWorker!==null?' · 👷 assisted':' · assign a Laborer to speed up')+'</div></div><button class="claim-btn" disabled style="opacity:0.8;font-weight:800;">'+rpct+'%</button></div>';
      }
    });
    if (!any) rows = '<div class="empty-note">No pending tasks right now.</div>';
    return '<div class="float-panel"><h2>📋 Tasks<span class="close-x" data-closepanel="1">✕</span></h2>'+rows+'</div>';
  }
  if (openPanel==='workers'){
    var dailyWage = state.workers.reduce(function(s,w){return s+WORKER_TYPES[w.type].wage;},0);
    var roster = state.workers.length ? state.workers.map(function(w){
      var loc = w.assignedPlot!==null ? 'Plot '+(w.assignedPlot+1) : 'Idle';
      return '<div class="roster-chip"><span>'+WORKER_TYPES[w.type].label+' · '+loc+'</span><button class="fire" data-fire="'+w.id+'">Let go</button></div>';
    }).join('') : '<div class="empty-note">No workers hired yet. Hire from the tool strip at the bottom of the screen.</div>';
    return '<div class="float-panel"><h2>👷 Workers<span class="close-x" data-closepanel="1">✕</span></h2>'+
      (dailyWage?'<div class="empty-note">Payroll: €'+dailyWage+'/day</div>':'')+'<div class="roster">'+roster+'</div></div>';
  }
  if (openPanel==='achievements'){
    var ach = ACHIEVEMENTS.map(function(a){ return '<div class="ach'+(state.achUnlocked[a.id]?' unlocked':'')+'">'+a.label+'</div>'; }).join('');
    return '<div class="float-panel"><h2>🏆 Achievements<span class="close-x" data-closepanel="1">✕</span></h2><div class="ach-grid">'+ach+'</div></div>';
  }
  if (openPanel==='reports'){
    var reps = state.reports.length ? state.reports.map(function(r){ return '<div class="report-item"><span class="rtime">Day '+(Math.floor(r.gameHour/24)+1)+'</span>'+r.text+'</div>'; }).join('') : '<div class="empty-note">No reports yet. Hire a Botanist to generate plant health reports, and watch for wildlife.</div>';
    return '<div class="float-panel"><h2>📰 Reports<span class="close-x" data-closepanel="1">✕</span></h2>'+reps+'</div>';
  }
  return '';
}

function bonusText(){
  var fBonus=forestBonus(), dBonus=diversityBonus(), eBonus=engineerBonus();
  var parts=[]; if (fBonus) parts.push('Forest +10%'); if (dBonus) parts.push('Diversity +15%'); if (eBonus) parts.push('Worker Eff +10%');
  if (visitorMagnetActive()) parts.push('Visitor Magnet +20%');
  return parts.length?parts.join(' · '):'No active bonuses';
}
// The speed <select> is built ONCE and never rebuilt — replacing it every tick was
// destroying the native dropdown mid-interaction, which is why selection wasn't sticking.
function buildSeasonChipOnce(){
  var speedOpts = SPEED_OPTIONS.map(function(o){ return '<option value="'+o.factor+'" '+(o.factor===state.speedFactor?'selected':'')+'>'+o.label+'</option>'; }).join('');
  var el = document.getElementById('seasonChipStatic');
  if (!el) return;
  el.innerHTML = '<span id="bonusTextSpan">'+bonusText()+'</span>&nbsp;|&nbsp;Speed <select id="speedSel">'+speedOpts+'</select>';
  var sel = document.getElementById('speedSel');
  if (sel) sel.addEventListener('change', function(e){ setSpeed(parseInt(e.target.value, 10)); });
}
function countPendingTasks(){
  var n = 0;
  if (!state.storage.built && !state.storage.building) n++;
  state.plots.forEach(function(p){
    if (['barren','overgrown','ready','dead'].indexOf(p.status) >= 0) n++;
  });
  if (state.buildings.garden.built && !state.buildings.garden.flowerType) n++;
  if (state.buildings.pond.built && !state.buildings.pond.specialization) n++;
  return n;
}
function dockHtml(){
  var taskCount = countPendingTasks();

    '<div class="dock-btn'+(openPanel==='tasks'?' active':'')+'" data-panel="tasks" title="Tasks">📋'+taskBadge+'</div>'+

function toolStripHtml(){

    chips += '<div class="tool-chip" data-tip="'+wt.label+'\\n€'+wt.wage+'/day\\n'+wt.desc+'" data-hire="'+k+'"><span class="em">👷</span>'+wt.label+'</div>';
  });
  Object.keys(ACCESSORIES).forEach(function(k){
    var acc = ACCESSORIES[k];
    chips += '<div class="tool-chip info" data-tip="'+acc.label+'\\n€'+acc.cost+'\\n'+acc.desc+'\\n(buy from a plot)"><span class="em">'+acc.emoji+'</span>'+acc.label+'</div>';
  });
  chips += '<div class="tool-chip info" data-tip="Watering cost varies by tree\\ncategory (€6-11).\\nOpen a growing plot to water."><span class="em">💧</span>Water</div>';
  chips += '<div class="tool-chip info" data-tip="Pruning cost varies by tree\\ncategory (€14-24).\\nOpen a growing plot to prune."><span class="em">✂️</span>Prune</div>';

}
function buildToolStripOnce(){
  var ts = document.getElementById('toolStrip');
  if (!ts) return;
  ts.innerHTML = toolStripHtml();
  var tip = document.getElementById('toolTip');
  document.querySelectorAll('.tool-chip').forEach(function(chip){
    chip.addEventListener('mouseenter', function(){
      var text = chip.getAttribute('data-tip');
      tip.textContent = text;
      var r = chip.getBoundingClientRect();
      var left = Math.min(window.innerWidth-200, Math.max(10, r.left + r.width/2 - 95));
      tip.style.left = left+'px';
      tip.style.top = (r.top-8)+'px';
      tip.style.transform = 'translateY(-100%)';
      tip.classList.add('show');
    });
    chip.addEventListener('mouseleave', function(){ tip.classList.remove('show'); });
    chip.addEventListener('click', function(){
      var hireType = chip.getAttribute('data-hire');
      if (hireType) hireWorker(hireType);
    });
  });
}

// Replaces a container's HTML while preserving the scrollTop of a named inner
// element — without this, any element scrolled to inside a container gets reset
// to the top every time that container's HTML is rebuilt (which happens every
// game tick for the modal/panel, since they show live-updating numbers).
function replacePreservingScroll(containerId, innerSelector, newHtml){
  var container = document.getElementById(containerId);
  if (!container) return;
  var prevInner = container.querySelector(innerSelector);
  var prevScroll = prevInner ? prevInner.scrollTop : null;
  container.innerHTML = newHtml;
  if (prevScroll !== null){
    var newInner = container.querySelector(innerSelector);
    if (newInner) newInner.scrollTop = prevScroll;
  }
}

    if (fScreen) fScreen.style.display = 'block';

    if (bonusSpan) bonusSpan.textContent = bonusText();

    var bgEl = document.getElementById('fieldBg');
    if (bgEl && !bgEl.dataset.built){ bgEl.innerHTML = fieldBackgroundSVG(); bgEl.dataset.built='1'; }

  replacePreservingScroll('modalLayer', '.modal', modalHtml());

      '<div class="row"><span>Game time passed</span><span class="v">'+s.gameHours+' hours</span></div>'+
      '<div class="row"><span>Oxygen produced</span><span class="v">+'+s.o2Gained+' O₂</span></div>'+
      '<div class="row"><span>Income earned</span><span class="v">+€'+s.moneyGained.toFixed(2)+'</span></div>'+
