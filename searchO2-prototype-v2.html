<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>searchO2 — Prototype v2 (Advanced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#EAF6E7; --panel:#FBF6EC; --pine:#2C4A32; --grass:#6FA85A; --gold:#F0AC3D; }
    body{ font-family:Nunito,Arial; margin:0; padding:18px; background:linear-gradient(#CDEDE8,#EAF6E7); color:var(--pine); }
    .wrap{ max-width:1100px; margin:0 auto; }
    header{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
    h1{ font-family:'Baloo 2'; margin:0; }
    .grid{ display:grid; grid-template-columns: 1fr 360px; gap:14px; margin-top:16px; }
    .panel{ background:var(--panel); border-radius:14px; padding:12px; box-shadow:0 8px 30px rgba(0,0,0,0.08); }
    .field-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
    .plot{ border-radius:12px; overflow:hidden; position:relative; aspect-ratio:1/1; cursor:pointer; }
    .stat{ display:flex; gap:8px; align-items:center; }
    .stat .val{ font-weight:800; }
    .small{ font-size:0.86rem; color:#4A6A50; }
    button{ background:var(--grass); color:white; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; }
    input,select{ padding:6px; border-radius:8px; border:1px solid rgba(0,0,0,0.08); }
    .list{ display:flex; flex-direction:column; gap:6px; }
    .row{ display:flex; justify-content:space-between; align-items:center; }
    .muted{ color:#56755A; }
    .leaderboard{ max-height:200px; overflow:auto; }
    /* top-left floating widgets */
    .tl-widgets{ position:fixed; left:16px; top:16px; z-index:60; display:flex; gap:8px; flex-direction:column; }
    .tl-icon{ width:44px; height:44px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); cursor:pointer; font-weight:800; }
    .widget-panel{ position:fixed; left:72px; top:16px; z-index:61; width:320px; background:var(--cream); border-radius:12px; padding:8px; box-shadow:0 20px 50px rgba(0,0,0,0.25); display:none; }
    .widget-panel.open{ display:block; }
    .accessories-bar{ display:flex; gap:8px; overflow:auto; padding:8px 4px; }
    .accessory{ min-width:90px; background:white; border-radius:8px; padding:8px; border:1px solid rgba(0,0,0,0.06); text-align:center; }
    .hint-box{ position:fixed; right:18px; top:18px; z-index:61; background:rgba(255,255,255,0.95); padding:10px 12px; border-radius:12px; box-shadow:var(--shadow); display:none; }
  </style>
</head>
<body>
<div class="wrap" id="app">Booting…</div>

<script>
// Prototype v2 — advanced features implementing many items from the Blueprint v2
(function(){
  // ----- constants -----
  var REAL_MS_PER_GAME_HOUR_SPEC = 15 * 60 * 1000;
  var SPEED_OPTIONS = [{label:'1x',f:1},{label:'60x',f:60},{label:'180x',f:180},{label:'600x',f:600}];
  var O2_RATE = 0.05; // € per O2 unit
  var PLOT_COUNT = 6;
  var PREP_DURATION_HOURS = 3;

  var TREE_TYPES = {
    oak:{label:'Oak',cost:120,stages:[{n:'Seed',h:1},{n:'Sprout',h:2},{n:'Young',h:4},{n:'Mature',h:99999}],o2:[0,0,2,6]},
    apple:{label:'Apple',cost:90,stages:[{n:'Seed',h:1},{n:'Sprout',h:1.5},{n:'Young',h:2.5},{n:'Fruiting',h:99999}],o2:[0,0,1.5,3.5],fruit:0.9},
    tomato:{label:'Tomato',cost:35,stages:[{n:'Seed',h:0.5},{n:'Sprout',h:0.5},{n:'Crop',h:1},{n:'Harvest',h:99999}],o2:[0,0,0.5,1],fruit:0.6}
  };

  var SEASONS = [{name:'Spring',growth:1.2,income:1},{name:'Summer',growth:1,income:1.25},{name:'Autumn',growth:1,income:1.2},{name:'Winter',growth:0.85,income:1}];
  var SEASON_LEN_GAME_HOURS = 96;

  var ACHIEVEMENTS = [
    {id:'first_tree',label:'First Tree',check:function(s){return s.treesPlanted>=1;}},
    {id:'green_starter',label:'100 O2',check:function(s){return s.totalO2AllTime>=100;}},
    {id:'forest_maker',label:'All Plots Planted',check:function(s){return s.plots.filter(p=>p.status==='growing').length===PLOT_COUNT;}}
  ];

  // ----- storage adapter (namespace) -----
  function makeStorage(ns){
    var prefix = 'searchO2_v2:' + (ns||'v1') + ':';
    return {
      get:function(k){return Promise.resolve().then(()=>localStorage.getItem(prefix+k)).then(v=>({value:v}));},
      set:function(k,v){return Promise.resolve().then(()=>localStorage.setItem(prefix+k,v));},
      remove:function(k){return Promise.resolve().then(()=>localStorage.removeItem(prefix+k));}
    };
  }
  window.storage = makeStorage('app');

  // ----- very small 'server' simulator implementing server-authoritative rules -----
  var server = (function(){
    var sstorage = makeStorage('server');
    // server state is authoritative source-of-truth for economy values
    var stateKey = 'server-state';
    function initDefault(){
      return {
        users:{}, // userId -> user state
        leaderboard:[]
      };
    }
    function load(){ return sstorage.get(stateKey).then(r=>{ if(!r.value) return initDefault(); try{return JSON.parse(r.value);}catch(e){return initDefault();}}); }
    function save(st){ return sstorage.set(stateKey, JSON.stringify(st)); }

    // helper: recompute rewards for a user given an action timestamp and authoritative startedAt
    function advanceUserBy(user, dh){
      if (dh<=0) return;
      // simple growth: each growing plot produces O2 and money
      var seasonIdx = Math.floor((user.gameHour % (SEASON_LEN_GAME_HOURS*4)) / SEASON_LEN_GAME_HOURS);
      var season = SEASONS[seasonIdx];
      user.gameHour += dh;
      var planted = user.plots.filter(p=>p.status==='growing');
      var fbonus = planted.length===PLOT_COUNT?0.10:0;
      var types = {}; planted.forEach(p=>p.treeType && (types[p.treeType]=true));
      var dbonus = Object.keys(types).length>=2?0.15:0;
      var totalMult = 1 + fbonus + dbonus;
      planted.forEach(function(p){
        var def = TREE_TYPES[p.treeType];
        var growDh = dh * season.growth;
        p.growHours += growDh;
        var idx = stageIndexFor(def, p.growHours);
        var o2Rate = def.o2[idx] || 0;
        var o2Gain = o2Rate * dh;
        user.totalO2 += o2Gain; user.totalO2AllTime += o2Gain;
        p.o2Total = (p.o2Total||0) + o2Gain;
        var inc = o2Gain * O2_RATE * totalMult;
        var isFruit = (def.stages[idx].n==='Fruiting' || def.stages[idx].n==='Harvest');
        if(isFruit && def.fruit) inc += def.fruit * dh * season.income * totalMult;
        user.money += inc;
      });
    }

    function stageIndexFor(def, growHours){ var acc=0; for(var i=0;i<def.stages.length;i++){ acc+=def.stages[i].h; if(growHours<acc) return i;} return def.stages.length-1; }

    // API: create user (guest)
    function createGuest(name){
      return load().then(st=>{
        var id = 'u_'+Math.random().toString(36).slice(2,10);
        var user = { id:id, name:name||('Guest-'+id.slice(-4)), money:10000, totalO2:0, totalO2AllTime:0, treesPlanted:0, plots:[], gameHour:0, ach:{}, workers:[], buildings:[], lastActionTs:0 };
        for(var i=0;i<PLOT_COUNT;i++) user.plots.push({id:i,status:'barren',treeType:null,growHours:0,prepHours:0, treeUid:null, o2Total:0});
        st.users[id]=user; save(st); return user;
      });
    }

    function getUser(id){ return load().then(st=>st.users[id] || null); }

    // server-validated action: start preparation
    function startPrep(userId, plotId){
      return load().then(st=>{
        var user = st.users[userId]; if(!user) throw new Error('User not found');
        var p = user.plots[plotId]; if(!p) throw new Error('Invalid plot');
        if(p.status !== 'barren') throw new Error('Plot not available');
        var cost = 15; if(user.money < cost) throw new Error('Insufficient funds');
        // validation passed
        user.money -= cost; p.status='preparing'; p.prepHours=0; user.lastActionTs=Date.now();
        save(st); return {user:user};
      });
    }

    // server-validated: plant
    function plantTree(userId, plotId, type){
      return load().then(st=>{
        var user = st.users[userId]; if(!user) throw new Error('User not found');
        var p = user.plots[plotId]; if(!p) throw new Error('Invalid plot');
        if(p.status!=='ready') throw new Error('Plot not ready');
        var def = TREE_TYPES[type]; if(!def) throw new Error('Unknown tree');
        if(user.money < def.cost) throw new Error('Insufficient funds');
        user.money -= def.cost; p.status='growing'; p.treeType=type; p.growHours=0; p.treeUid='t_'+Math.random().toString(36).slice(2,9); p.o2Total=0; user.treesPlanted=(user.treesPlanted||0)+1; user.lastActionTs=Date.now();
        save(st); return {user:user};
      });
    }

    // server-validated: tick advancement (simulate catch-up when client reconnects)
    function advanceUser(userId, realMs){ return load().then(st=>{
      var user = st.users[userId]; if(!user) throw new Error('User not found');
      var dh = (realMs/REAL_MS_PER_GAME_HOUR_SPEC) * (user.speedFactor||180);
      dh = Math.min(dh, 24*4*30);
      advanceUserBy(user, dh);
      save(st); return {user:user, dh:dh};
    }); }

    // update leaderboard
    function updateLeaderboard(user){ return load().then(st=>{
      var lb = st.leaderboard || [];
      var found = lb.find(it=>it.id===user.id);
      if(found){ found.o2=user.totalO2AllTime; found.money=user.money;} else lb.push({id:user.id,name:user.name,o2:user.totalO2AllTime,money:user.money});
      lb.sort((a,b)=>b.o2-a.o2); st.leaderboard=lb.slice(0,100); save(st); return st.leaderboard;
    }); }

    return { createGuest:createGuest, getUser:getUser, startPrep:startPrep, plantTree:plantTree, advanceUser:advanceUser, updateLeaderboard:updateLeaderboard };
  })();

  // ----- client app state & helpers -----
  var state = null; var tickHandle=null; var lastRealTs = Date.now();

  function freshClientState(){
    var plots=[]; for(var i=0;i<PLOT_COUNT;i++) plots.push({id:i,status:'barren',treeType:null,growHours:0,prepHours:0});
    return { userId:null, name:null, money:0, totalO2:0, totalO2AllTime:0, treesPlanted:0, plots:plots, speedFactor:180, lastSaveReal:Date.now(), ach:{}, offlineSummary:null };
  }

  function saveClient(){ state.lastSaveReal = Date.now(); return window.storage.set('client-save', JSON.stringify(state)); }
  function loadClient(){ return window.storage.get('client-save').then(r=>{ if(!r.value) state=freshClientState(); else try{ state=JSON.parse(r.value);}catch(e){ state=freshClientState(); } return state; }); }

  // ----- UI rendering -----
  function render(){ if(!state) return; var season = SEASONS[Math.floor((state.gameHour||0)%(SEASON_LEN_GAME_HOURS*4)/SEASON_LEN_GAME_HOURS)];
    var top = '<header><div><h1>searchO2 — Prototype v2</h1><div class="small">Advanced local prototype (server-simulated)</div></div>'+
      '<div class="stat"><div class="small">User</div><div class="val">'+(state.name||'—')+'</div></div></header>';

    var plotsHtml = state.plots.map(p=>renderPlot(p)).join('');

    var rightCol = '<div class="panel">'+
      '<h3>Stats</h3><div class="row"><div class="small">Balance</div><div class="val">€'+(state.money||0).toFixed(2)+'</div></div>'+
      '<div class="row"><div class="small">Total O₂</div><div class="val">'+(state.totalO2||0).toFixed(1)+'</div></div>'+
      '<hr/>'+
      '<h3>Controls</h3><div class="list">'+
      '<button id="btnExport">Export Save</button><button id="btnImport">Import Save</button>'+
      '<div class="small">Clock speed <select id="speedSel">'+SPEED_OPTIONS.map(o=>'<option value="'+o.f+'">'+o.label+'</option>').join('')+'</select></div>'+
      '</div></div>';

    var workersHtml = '<div class="panel"><h3>Workers</h3><div class="small">Hire workers to speed tasks (simulated)</div><div class="list">'+
      '<div class="row"><div>Laborer (€20/day)</div><button data-hire="laborer">Hire</button></div>'+
      '</div></div>';

    var leaderboardHtml = '<div class="panel"><h3>Leaderboard (shared server-sim)</h3><div id="lb" class="leaderboard muted">Loading…</div></div>';

    var html = top + '<div class="grid"><div><div class="panel"><h3>Field</h3><div class="field-grid">'+plotsHtml+'</div></div>'+workersHtml+'</div>'+rightCol + '</div>' + leaderboardHtml;
    document.getElementById('app').innerHTML = html;

    // wire events
    document.querySelectorAll('[data-prep]').forEach(b=>b.onclick=function(){ clientStartPrep(parseInt(b.getAttribute('data-prep'))); });
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick=function(){ openPicker(parseInt(b.getAttribute('data-open'))); });
    document.querySelectorAll('[data-plant]').forEach(b=>b.onclick=function(){ clientPlant(parseInt(b.getAttribute('data-plant')), b.getAttribute('data-type')); });
    var speedSel = document.getElementById('speedSel'); if(speedSel) speedSel.value = state.speedFactor; speedSel.onchange=function(){ state.speedFactor=parseInt(speedSel.value); saveClient(); };
    var btnExport = document.getElementById('btnExport'); if(btnExport) btnExport.onclick=exportSave;
    var btnImport = document.getElementById('btnImport'); if(btnImport) btnImport.onclick=importSave;
    refreshLeaderboard();
    // top-left widgets (tasks / achievements / hints / accessories)
    (function ensureTL(){
      if(document.getElementById('tlWidgets')) return;
      var tl = document.createElement('div'); tl.id='tlWidgets'; tl.className='tl-widgets';
      tl.innerHTML = '<div class="tl-icon" id="btnTasks">T</div><div class="tl-icon" id="btnAch">A</div><div class="tl-icon" id="btnHints">?</div><div class="tl-icon" id="btnAcc">$</div>';
      document.body.appendChild(tl);
      var panel = document.createElement('div'); panel.id='tlPanel'; panel.className='widget-panel'; document.body.appendChild(panel);
      document.getElementById('btnTasks').onclick = function(){ toggleWidget('tasks'); };
      document.getElementById('btnAch').onclick = function(){ toggleWidget('ach'); };
      document.getElementById('btnHints').onclick = function(){ toggleWidget('hints'); };
      document.getElementById('btnAcc').onclick = function(){ toggleWidget('acc'); };
    })();
    function toggleWidget(name){ var panel=document.getElementById('tlPanel'); if(panel.dataset.open===name){ panel.dataset.open=''; panel.classList.remove('open'); panel.innerHTML=''; return;} panel.dataset.open=name; panel.classList.add('open');
      if(name==='tasks'){ renderTasksPanel(); } else if(name==='ach'){ renderAchPanel(); } else if(name==='hints'){ renderHintsPanel(); } else if(name==='acc'){ renderAccPanel(); } }
    function renderTasksPanel(){ var panel=document.getElementById('tlPanel'); var html='<h4>Tasks</h4>';
      state.cleanupTasks = state.cleanupTasks||[]; if(state.cleanupTasks.length===0) html += '<div class="small muted">No cleanup tasks</div>'; else html += state.cleanupTasks.map(function(t){ return '<div class="task-row"><div><div class="name">'+t.title+'</div><div class="meta">'+t.desc+'</div></div><button class="claim-btn" data-taskid="'+t.id+'">Assign</button></div>'; }).join(''); panel.innerHTML=html; panel.querySelectorAll('[data-taskid]').forEach(b=>b.onclick=function(){ var id=b.getAttribute('data-taskid'); assignWorkerToTask(id); }); }
    function renderAchPanel(){ var panel=document.getElementById('tlPanel'); var html='<h4>Achievements</h4>'+ ACHIEVEMENTS.map(a=>'<div style="padding:6px 0">'+a.label+' '+(state.ach&&state.ach[a.id]?'✅':'')+'</div>').join(''); panel.innerHTML=html; }
    function renderHintsPanel(){ var panel=document.getElementById('tlPanel'); panel.innerHTML='<h4>Hints</h4><div class="small">Automatic hints appear periodically. Click a planted tree info icon for plant-specific facts.</div>'; }
    function renderAccPanel(){ var panel=document.getElementById('tlPanel'); var accs = [{id:'botanist',label:'Botanist',cost:120},{id:'scarecrow',label:'Scarecrow',cost:45},{id:'fence',label:'Fence',cost:200}]; panel.innerHTML = '<h4>Accessories</h4><div class="accessories-bar">'+ accs.map(a=>'<div class="accessory" data-acc="'+a.id+'">'+a.label+'<div class="small">€'+a.cost+'</div></div>').join('') +'</div>'; panel.querySelectorAll('[data-acc]').forEach(b=>b.onmouseenter=function(){ b.title='Cost: €'+(accs.find(x=>x.id===b.getAttribute('data-acc'))||{}).cost; }); }
  }

  function renderPlot(p){
    var badge = p.status==='barren'?'Barren':(p.status==='preparing'?'Preparing…':(p.status==='ready'?'Ready to plant':(p.status==='growing'?('Growing'):'')));
    var progress = 0;
    if(p.status==='preparing') progress = Math.min(100, Math.round((p.prepHours/PREP_DURATION_HOURS)*100));
    // include tree UID and per-tree O2 if present
    var treeInfo = '';
    if(p.treeType){ treeInfo = '<div style="text-align:center"><div style="font-weight:800">'+TREE_TYPES[p.treeType].label+'</div><div class="small">'+(p.growHours||0).toFixed(1)+'h</div><div class="small">ID: '+(p.treeUid||'—')+'</div><div class="small">O₂: '+((p.o2Total||0).toFixed? (p.o2Total||0).toFixed(1) : (p.o2Total||0))+'</div></div>'; }
    return '<div class="plot" data-plot="'+p.id+'" style="background:linear-gradient(#F7FFF5,#E6F5EA);padding:8px;border:2px solid rgba(0,0,0,0.04);">'+
      '<div style="position:absolute;right:8px;top:8px;background:white;padding:6px;border-radius:8px;font-weight:700;">'+badge+'</div>'+
      '<div style="position:absolute;left:8px;bottom:8px;right:8px;height:8px;background:#eee;border-radius:6px;">'+
      '<div style="height:100%;width:'+progress+'%;background:'+ (progress>50? '#F0AC3D':'#6FA85A') +';border-radius:6px;transition:width .4s"></div></div>'+
      '<div style="display:flex;height:100%;align-items:center;justify-content:center;">'+(p.treeType? treeInfo : '<div style="text-align:center">Plot '+(p.id+1)+'</div>')+'</div>'+
      '<div style="position:absolute;left:8px;top:8px;">'+(p.treeType? '<button class="icon-btn" data-info="'+p.id+'">i</button>' : '<button data-prep="'+p.id+'">Dig</button>')+'</div>'+
      (p.status==='ready'?'<div style="position:absolute;left:8px;bottom:36px"><button data-open="'+p.id+'">Plant</button></div>':'')+
      '</div>';
  }

  function renderPicker(plotId){
    return '<div style="position:absolute;inset:10px;background:rgba(0,0,0,0.55);display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:8px">'+
      Object.keys(TREE_TYPES).map(k=>'<button data-plant="'+plotId+'" data-type="'+k+'">Plant '+TREE_TYPES[k].label+' (€'+TREE_TYPES[k].cost+')</button>').join('')+
      '<button data-cancel="1" style="background:transparent;color:white">Cancel</button></div>';
  }

  // ----- client actions that call server simulation -----
  function clientStartPrep(plotId){ if(!state.userId) return promptLogin();
    // client-side input validation
    if(typeof plotId!=='number' || plotId<0 || plotId>=PLOT_COUNT) return alert('Invalid plot');
    // call server
    server.startPrep(state.userId, plotId).then(function(res){
      // sync client state from server-authoritative user state
      mergeUserState(res.user); saveClient().then(render);
    }).catch(function(err){ alert('Server: '+err.message); });
  }

  function openPicker(plotId){ var p = state.plots[plotId]; if(!p || p.status!=='ready') return; showPickerPopover(plotId); }
  function attachPickerEvents(){
    document.querySelectorAll('[data-plant]').forEach(b=>b.onclick=function(e){ var id=parseInt(b.getAttribute('data-plant')); var t=b.getAttribute('data-type'); clientPlant(id,t); closePopover(); });
    document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=function(){ closePopover(); render(); });
    document.querySelectorAll('[data-info]').forEach(b=>b.onclick=function(){ var id=parseInt(b.getAttribute('data-info')); showTreeInfo(id); });
  }

  function clientPlant(plotId, type){ if(!state.userId) return promptLogin(); server.plantTree(state.userId, plotId, type).then(function(res){ mergeUserState(res.user); saveClient().then(render); server.updateLeaderboard(res.user).then(()=>refreshLeaderboard()); }).catch(function(err){ alert('Server: '+err.message); }); }

  function mergeUserState(u){ // copy fields from server user to client
    state.userId = u.id; state.name = u.name; state.money = u.money; state.totalO2 = u.totalO2; state.totalO2AllTime = u.totalO2AllTime; state.treesPlanted = u.treesPlanted; state.gameHour = u.gameHour;
    // ensure plots include server fields (treeUid, o2Total)
    state.plots = u.plots.map(function(p){ return { id:p.id, status:p.status, treeType:p.treeType, growHours:p.growHours, prepHours:p.prepHours, treeUid:p.treeUid||null, o2Total:p.o2Total||0 }; });
  }

  // ----- floating popover (positioned to stay within viewport) -----
  var currentPopover = null;
  function closePopover(){ if(currentPopover){ currentPopover.remove(); currentPopover=null; } }
  function showPopoverForPlot(plotId, contentHtml){
    closePopover();
    var app = document.getElementById('app');
    var plotEl = app.querySelector('[data-plot="'+plotId+'"]');
    var p = document.createElement('div'); p.className='popover'; p.innerHTML = contentHtml; document.body.appendChild(p);
    if(!plotEl){ p.style.left='50%'; p.style.top='50%'; p.style.transform='translate(-50%,-50%)'; currentPopover=p; return; }
    var rect = plotEl.getBoundingClientRect();
    // compute preferred below plot
    var top = rect.bottom + 8; var left = rect.left + rect.width/2 - 100; // popover width 200
    var vw = Math.max(document.documentElement.clientWidth, window.innerWidth||0);
    var vh = Math.max(document.documentElement.clientHeight, window.innerHeight||0);
    if(left < 8) left = 8; if(left + 208 > vw) left = vw - 208 - 8;
    if(top + p.offsetHeight > vh - 8){ // flip above
      top = rect.top - p.offsetHeight - 8;
      if(top < 8) top = 8;
    }
    p.style.left = left+'px'; p.style.top = top+'px'; p.style.position='fixed'; currentPopover = p;
    var to = setTimeout(function(){ if(currentPopover===p) closePopover(); }, 12000);
    p.addEventListener('mouseenter', function(){ clearTimeout(to); });
    p.addEventListener('mouseleave', function(){ clearTimeout(to); setTimeout(function(){ if(currentPopover===p) closePopover(); }, 4000); });
  }

  function showPickerPopover(plotId){
    var html = '<h4>Choose Plant</h4>' +
      Object.keys(TREE_TYPES).map(function(k){ var d=TREE_TYPES[k]; return '<div class="opt"><div>'+d.label+'<div class="small">€'+d.cost+' · '+d.label+'</div></div><div><button data-plant="'+plotId+'" data-type="'+k+'">Plant</button></div></div>'; }).join('') +
      '<div class="hint">Pick a tree — server will validate cost & availability.</div>';
    showPopoverForPlot(plotId, html);
    attachPickerEvents();
  }

  // ----- educational hints and tasks -----
  function showTreeInfo(plotId){
    var p = state.plots[plotId]; if(!p || !p.treeType) return;
    var hints = getRandomTreeHints(p.treeType);
    var html = '<h4>'+TREE_TYPES[p.treeType].label+' — Info</h4><div>'+hints[0]+'</div>';
    showPopoverForPlot(plotId, html);
  }

  function getRandomTreeHints(type){
    var base = (TREE_TYPES[type] && TREE_TYPES[type].fact) ? [TREE_TYPES[type].fact] : ['This plant needs care.'];
    var extras = ['Water regularly', 'Use balanced fertilizer', 'Prune dead branches', 'Watch for pests', 'Rotate crops to maintain soil'];
    // shuffle and pick two
    var arr = base.concat(extras.sort(()=>0.5-Math.random()).slice(0,2)); return arr;
  }

  function showHintBox(msg, timeout){
    var hb = document.getElementById('hintBox'); if(!hb){ hb = document.createElement('div'); hb.id='hintBox'; hb.className='hint-box'; document.body.appendChild(hb); }
    hb.innerHTML = '<strong>Hint</strong><div class="small">'+msg+'</div>'; hb.style.display='block'; setTimeout(function(){ hb.style.display='none'; }, timeout||6000);
  }

  function assignWorkerToTask(taskId){ // simple assign: cost and quick complete
    state.cleanupTasks = state.cleanupTasks || []; var idx = state.cleanupTasks.findIndex(t=>t.id==taskId); if(idx<0) return; var t=state.cleanupTasks[idx]; var cost = t.cost||20; if(state.money < cost){ alert('Not enough money to assign worker'); return; }
    state.money -= cost; // consume cost
    // complete after short delay
    setTimeout(function(){ state.cleanupTasks.splice(idx,1); saveClient().then(render); showHintBox('Task '+t.title+' completed by worker.',4000); }, 3000);
    saveClient().then(render);
  }

  function generateCleanupTask(){ state.cleanupTasks = state.cleanupTasks||[]; var id='c_'+Math.random().toString(36).slice(2,8); var t={ id:id, title:'Cleanup debris', desc:'Remove rocks/weeds from field', cost:20 }; state.cleanupTasks.push(t); saveClient().then(render); }

  function scheduleCleanupGenerator(){ setInterval(function(){ generateCleanupTask(); }, 1000 * 30); }

  function scheduleHints(){ setInterval(function(){ // pick a random planted tree and show a hint
    var planted = state.plots.filter(p=>p.status==='growing'); if(!planted.length) return; var p = planted[Math.floor(Math.random()*planted.length)]; var msgs = getRandomTreeHints(p.treeType); showHintBox(msgs[Math.floor(Math.random()*msgs.length)], 7000); }, 15000); }

  // ----- offline catch-up / loop -----
  function startLoop(){ if(tickHandle) clearInterval(tickHandle); tickHandle=setInterval(function(){ var now=Date.now(); var realDelta=now-lastRealTs; lastRealTs=now; // advance locally and ask server occasionally
      // advance local simulation
      var dh = (realDelta/REAL_MS_PER_GAME_HOUR_SPEC)*state.speedFactor; advanceClient(dh);
      render();
    }, 1000); }

  function advanceClient(dh){ if(dh<=0) return; // optimistic local advance for UI
    // apply same rules as server to client-visible state for responsiveness
    var season = SEASONS[Math.floor((state.gameHour||0)%(SEASON_LEN_GAME_HOURS*4)/SEASON_LEN_GAME_HOURS)];
    var planted = state.plots.filter(p=>p.status==='growing');
    var fbonus = planted.length===PLOT_COUNT?0.10:0; var types={}; planted.forEach(p=>p.treeType && (types[p.treeType]=true)); var dbonus = Object.keys(types).length>=2?0.15:0; var totalMult=1+fbonus+dbonus;
    state.gameHour = (state.gameHour||0) + dh;
    state.plots.forEach(function(p){ if(p.status==='preparing'){ p.prepHours = (p.prepHours||0) + dh; if(p.prepHours >= PREP_DURATION_HOURS) p.status='ready'; } else if(p.status==='growing'){ var def=TREE_TYPES[p.treeType]; var growDh = dh * season.growth; p.growHours = (p.growHours||0) + growDh; var idx = stageIndexFor(def,p.growHours); var o2Rate = def.o2[idx]||0; var o2Gain = o2Rate*dh; state.totalO2 += o2Gain; state.totalO2AllTime += o2Gain; var inc = o2Gain*O2_RATE*totalMult; if((def.stages[idx].n==='Fruiting'||def.stages[idx].n==='Harvest') && def.fruit) inc += def.fruit*dh*season.income*totalMult; state.money += inc; } });
  }

  function stageIndexFor(def, growHours){ var acc=0; for(var i=0;i<def.stages.length;i++){ acc+=def.stages[i].h; if(growHours<acc) return i;} return def.stages.length-1; }

  // ----- leaderboards -----
  function refreshLeaderboard(){ server.getUser = server.getUser || function(id){ return Promise.resolve(null); }; // ensure exists
    // read server simulated leaderboard
    var sstorage = makeStorage('server'); sstorage.get('server-state').then(r=>{ var lb=[]; try{ lb = r.value? (JSON.parse(r.value).leaderboard || []):[]; }catch(e){} var el = document.getElementById('lb'); if(!el) return; el.innerHTML = lb.map((it,i)=>'<div class="row"><div>'+(i+1)+'. '+it.name+'</div><div>O₂:'+Math.round(it.o2)+'</div></div>').join('') || '<div class="small muted">No entries yet</div>'; }); }

  // ----- export/import -----
  function exportSave(){ var txt = JSON.stringify(state, null, 2); var blob = new Blob([txt], {type:'application/json'}); var url = URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='searchO2-save.json'; document.body.appendChild(a); a.click(); a.remove(); }
  function importSave(){ var inp = document.createElement('input'); inp.type='file'; inp.accept='application/json'; inp.onchange=function(){ var f=inp.files[0]; var r=new FileReader(); r.onload=function(){ try{ var obj=JSON.parse(r.result); state = obj; saveClient().then(()=>{ render(); alert('Imported.'); }); }catch(e){ alert('Invalid file'); } }; r.readAsText(f); }; inp.click(); }

  // ----- onboarding/login -----
  function promptLogin(){ var name = prompt('Enter a display name (or leave blank for guest):'); server.createGuest(name).then(function(u){ mergeUserState(u); state.userId = u.id; state.name = u.name; saveClient().then(()=>{ render(); server.updateLeaderboard(u).then(()=>refreshLeaderboard()); }); }); }

  // ----- boot -----
  loadClient().then(function(){ // if we already have userId, reload authoritative user
    if(state.userId){ server.getUser(state.userId).then(function(u){ if(u) mergeUserState(u); render(); startLoop(); scheduleHints(); scheduleCleanupGenerator(); }); } else { render(); // show login button
      // first-run quick prompt
      if(!state.userId) setTimeout(function(){ if(confirm('Create a guest account to persist leaderboards?')) promptLogin(); }, 400);
    }
    lastRealTs = Date.now(); startLoop(); scheduleHints(); scheduleCleanupGenerator();
  });

})();
</script>
</body>

  .overlay{ position:fixed; inset:0; background: rgba(44,74,50,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding: 20px; }
  .modal{ background: var(--cream); border-radius:22px; padding:26px; max-width:420px; width:100%; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .modal h2{ margin-top:0; }
  .modal .row{ display:flex; justify-content:space-between; padding:6px 0; font-size:0.92rem; }
  .modal .row .v{ font-weight:800; }
  .modal button{ margin-top:16px; width:100%; padding:11px; border:none; border-radius:12px; background: var(--grass); color:white; font-weight:800; font-size:0.95rem; cursor:pointer; font-family:'Baloo 2'; }

  .sway{ animation: sway 3s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes sway{ 0%,100%{ transform:rotate(-1.5deg);} 50%{ transform:rotate(1.5deg);} }

// ---------- STATE ----------
var state = null;

var lastRealTs = Date.now();

var offlineSummary = null;

function freshState(){
  var plots = [];
  for (var i=0;i<PLOT_COUNT;i++){
    plots.push({ id:i, status:'barren', treeType:null, growHours:0, prepHours:0,
      assignedWorker:null, accessories:{irrigation:false, fertilizer:false} });
  }
  return {
    money: 10000, totalO2: 0, totalO2AllTime: 0, treesPlanted: 0, gameHour: 0,
    plots: plots, achUnlocked: {}, speedFactor: 180, lastSaveReal: Date.now(),
    workers: [], lastPaidDay: 0
  };
}

// ---------- PERSISTENCE ----------
function saveState(){
  state.lastSaveReal = Date.now();
  window.storage.set('searchO2-save-v2', JSON.stringify(state)).catch(function(e){ console.error('Save failed', e); });
}
function loadState(){
  window.storage.get('searchO2-save-v2').then(function(res){
    if (res && res.value){
      try{
        var loaded = JSON.parse(res.value);
        var elapsedReal = Date.now() - (loaded.lastSaveReal || Date.now());
        state = loaded;
        nextWorkerId = 1 + state.workers.reduce(function(m,w){return Math.max(m,w.id);},0);
        if (elapsedReal > 5000){
          var before = { money: state.money, totalO2AllTime: state.totalO2AllTime };
          var gh = gameHoursFromReal(elapsedReal, state.speedFactor);
          gh = Math.min(gh, 24*4*30);
          advanceGame(gh);
          offlineSummary = {
            realMinutes: Math.round(elapsedReal/60000),
            gameHours: Math.round(gh*10)/10,
            moneyGained: Math.round((state.money-before.money)*100)/100,
            o2Gained: Math.round((state.totalO2AllTime-before.totalO2AllTime)*10)/10
          };
        }
      }catch(e){ console.error('Parse failed, starting fresh', e); state = freshState(); }
    } else { state = freshState(); }
    lastRealTs = Date.now();
    startLoop(); render();
  }).catch(function(e){ console.error('Load failed, starting fresh', e); state = freshState(); lastRealTs=Date.now(); startLoop(); render(); });
}

// ---------- GAME LOGIC ----------
function gameHoursFromReal(realMs, speedFactor){ return (realMs / REAL_MS_PER_GAME_HOUR_SPEC) * speedFactor; }
function currentSeason(){
  var cyclePos = state.gameHour % (SEASON_LEN_GAME_HOURS*4);
  var idx = Math.floor(cyclePos / SEASON_LEN_GAME_HOURS) % 4;
  return SEASONS[idx];
}
function forestBonus(){ return state.plots.filter(function(p){return p.status==='growing';}).length===PLOT_COUNT ? 0.10 : 0; }
function diversityBonus(){
  var types={}; state.plots.forEach(function(p){ if(p.treeType) types[p.treeType]=true; });
  return Object.keys(types).length>=2 ? 0.15 : 0;
}
function engineerBonus(){ return state.workers.some(function(w){return w.type==='engineer';}) ? 0.10 : 0; }
function workerOnPlot(plotId){
  var p = state.plots[plotId];
  if (!p.assignedWorker) return null;
  return state.workers.find(function(w){return w.id===p.assignedWorker;}) || null;
}

function advanceGame(dh){
  if (dh<=0) return;
  var season = currentSeason();
  var totalMult = 1 + forestBonus() + diversityBonus() + engineerBonus();

  state.gameHour += dh;

  state.plots.forEach(function(p){
    var w = workerOnPlot(p.id);
    if (p.status==='preparing'){
      var prepMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : 1;
      p.prepHours += dh * prepMult;
      if (p.prepHours >= PREP_DURATION_HOURS){ p.status='ready'; }
    } else if (p.status==='growing'){
      var def = TREE_TYPES[p.treeType];
      var growMult = (w && (w.type==='farmer'||w.type==='botanist')) ? WORKER_TYPES[w.type].mult : 1;
      var irrMult = p.accessories.irrigation ? 1.15 : 1;
      var fertMult = p.accessories.fertilizer ? 1.20 : 1;
      var growDh = dh * season.growth * growMult * irrMult;
      p.growHours += growDh;
      var stageIdx = stageIndexFor(def, p.growHours);
      var o2Rate = def.o2AtStage[stageIdx];
      var o2Gain = o2Rate * dh * fertMult;
      state.totalO2 += o2Gain; state.totalO2AllTime += o2Gain;
      var income = o2Gain * O2_RATE * totalMult;
      var stageName = def.stages[stageIdx].n;
      if ((stageName==='Fruiting'||stageName==='Harvest Ready') && def.fruitBonus){
        income += def.fruitBonus * dh * season.income * totalMult;
      }
      state.money += income;
    }
  });

  var newDay = Math.floor(state.gameHour/24);
  if (newDay > state.lastPaidDay && state.workers.length){
    var days = newDay - state.lastPaidDay;
    var dailyWage = state.workers.reduce(function(s,w){return s+WORKER_TYPES[w.type].wage;},0);
    state.money -= dailyWage * days;
  }
  state.lastPaidDay = newDay;
}

function stageIndexFor(def, growHours){
  var acc=0;
  for (var i=0;i<def.stages.length;i++){ acc+=def.stages[i].h; if (growHours<acc) return i; }
  return def.stages.length-1;
}
function plotStageInfo(p){
  if (p.status!=='growing') return null;
  var def = TREE_TYPES[p.treeType];
  var idx = stageIndexFor(def, p.growHours);
  var acc=0; for (var i=0;i<idx;i++) acc+=def.stages[i].h;
  var into = p.growHours-acc, dur = def.stages[idx].h;
  var pct = dur>9000 ? 100 : Math.min(100, Math.round((into/dur)*100));
  return { def:def, idx:idx, name:def.stages[idx].n, pct:pct, isFinal: dur>9000 };
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(function(a){ if (!state.achUnlocked[a.id] && a.check(state)) state.achUnlocked[a.id]=true; });
}

// ---------- ACTIONS ----------
function startPrep(plotId){
  var p = state.plots[plotId];
  if (p.status!=='barren') return;
  var LABOR_COST = 15;
  if (state.money < LABOR_COST) return;
  state.money -= LABOR_COST; p.status='preparing'; p.prepHours=0;
  render(); saveState();
}
function openTreePicker(plotId){
  var p = state.plots[plotId]; if (p.status!=='ready') return;
  pendingPicker = plotId; openPopover=null; render();
}
function plantTree(plotId, type){
  var p = state.plots[plotId]; var def = TREE_TYPES[type];
  if (p.status!=='ready' || state.money<def.cost) return;
  state.money -= def.cost; p.status='growing'; p.treeType=type; p.growHours=0;
  state.treesPlanted += 1; pendingPicker=null;
  checkAchievements(); render(); saveState();
}
function setSpeed(factor){ state.speedFactor = factor; saveState(); render(); }

function hireWorker(type){
  state.workers.push({ id: nextWorkerId++, type: type, assignedPlot: null });
  checkAchievements(); render(); saveState();
}
function fireWorker(workerId){
  var w = state.workers.find(function(x){return x.id===workerId;});
  if (!w) return;
  if (w.assignedPlot!==null){ state.plots[w.assignedPlot].assignedWorker=null; }
  state.workers = state.workers.filter(function(x){return x.id!==workerId;});
  render(); saveState();
}
function assignWorker(workerId, plotId){
  var w = state.workers.find(function(x){return x.id===workerId;});
  var p = state.plots[plotId];
  if (!w || !p) return;
  if (w.assignedPlot!==null) state.plots[w.assignedPlot].assignedWorker=null;
  if (p.assignedWorker!==null){
    var prev = state.workers.find(function(x){return x.id===p.assignedWorker;});
    if (prev) prev.assignedPlot=null;
  }
  w.assignedPlot = plotId; p.assignedWorker = w.id;
  openPopover=null; render(); saveState();
}
function unassignWorker(plotId){
  var p = state.plots[plotId];
  if (p.assignedWorker!==null){
    var w = state.workers.find(function(x){return x.id===p.assignedWorker;});
    if (w) w.assignedPlot=null;
    p.assignedWorker=null;
  }
  openPopover=null; render(); saveState();
}
function buyAccessory(plotId, kind){
  var p = state.plots[plotId]; var acc = ACCESSORIES[kind];
  if (p.accessories[kind] || state.money<acc.cost) return;
  state.money -= acc.cost; p.accessories[kind]=true;
  openPopover=null; render(); saveState();
}
function togglePopover(plotId, kind){
  if (openPopover && openPopover.plotId===plotId && openPopover.kind===kind) openPopover=null;
  else openPopover = {plotId:plotId, kind:kind};
  pendingPicker=null; render();
}

// ---------- LOOP ----------
function startLoop(){
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    var now=Date.now(); var realDelta = now-lastRealTs; lastRealTs=now;
    var dh = gameHoursFromReal(realDelta, state.speedFactor);
    advanceGame(dh); checkAchievements(); render();
  }, 1000);
  setInterval(saveState, 15000);
}

// ---------- PLOT RENDERING ----------
function plotSvg(p){
  var stageInfo = plotStageInfo(p);
  var w = workerOnPlot(p.id);
  var isActive = (p.status==='preparing') || (p.status==='growing' && stageInfo && !stageInfo.isFinal) || (p.status==='growing');
  var working = !!w && (p.status==='preparing' || p.status==='growing');

  var bed = '<ellipse cx="100" cy="90" rx="88" ry="48" fill="#7A5334"/>'+
            '<ellipse cx="100" cy="86" rx="88" ry="46" fill="#8B5A3C"/>';
  var tillLines='';
  for (var i=-70;i<=70;i+=18){ tillLines += '<path d="M'+(100+i*0.9)+',48 Q'+(100+i)+',86 '+(100+i*0.9)+',124" stroke="#6E4429" stroke-width="2" fill="none" opacity="0.4"/>'; }

  var content='';
  if (p.status==='barren'){
    content = tillLines;
  } else if (p.status==='preparing'){
    content = '<g opacity="0.7"><rect x="30" y="80" width="140" height="7" rx="3" fill="#5A3A22"/><rect x="30" y="95" width="140" height="7" rx="3" fill="#5A3A22"/></g>';

      content += personSvg('laborer', true, 150, 55);
      content += '<g class="dust" style="transform-origin:150px 90px;"><circle cx="150" cy="90" r="5" fill="#C9A374"/></g>';
    }
  } else if (p.status==='ready'){
    content = '<g><ellipse cx="100" cy="90" rx="18" ry="8" fill="#7A9B5F"/>'+
      '<circle cx="100" cy="55" r="15" fill="'+(Math.floor(Date.now()/500)%2 ? '#F0AC3D':'#F7CB74')+'" opacity="0.9"/>'+
      '<text x="100" y="61" font-size="16" text-anchor="middle" fill="#543A0F">+</text></g>';
  } else if (p.status==='growing'){
    var def = TREE_TYPES[p.treeType]; var idx = stageInfo.idx;
    if (idx===0){ content = '<circle cx="100" cy="82" r="6" fill="#4A3320"/>'; }
    else if (idx===1){ content = '<g class="sway"><rect x="97" y="60" width="6" height="26" fill="#588A46"/><circle cx="100" cy="58" r="9" fill="#79B25F"/></g>'; }
    else {
      var canopyColor = p.treeType==='oak' ? '#4E8F52' : (p.treeType==='apple' ? '#5FA85B' : '#6FBF5E');
      var trunkH = 42; var canopyR = 26 + Math.min(idx,3)*3;
      var fruits='';
      if ((p.treeType==='apple'||p.treeType==='tomato') && idx>=3){
        var dotColor = p.treeType==='apple' ? '#D8483C' : '#E2412F';
        fruits = '<circle cx="86" cy="42" r="4" fill="'+dotColor+'"/><circle cx="114" cy="38" r="4" fill="'+dotColor+'"/><circle cx="100" cy="26" r="4" fill="'+dotColor+'"/>';
      }
      content = '<g class="sway" style="transform-origin:100px 84px;">'+
        '<rect x="94" y="'+(84-trunkH)+'" width="12" height="'+trunkH+'" rx="4" fill="'+(p.treeType==='oak'?'#6E4429':'#7A5334')+'"/>'+
        '<circle cx="100" cy="'+(84-trunkH-canopyR*0.5)+'" r="'+canopyR+'" fill="'+canopyColor+'"/>'+ fruits +'</g>';
      if (def.o2AtStage[idx]>0){
        content += '<g class="rise"><circle cx="72" cy="40" r="3.5" fill="#F0AC3D" opacity="0.8"/></g>'+
                   '<g class="rise2"><circle cx="128" cy="46" r="2.8" fill="#F0AC3D" opacity="0.7"/></g>';
      }
    }
    if (w && !stageInfo.isFinal) content += personSvg(w.type, true, 155, 60);
    else if (w) content += personSvg(w.type, false, 155, 60);
  }

  if (p.accessories.irrigation) content += '<text x="24" y="145" font-size="16">💧</text>';
  if (p.accessories.fertilizer) content += '<text x="46" y="145" font-size="16">🌾</text>';

  var progressPct=0;
  if (p.status==='preparing') progressPct = Math.min(100, Math.round((p.prepHours/PREP_DURATION_HOURS)*100));
  else if (p.status==='growing' && stageInfo && !stageInfo.isFinal) progressPct = stageInfo.pct;
  else if (p.status==='growing' && stageInfo && stageInfo.isFinal) progressPct = 100;

  var ring='';
  if (progressPct>0 && progressPct<100){
    var circ = 2*Math.PI*30;
    var off = circ - (circ*progressPct/100);
    ring = '<g transform="translate(100,4)">'+
      '<circle r="14" fill="none" stroke="#00000022" stroke-width="5"/>'+
      '<circle r="14" fill="none" stroke="#F0AC3D" stroke-width="5" stroke-dasharray="'+(2*Math.PI*14)+'" stroke-dashoffset="'+((2*Math.PI*14)-(2*Math.PI*14*progressPct/100))+'" stroke-linecap="round" transform="rotate(-90)"/>'+
      '<text x="0" y="4" font-size="9" text-anchor="middle" fill="#2C4A32" font-weight="700">'+progressPct+'%</text>'+
      '</g>';
  }

  return '<svg viewBox="0 0 200 150">'+bed+content+ring+'</svg>';
}

function plotPopoverHtml(p){
  if (!openPopover || openPopover.plotId!==p.id) return '';
  if (openPopover.kind==='worker'){
    var relevantRole = p.status==='preparing' ? 'prep' : 'grow';
    var idleCompatible = state.workers.filter(function(w){
      return w.assignedPlot===null && (WORKER_TYPES[w.type].role===relevantRole);
    });
    var w = workerOnPlot(p.id);
    var html = '<div class="popover"><h4>👷 Assign worker</h4>';
    if (w){
      html += '<div class="opt"><span>'+WORKER_TYPES[w.type].label+' is working here</span><button data-unassign="'+p.id+'">Unassign</button></div>';
    }
    if (idleCompatible.length){
      idleCompatible.forEach(function(iw){
        html += '<div class="opt"><span>'+WORKER_TYPES[iw.type].label+' (idle)</span><button data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign</button></div>';
      });
    } else if (!w) {
      html += '<div class="hint">No idle worker fits this task yet. Hire one in the Workers panel below.</div>';
    }
    html += '</div>';
    return html;
  }
  if (openPopover.kind==='accessory'){
    var html2 = '<div class="popover"><h4>🧰 Accessories</h4>';
    Object.keys(ACCESSORIES).forEach(function(k){
      var acc = ACCESSORIES[k]; var owned = p.accessories[k];
      html2 += '<div class="opt"><span>'+acc.emoji+' '+acc.label+'<br><span class="hint" style="margin:0;">'+acc.desc+'</span></span>'+
        (owned ? '<span>✓</span>' : '<button data-buyacc="'+k+'" data-buyplot="'+p.id+'">€'+acc.cost+'</button>') +
        '</div>';
    });
    html2 += '</div>';
    return html2;
  }
  return '';
}

function plotTreePickerHtml(p){
  if (pendingPicker!==p.id) return '';
  var html = '<div class="popover"><h4>🌳 Plant a tree</h4>';
  Object.keys(TREE_TYPES).forEach(function(k){
    var d = TREE_TYPES[k];
    html += '<div class="opt"><span>'+d.label+'<br><span class="hint" style="margin:0;">'+d.category+'</span></span><button data-plant="'+p.id+'" data-type="'+k+'">€'+d.cost+'</button></div>';
  });
  html += '<button class="ghost" data-cancelplant="1" style="width:100%;margin-top:4px;">✕ Cancel</button></div>';
  return html;
}

function plotSpotHtml(p, layout){
  var stageInfo = plotStageInfo(p);
  var labelText = p.status==='barren' ? 'Plot '+(p.id+1)+' — Barren' :
    p.status==='preparing' ? 'Preparing…' :
    p.status==='ready' ? 'Tap to plant' :
    stageInfo.name;
  var showWorkerIcon = (p.status==='preparing' || p.status==='growing');
  var showAccIcon = (p.status==='ready' || p.status==='growing');
  var extraInfo = '';
  if (p.treeType){ extraInfo = '<div style="position:absolute;top:14px;left:6px;font-size:0.7rem;color:#3E6B49;font-weight:700;background:rgba(255,255,255,0.9);padding:2px 6px;border-radius:8px;">ID:'+ (p.treeUid||'—') +' · '+TREE_TYPES[p.treeType].label+'</div>'; }
  return '<div class="plot-spot" style="top:'+layout.top+'%;left:'+layout.left+'%;width:'+layout.w+'%;height:'+layout.h+'%;" data-plot="'+p.id+'">'+
    '<div class="plot-label">'+labelText+'</div>'+ extraInfo +
    plotSvg(p)+
    '<div class="plot-icons">'+
      (showWorkerIcon ? '<div class="icon-btn'+(p.assignedWorker!==null?' on':'')+'" data-workericon="'+p.id+'">👷</div>' : '')+
      (showAccIcon ? '<div class="icon-btn'+((p.accessories.irrigation||p.accessories.fertilizer)?' on':'')+'" data-accicon="'+p.id+'">🧰</div>' : '')+
    '</div>'+
    plotPopoverHtml(p)+
    plotTreePickerHtml(p)+
  '</div>';
}

// ---------- FULL RENDER ----------
function render(){
  if (!state) return;
  var season = currentSeason();
  var gameDay = Math.floor(state.gameHour/24)+1;
  var fBonus=forestBonus(), dBonus=diversityBonus(), eBonus=engineerBonus();
  var bonusText=[];
  if (fBonus) bonusText.push('Forest Bonus +10%');
  if (dBonus) bonusText.push('Diverse Species +15%');
  if (eBonus) bonusText.push('Worker Efficiency +10%');

  var tasksHtml=''; var anyTasks=false;
  state.plots.forEach(function(p){
    if (p.status==='barren'){ anyTasks=true;
      tasksHtml += '<div class="task-row"><div><div class="name">Plot '+(p.id+1)+' — Dig Land</div><div class="meta">€15 · 3 game-hours</div></div><button class="claim-btn" data-prep="'+p.id+'">Start</button></div>';
    } else if (p.status==='preparing'){ anyTasks=true;
      var pct = Math.min(100, Math.round((p.prepHours/PREP_DURATION_HOURS)*100));
      tasksHtml += '<div class="task-row"><div><div class="name">Plot '+(p.id+1)+' — Preparing Soil</div><div class="meta">'+pct+'% done'+(p.assignedWorker!==null?' · 👷 assisted':'')+'</div></div><button class="claim-btn" disabled>…</button></div>';
    } else if (p.status==='ready'){ anyTasks=true;
      tasksHtml += '<div class="task-row"><div><div class="name">Plot '+(p.id+1)+' — Ready to Plant</div><div class="meta">Choose a tree</div></div><button class="claim-btn" data-open="'+p.id+'">Plant</button></div>';
    }
  });
  if (!anyTasks) tasksHtml = '<div class="empty-note">No pending tasks — your farm is fully planted! 🌳</div>';

  var achHtml = ACHIEVEMENTS.map(function(a){ return '<div class="ach'+(state.achUnlocked[a.id]?' unlocked':'')+'">'+a.label+'</div>'; }).join('');
  var speedOptsHtml = SPEED_OPTIONS.map(function(o){ return '<option value="'+o.factor+'" '+(o.factor===state.speedFactor?'selected':'')+'>'+o.label+'</option>'; }).join('');

  var dailyWage = state.workers.reduce(function(s,w){return s+WORKER_TYPES[w.type].wage;},0);
  var hireHtml = Object.keys(WORKER_TYPES).map(function(k){
    var wt = WORKER_TYPES[k];
    return '<div class="worker-hire-row"><div><div class="wname">'+wt.label+'</div><div class="wmeta">€'+wt.wage+'/day · '+wt.desc+'</div></div><button class="hire-btn" data-hire="'+k+'">Hire</button></div>';
  }).join('');
  var rosterHtml = state.workers.length ? '<div class="roster">'+state.workers.map(function(w){
    var loc = w.assignedPlot!==null ? 'Plot '+(w.assignedPlot+1) : 'Idle';
    return '<div class="roster-chip"><span>'+WORKER_TYPES[w.type].label+' · '+loc+'</span><button class="fire" data-fire="'+w.id+'">Let go</button></div>';
  }).join('')+'</div>' : '<div class="empty-note">No workers hired yet.</div>';

  var html = ''+
  '<header class="topbar">'+
    '<div class="brand"><svg class="leaf" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#6FA85A"/><path d="M12 24 Q20 8 30 12 Q26 26 12 24Z" fill="#FBF6EC"/></svg>'+
      '<div><h1>searchO2</h1><div class="tag">Phase 1 prototype — field view</div></div></div>'+
    '<div class="stats">'+
      '<div class="stat-pill'+(state.money<0?' warn':'')+'"><span class="val">€'+state.money.toFixed(2)+'</span><span class="lbl">balance</span></div>'+
      '<div class="stat-pill"><span class="val">'+state.totalO2.toFixed(1)+'</span><span class="lbl">O₂ units</span></div>'+
      '<div class="stat-pill"><span class="val">Day '+gameDay+'</span><span class="lbl">game time</span></div>'+
      (dailyWage ? '<div class="stat-pill"><span class="val">€'+dailyWage+'/day</span><span class="lbl">payroll</span></div>' : '')+
    '</div></header>'+
  '<div class="season-strip"><div class="season-name"><span>'+season.emoji+'</span> '+season.name+
    (bonusText.length? ' · <span style="color:#B8842E">'+bonusText.join(', ')+'</span>' : '')+'</div>'+
    '<div class="speed-toggle">Clock speed: <select id="speedSel">'+speedOptsHtml+'</select></div></div>'+
  // two-column layout: left = field, right = stacked panels
  '<div class="grid">'+
    '<div>'+
      '<div class="panel" style="padding:12px 12px 18px;margin-bottom:12px;"><h3>Field</h3>'+
        '<div class="field-scene"><div class="field-bg" id="fieldBg"></div>'+
          '<div class="field-plots">'+ state.plots.map(function(p,i){ return plotSpotHtml(p, PLOT_LAYOUT[i]); }).join('') +'</div>'+
        '</div></div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:12px;">'+
      '<div class="panel"><h2>📋 Tasks</h2>'+tasksHtml+'</div>'+
      '<div class="panel"><h2>👷 Workers</h2>'+hireHtml+rosterHtml+'</div>'+
      '<div class="panel"><h2>🏆 Achievements</h2><div class="ach-grid">'+achHtml+'</div></div>'+
      '<div class="panel"><h2>🧰 Accessories</h2><div class="accessories-bar">'+
        '<div class="accessory">Irrigation<br><div class="small">€80</div></div>'+
        '<div class="accessory">Fertilizer<br><div class="small">€60</div></div>'+
      '</div></div>'+
      '<div class="panel"><h2>💡 Fact</h2><div class="facts">'+(function(){
        var planted = state.plots.filter(function(p){return p.status==='growing';});
        if (!planted.length) return 'Plant your first tree to unlock oxygen facts here.';
        var p = planted[Math.floor((Date.now()/4000)%planted.length)];
        return TREE_TYPES[p.treeType].fact;
      })()+'</div></div>'+
    '</div>'+
  '</div>';

  document.getElementById('app').innerHTML = html;
  var bgEl = document.getElementById('fieldBg');
  if (bgEl && !bgEl.dataset.built){ bgEl.innerHTML = fieldBackgroundSVG(); bgEl.dataset.built='1'; }

  if (offlineSummary){
    var s = offlineSummary;
    document.body.insertAdjacentHTML('beforeend',
      '<div class="overlay" id="offlineModal"><div class="modal"><h2>🌤️ Welcome back!</h2>'+
      '<div class="row"><span>Time away</span><span class="v">'+s.realMinutes+' min real time</span></div>'+
      '<div class="row"><span>Game time passed</span><span class="v">'+s.gameHours+' hours</span></div>'+
      '<div class="row"><span>Oxygen produced</span><span class="v">+'+s.o2Gained+' O₂</span></div>'+
      '<div class="row"><span>Income earned</span><span class="v">+€'+s.moneyGained.toFixed(2)+'</span></div>'+
      '<button id="closeOffline">Back to the farm</button></div></div>'
    );
    document.getElementById('closeOffline').onclick = function(){ offlineSummary=null; document.getElementById('offlineModal').remove(); };
  }
  wireEvents();
}

function wireEvents(){
  document.querySelectorAll('[data-prep]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); startPrep(parseInt(b.getAttribute('data-prep')));}; });
  document.querySelectorAll('[data-open]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); openTreePicker(parseInt(b.getAttribute('data-open')));}; });
  document.querySelectorAll('[data-workericon]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); togglePopover(parseInt(b.getAttribute('data-workericon')),'worker');}; });
  document.querySelectorAll('[data-accicon]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); togglePopover(parseInt(b.getAttribute('data-accicon')),'accessory');}; });
  document.querySelectorAll('[data-assign]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); assignWorker(parseInt(b.getAttribute('data-assign')), parseInt(b.getAttribute('data-assignplot')));}; });
  document.querySelectorAll('[data-unassign]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); unassignWorker(parseInt(b.getAttribute('data-unassign')));}; });
  document.querySelectorAll('[data-buyacc]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); buyAccessory(parseInt(b.getAttribute('data-buyplot')), b.getAttribute('data-buyacc'));}; });
  document.querySelectorAll('[data-plant]').forEach(function(b){ b.onclick=function(e){e.stopPropagation(); plantTree(parseInt(b.getAttribute('data-plant')), b.getAttribute('data-type'));}; });
  var cancelBtn = document.querySelector('[data-cancelplant]'); if (cancelBtn) cancelBtn.onclick=function(e){e.stopPropagation(); pendingPicker=null; render();};
  document.querySelectorAll('.plot-spot').forEach(function(el){
    el.addEventListener('click', function(){
      var id = parseInt(el.getAttribute('data-plot')); var p = state.plots[id];
      if (p.status==='barren') startPrep(id);
    });
  });
  document.querySelectorAll('[data-hire]').forEach(function(b){ b.onclick=function(){ hireWorker(b.getAttribute('data-hire')); }; });
  document.querySelectorAll('[data-fire]').forEach(function(b){ b.onclick=function(){ fireWorker(parseInt(b.getAttribute('data-fire'))); }; });
  var speedSel = document.getElementById('speedSel'); if (speedSel) speedSel.onchange=function(){ setSpeed(parseInt(speedSel.value)); };
}

loadState();
})();
</script>
</body>
</html>
