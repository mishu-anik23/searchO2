        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
        b.building=false; b.built=true;
        pushReport(def.icon+' '+def.label+' construction complete! '+(def.category==='decorative' ? 'Reputation +'+def.reputationBonus+'.' : 'Ready to sell to visitors.'));
        if (key==='garden') showNotification('🌷','Your Garden is ready — choose what to plant!','building',key);
        else if (key==='pond') showNotification('🪷','Your Pond is ready — choose Fish Farm or Duck Farm!','building',key);
        checkAchievements();
      }
    }
  });
  // Rocks / boulder clearing timer
  if (state.rocksClearing){
    state.rocksClearHours += dh;
    if (state.rocksClearHours >= 2){
      state.rocksClearing = false;
      state.rocksCleared = true;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('achieve');
      pushReport('🪨 Boulders and rock obstacles successfully cleared from road corridor! Paving unlocked.');
      showNotification('🪨', 'Boulders cleared! Road corridor is ready for paving.', 'building', 'road');
      if (state.rocksWorkerId !== undefined){
        var rkW = state.workers.find(function(w){ return w.id === state.rocksWorkerId; });
        if (rkW && typeof animateWorkerPathWalk === 'function'){
          animateWorkerPathWalk(rkW, 'crew_shed', 'rocks');
        }
        delete state.rocksWorkerId;
      }
    }
  }

  // Lawn overgrowth & mowing simulation
  if (state.lawnMowing){
    state.lawnMowHours += dh;
    if (state.lawnMowHours >= 1.5){
      state.lawnMowing = false;
      state.lawnOvergrowth = 0;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('achieve');
      pushReport('🌿 Estate lawn mowed and manicured! Pristine grounds restored (+5 reputation).');
      showNotification('🌿', 'Lawn manicured! Farm curb appeal restored.', 'tasks', null);
      if (state.lawnWorkerId !== undefined){
        var lnW = state.workers.find(function(w){ return w.id === state.lawnWorkerId; });
        if (lnW && typeof animateWorkerPathWalk === 'function'){
          animateWorkerPathWalk(lnW, 'crew_shed', 'lawn');
        }
        delete state.lawnWorkerId;
      }
    }
  } else {
    // Lawn grass gradually grows over time (1.2% per game hour)
    state.lawnOvergrowth = Math.min(100, (state.lawnOvergrowth || 0) + dh * 1.2);
  }

  // Block-wise road construction timers
  if (state.roads){
    ['subway','crew_trail','garden_walk','market_promenade'].forEach(function(rk){
      var seg = state.roads[rk]; var def = ROAD_SEGMENTS[rk];
      if (seg && seg.building && def){
        seg.buildHours += dh;
        if (seg.buildHours >= def.buildHours){
          seg.building = false; seg.built = true;
          if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('achieve');
          pushReport(def.icon + ' ' + def.label + ' construction complete! ' + def.desc);
          showNotification(def.icon, def.label + ' constructed!', 'building', 'road');
          checkAchievements();
        }
      }
    });
  }

  // Village Visitor Foot-Traffic Economy:
  // When Main Road is open, Coffee House and Juice Bar serve strolling visitors, generating
  // authentic visitor revenue based on farm reputation and paved promenade walkways!
  // Stored harvest is preserved for manual player logistics dispatch and selling.
  if (state.buildings.road && state.buildings.road.built){
    var baseRep = farmReputation();
    var magnetMult = visitorMagnetActive() ? 1.25 : 1.0;
    var promenadeBoost = (state.roads && state.roads.market_promenade && state.roads.market_promenade.built) ? 1.35 : 1.0;
    ['coffee_shop','juice_bar'].forEach(function(key){
      var b = state.buildings[key]; if (!b.built) return;
      var def = BUILDING_TYPES[key];
      var visitorRev = ((def.upkeep / 24) * 1.6 + baseRep * 0.45) * dh * magnetMult * promenadeBoost;
      state.money += visitorRev;
      if (Math.random() < 0.12 && typeof SoundTrackEngine !== 'undefined'){
        if (key === 'coffee_shop') SoundTrackEngine.playSFX('brew');
        else SoundTrackEngine.playSFX('pour');
      }
    });
  }

  // Garden and Pond both need tending — freshness decays continuously once
  // planted/stocked. Garden's reputation bonus scales with it; Pond's actual
  // production (fish/duck sales into storage) only happens while it's fed.
  var garden = state.buildings.garden;
  if (garden.built && garden.flowerType){
    garden.freshness = Math.max(0, garden.freshness - dh*GARDEN_FRESHNESS_DECAY);
    if (garden.freshness < FRESHNESS_WARN_THRESHOLD && !garden.warnedLow){
      garden.warnedLow = true;
      pushReport('🌷 The garden is wilting from neglect — tend it to keep its reputation bonus.');
      showNotification('🥀','The garden needs tending — it\'s wilting.','building','garden');
    } else if (garden.freshness >= 60){ garden.warnedLow = false; }
  }
  var pond = state.buildings.pond;
  if (pond.built && pond.specialization){
    pond.freshness = Math.max(0, pond.freshness - dh*POND_FRESHNESS_DECAY);
    if (pond.freshness < FRESHNESS_WARN_THRESHOLD && !pond.warnedLow){
      pond.warnedLow = true;
      var pondSpecName = POND_SPECIALIZATIONS[pond.specialization].label;
      pushReport('🐟 The '+pondSpecName+' needs feeding — production has slowed.');
      showNotification('🍽️',pondSpecName+' needs feeding.','building','pond');
    } else if (pond.freshness >= 60){ pond.warnedLow = false; }
    // Production requires an assigned Farmer, same pattern as tree harvesting — it
    // accumulates as pendingCollect and needs a manual Collect action, rather than

    var pondWorker = workerOnBuilding('pond');
    if (state.storage.built && pond.freshness > 0 && pondWorker && pondWorker.type==='farmer'){
      var spec = POND_SPECIALIZATIONS[pond.specialization];
      var freshMult = pond.freshness/100;

      pond.pendingCollect = Math.min(150, (pond.pendingCollect||0) + produced);
    }
  }

  state.plots.forEach(function(p){

    } else if (p.status==='clearing'){
      if (!(w && w.inTransit)){
        var clearMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : (w ? 1.25 : 1);
        p.taskHours += dh * clearMult;
        if (p.taskHours >= CLEAR_DURATION_HOURS){

          if (w){

            p.assignedWorker = null; retWorker1.assignedPlot = null;
            if (typeof animateWorkerPathWalk === 'function'){
              animateWorkerPathWalk(retWorker1, 'crew_shed', retPlotId1);
            }
          }
        }
      }
    } else if (p.status==='preparing'){
      if (!(w && w.inTransit)){
        var prepMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : (w ? 1.25 : 1);
        p.taskHours += dh * prepMult;
        if (p.taskHours >= PREP_DURATION_HOURS){
          p.status='ready'; p.weedHours=0; p.taskHours=0;
          showNotification('🌱','Plot '+(p.id+1)+' is prepared and ready for planting!','plot',p.id);
          if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
          if (w){
            var retWorker2 = w; var retPlotId2 = p.id;
            p.assignedWorker = null; retWorker2.assignedPlot = null;
            if (typeof animateWorkerPathWalk === 'function'){
              animateWorkerPathWalk(retWorker2, 'crew_shed', retPlotId2);
            }
          }
        }
      }
    } else if (p.status==='removing'){
      if (!(w && w.inTransit)){
        var remDef = TREE_TYPES[p.treeType]; var remCfg = REMOVE_CONFIG[remDef.category];
        var remMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : (w ? 1.25 : 1);
        p.taskHours += dh * remMult;
        if (p.taskHours >= remCfg.hours){
          var salvage = Math.round(remDef.cost * remCfg.salvagePct * 100)/100;
          state.money += salvage;
          state.treesRemoved = (state.treesRemoved||0) + 1;
          pushReport('🪓 Removed the dead '+remDef.label+' (#'+p.treeId+') from Plot '+(p.id+1)+'.'+(salvage>0?' Salvaged €'+salvage.toFixed(2)+' from the wood.':''));
          if (remCfg.vehicle) spawnVehicleAnimation(PLOT_LAYOUT[p.id]);
          p.status='barren'; p.treeType=null; p.treeId=null; p.growHours=0; p.taskHours=0; p.weedHours=0;
          p.health=100; p.ageHours=0; p.downtimeHours=0; p.zeroHealthStreakHours=0; p.pendingHarvest=0;
          checkAchievements();
          if (w){
            var retWorker3 = w; var retPlotId3 = p.id;
            p.assignedWorker = null; retWorker3.assignedPlot = null;
            if (typeof animateWorkerPathWalk === 'function'){
              animateWorkerPathWalk(retWorker3, 'crew_shed', retPlotId3);
            }
          }
        }
      }
    } else if (p.status==='growing'){
      var def = TREE_TYPES[p.treeType];

      if (p.health<=0){

        p.zeroHealthStreakHours += dh;
        if (p.zeroHealthStreakHours >= TREE_DRY_THRESHOLD_HOURS){
          p.status = 'dead';
          pushReport('💀 The '+def.label+' on Plot '+(p.id+1)+' (#'+p.treeId+') has dried out completely and needs to be removed before you can replant.');

      } else {

        var o2Rate = def.o2AtStage[stageIdx];
        var o2Gain = o2Rate * dh * fertMult * healthMult;
        state.totalO2 += o2Gain; state.totalO2AllTime += o2Gain; p.o2Produced += o2Gain;
        state.money += o2Gain * O2_RATE * totalMult;
        var isFinalStage = stageIdx === def.stages.length-1;
        if (isFinalStage && def.lateBonus){
          var harvestAmt = def.lateBonus*dh*season.income*totalMult*healthMult;

          else { state.money += harvestAmt * 0.5; } // spoilage penalty without storage
        }
      }
    }

    if (p.animal && state.gameHour >= p.animal.expiresAtHour){
      var a = ANIMALS.find(function(x){return x.key===p.animal.key;});
      state.money -= ANIMAL_PENALTY; state.demerits += 1;
      if (p.status==='preparing' || p.status==='clearing'){ p.taskHours = Math.max(0, p.taskHours-1); }
      pushReport('🐾 A '+a.name+' passed through Plot '+(p.id+1)+' unnoticed — minor setback (-€'+ANIMAL_PENALTY+', +1 demerit). '+a.fact);

  });

  var anyActive = state.plots.some(function(p){return p.animal;});
  if (!anyActive){
    var prob = 1 - Math.pow(1-ANIMAL_SPAWN_RATE, dh);
    if (Math.random() < prob){
      var eligible = state.plots.filter(function(p){ return ['barren','overgrown','preparing','clearing','ready'].indexOf(p.status)>=0 && (!p.accessories || !p.accessories.boundary); });
      if (eligible.length){
        var target = eligible[Math.floor(Math.random()*eligible.length)];
        var animal = ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
        target.animal = { key:animal.key, expiresAtHour: state.gameHour + ANIMAL_WINDOW_HOURS };
        showNotification(animal.emoji, animal.name+' spotted on Plot '+(target.id+1)+'!', 'plot', target.id);
      }
    }
  }

  var newDay = Math.floor(state.gameHour/24);
  if (newDay > state.lastPaidDay){
    var days = newDay - state.lastPaidDay;
    if (state.workers.length){
      var dailyWage = state.workers.reduce(function(s,w){return s+WORKER_TYPES[w.type].wage;},0);
      state.money -= dailyWage * days;
    }
    var buildingUpkeep = 0;
    BUILDING_ORDER.forEach(function(key){
      var b = state.buildings[key]; var def = BUILDING_TYPES[key];
      if (b.built && def.upkeep) buildingUpkeep += def.upkeep;
    });
    if (buildingUpkeep) state.money -= buildingUpkeep * days;
    if (state.loan){
      for (var di=0; di<days && state.loan; di++){
        if (state.loan.remainingBalance <= 0.01){
          pushReport('🏦 Loan fully repaid! Your farm is debt-free.');

        }
        var installment = Math.min(state.loan.dailyInstallment, state.loan.remainingBalance);
        if (state.money >= installment){
          state.money -= installment; state.loan.remainingBalance -= installment; state.loan.daysPaid += 1;
        } else {
          var paid = Math.max(0, state.money);
          var shortfall = installment - paid;
          var penalty = shortfall * LOAN_PENALTY_RATE;
          state.money = 0;
          state.loan.remainingBalance = Math.max(0, state.loan.remainingBalance - paid + penalty);
          state.loan.missedPayments = (state.loan.missedPayments||0) + 1;
          state.demerits += 1;
          pushReport('⚠️ Missed a loan payment (€'+installment.toFixed(2)+' due) — €'+penalty.toFixed(2)+' penalty added to what you still owe, +1 demerit.');
        }
      }
    }
    state.plots.forEach(function(p){
      if (p.status==='growing'){
        var w2 = workerOnPlot(p.id);
        if (w2 && w2.type==='botanist'){

          var rec = p.health<40 ? 'Urgent: water and consider pruning soon.' : (p.health<70 ? 'Recommend watering this plot.' : 'Looking healthy — no action needed.');
          pushReport('📋 Botanist report — Plot '+(p.id+1)+' ('+def2.label+', #'+p.treeId+'): health '+Math.round(p.health)+'%, KPI '+plotKpi(p)+'%, stage "'+def2.stages[stageIndexFor(def2,p.growHours)].n+'". '+rec);
        }

        }

        pushReport('⚠️ Plot '+(p.id+1)+' remains overgrown and uncleared. -€'+DEMERIT_FINE+', +1 demerit.');
      }
    });
  }
  state.lastPaidDay = newDay;
}

function stageIndexFor(def, growHours){
  var acc=0;
  for (var i=0;i<def.stages.length;i++){ acc+=def.stages[i].h; if (growHours<acc) return i; }
  return def.stages.length-1;
}
function plotStageInfo(p){
  if (p.status!=='growing') return null;
  var def = TREE_TYPES[p.treeType];
  var idx = stageIndexFor(def, p.growHours);
  var acc=0; for (var i=0;i<idx;i++) acc+=def.stages[i].h;
  var into = p.growHours-acc, dur = def.stages[idx].h;
  var pct = dur>9000 ? 100 : Math.min(100, Math.round((into/dur)*100));
  return { def:def, idx:idx, name:def.stages[idx].n, pct:pct, isFinal: dur>9000 };
}

function triggerSaleLogisticsSequence(){
  if (!state.storage.built) return;
  if (!state.storage.items || state.storage.items.length === 0){
    if (state.storage.stored > 0){
      state.storage.items = [{
        id: 'legacy_batch_' + Date.now(),
        cropKey: 'produce',
        name: 'Fresh Farm Produce Batch',
        category: 'produce',
        icon: '🍏',
        source: 'Farm Fields',
        value: state.storage.stored,
        qty: Math.max(1, Math.round(state.storage.stored / 8)),
        freshness: 98,
        harvestedHour: state.gameHour || 0
      }];
    } else {
      showNotification('📦', 'Storage is empty! Harvest crops first.', 'storage', null);
      return;
    }
  }

  // Filter selected items
  var itemsToSell = state.storage.items.filter(function(it){
    return storageSelectedMap[it.id] !== false; // default true
  });

  if (itemsToSell.length === 0){
    showNotification('📦', 'Please select at least one item to sell.', 'storage', null);
    return;
  }

  // Check Laborer requirement
  var laborer = workerOnStorage();
  if (!laborer){
    var idleLaborer = state.workers.find(function(w){ return w.type === 'laborer' && w.assignedPlot === null && !w.assignedBuilding; });
    if (idleLaborer){
      state.storage.assignedLaborerId = idleLaborer.id;
      laborer = idleLaborer;
      pushReport('👷 Assigned Laborer ' + (idleLaborer.name || ('#' + idleLaborer.id)) + ' to Storage loading bay.');
    } else {
      var anyLaborer = state.workers.find(function(w){ return w.type === 'laborer'; });
      if (anyLaborer){
        showNotification('👷', 'Assign an available Laborer to load transport cargo before selling.', 'storage', null);
        pushReport('⚠️ Shipment cannot depart without a Laborer assigned to load cargo at the storage dock.');
        return;
      } else {
        showNotification('👷', 'A Laborer is required to load cargo! Hire one in the Workers panel.', 'storage', null);
        pushReport('⚠️ No Laborer on staff. Hire a Laborer to handle storage cargo and transport loading.');
        return;
      }
    }
  }

  var totalRev = itemsToSell.reduce(function(sum, it){ return sum + (it.value || 0); }, 0);
  var hasTimber = itemsToSell.some(function(it){ return it.category === 'timber'; });
  var hasProduce = itemsToSell.some(function(it){ return it.category !== 'timber'; });
  var vehicleType = (hasTimber && !hasProduce) ? 'timber' : ((hasProduce && !hasTimber) ? 'produce' : 'mixed');

  // Remove sold items from inventory
  var soldMap = {};
  itemsToSell.forEach(function(it){ soldMap[it.id] = true; });
  state.storage.items = state.storage.items.filter(function(it){ return !soldMap[it.id]; });
  state.storage.stored = Math.max(0, state.storage.items.reduce(function(s, it){ return s + (it.value || 0); }, 0));
  state.storage.warnedFull = false;

  // Clear selections
  storageSelectedMap = {};

  // Close modal to let player view the road logistics animation
  if (activeModal && activeModal.type === 'storage'){
    activeModal = null;
  }
  render();

  // Run animated logistics sequence
  animateTransportLogistics(vehicleType, totalRev, itemsToSell.length, laborer);
}

function animateTransportLogistics(vehicleType, totalRevenue, itemCount, laborer){
  var scene = document.querySelector('.field-scene');
  if (!scene) {
    // Headless / test environment fallback
    state.money += totalRevenue;
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
    pushReport('💰 Transport departed: Sold ' + itemCount + ' items for €' + totalRevenue.toFixed(2) + '.');
    render(); requestSave();
    return;
  }

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    scene.appendChild(truckLayer);
  }
  truckLayer.innerHTML = '';

  var vehicleSvg = vehicleType === 'timber' ? drawTimberTruckSvg() : (vehicleType === 'produce' ? drawFoodContainerTruckSvg() : drawMixedHaulerSvg());
  var vehicleName = vehicleType === 'timber' ? 'Timber Logging Truck' : (vehicleType === 'produce' ? 'Refrigerated Food Container Van' : 'Farm Hauler');

  var truckEl = document.createElement('div');
  truckEl.className = 'logistics-truck-sprite';
  truckEl.style.cssText = 'position:absolute;width:140px;height:70px;z-index:26;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.3));';
  truckEl.innerHTML = vehicleSvg;
  truckLayer.appendChild(truckEl);

  var laborerEl = document.createElement('div');
  laborerEl.className = 'logistics-laborer-sprite';
  laborerEl.style.cssText = 'position:absolute;z-index:27;opacity:0;transition:all 0.35s ease;';
  laborerEl.innerHTML = '<div style="font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));">👷</div>';
  truckLayer.appendChild(laborerEl);

  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');
  pushReport('🚛 ' + vehicleName + ' arrived through Farm Main Gate and navigating along road to Storage loading dock.');

  // Step 1: Drive in through Farm Main Gate, along Main Road, up Central Access Road to Storage (Behind Plot 1)
  var inRoute = [
    { x: -12, y: 47 },
    { x: 1,   y: 47 },
    { x: 39,  y: 47 },
    { x: 39,  y: 8 }
  ];

  animateAlongWaypoints(truckEl, inRoute, 2500, function(){
    // Step 2: Loading crates at Storage loading dock (x: 39%, y: 8%)
    laborerEl.style.opacity = '1';
    laborerEl.style.left = '36%';
    laborerEl.style.top = '7%';
    var passes = 0;
    var loadInterval = setInterval(function(){
      passes++;
      var isAtTruck = (passes % 2 === 1);
      laborerEl.style.left = isAtTruck ? '39%' : '36%';
      laborerEl.innerHTML = '<div style="font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));">' +
        (isAtTruck ? (vehicleType === 'timber' ? '🪵' : '📦') : '👷') + '</div>';
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
      if (passes >= 4){
        clearInterval(loadInterval);
        setTimeout(finishLoading, 400);
      }
    }, 550);
  });

  // Step 3: Departure along central access corridor past Plot 1 -> Main Road -> Main Gate
  function finishLoading(){
    laborerEl.style.left = '35%';
    laborerEl.innerHTML = '<div style="font-size:24px;">👋</div>';
    setTimeout(function(){ laborerEl.style.opacity = '0'; }, 1000);

    pushReport('🚚 ' + vehicleName + ' fully loaded with ' + itemCount + ' items. Departing from Storage down access road past Plot 1 and through Farm Main Gate!');
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');

    var outRoute = [
      { x: 39,  y: 8 },
      { x: 39,  y: 47 },
      { x: 1,   y: 47 },
      { x: -16, y: 47 }
    ];

    animateAlongWaypoints(truckEl, outRoute, 2800, function(){
      state.money += totalRevenue;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
      pushReport('💰 Transport delivered! Earned €' + totalRevenue.toFixed(2) + ' from farm harvest sales.');
      showNotification('💰', 'Shipment complete: +€' + totalRevenue.toFixed(2), 'storage', null);

      var coinBadge = document.createElement('div');
      coinBadge.className = 'logistics-coin-burst';
      coinBadge.style.left = '39%';
      coinBadge.style.top = '10%';
      coinBadge.innerHTML = '🪙 +€' + totalRevenue.toFixed(2);
      scene.appendChild(coinBadge);
      setTimeout(function(){ if (coinBadge.parentNode) coinBadge.parentNode.removeChild(coinBadge); }, 2500);

      truckLayer.innerHTML = '';
      checkAchievements();
      render();
      requestSave();
    });
  }
}

var bankruptcyDismissed = false;
var resetConfirmPending = false;
function checkBankruptcy(){
  if (!state) return;
  if (state.money >= BANKRUPTCY_TRIGGER){ bankruptcyDismissed = false; return; }
  if (state.loan) return; // already dealing with it
  if (bankruptcyDismissed) return;
  if (activeModal && activeModal.type==='bank') return;
  activeModal = {type:'bank', plotId:null};
  openPanel = null;
}
function takeLoan(key){
  if (state.loan) return;
  var o = LOAN_OPTIONS.find(function(x){return x.key===key;});
  if (!o) return;
  var totalOwed = o.principal * (1+o.rate);
  state.money += o.principal;
  state.loan = { key:o.key, label:o.label, principal:o.principal, rate:o.rate, termDays:o.termDays,
    totalOwed: totalOwed, dailyInstallment: totalOwed/o.termDays, remainingBalance: totalOwed, daysPaid:0, missedPayments:0 };
  pushReport('🏦 Took a '+o.label+' of €'+o.principal+'. Total repayment: €'+totalOwed.toFixed(2)+' over '+o.termDays+' days (€'+(totalOwed-o.principal).toFixed(2)+' interest).');
  bankruptcyDismissed = false;
  closeModal(); requestSave();
}
function repayLoanEarly(){
  if (!state.loan) return;
  var bal = state.loan.remainingBalance;
  if (state.money < bal) return;
  state.money -= bal;
  pushReport('✅ Paid off the remaining €'+bal.toFixed(2)+' loan balance early. Your farm is debt-free.');
  state.loan = null;
  render(); requestSave();
}

// ================= LOOP =================
function startLoop(){
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    var now=Date.now(); var realDelta = now-lastRealTs; lastRealTs=now;
    var dh = gameHoursFromReal(realDelta, state.speedFactor);
    advanceGame(dh); checkAchievements(); processHarvests(); checkBankruptcy(); render();
  }, 1000);
  setInterval(requestSave, 20000);
}
function processHarvests(){
  state.plots.forEach(function(p){
    var hDur = hasTractor() ? 3500 : 10000;
    if (p.harvesting && Date.now() - p.harvestStartReal >= hDur){
      var amt = p.harvestAmount||0;
      var room = Math.max(0, state.storage.capacity - state.storage.stored);
      var accepted = Math.min(amt, room);
      var lost = amt - accepted;
      state.storage.stored += accepted;
      state.harvestCount = (state.harvestCount||0)+1;
      if (!state.storage.items) state.storage.items = [];
      var treeDef = TREE_TYPES[p.treeType];
      var isTimber = treeDef && treeDef.category === 'Timber Tree';
      state.storage.items.push({
        id: 'crop_' + Date.now() + '_' + Math.floor(Math.random()*10000),
        cropKey: p.treeType,
        name: treeDef ? (treeDef.label + (isTimber ? ' Timber Logs' : ' Harvest')) : 'Crop Harvest',
        category: isTimber ? 'timber' : 'produce',
        icon: isTimber ? '🪵' : (treeDef ? treeDef.icon : '🍎'),
        source: 'Plot ' + (p.id+1) + ' (' + (treeDef ? treeDef.label : 'Tree') + ')',
        value: accepted,
        qty: Math.max(1, Math.round(accepted / (isTimber ? 12 : 8))),
        freshness: 100,
        harvestedHour: state.gameHour || 0,
        harvestedAt: Date.now()
      });
      if (lost > 0.01){
        pushReport('⚠️ Storage was full — €'+lost.toFixed(2)+' worth of '+TREE_TYPES[p.treeType].label+' from Plot '+(p.id+1)+' spoiled. Sell stock or expand storage.');
      } else {
        pushReport('🧺 Harvested €'+amt.toFixed(2)+' worth of '+TREE_TYPES[p.treeType].label+' from Plot '+(p.id+1)+' and moved it into storage.');
      }
      p.pendingHarvest = Math.max(0, p.pendingHarvest-amt);
      p.harvesting=false; p.harvestAmount=0;
      if (!state.buildings.garage || !state.buildings.garage.built){
        spawnCarryAnimation(PLOT_LAYOUT[p.id], STORAGE_SPOT);
      }
      checkAchievements();
    }
  });
  var pondB = state.buildings.pond;
  if (pondB.collecting && Date.now()-pondB.collectStartReal >= 4000){
    var pamt = pondB.collectAmount||0;
    var proom = Math.max(0, state.storage.capacity - state.storage.stored);
    var paccepted = Math.min(pamt, proom);
    var plost = pamt - paccepted;
    state.storage.stored += paccepted;
    state.harvestCount = (state.harvestCount||0)+1;
    var pondLabel = POND_SPECIALIZATIONS[pondB.specialization].label;
    if (!state.storage.items) state.storage.items = [];
    state.storage.items.push({
      id: 'pond_' + Date.now() + '_' + Math.floor(Math.random()*10000),
      cropKey: pondB.specialization,
      name: pondB.specialization === 'fish' ? 'Fresh River Trout' : 'Heritage Duck Feathers & Eggs',
      category: 'pond',
      icon: POND_SPECIALIZATIONS[pondB.specialization].icon,
      source: 'Duck & Fish Pond (' + pondLabel + ')',
      value: paccepted,
      qty: Math.max(1, Math.round(paccepted / 6)),
      freshness: 100,
      harvestedHour: state.gameHour || 0,
      harvestedAt: Date.now()
    });
    if (plost > 0.01){
      pushReport('⚠️ Storage was full — €'+plost.toFixed(2)+' worth of '+pondLabel+' produce spoiled. Sell stock or expand storage.');
    } else {
      pushReport('🧺 Collected €'+pamt.toFixed(2)+' worth of '+pondLabel+' produce and moved it into storage.');
    }
    pondB.pendingCollect = Math.max(0, pondB.pendingCollect-pamt);
    pondB.collecting=false; pondB.collectAmount=0;
    spawnCarryAnimation(VILLAGE_LAYOUT.pond, STORAGE_SPOT);
    checkAchievements();
  }
  if (state.storage.built && state.storage.capacity>0){
    var ratio = state.storage.stored/state.storage.capacity;
    if (ratio >= STORAGE_WARN_RATIO && !state.storage.warnedFull){
      state.storage.warnedFull = true;
      pushReport('📦 Storage is over '+Math.round(STORAGE_WARN_RATIO*100)+'% full ('+Math.round(ratio*100)+'%). Sell some harvest or expand storage soon.');
      showNotification('📦','Storage is over '+Math.round(STORAGE_WARN_RATIO*100)+'% full — sell or expand.','storage',null);
    } else if (ratio < 0.6){ state.storage.warnedFull = false; }
  }
}

var hintQueue = [];
function refillHintQueue(){
  var facts = []; var seen = {};
  state.plots.forEach(function(p){ if (p.treeType && !seen[p.treeType]){ seen[p.treeType]=true; facts.push(TREE_TYPES[p.treeType].fact); } });
  facts = facts.concat(GENERIC_TIPS);
  for (var i=facts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=facts[i]; facts[i]=facts[j]; facts[j]=t; }
  hintQueue = facts;
}

// carry-to-storage basket animation, appended outside the render-replaced DOM
function spawnCarryAnimation(fromLayout, toLayout){
  var scene = document.querySelector('.field-scene'); if (!scene) return;
  var rect = scene.getBoundingClientRect();
  var fx = rect.left + rect.width*(fromLayout.left+fromLayout.w/2)/100;
  var fy = rect.top + rect.height*(fromLayout.top+fromLayout.h/2)/100;
  var tx = rect.left + rect.width*(toLayout.left+toLayout.w/2)/100;
  var ty = rect.top + rect.height*(toLayout.top+toLayout.h/2)/100;
  var el = document.createElement('div');
  el.style.position='fixed'; el.style.left=fx+'px'; el.style.top=fy+'px'; el.style.fontSize='22px'; el.style.zIndex='60';
  el.style.transition='left 1.6s ease-in-out, top 1.6s ease-in-out'; el.textContent='🧺';
  document.body.appendChild(el);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.left=tx+'px'; el.style.top=ty+'px'; }); });
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1800);
}

// ================= STRICT MANHATTAN ROAD NETWORK PATHFINDING =================
// Computes exact paved road waypoints connecting any origin to any destination,
// strictly following Avenue subways, East-West spurs, and the 50px cross-lane L-turn into Storage Barn.

function getRoadNetworkWaypoints(origin, destination){
  var mainRoadY = 47.0;

  // Exact path from location to Main Road junction [loc -> ... -> Main Road]
  function toMainRoad(loc){
    if (typeof loc === 'object' && loc !== null && 'x' in loc && 'y' in loc){
      if (Math.abs(loc.y - mainRoadY) < 1) return [{ x: loc.x, y: mainRoadY }];
      return [{ x: loc.x, y: loc.y }, { x: loc.x, y: mainRoadY }];
    }
    if (loc === 'main_gate'){
      return [{ x: 1.0, y: mainRoadY }];
    }
    if (loc === 'crew_shed'){
      // Crew Shed Porch (x:12.7, y:66) up Crew Trail to Main Road (x:12.7, y:47)
      return [{ x: 12.7, y: 66.0 }, { x: 12.7, y: mainRoadY }];
    }
    if (loc === 'storage'){
      // Storage Apron (x:52.5, y:18) -> 50px cross-lane (x:52.5, y:21.7) -> L-Turn East to Avenue 2 (x:60.2, y:21.7) -> Avenue 2 South to Main Road (x:60.2, y:47)
      return [{ x: 52.5, y: 18.0 }, { x: 52.5, y: 21.7 }, { x: 60.2, y: 21.7 }, { x: 60.2, y: mainRoadY }];
    }
    if (loc === 0){
      // Plot 0 South Gate (x:24, y:31.4) -> East Spur to Avenue 1 (x:31, y:31.4) -> Avenue 1 South to Main Road (x:31, y:47)
      return [{ x: 24.0, y: 31.4 }, { x: 31.0, y: 31.4 }, { x: 31.0, y: mainRoadY }];
    }
    if (loc === 1){
      // Plot 1 South Gate (x:52, y:41.4) -> East Spur to Avenue 2 (x:60.2, y:41.4) -> Avenue 2 South to Main Road (x:60.2, y:47)
      return [{ x: 52.0, y: 41.4 }, { x: 60.2, y: 41.4 }, { x: 60.2, y: mainRoadY }];
    }
    if (loc === 2){
      // Plot 2 South Gate (x:80.5, y:31.4) -> West Spur to Avenue 3 (x:73.8, y:31.4) -> Avenue 3 South to Main Road (x:73.8, y:47)
      return [{ x: 80.5, y: 31.4 }, { x: 73.8, y: 31.4 }, { x: 73.8, y: mainRoadY }];
    }
    if (loc === 3){
      // Plot 3 North Gate (x:24, y:65.4) -> East Spur to Avenue 1 (x:31, y:65.4) -> Avenue 1 North to Main Road (x:31, y:47)
      return [{ x: 24.0, y: 65.4 }, { x: 31.0, y: 65.4 }, { x: 31.0, y: mainRoadY }];
    }
    if (loc === 4){
      // Plot 4 North Gate (x:52.5, y:66) -> Avenue 2 South branch straight up to Main Road (x:52.5, y:47)
      return [{ x: 52.5, y: 66.0 }, { x: 52.5, y: mainRoadY }];
    }
    if (loc === 5){
      // Plot 5 North Gate (x:80.5, y:65.4) -> West Spur to Avenue 3 (x:73.8, y:65.4) -> Avenue 3 North to Main Road (x:73.8, y:47)
      return [{ x: 80.5, y: 65.4 }, { x: 73.8, y: 65.4 }, { x: 73.8, y: mainRoadY }];
    }
    if (loc === 'garage'){
      return [{ x: 93.5, y: 34.0 }, { x: 93.5, y: mainRoadY }];
    }
    if (loc === 'pond'){
      return [{ x: 38.0, y: 34.0 }, { x: 38.0, y: mainRoadY }];
    }
    if (loc === 'garden'){
      return [{ x: 38.0, y: 66.0 }, { x: 38.0, y: mainRoadY }];
    }
    if (loc === 'coffee_shop'){
      return [{ x: 67.0, y: 34.0 }, { x: 67.0, y: mainRoadY }];
    }
    if (loc === 'juice_bar'){
      return [{ x: 67.0, y: 66.0 }, { x: 67.0, y: mainRoadY }];
    }
    if (loc === 'rocks'){
      return [{ x: 47.0, y: 28.0 }, { x: 47.0, y: mainRoadY }];
    }
    if (loc === 'lawn'){
      return [{ x: 50.0, y: 56.0 }, { x: 50.0, y: mainRoadY }];
    }
    return [{ x: 24.0, y: mainRoadY }];
  }

  var originPts = toMainRoad(origin);
  var destPtsReversed = toMainRoad(destination);
  var destPts = destPtsReversed.slice().reverse();

  var originJunction = originPts[originPts.length - 1];
  var destJunction = destPts[0];

  var fullRoute = [];
  originPts.forEach(function(pt){ fullRoute.push(pt); });

  // Travel horizontally along Main Road if junctions differ
  if (Math.abs(originJunction.x - destJunction.x) > 0.5){
    fullRoute.push({ x: destJunction.x, y: mainRoadY });
  }

  destPts.forEach(function(pt, idx){
    if (idx > 0) fullRoute.push(pt);
  });

  // Deduplicate consecutive identical waypoints
  var cleanRoute = [];
  fullRoute.forEach(function(pt){
    if (!cleanRoute.length){
      cleanRoute.push(pt);
    } else {
      var last = cleanRoute[cleanRoute.length - 1];
      if (Math.hypot(last.x - pt.x, last.y - pt.y) > 0.3){
        cleanRoute.push(pt);
      }
    }
  });

  return cleanRoute;
}

function getPlotJunctionX(plotId){
  if (plotId === 0 || plotId === 3) return 31.0; // Avenue 1
  if (plotId === 1) return 60.2;                 // Avenue 2 North
  if (plotId === 4) return 52.5;                 // Avenue 2 South
  return 73.8;                                   // Avenue 3 (Plots 2 & 5)
}

function getPlotDestY(plotId){
  if (plotId === 0 || plotId === 2) return 31.4;
  if (plotId === 1) return 41.4;
  if (plotId === 3 || plotId === 5) return 65.4;
  if (plotId === 4) return 66.0;
  return 47.0;
}

function calculateGridRoute(startPoint, endPoint){
  return getRoadNetworkWaypoints(startPoint, endPoint);
}

// Enhanced multi-segment waypoint animator with smooth cornering curves and continuous rotational heading
function animateAlongWaypoints(el, rawWaypoints, totalDurationMs, onComplete){
  if (!rawWaypoints || rawWaypoints.length < 2){
    if (onComplete) onComplete();
    return;
  }

  var isPedestrian = el.classList.contains('human-walker-sprite');

  // For vehicles: insert smooth filleted cornering points at sharp 90° intersections
  var waypoints = [];
  if (isPedestrian){
    waypoints = rawWaypoints;
  } else {
    for (var w = 0; w < rawWaypoints.length; w++){
      if (w > 0 && w < rawWaypoints.length - 1){
        var p0 = rawWaypoints[w - 1];
        var p1 = rawWaypoints[w];
        var p2 = rawWaypoints[w + 1];
        var d1 = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        var d2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        // If corner turn detected, fillet corner with curved control point
        if (d1 > 4 && d2 > 4){
          var cut1 = Math.min(2.5, d1 * 0.25);
          var cut2 = Math.min(2.5, d2 * 0.25);
          var entry = { x: p1.x - (p1.x - p0.x) * (cut1 / d1), y: p1.y - (p1.y - p0.y) * (cut1 / d1) };
          var apex  = { x: (p1.x * 2 + entry.x + p2.x) / 4,   y: (p1.y * 2 + entry.y + p2.y) / 4 };
          var exit  = { x: p1.x + (p2.x - p1.x) * (cut2 / d2), y: p1.y + (p2.y - p1.y) * (cut2 / d2) };
          waypoints.push(entry);
          waypoints.push(apex);
          waypoints.push(exit);
          continue;
        }
      }
      waypoints.push(rawWaypoints[w]);
    }
  }

  // Calculate Euclidean distance for proportional velocities
  var legDists = [];
  var totalDist = 0;
  for (var i = 1; i < waypoints.length; i++){
    var d = Math.hypot(waypoints[i].x - waypoints[i-1].x, waypoints[i].y - waypoints[i-1].y);
    legDists.push(d);
    totalDist += d;
  }
  if (totalDist < 0.1) totalDist = 0.1;

  var currentIdx = 0;
  var currentAngle = 0;
  el.style.left = waypoints[0].x + '%';
  el.style.top = waypoints[0].y + '%';

  function nextStep(){
    currentIdx++;
    if (currentIdx >= waypoints.length){
      if (onComplete) onComplete();
      return;
    }
    var prev = waypoints[currentIdx - 1];
    var curr = waypoints[currentIdx];
    var legDist = legDists[currentIdx - 1] || 1;
    var stepDuration = Math.max(120, Math.round(totalDurationMs * (legDist / totalDist)));

    var dx = curr.x - prev.x;
    var dy = curr.y - prev.y;

    if (isPedestrian){
      // Pedestrians face walking direction without tilting or snapping
      if (dx > 0.4) el.style.transform = 'scaleX(1)';
      else if (dx < -0.4) el.style.transform = 'scaleX(-1)';
      el.style.transition = 'left ' + (stepDuration / 1000) + 's linear, top ' + (stepDuration / 1000) + 's linear';
    } else {
      // Vehicles: Continuous rotational heading tracking without abrupt flipping
      if (Math.hypot(dx, dy) > 0.1){
        var targetAngle = Math.atan2(dy, dx) * (180 / Math.PI);
        // Shortest angular difference unwrapping
        var diff = ((targetAngle - currentAngle + 540) % 360) - 180;
        currentAngle += diff;
      }
      el.style.transform = 'rotate(' + currentAngle + 'deg)';
      el.style.transition = 'left ' + (stepDuration / 1000) + 's linear, top ' + (stepDuration / 1000) + 's linear, transform ' + Math.min(0.35, stepDuration / 1000) + 's ease-in-out';
    }

    el.style.left = curr.x + '%';
    el.style.top = curr.y + '%';
    setTimeout(nextStep, stepDuration);
  }

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      nextStep();
    });
  });
}

function spawnVehicleAnimation(fromLayoutOrId){
  var scene = document.querySelector('.field-scene');

  var plotId = 0;
  if (typeof fromLayoutOrId === 'number'){

  } else if (fromLayoutOrId && state.plots){
    for (var i = 0; i < PLOT_LAYOUT.length; i++){
      if (Math.abs(PLOT_LAYOUT[i].left - fromLayoutOrId.left) < 1 && Math.abs(PLOT_LAYOUT[i].top - fromLayoutOrId.top) < 1){
        plotId = i; break;
      }
    }
  }

  var junctionX = getPlotJunctionX(plotId);
  var plotY = getPlotDestY(plotId);

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    truckLayer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:25;';
    scene.appendChild(truckLayer);
  }

  var truckEl = document.createElement('div');
  truckEl.className = 'logistics-truck-sprite';
  truckEl.style.cssText = 'position:absolute;width:130px;height:65px;z-index:26;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.3));';
  truckEl.innerHTML = drawTimberTruckSvg();
  truckLayer.appendChild(truckEl);

  pushReport('🚛 Logging flatbed truck entered through Farm Main Gate and navigated along road to Plot ' + (plotId + 1) + '.');
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');

  // Waypoints: Enter Gate -> Main Road Junction -> Feeder Subway to Plot
  var inRoute = [
    { x: -12, y: 47.0 },
    { x: 1.0, y: 47.0 },
    { x: junctionX, y: 47.0 },
    { x: junctionX, y: plotY }
  ];

  animateAlongWaypoints(truckEl, inRoute, 2400, function(){
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
    pushReport('🪵 Timber logs loaded securely onto truck bolsters at Plot ' + (plotId + 1) + '.');

    setTimeout(function(){
      // Smooth Turnaround Loop at Plot (sweeping semicircular arc rather than sudden flip)
      var isNorthPlot = plotY < 47;
      var loopDir = isNorthPlot ? 1 : -1;
      var turnaroundArc = [
        { x: junctionX, y: plotY },
        { x: junctionX + 3.2, y: plotY - 1.8 * loopDir },
        { x: junctionX + 4.5, y: plotY + 2.0 * loopDir },
        { x: junctionX + 1.5, y: plotY + 4.5 * loopDir },
        { x: junctionX, y: plotY + 6.0 * loopDir },
        { x: junctionX, y: 47.0 },
        { x: 1.0, y: 47.0 },
        { x: -16.0, y: 47.0 }
      ];

      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');
      animateAlongWaypoints(truckEl, turnaroundArc, 3100, function(){
        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
        pushReport('✓ Logging truck departed through Farm Main Gate.');
        if (truckEl.parentNode) truckEl.parentNode.removeChild(truckEl);
      });
    }, 1200);
  });
}

// Helper: Get point coordinates for destination or origin
function getFarmLocationCoords(loc){
  if (typeof loc === 'number'){
    return { x: getPlotJunctionX(loc), y: getPlotDestY(loc) };
  }
  if (loc === 'storage') return { x: 52.5, y: 14 };
  if (loc === 'pond') return { x: 38, y: 23 };
  if (loc === 'garden') return { x: 38, y: 77 };
  if (loc === 'coffee_shop') return { x: 67, y: 23 };
  if (loc === 'juice_bar') return { x: 67, y: 77 };
  if (loc === 'garage') return { x: 93.5, y: 23 };
  if (loc === 'rocks') return { x: 47, y: 28 };
  if (loc === 'lawn') return { x: 50, y: 56 };
  if (loc === 'crew_shed') return { x: 12.7, y: 76 };
  return { x: 24.5, y: 47 };
}

// Two-way Worker Walking Animation: Full-human walking model along strict Manhattan road network
function animateWorkerPathWalk(worker, destination, origin, onComplete){
  var scene = document.querySelector('.field-scene');
  if (!scene){
    if (typeof onComplete === 'function') onComplete();
    return;
  }

  var isReturnWalk = (destination === 'crew_shed');
  var fromKey = isReturnWalk ? (origin !== undefined ? origin : 0) : 'crew_shed';
  var toKey = isReturnWalk ? 'crew_shed' : destination;

  // Single consistent worker visuals: Set inTransit flag while pedestrian sprite walks
  if (worker){
    worker.inTransit = true;
    if (isReturnWalk) worker.isReturning = true;
    render();
  }

  var workerType = worker ? worker.type : 'farmer';
  var workerTool = WORKER_TYPES[workerType] ? WORKER_TYPES[workerType].tool : 'shovel';
  if (destination === 'rocks') workerTool = 'pickaxe';
  else if (destination === 'lawn') workerTool = 'mower';
  else if (typeof destination === 'number'){
    var p = state.plots[destination];
    if (p){
      if (p.status === 'preparing') workerTool = 'shovel';
      else if (p.status === 'clearing') workerTool = 'scythe';
      else if (p.status === 'removing') workerTool = 'axe';
      else if (p.harvesting) workerTool = 'basket';
    }
  }

  var workerEl = document.createElement('div');
  workerEl.className = 'human-walker-sprite';
  workerEl.innerHTML = '<svg viewBox="-18 -20 36 65" width="38" height="60" style="overflow:visible;">' +
    drawHumanWorkerSvg(workerType, workerTool, true, false) +
  '</svg>';

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    truckLayer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:34;';
    scene.appendChild(truckLayer);
  }
  truckLayer.appendChild(workerEl);

  // Strictly follow paved road network waypoints (Crew Trail -> Main Road -> Avenue -> Spur -> Gate)
  var walkRoute = getRoadNetworkWaypoints(fromKey, toKey);

  // Compute realistic travel time proportional to actual road path length
  var totalDist = 0;
  for (var r = 1; r < walkRoute.length; r++){
    totalDist += Math.hypot(walkRoute[r].x - walkRoute[r-1].x, walkRoute[r].y - walkRoute[r-1].y);
  }
  var walkDuration = Math.max(1600, Math.min(3400, Math.round(totalDist * 42)));

  animateAlongWaypoints(workerEl, walkRoute, walkDuration, function(){
    if (workerEl.parentNode) workerEl.parentNode.removeChild(workerEl);
    if (!isReturnWalk){
      if (worker) worker.inTransit = false;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
      // Mount on-site working figure seamlessly upon arrival
      render();
      if (typeof onComplete === 'function') onComplete();
    } else {
      if (worker){
        worker.inTransit = false;
        worker.isReturning = false;
        worker.assignedPlot = null;
        worker.assignedBuilding = null;
      }
      render();
      if (typeof onComplete === 'function') onComplete();
    }
  });
}

// 2-Wheel Harvest Cart Logistics Sequence:
// Farmer leaves Crew Shed -> Farm Garage (hitches 2-wheel cart) -> Plot (harvests) -> Storage Barn (unloads with currency burst) -> Farm Garage (returns cart)
function triggerHarvestCartSequence(plotId, onComplete){
  var scene = document.querySelector('.field-scene');
  if (!scene) return;

  var junctionX = getPlotJunctionX(plotId);
  var plotY = getPlotDestY(plotId);
  var tractorMode = typeof hasTractor === 'function' ? hasTractor() : false;

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    truckLayer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:32;';
    scene.appendChild(truckLayer);
  }

  // Sprite containing Tractor + Trailer OR Farmer + 2-wheel cart
  var cartSprite = document.createElement('div');
  cartSprite.style.cssText = 'position:absolute;width:' + (tractorMode ? '84px' : '72px') + ';height:46px;z-index:33;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));display:flex;align-items:center;';
  cartSprite.innerHTML = (tractorMode ?
    '<span style="font-size:28px;margin-right:-6px;z-index:2;">🚜</span><div id="cartCargoBox" style="width:52px;height:34px;">' + drawHarvestCartSvg(false) + '</div>' :
    '<span style="font-size:24px;margin-right:-8px;z-index:2;">🧑‍🌾</span><div id="cartCargoBox" style="width:48px;height:32px;">' + drawHarvestCartSvg(false) + '</div>');
  truckLayer.appendChild(cartSprite);

  pushReport((tractorMode ? '🚜 Farm Utility Tractor' : '🧑‍🌾 Farmer with 2-wheel cart') + ' dispatched from East Farm Garage to Plot ' + (plotId + 1) + '.');
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');

  // Leg 1: East Farm Garage (x: 93.5, y: 23) -> Main Road (x: 93.5, y: 47) -> Junction (junctionX, 47) -> Plot (junctionX, plotY)
  var legDuration = tractorMode ? 2200 : 3600;
  var legToPlot = [
    { x: 93.5, y: 23 },
    { x: 93.5, y: 47 },
    { x: junctionX, y: 47 },
    { x: junctionX, y: plotY }
  ];

  animateAlongWaypoints(cartSprite, legToPlot, legDuration, function(){
    var box = cartSprite.querySelector('#cartCargoBox');
    if (box) box.innerHTML = drawHarvestCartSvg(true, '🍎');
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
    pushReport((tractorMode ? '🚜 Mechanized loading into tractor trailer at Plot ' : '🧺 Picking crops into 2-wheel cart at Plot ') + (plotId + 1) + '...');

    setTimeout(function(){
      // Leg 2: Plot (junctionX, plotY) -> Main Road (junctionX, 47) -> Avenue 2 (x: 60.2, y: 47) -> L-Turn (x: 60.2, y: 21.5) -> Storage Barn Loading Apron (x: 52.8, y: 20.5)
      var legToStorage = [
        { x: junctionX, y: plotY },
        { x: junctionX, y: 47 },
        { x: 60.2, y: 47 },
        { x: 60.2, y: 21.5 },
        { x: 52.8, y: 20.5 }
      ];
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');
      animateAlongWaypoints(cartSprite, legToStorage, legDuration, function(){
        if (box) box.innerHTML = drawHarvestCartSvg(false);
        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
        pushReport('✓ Delivered harvested produce directly to Storage Barn loading bay.');
        
        var burst = document.createElement('div');
        burst.style.cssText = 'position:absolute;left:52.5%;top:10%;font-size:18px;font-weight:800;color:#2E7D32;z-index:40;transition:all 1.4s ease-out;pointer-events:none;';
        burst.textContent = tractorMode ? '🚜 +Mechanized Harvest Stored!' : '🧺 +Harvest Stored!';
        scene.appendChild(burst);
        requestAnimationFrame(function(){
          burst.style.top = '3%';
          burst.style.opacity = '0';
        });
        setTimeout(function(){ if (burst.parentNode) burst.parentNode.removeChild(burst); }, 1400);

        setTimeout(function(){
          // Leg 3: Return to Garage: (52.8, 20.5) -> (60.2, 21.5) -> (60.2, 47) -> (93.5, 47) -> (93.5, 23)
          var legToGarage = [
            { x: 52.8, y: 20.5 },
            { x: 60.2, y: 21.5 },
            { x: 60.2, y: 47 },
            { x: 93.5, y: 47 },
            { x: 93.5, y: 23 }
          ];
          animateAlongWaypoints(cartSprite, legToGarage, Math.round(legDuration * 0.9), function(){
            pushReport((tractorMode ? '🚜 Utility Tractor' : '🚜 2-wheel cart') + ' parked securely back at the Farm Garage.');
            if (cartSprite.parentNode) cartSprite.parentNode.removeChild(cartSprite);
            if (onComplete) onComplete();
          });
        }, 800);
      });
    }, tractorMode ? 1200 : 2200);
  });
}


// Task notification toasts — separate from the ambient educational hint toast. These
// fire on newly-triggered actionable events (dead tree, overgrown plot, wildlife,
// storage full) and auto-dismiss after ~9s if ignored, with a "View" shortcut straight
// to the relevant modal. Managed as direct DOM nodes (not part of render()'s innerHTML
// replacement) so they survive the 1s game tick without flickering or losing timers.
function showNotification(icon, text, actionType, actionArg){
  var stack = document.getElementById('notifStack'); if (!stack) return;
  var el = document.createElement('div');
  el.className = 'notif-toast';
  el.innerHTML = '<span class="notif-toast-icon">'+icon+'</span>'+
    '<div class="notif-toast-content">'+
      '<div class="notif-toast-text">'+text+'</div>'+
      '<div class="notif-toast-actions">'+
        '<button class="notif-toast-btn-view" data-nv="1">View</button>'+
        '<button class="notif-toast-btn-dismiss" data-nx="1">Dismiss</button>'+
      '</div>'+
    '</div>';
  var timer = setTimeout(remove, 9000);
  function remove(){ clearTimeout(timer); if (el.parentNode) el.parentNode.removeChild(el); }
  el.querySelector('[data-nv]').onclick = function(){
    remove();
    if (actionType==='plot') openModal('plot', actionArg);
    else if (actionType==='bank') openModal('bank', null);
    else if (actionType==='storage') openModal('storage', null);
    else if (actionType==='building') openModal('building', actionArg);
  };
  el.querySelector('[data-nx]').onclick = remove;
  stack.appendChild(el);
  while (stack.children.length>3){ stack.removeChild(stack.firstChild); }
}

  if (tool==='saw') return '<g'+cls+'><rect x="-2" y="2" width="16" height="3" fill="#B0B0B0"/><path d="M-2,5 L1,8 L4,5 L7,8 L10,5 L13,8" stroke="#8A8A8A" stroke-width="1.4" fill="none"/><rect x="-4" y="0" width="4" height="6" rx="1" fill="#7A5334"/></g>';

function personSvg(type, working, x, y, basket, toolOverride){
  var tool = toolOverride || (basket ? 'basket' : (WORKER_TYPES[type] ? WORKER_TYPES[type].tool : 'shovel'));
  return '<g transform="translate('+x+','+y+')">' +
    drawHumanWorkerSvg(type, tool, false, working) +

}
function drawCanopy(def, cx, cy, canopyR){
  var shape = def.shape, color = def.canopy;
  if (shape==='conifer'){
    return '<g fill="'+color+'">'+
      '<polygon points="'+cx+','+(cy-canopyR*1.5)+' '+(cx-canopyR*0.8)+','+(cy-canopyR*0.5)+' '+(cx+canopyR*0.8)+','+(cy-canopyR*0.5)+'"/>'+
      '<polygon points="'+cx+','+(cy-canopyR*1.0)+' '+(cx-canopyR*0.95)+','+(cy+canopyR*0.15)+' '+(cx+canopyR*0.95)+','+(cy+canopyR*0.15)+'"/>'+
      '<polygon points="'+cx+','+(cy-canopyR*0.5)+' '+(cx-canopyR*1.05)+','+cy+' '+(cx+canopyR*1.05)+','+cy+'"/>'+
    '</g>';
  }
  if (shape==='umbrella'){
    return '<g fill="'+color+'">'+
      '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(canopyR*1.35)+'" ry="'+(canopyR*0.42)+'"/>'+
      '<ellipse cx="'+cx+'" cy="'+(cy-canopyR*0.28)+'" rx="'+(canopyR*1.1)+'" ry="'+(canopyR*0.32)+'"/>'+
    '</g>';
  }
  if (shape==='tallRound'){
    return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(canopyR*0.72)+'" ry="'+(canopyR*1.2)+'" fill="'+color+'"/>';
  }
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+canopyR+'" fill="'+color+'"/>';
}
function drawDeadTreeShape(def){
  if (def.shape==='bush'){
    return '<ellipse cx="86" cy="86" rx="16" ry="12" fill="#A69B7A"/><ellipse cx="114" cy="86" rx="16" ry="12" fill="#A69B7A"/><ellipse cx="100" cy="78" rx="18" ry="13" fill="#A69B7A"/>';

function plotSpotHtml(p, layout){
  var stageInfo = plotStageInfo(p);
  var def = p.treeType ? TREE_TYPES[p.treeType] : null;
  var labelText = p.status==='barren' ? 'Plot '+(p.id+1) :
    p.status==='overgrown' ? '⚠️ Overgrown' :
    p.status==='preparing' ? 'Preparing…' :
    p.status==='clearing' ? 'Clearing…' :
    p.status==='dead' ? '💀 Dead #'+p.treeId :
    p.status==='removing' ? 'Removing…' :
    p.status==='ready' ? 'Tap to plant' :
    (p.health<=0 ? '💤 Stalled #'+p.treeId : stageInfo.name+' #'+p.treeId);
  var healthBar='';
  if (p.status==='growing'){
    var hColor = p.health>=70 ? '#6FA85A' : (p.health>=40 ? '#F0AC3D' : '#E8785A');
    healthBar = '<div class="health-mini"><div class="fill" style="width:'+p.health+'%;background:'+hColor+';"></div></div>';
  }
  var tagPosClass = (layout && layout.top >= 48) ? 'tag-pos-south' : 'tag-pos-north';
  return '<div class="plot-spot '+tagPosClass+'" style="top:'+layout.top+'%;left:'+layout.left+'%;width:'+layout.w+'%;height:'+layout.h+'%;" data-plot="'+p.id+'">'+
    '<div class="plot-label">'+(def?def.icon+' ':'')+labelText+'</div>'+ plotSvg(p) + healthBar +
    '<div class="plot-sub">'+ (p.assignedWorker!==null?'👷':'') + ((p.accessories&&(p.accessories.irrigation||p.accessories.fertilizer))?'🧰':'') + (p.pendingHarvest>0.5?'🧺':'') +'</div>'+
  '</div>';
}
function storageSpotHtml(){
  var s = state.storage;
  var label = s.building ? 'Storage ('+Math.round(Math.min(100,(s.buildHours/STORAGE_BUILD_HOURS)*100))+'%)' :
    (s.expanding ? 'Expanding ('+Math.round(Math.min(100,(s.expandHours/STORAGE_EXPAND_HOURS)*100))+'%)' :
    (s.built ? '€'+Math.round(s.stored)+' / €'+s.capacity : 'Storage Barn'));
  var fillPct = s.built ? Math.min(100, Math.round((s.stored/Math.max(1,s.capacity))*100)) : 0;
  var fillColor = fillPct>=85 ? '#E8785A' : (fillPct>=60 ? '#F0AC3D' : '#6FA85A');
  return '<div class="plot-spot village-building-card tag-pos-north '+(s.built?'is-built':'')+(s.building?'is-building':'')+'" style="top:'+STORAGE_SPOT.top+'%;left:'+STORAGE_SPOT.left+'%;width:'+STORAGE_SPOT.w+'%;height:'+STORAGE_SPOT.h+'%;" data-storage="1">'+
    '<div class="plot-label">🏚️ '+label+'</div>'+
    drawStorageScene(s) +
    (s.built ? '<div class="health-mini"><div class="fill" style="width:'+fillPct+'%;background:'+fillColor+';"></div></div>' : '')+
  '</div>';
}

function buildingSpotHtml(key){
  var b = state.buildings[key]; var def = BUILDING_TYPES[key]; var layout = VILLAGE_LAYOUT[key];
  var locked = def.requiresRoad && !state.buildings.road.built && !b.built && !b.building;
  var needsChoice = b.built && ((key==='garden' && !b.flowerType) || (key==='pond' && !b.specialization));
  var label = b.building ? def.label+' ('+Math.round(Math.min(100,(b.buildHours/def.buildHours)*100))+'%)' :
    (locked ? def.label+' 🔒' :
    (needsChoice ? def.label+' — Choose!' :
    (key==='garden' && b.built ? FLOWER_TYPES[b.flowerType].label :
    (key==='pond' && b.built ? POND_SPECIALIZATIONS[b.specialization].label : def.label))));
  var tending = b.careAnimUntil && Date.now() < b.careAnimUntil;

  var inner;
  if (key === 'road'){
    inner = drawRoadScene(b);
  } else if (key === 'crew_shed'){
    inner = drawCrewShedScene(b);
  } else if (key === 'garage'){
    inner = drawGarageScene(b);
  } else if (key === 'coffee_shop'){
    inner = drawCoffeeShopScene(b, tending);
  } else if (key === 'juice_bar'){
    inner = drawJuiceBarScene(b, tending);
  } else if (key === 'pond'){
    inner = drawPondScene(b.specialization, b.freshness, tending, b.collecting, b.building);
  } else if (key === 'garden'){
    inner = drawGardenScene(b.flowerType, b.freshness, tending, b.building);
  }

  // Dynamic Identity Tag Positioning:
  // North-curb cards (top < 45) keep tags at top; South-curb cards (top >= 48) place tags cleanly at bottom!
  var tagPosClass = (layout && layout.top >= 48) ? 'tag-pos-south' : 'tag-pos-north';

  var freshBar = (b.built && ((key==='garden'&&b.flowerType)||(key==='pond'&&b.specialization))) ?
    '<div class="health-mini"><div class="fill" style="width:'+b.freshness+'%;background:'+(b.freshness>=60?'#6FA85A':(b.freshness>=35?'#F0AC3D':'#E8785A'))+';"></div></div>' : '';
  var sub = (key==='pond' && b.built && b.specialization) ?
    '<div class="plot-sub">'+(b.assignedWorker?'👷':'')+((b.pendingCollect||0)>0.5?'🧺':'')+'</div>' :
    (key==='crew_shed' && b.built ? '<div class="plot-sub">'+state.workers.length+' 👷</div>' : '');

  return '<div class="plot-spot village-building-card '+tagPosClass+' '+(locked?'is-locked':'')+(b.built?'is-built':'')+(b.building?'is-building':'')+'" style="top:'+layout.top+'%;left:'+layout.left+'%;width:'+layout.w+'%;height:'+layout.h+'%;" data-building="'+key+'">'+
    '<div class="plot-label">'+(def?def.icon+' ':'')+label+'</div>'+
    inner + freshBar + sub +
  '</div>';
}

function getPendingTasksList(){
  var tasks = [];
  if (!state) return tasks;
  if (!state.rocksCleared && !state.rocksClearing){
    tasks.push({ type: 'rocks', targetId: null, label: '🪨 Clear Boulders (€50)', cost: 50 });
  }
  if ((state.lawnOvergrowth || 0) >= 30 && !state.lawnMowing){
    tasks.push({ type: 'lawn', targetId: null, label: '🌿 Mow Lawn (€15)', cost: 15 });
  }
  state.plots.forEach(function(p, idx){
    if (p.status === 'barren'){
      tasks.push({ type: 'dig', targetId: idx, label: '⛏️ Plot ' + (idx+1) + ' — Dig (€' + LABOR_COST + ')', cost: LABOR_COST });
    } else if (p.status === 'overgrown'){
      tasks.push({ type: 'clear', targetId: idx, label: '🌾 Plot ' + (idx+1) + ' — Clear Brush (€' + CLEAR_COST + ')', cost: CLEAR_COST });
    } else if (p.status === 'dead'){
      var def = TREE_TYPES[p.treeType]; var cfg = REMOVE_CONFIG[def.category];
      tasks.push({ type: 'removeTree', targetId: idx, label: '🪓 Plot ' + (idx+1) + ' — Cut ' + def.label + ' (€' + cfg.cost + ')', cost: cfg.cost });
    } else if (p.status === 'growing'){
      if (p.pendingHarvest >= 0.5 && !p.harvesting){
        tasks.push({ type: 'harvest', targetId: idx, label: '🧺 Plot ' + (idx+1) + ' — Harvest (€' + p.pendingHarvest.toFixed(2) + ')', cost: 0 });
      } else if (p.health < 60){
        tasks.push({ type: 'water', targetId: idx, label: '💧 Plot ' + (idx+1) + ' — Water', cost: 0 });
      } else if (p.assignedWorker === null){
        tasks.push({ type: 'plot', targetId: idx, label: '🌱 Plot ' + (idx+1) + ' — Tend Plant', cost: 0 });
      }
    }
  });
  if (state.storage && state.storage.built && !state.storage.assignedLaborerId){
    tasks.push({ type: 'storage', targetId: null, label: '📦 Storage Depot Loading', cost: 0 });
  }
  if (state.buildings && state.buildings.pond && state.buildings.pond.built && !state.buildings.pond.assignedWorker){
    tasks.push({ type: 'building', targetId: 'pond', label: '🪷 Pond Aquaculture', cost: 0 });
  }
  return tasks;
}

    html += '<div class="storage-inventory-grid">';
    if (visibleItems.length === 0){
      html += '<div class="empty-note" style="padding:16px;text-align:center;">' +
        (items.length === 0
          ? 'Storage cellar is currently empty. Harvest trees in your plots or pond produce to stock the barn!'
          : 'No items match the "' + storageFilter + '" filter.') +
      '</div>';
    } else {
      visibleItems.forEach(function(it){
        var isSel = storageSelectedMap[it.id] !== false;
        html += '<div class="storage-item-card ' + (isSel ? 'is-selected' : '') + '" data-toggle-storage-item="' + it.id + '">' +
          '<input type="checkbox" ' + (isSel ? 'checked' : '') + ' style="pointer-events:none;">' +
          '<div class="item-icon">' + (it.icon || '📦') + '</div>' +
          '<div class="item-details">' +
            '<div class="item-name"><b>' + it.name + '</b> <span class="item-qty">(' + it.qty + ' units)</span></div>' +
            '<div class="item-source">🌱 Harvested from: <b>' + it.source + '</b></div>' +
            '<div class="item-meta">' +
              '<span>Freshness: <b style="color:' + (it.freshness>=75?'#2E7D32':'#F57C00') + '">' + it.freshness + '%</b></span> ' +
              '<span>· Preserved at 4.2°C</span>' +
            '</div>' +
          '</div>' +
          '<div class="item-value">' +
            '<div class="val-num">€' + it.value.toFixed(2) + '</div>' +
            '<span class="val-sub">Export Value</span>' +
          '</div>' +
        '</div>';
      });
    }
    html += '</div>';

    // Vehicle Transport Preview
    if (selectedItems.length > 0){
      if (vehicleType === 'timber'){
        html += '<div class="storage-vehicle-preview timber">' +
          '<b>🚛 Heavy Timber Logging Truck</b>' +
          '<span>Dispatches via Main Road with secured bolster stanchions and ratchet straps for heavy timber logs.</span>' +
        '</div>';
      } else if (vehicleType === 'produce'){
        html += '<div class="storage-vehicle-preview produce">' +
          '<b>🚚 Refrigerated Food Container Van</b>' +
          '<span>Insulated delivery van with Thermo-King cooling unit preserving farm freshness on the road.</span>' +
        '</div>';
      } else {
        html += '<div class="storage-vehicle-preview mixed">' +
          '<b>🚚🚛 Multi-Cargo Farm Freight Hauler</b>' +
          '<span>Heavy-duty covered hauler transporting mixed timber and refrigerated food crates.</span>' +
        '</div>';
      }
    }

    // Laborer Requirement Check
    var assignedLaborer = workerOnStorage();
    var idleLaborers = state.workers.filter(function(w){ return w.type === 'laborer' && w.assignedPlot === null && !w.assignedBuilding; });
    var allLaborers = state.workers.filter(function(w){ return w.type === 'laborer'; });
    var canDispatch = selectedItems.length > 0 && (assignedLaborer !== null || idleLaborers.length > 0);

    if (assignedLaborer){
      html += '<div class="laborer-status-box ok">' +
        '<span>👷 <b>Assigned Logistics Laborer:</b> ' + (assignedLaborer.name || ('Laborer #' + assignedLaborer.id)) + ' (Ready at loading dock)</span>' +
        '<button class="mini-btn" data-unassign-laborer-storage="1" style="margin-left:8px;">Unassign</button>' +
      '</div>';
    } else if (idleLaborers.length > 0){
      html += '<div class="laborer-status-box warn">' +
        '<span>⚠️ <b>Laborer Required:</b> Assign a Laborer to load crates and handle shipment dispatch.</span><br>' +
        '<button class="secondary" data-assign-laborer-storage="' + idleLaborers[0].id + '" style="margin-top:6px;">👷 Assign Available Laborer to Storage</button>' +
      '</div>';
    } else if (allLaborers.length > 0){
      html += '<div class="laborer-status-box warn">' +
        '<span>⚠️ All Laborers are currently busy. Free one up from plot tasks or hire another to dispatch transport.</span>' +
      '</div>';
    } else {
      html += '<div class="laborer-status-box alert">' +
        '<span>⚠️ <b>No Laborer Hired:</b> A farm Laborer is required to operate the storage loading dock and load transport vehicles.</span><br>' +
        '<button class="secondary" data-hire="laborer" style="margin-top:6px;">👷 Hire Laborer (€30 wage)</button>' +
      '</div>';
    }

    // Dispatch Transport Button
    html += '<button class="primary" data-dispatch-sale="1" ' + (!canDispatch ? 'disabled' : '') + '>' +
      '🚚 Dispatch Transport & Sell ' + (selectedItems.length > 0 ? ('(' + selectedItems.length + ' items · €' + selectedValue.toFixed(2) + ')') : '(No items selected)') +
    '</button>';

    // Expand Storage Section
    html += '<div class="section" style="margin-top:12px;"><h4>📦 Expand Storage Capacity</h4>' +
      '<div class="sub" style="margin-bottom:6px;">+€' + STORAGE_EXPAND_CAPACITY + ' cold cellar capacity, ' + STORAGE_EXPAND_HOURS + 'h construction time.</div>' +
      '<button class="secondary" data-expandstorage="1" ' + (state.money < expandStorageCost() ? 'disabled' : '') + '>Expand Cellar — €' + expandStorageCost() + '</button>' +
    '</div>';
  }

  html += '<button class="modal-bottom-close" data-closemodal="1">✕ Close Storage Window</button>';
  html += '</div></div>';
  return html;
}

function modalHtml(){
  if (!activeModal) return '';
  if (activeModal.type==='storage') return storageModalHtml();
  if (activeModal.type==='bank') return bankModalHtml();
  if (activeModal.type==='building') return buildingModalHtml(activeModal.plotId);
  if (activeModal.type==='auth') return authModalHtml();
  var p = state.plots[activeModal.plotId];
  var def = p.treeType ? TREE_TYPES[p.treeType] : null;
  var stageInfo = plotStageInfo(p);
  var w = workerOnPlot(p.id);

  var html = '<div class="overlay" id="modalOverlay"><div class="modal">'+
    '<h2><span>' + (def ? def.icon + ' ' : '') + 'Plot ' + (p.id + 1) + (def ? ' — ' + def.label + ' <span style="font-size:0.7rem;color:var(--pine-soft);">#' + p.treeId + '</span>' : '') + '</span>' +
    '<button class="close-modal" data-closemodal="1" title="Close Plot Window">✕</button></h2>';

  if (p.animal){
    var an = ANIMALS.find(function(x){return x.key===p.animal.key;});
    html += '<div class="animal-alert"><span class="em">'+an.emoji+'</span> <b>'+an.name+' spotted!</b><br>'+an.fact+
      '<button class="primary" data-scare="'+p.id+'">Scare Away (€'+SCARE_COST+')</button></div>';
  }

  if (p.status==='barren'){
    html += '<div class="sub">Empty land. Weeds build up over time if left untouched.</div>'+
      '<div class="row"><span>Weed level</span><span class="v">'+Math.round(Math.min(100,p.weedHours/OVERGROWN_THRESHOLD*100))+'%</span></div>'+
      '<button class="primary" data-prep="'+p.id+'" '+(state.money<LABOR_COST?'disabled':'')+'>Dig Land (€'+LABOR_COST+' · 3h)</button>';
  } else if (p.status==='overgrown'){
    html += '<div class="sub">This plot became overgrown from neglect and needs clearing before you can dig or plant.</div>'+
      '<button class="primary" data-clear="'+p.id+'" '+(state.money<CLEAR_COST?'disabled':'')+'>Clear Overgrowth (€'+CLEAR_COST+' · 2h)</button>';
  } else if (p.status==='preparing' || p.status==='clearing'){
    var dur = p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS;
    var pct = Math.round(Math.min(100,(p.taskHours/dur)*100));
    html += '<div class="sub">'+(p.status==='preparing'?'Digging in progress. Soil will be ready for planting once complete.':'Clearing overgrowth.')+'</div>'+
      '<div class="row"><span>Progress</span><span class="v">'+pct+'%</span></div>'+
      '<div class="healthbar" style="margin-bottom:12px;"><div class="fill" style="width:'+pct+'%;background:#F0AC3D;"></div></div>'+
      (w ? ('<div class="row"><span>Assisted by</span><span class="v">'+WORKER_TYPES[w.type].label+' (#'+w.id+')</span></div>'+
            '<button class="secondary" onclick="unassignWorkerById('+w.id+')" style="margin-top:6px;">↩️ Recall Worker to Shed</button>')
         : (function(){
            var idleCrew = state.workers.filter(function(x){return x.assignedPlot===null && !x.assignedBuilding && (x.type==='laborer' || x.type==='farmer');});
            if (!idleCrew.length) return '<div class="empty-note">Tip: Recruit a Farmer or Laborer from the Crew Shed to assist with digging (+50% speed).</div>';
            return '<div class="section"><h4>👷 Assign Available Field Worker</h4>'+
              idleCrew.map(function(iw){ return '<div class="worker-opt"><div class="worker-opt-info"><b>'+WORKER_TYPES[iw.type].label+' #'+iw.id+'</b><span class="worker-opt-status">(idle)</span></div><button class="worker-opt-btn" data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign Worker</button></div>'; }).join('')+'</div>';
          })());
  } else if (p.status==='dead'){
    var remCfg = REMOVE_CONFIG[def.category];
    html += '<div class="sub">This '+def.label+' dried out completely after being neglected at 0% health for too long. It won\'t recover — it needs to be cut down before you can replant here.</div>'+
      '<div class="row"><span>Removal cost</span><span class="v">€'+remCfg.cost+'</span></div>'+
      '<div class="row"><span>Time needed</span><span class="v">'+remCfg.hours+'h'+(remCfg.vehicle?' + hauling':'')+'</span></div>'+
      (remCfg.salvagePct>0 ? '<div class="row"><span>Expected salvage</span><span class="v">≈€'+(remCfg.cost*remCfg.salvagePct).toFixed(2)+'</span></div>' : '')+
      '<button class="primary" data-removetree="'+p.id+'" '+(state.money<remCfg.cost?'disabled':'')+'>Cut down '+def.label+' (€'+remCfg.cost+')</button>'+
      '<div class="empty-note" style="margin-top:6px;">Assign a Laborer once removal starts to speed it up ('+remCfg.tool+(remCfg.vehicle?' + truck':'')+').</div>';
  } else if (p.status==='removing'){
    var remCfg2 = REMOVE_CONFIG[def.category];
    html += '<div class="sub">Cutting down the dead '+def.label+' with a '+remCfg2.tool+(remCfg2.vehicle?', then hauling it away by truck.':'.')+'</div>'+
      '<div class="row"><span>Progress</span><span class="v">'+Math.round(Math.min(100,(p.taskHours/remCfg2.hours)*100))+'%</span></div>'+
      (w ? '<div class="row"><span>Assisted by</span><span class="v">'+WORKER_TYPES[w.type].label+'</span></div>'
         : '<div class="empty-note">No worker assigned — this will take the full '+remCfg2.hours+'h. Assign a Laborer below to speed it up.</div>');
    var idleCrew = state.workers.filter(function(x){return x.assignedPlot===null && !x.assignedBuilding && (x.type==='laborer' || x.type==='farmer');});
    if (!w && idleCrew.length){
      html += idleCrew.map(function(iw){ return '<div class="worker-opt"><div class="worker-opt-info"><b>'+WORKER_TYPES[iw.type].label+' #'+iw.id+'</b><span class="worker-opt-status">(idle)</span></div><button class="worker-opt-btn" data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign Worker</button></div>'; }).join('');
    } else if (w) {
      html += '<button class="secondary" onclick="unassignWorkerById('+w.id+')" style="margin-top:6px;">↩️ Recall Worker to Shed</button>';
    }
  } else if (p.status==='ready'){
    html += '<div class="sub">Soil is ready — but weeds will creep back if it sits unplanted too long. Every species from the blueprint\'s tree categories is available.</div>'+
      '<div class="row"><span>Weed level</span><span class="v">'+Math.round(Math.min(100,p.weedHours/OVERGROWN_THRESHOLD*100))+'%</span></div>';
    CATEGORY_ORDER.forEach(function(cat){
      html += '<div class="cat-head">'+cat+'</div><div class="grid2">';
      Object.keys(TREE_TYPES).forEach(function(k){
        var d = TREE_TYPES[k]; if (d.category!==cat) return;
        html += '<button class="plant-opt" data-plant="'+p.id+'" data-type="'+k+'" '+(state.money<d.cost?'disabled style="opacity:0.5;"':'')+'><span class="pn">'+d.icon+' '+d.label+'</span><span class="pc">€'+d.cost+'</span></button>';
      });
      html += '</div>';
    });
  } else if (p.status==='growing'){
    var hColor = p.health>=70 ? '#6FA85A' : (p.health>=40 ? '#F0AC3D' : '#E8785A');
    var kpi = plotKpi(p);
    html += '<div class="sub">'+def.category+' · stage: '+(p.health<=0?'stalled — no oxygen output':stageInfo.name)+'</div>'+
      '<div class="row"><span>Oxygen produced (this tree)</span><span class="v">'+p.o2Produced.toFixed(1)+' O₂</span></div>'+
      '<div class="row"><span>Health</span><span class="v">'+Math.round(p.health)+'%</span></div>'+
      '<div class="healthbar"><div class="fill" style="width:'+p.health+'%;background:'+hColor+';"></div></div>'+
      '<div class="kpi-box"><span class="big">'+kpi+'% KPI</span><br><span style="color:var(--pine-soft);">Efficiency = productive time ÷ total time since planting.'+
        (p.downtimeHours>0.05 ? (' Stalled '+p.downtimeHours.toFixed(1)+'h with 0% health so far.') : '')+'</span></div>';

    if (def.lateBonus){
      html += '<div class="section"><h4>🧺 Harvest</h4>'+
        '<div class="row"><span>Ready to harvest</span><span class="v">€'+p.pendingHarvest.toFixed(2)+'</span></div>'+
        (p.harvesting ? '<div class="empty-note">Farmer is picking… ('+Math.min(100,Math.round((Date.now()-p.harvestStartReal)/4000*100))+'%)</div>' :
          (p.pendingHarvest>0.5 ? ('<button class="primary" data-harvest="'+p.id+'" '+((!w||w.type!=='farmer')?'disabled':'')+'>Harvest now</button>'+
            ((!w||w.type!=='farmer')?'<div class="empty-note">Assign a Farmer below to harvest by hand.</div>':''))
          : '<div class="empty-note">Nothing ready yet.</div>'))+
        (!state.storage.built ? '<div class="empty-note">No Storage Room yet — half the value spoils automatically on each harvest. Build one from the Tasks panel.</div>'
          : '<div class="empty-note">Storage: €'+state.storage.stored.toFixed(0)+' / €'+state.storage.capacity+' — open the storage building to sell or expand.</div>')+
      '</div>';
    }

    html += '<div class="section"><h4>🩺 Care (real maintenance costs)</h4>'+
        '<button class="secondary" data-water="'+p.id+'" '+(state.money<CARE_COST.water[def.category]?'disabled':'')+'>💧 Water now — €'+CARE_COST.water[def.category]+' (+30 health)</button>'+
        (def.category!=='Vegetable' ? '<button class="secondary" data-prune="'+p.id+'" '+(state.money<CARE_COST.prune[def.category]?'disabled':'')+'>✂️ Prune now — €'+CARE_COST.prune[def.category]+' (+40 health)</button>' : '')+
      '</div>'+
      '<div class="section"><h4>🧰 Accessories</h4>'+
        Object.keys(ACCESSORIES).map(function(k){
          var acc = ACCESSORIES[k]; var owned = p.accessories[k];
          return '<div class="row"><span>'+acc.emoji+' '+acc.label+' <span style="color:var(--pine-soft);font-size:0.72rem;">('+acc.desc+')</span></span>'+
            (owned ? '<span class="v">✓ installed</span>' : '<button class="claim-btn" data-buyacc="'+k+'" data-buyplot="'+p.id+'" '+(state.money<acc.cost?'disabled':'')+'>€'+acc.cost+'</button>')+'</div>';
        }).join('')+
      '</div>'+
      '<div class="section"><h4>👷 Worker</h4>'+
        (w ? ('<div class="worker-opt assigned"><div class="worker-opt-info"><b>✓ '+WORKER_TYPES[w.type].label+' #'+w.id+'</b><span class="worker-opt-status">assigned here</span></div><button class="secondary worker-opt-btn" onclick="unassignWorkerById('+w.id+')">↩️ Recall to Shed</button></div>')
           : (function(){
              var idle = state.workers.filter(function(x){return x.assignedPlot===null && !x.assignedBuilding;});
              if (!idle.length) return '<div class="empty-note">No idle personnel available — recruit from the Crew Shed.</div>';
              return idle.map(function(iw){ return '<div class="worker-opt"><div class="worker-opt-info"><b>'+WORKER_TYPES[iw.type].label+' #'+iw.id+'</b><span class="worker-opt-status">(idle)</span></div><button class="worker-opt-btn" data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign Worker</button></div>'; }).join('');
            })())+
      '</div>'+
      '<div class="section"><h4>💡 About this species</h4><div style="font-size:0.78rem;color:var(--pine-soft);">'+def.fact+'</div></div>';
  }

  html += '<button class="modal-bottom-close" data-closemodal="1">✕ Close Plot Window</button>';
  html += '</div></div>';
  return html;
}

// ================= FLOATING PANELS =================
function panelHtml(){
  if (!openPanel) return '';
  if (openPanel==='tasks'){
    var rows=''; var any=false;
    if (!state.storage.built){
      any=true;
      if (state.storage.building){
        var spct = Math.round(Math.min(100,(state.storage.buildHours/STORAGE_BUILD_HOURS)*100));
        rows += '<div class="task-row"><div class="task-info"><div class="name">🏗 Building Storage Room</div><div class="meta">'+spct+'% done</div></div><button class="claim-btn" disabled>…</button></div>';
      } else {
        rows += '<div class="task-row"><div class="task-info"><div class="name">🏚 Build Storage Room</div><div class="meta">€'+STORAGE_COST+' · '+STORAGE_BUILD_HOURS+'h · stops harvest spoilage</div></div><button class="claim-btn" data-buildstorage="1" '+(state.money<STORAGE_COST?'disabled':'')+'>Build</button></div>';
      }
    } else if (state.storage.expanding){
      any=true;
      var epct = Math.round(Math.min(100,(state.storage.expandHours/STORAGE_EXPAND_HOURS)*100));

    }
