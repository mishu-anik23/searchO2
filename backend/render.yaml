services:
  - type: web
    name: searcho2-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://searcho2.online
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: postgresql://postgres.plvieqzmwwjcjyvwyczl:$0@Ar!Sh_m@Dz2009@aws-1-eu-west-1.pooler.supabase.com:5432/postgres
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
