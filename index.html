  var currentArchiveIdx = null;
  var activeArchiveSequence = null;

  function getArchiveTrackSequence(trackDef){
    var stepLen = (60 / trackDef.bpm) / 2;
    var steps = [];
    trackDef.chordsProg.forEach(function(cp){
      steps.push({ bass: cp.bass, chords: cp.chords, lead: cp.lead, leadInst: cp.inst || 'pluck' });
      steps.push({ bass: null, chords: cp.chords ? [cp.chords[0]] : null, lead: null, leadInst: cp.inst || 'pluck' });
      steps.push({ bass: cp.bass, chords: cp.chords ? [cp.chords[1] || cp.chords[0]] : null, lead: cp.lead, leadInst: cp.inst || 'pluck' });
      steps.push({ bass: null, chords: cp.chords ? [cp.chords[2] || cp.chords[0]] : null, lead: null, leadInst: cp.inst || 'pluck' });
    });
    return {
      id: trackDef.id,
      title: trackDef.title,
      artist: trackDef.artist,
      year: trackDef.year,
      genre: trackDef.genre,
      subgenre: trackDef.subgenre,
      stepLen: stepLen,
      steps: steps
    };
  }

  function getArchiveSequence(idx){
    if (idx === null || !BILLBOARD_ARCHIVE[idx]) return null;
    if (activeArchiveSequence && activeArchiveSequence.archiveIdx === idx) return activeArchiveSequence;
    var seq = getArchiveTrackSequence(BILLBOARD_ARCHIVE[idx]);
    seq.archiveIdx = idx;
    activeArchiveSequence = seq;
    return activeArchiveSequence;
  }

  function playArchiveTrack(idx){
    initContext();
    if (!audioCtx) return;
    if (currentArchiveIdx === idx && isPlaying){
      pause();
      if (openPanel === 'music') render();
      return;
    }
    currentArchiveIdx = idx;
    currentStep = 0;
    isPlaying = true;
    nextStepTime = audioCtx.currentTime + 0.05;
    startScheduler();
    showNotification('📻', 'Now Playing: ' + BILLBOARD_ARCHIVE[idx].title + ' — ' + BILLBOARD_ARCHIVE[idx].artist + ' (' + BILLBOARD_ARCHIVE[idx].year + ')', 'music', null);
    if (openPanel === 'music') render();
  }

  function toggleArchivePlay(){
    initContext();
    if (!audioCtx) return;
    if (currentArchiveIdx === null) currentArchiveIdx = 0;
    if (isPlaying){
      pause();
    } else {
      isPlaying = true;
      currentStep = 0;
      nextStepTime = audioCtx.currentTime + 0.05;
      startScheduler();
    }
    if (openPanel === 'music') render();
  }

  function nextArchiveTrack(){
    if (currentArchiveIdx === null) currentArchiveIdx = 0;
    else currentArchiveIdx = (currentArchiveIdx + 1) % BILLBOARD_ARCHIVE.length;
    playArchiveTrack(currentArchiveIdx);
  }

  function prevArchiveTrack(){
    if (currentArchiveIdx === null) currentArchiveIdx = 0;
    else currentArchiveIdx = (currentArchiveIdx - 1 + BILLBOARD_ARCHIVE.length) % BILLBOARD_ARCHIVE.length;
    playArchiveTrack(currentArchiveIdx);
  }

  return {
    playArchiveTrack: playArchiveTrack,
    toggleArchivePlay: toggleArchivePlay,
    nextArchiveTrack: nextArchiveTrack,
    prevArchiveTrack: prevArchiveTrack,
    isArchivePlaying: function(){ return isPlaying && currentArchiveIdx !== null; },
    getArchiveCurrentIndex: function(){ return currentArchiveIdx; },
    getArchiveList: function(){ return BILLBOARD_ARCHIVE; },
    getVolume: function(){ return volume; },
    init: function(){
      syncUI();
      // Unlock on first user gesture
      var unlockAudio = function(){
        initContext();
        window.removeEventListener('click', unlockAudio);
        window.removeEventListener('keydown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };
      window.addEventListener('click', unlockAudio);
      window.addEventListener('keydown', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);
    },
    play: play,
    pause: pause,
    toggle: toggle,
    nextTrack: nextTrack,
    prevTrack: prevTrack,
    playTrackById: playTrackById,
    selectTrackByIndex: selectTrackByIndex,
    setVolume: setVolume,
    toggleMute: toggleMute,
    toggleSfx: toggleSfx,
    playSFX: playSFX,
    isPlaying: function(){ return isPlaying; },
    getCurrentTrack: function(){ return TRACKS[currentTrackIdx]; },
    syncUI: syncUI
  };
})();


function switchScreen(screenName){
  currentScreen = screenName;
  var rScreen = document.getElementById('regionScreen');
  var fScreen = document.getElementById('farmScreen');
  if (screenName === 'farm'){
    if (rScreen) rScreen.style.display = 'none';
    if (fScreen) fScreen.style.display = 'block';
    buildSeasonChipOnce();
    buildToolStripOnce();
    if (typeof SoundTrackEngine !== 'undefined'){
      SoundTrackEngine.playTrackById('germany');
    }
  } else {
    if (rScreen) rScreen.style.display = 'block';
    if (fScreen) fScreen.style.display = 'none';
    if (typeof SoundTrackEngine !== 'undefined'){
      SoundTrackEngine.playTrackById('globe');
    }
  }
  render();
}

function updateAuthUIState(){
  var rScreen = document.getElementById('regionScreen');
  var authOverlay = document.getElementById('initialAuthOverlay');
  var authCard = document.getElementById('initialAuthCard');

  if (!apiUser){
    if (rScreen) rScreen.classList.add('screen-blurred');
    if (authOverlay) authOverlay.classList.remove('hidden');
    if (authCard) {
      authCard.innerHTML = initialAuthModalHtml();
      wireInitialAuthEvents();
    }
  } else {
    if (rScreen) rScreen.classList.remove('screen-blurred');
    if (authOverlay) authOverlay.classList.add('hidden');
  }
}

function renderRegionCardsHtml(state, season){
  return REGIONAL_BIOMES.map(function(b){
    var isCurrent = b.id === 'germany';
    var badgeClass = isCurrent ? 'active' : 'locked';
    var badgeText = isCurrent ? '🟢 ACTIVE FARM · 6 PLOTS' : ('🔒 UNLOCKS AT ' + b.unlockO2.toLocaleString() + ' O₂');

    var snapshotHtml = '';
    if (isCurrent && state){
      var growingTrees = state.plots.filter(function(p){ return p.status==='growing'; }).length;
      snapshotHtml = '<div class="farm-snapshot-box" id="farmSnapshotBox">' +
        '<div><span class="s-lbl">TREASURY</span><span class="s-val">€' + state.money.toFixed(2) + '</span></div>' +
        '<div><span class="s-lbl">TOTAL OXYGEN</span><span class="s-val">' + state.totalO2.toFixed(1) + ' O₂</span></div>' +
        '<div><span class="s-lbl">ACTIVE TREES</span><span class="s-val">' + growingTrees + ' / 6 Plots</span></div>' +
        '<div><span class="s-lbl">SEASON</span><span class="s-val">' + season.emoji + ' ' + season.name + '</span></div>' +
      '</div>';
    }

    var speciesList = b.nativeSpecies.map(function(s){ return '<span class="species-mini-pill">' + s + '</span>'; }).join('');

    var btnHtml = isCurrent
      ? '<button class="btn-enter-region" data-enterfarm="germany"><span>Enter German Farm ➔</span></button>'
      : '<button class="btn-locked-region" disabled><span>🔒 Region Surveying (' + b.unlockO2.toLocaleString() + ' O₂ Needed)</span></button>';

    return '<div class="region-card ' + (isCurrent ? 'active-region' : 'locked-region') + '" ' + (isCurrent ? 'data-enterfarm="germany"' : ('data-centerregion="' + b.id + '"')) + '>' +
      '<div>' +
        '<div class="region-card-top">' +
          '<div class="region-flag-wrap">' +
            '<span class="region-flag">' + b.flag + '</span>' +
            '<div>' +
              '<h3 class="region-title">' + b.title + '</h3>' +
              '<div class="region-country">' + b.country + ' · ' + b.biomeType + '</div>' +
            '</div>' +
          '</div>' +
          '<span class="region-badge ' + badgeClass + '">' + badgeText + '</span>' +
        '</div>' +
        (isCurrent ? snapshotHtml : '') +
        '<div class="region-meta-list">' +
          '<div class="region-meta-item"><span class="lbl">🌡️ Climate & Weather</span><span class="val">' + b.climate + '</span></div>' +
          '<div class="region-meta-item"><span class="lbl">🌱 Soil Conditions</span><span class="val">' + b.soilQuality + '</span></div>' +
          '<div class="region-meta-item" style="flex-direction:column;align-items:flex-start;gap:4px;"><span class="lbl">Native Species</span><div class="species-pill-box">' + speciesList + '</div></div>' +
        '</div>' +
        '<div class="trait-banner">⭐ ' + b.specialTrait + '</div>' +
      '</div>' +
      '<div style="margin-top:12px;">' + btnHtml + '</div>' +
    '</div>';
  }).join('');
}

var API_BASE_URL = 'http://localhost:5000/api';
var WS_BASE_URL = 'ws://localhost:5000/ws';
var apiUser = null;
var authToken = null;
var backendOnline = false;
var wsConnection = null;

var ApiClient = {
  init: function(){
    var self = this;
    fetch(API_BASE_URL + '/health', { method: 'GET' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.status === 'healthy'){
          backendOnline = true;
          console.log('✅ Connected to searchO2 backend on', API_BASE_URL);
          var savedToken = localStorage.getItem('searchO2_token');
          if (savedToken){
            authToken = savedToken;
            self.fetchMe();
          } else {
            var localGuest = localStorage.getItem('searchO2_guest_user');
            if (localGuest){
              try { apiUser = JSON.parse(localGuest); } catch(e){}
            }
            render();
          }
        }
      })
      .catch(function(err){
        backendOnline = false;
        console.log('ℹ️ Backend offline — running in local standalone mode');
        var localGuest = localStorage.getItem('searchO2_guest_user');
        if (localGuest){
          try { apiUser = JSON.parse(localGuest); } catch(e){}
        }
        render();
      });
  },
  fetchMe: function(){
    var self = this;
    if (!authToken) return;
    fetch(API_BASE_URL + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if (data.user){
        apiUser = data.user;
        render();
        self.connectWs();
        self.syncFarm();
      } else {
        authToken = null;
        localStorage.removeItem('searchO2_token');
        render();
      }
    })
    .catch(function(){});
  },
  connectWs: function(){
    if (!authToken || wsConnection) return;
    try {
      wsConnection = new WebSocket(WS_BASE_URL + '?token=' + authToken);
      wsConnection.onmessage = function(ev){
        try {
          var msg = JSON.parse(ev.data);
          if (msg.type === 'TICK' || msg.type === 'TASK_COMPLETE'){
            showNotification('⚡', msg.payload.message || 'Server synchronized farm progress', 'plot', 0);
          }
        } catch(e){}
      };
      wsConnection.onclose = function(){ wsConnection = null; };
    } catch(e){}
  },
  register: function(email, password, displayName){
    var self = this;
    return fetch(API_BASE_URL + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password, displayName: displayName })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      authToken = d.accessToken;
      apiUser = d.user;
      localStorage.setItem('searchO2_token', authToken);
      localStorage.removeItem('searchO2_guest_user');
      showNotification('🎉', 'Welcome ' + d.user.displayName + '! Cloud save active.', 'bank', null);
      self.connectWs();
      closeModal();
      render();
    });
  },
  login: function(email, password){
    var self = this;
    return fetch(API_BASE_URL + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      authToken = d.accessToken;
      apiUser = d.user;
      localStorage.setItem('searchO2_token', authToken);
      localStorage.removeItem('searchO2_guest_user');
      showNotification('✅', 'Signed in as ' + d.user.displayName, 'bank', null);
      self.connectWs();
      closeModal();
      render();
    });
  },
  loginGoogle: function(idToken){
    var self = this;
    return fetch(API_BASE_URL + '/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: idToken || 'mock_google_user_' + Date.now() })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      authToken = d.accessToken;
      apiUser = d.user;
      localStorage.setItem('searchO2_token', authToken);
      localStorage.removeItem('searchO2_guest_user');
      showNotification('🚀', 'Signed in with Google! Cloud save active.', 'bank', null);
      self.connectWs();
      closeModal();
      render();
    });
  },
  startLocalGuest: function(){
    apiUser = {
      id: 'guest_' + Math.floor(1000 + Math.random()*9000),
      displayName: 'Guest Farmer #' + Math.floor(1000 + Math.random()*9000),
      role: 'guest',
      authProvider: 'local_guest'
    };
    localStorage.setItem('searchO2_guest_user', JSON.stringify(apiUser));
    showNotification('🌱', 'Guest session active (Central Europe / Germany)', 'bank', null);
    closeModal();
    render();
  },
  loginGuest: function(){
    var self = this;
    if (backendOnline){
      return fetch(API_BASE_URL + '/auth/guest', { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) throw new Error(d.error);
        authToken = d.accessToken;
        apiUser = d.user;
        localStorage.setItem('searchO2_token', authToken);
        localStorage.removeItem('searchO2_guest_user');
        showNotification('🌱', 'Welcome ' + d.user.displayName + '! Connected to PostgreSQL 18.', 'bank', null);
        self.connectWs();
        closeModal();
        render();
      })
      .catch(function(){
        self.startLocalGuest();
      });
    } else {
      self.startLocalGuest();
      return Promise.resolve();
    }
  },
  upgrade: function(provider, payload){
    var self = this;
    if (!authToken) return Promise.reject(new Error('No active guest session'));
    payload.provider = provider;
    return fetch(API_BASE_URL + '/auth/upgrade', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify(payload)
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      authToken = d.accessToken;
      apiUser = d.user;
      localStorage.setItem('searchO2_token', authToken);
      localStorage.removeItem('searchO2_guest_user');
      showNotification('🏆', 'Account upgraded! Your farm is permanently saved.', 'bank', null);
      closeModal();
      render();
    });
  },
  logout: function(){
    var self = this;
    if (authToken){
      fetch(API_BASE_URL + '/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken } }).catch(function(){});
    }
    authToken = null;
    apiUser = null;
    localStorage.removeItem('searchO2_token');
    localStorage.removeItem('searchO2_guest_user');
    if (wsConnection) { wsConnection.close(); wsConnection = null; }
    showNotification('👋', 'Signed out', 'bank', null);
    currentScreen = 'region_select';
    closeModal();
    render();
  },
  syncFarm: function(){
    if (!authToken || !backendOnline) return;
    fetch(API_BASE_URL + '/farm', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.farm && d.plots){
        state.money = Number(d.farm.money);
        state.totalO2 = Number(d.farm.total_o2);
        state.totalO2AllTime = Number(d.farm.total_o2_all_time);
        state.treesPlanted = d.farm.trees_planted;
        state.treesRemoved = d.farm.trees_removed || 0;
        state.gameHour = Number(d.farm.game_hour);
        if (d.farm.storage_state) state.storage = d.farm.storage_state;
        if (d.farm.buildings_state) state.buildings = d.farm.buildings_state;
        if (d.farm.loan_state) state.loan = d.farm.loan_state;
        d.plots.forEach(function(sp, idx){
          if (state.plots[idx]){
            state.plots[idx].status = sp.status;
            state.plots[idx].treeType = sp.tree_type;
            state.plots[idx].treeId = sp.tree_id;
            state.plots[idx].health = Number(sp.health);
            state.plots[idx].growHours = Number(sp.grow_hours);
            state.plots[idx].taskHours = Number(sp.task_hours);
            state.plots[idx].weedHours = Number(sp.weed_hours);
            state.plots[idx].zeroHealthStreakHours = Number(sp.zero_health_streak_hours || 0);
            state.plots[idx].pendingHarvest = Number(sp.pending_harvest);
            if (sp.accessories) state.plots[idx].accessories = sp.accessories;
          }
        });
        render();
      }
    })
    .catch(function(){});
  }
};

// ================= PERSISTENCE =================
// Every action used to call storage.set() immediately (14 call sites) on top of a
// 15s auto-save interval. Rapid clicking (or several harvests finishing back-to-back)
// could fire many writes within the same second, which is the most likely cause of
// the "Internal server error" — the storage API is rate-limited. This coalesces
// everything into at most one write per ~3s, retries once on failure instead of
// silently dropping it, and never lets two writes overlap.
var saveTimer = null;
var savePending = false;
var saveInFlight = false;
function doSave(){
  if (!window.storage || !state) return;
  if (saveInFlight){ savePending = true; return; }
  saveInFlight = true;
  state.lastSaveReal = Date.now();
  window.storage.set('searchO2-save-v4', JSON.stringify(state)).then(function(){
    saveInFlight = false;
    if (savePending){ savePending = false; requestSave(); }
  }).catch(function(e){
    saveInFlight = false;
    console.error('Save failed, will retry shortly:', e);
    setTimeout(function(){ requestSave(); }, 6000);
  });
}
function requestSave(){
  savePending = true;
  if (saveTimer) return;
  saveTimer = setTimeout(function(){ saveTimer=null; savePending=false; doSave(); }, 3000);
}
window.addEventListener('beforeunload', function(){ if (window.storage && state) doSave(); });
function loadState(){
  if (!window.storage){ state = freshState(); afterLoad(); return; }
  window.storage.get('searchO2-save-v4').then(function(res){
    if (res && res.value){
      try{
        var loaded = JSON.parse(res.value);
        var elapsedReal = Date.now() - (loaded.lastSaveReal || Date.now());
        state = loaded;
        if (!state.roads) state.roads = {};
        ['main','subway','crew_trail','garden_walk','market_promenade'].forEach(function(rk){
          if (!state.roads[rk]) state.roads[rk] = {built:false,building:false,buildHours:0};
        });
        if (!state.marketplaceUnlocked) state.marketplaceUnlocked = {};

        if (!state.storage) state.storage = { built:false, building:false, buildHours:0, capacity:0, stored:0, level:0, expanding:false, expandHours:0, warnedFull:false };
        if (state.storage.items===undefined) state.storage.items = [];
        if (state.storage.assignedLaborerId===undefined) state.storage.assignedLaborerId = null;
        if (state.storage.capacity===undefined) state.storage.capacity = state.storage.built ? STORAGE_BASE_CAPACITY : 0;
        if (state.storage.stored===undefined) state.storage.stored = 0;
        if (state.storage.level===undefined) state.storage.level = state.storage.built ? 1 : 0;
        if (state.storage.expanding===undefined) state.storage.expanding = false;
        if (state.storage.expandHours===undefined) state.storage.expandHours = 0;
        if (state.storage.warnedFull===undefined) state.storage.warnedFull = false;
        if (state.hasTractor===undefined) state.hasTractor = false;
        if (state.rocksCleared===undefined) state.rocksCleared = false;
        if (state.rocksClearing===undefined) state.rocksClearing = false;
        if (state.rocksClearHours===undefined) state.rocksClearHours = 0;
        if (state.lawnOvergrowth===undefined) state.lawnOvergrowth = 0;
        if (state.lawnMowing===undefined) state.lawnMowing = false;
        if (state.lawnMowHours===undefined) state.lawnMowHours = 0;
        if (state.loan===undefined) state.loan = null;

        if (!state.buildings) state.buildings = {};
        if (!state.buildings.road) state.buildings.road = {built:false,building:false,buildHours:0};
        if (!state.buildings.crew_shed) state.buildings.crew_shed = {built:false,building:false,buildHours:0};
        if (!state.buildings.garage) state.buildings.garage = {built:false,building:false,buildHours:0};
        if (!state.buildings.garden) state.buildings.garden = {built:false,building:false,buildHours:0,flowerType:null,freshness:100,warnedLow:false,careAnimUntil:0};
        if (!state.buildings.pond) state.buildings.pond = {built:false,building:false,buildHours:0,specialization:null,freshness:100,warnedLow:false,careAnimUntil:0,assignedWorker:null,pendingCollect:0,collecting:false,collectStartReal:0,collectAmount:0};
        if (!state.buildings.coffee_shop) state.buildings.coffee_shop = {built:false,building:false,buildHours:0};
        if (!state.buildings.juice_bar) state.buildings.juice_bar = {built:false,building:false,buildHours:0};

        if (state.treesRemoved===undefined) state.treesRemoved = 0;
        if (state.demerits===undefined) state.demerits = 0;
        if (!state.visitorStats) state.visitorStats = { totalVisitors:0, totalIncome:0, ratingSum:0, ratingCount:0 };

        if (state.plots) state.plots.forEach(function(p){ if (p.zeroHealthStreakHours===undefined) p.zeroHealthStreakHours = 0; });

        state.workers.forEach(function(w){ if (w.assignedBuilding===undefined) w.assignedBuilding = null; });
        nextWorkerId = 1 + state.workers.reduce(function(m,w){return Math.max(m,w.id);},0);
        if (elapsedReal > 5000){
          var before = { money: state.money, totalO2AllTime: state.totalO2AllTime };
          var gh = gameHoursFromReal(elapsedReal, state.speedFactor);
          gh = Math.min(gh, 24*4*30);

            moneyGained: Math.round((state.money-before.money)*100)/100,

        }

function afterLoad(){

// ================= CORE GAME LOGIC =================
function gameHoursFromReal(realMs, speedFactor){ return (realMs / REAL_MS_PER_GAME_HOUR_SPEC) * speedFactor; }
function currentSeason(){
  var cyclePos = state.gameHour % (SEASON_LEN_GAME_HOURS*4);
  var idx = Math.floor(cyclePos / SEASON_LEN_GAME_HOURS) % 4;
  return SEASONS[idx];
}
function forestBonus(){ return state.plots.filter(function(p){return p.status==='growing';}).length===PLOT_COUNT ? 0.10 : 0; }
function diversityBonus(){
  var types={}; state.plots.forEach(function(p){ if(p.treeType) types[p.treeType]=true; });
  return Object.keys(types).length>=2 ? 0.15 : 0;
}
function engineerBonus(){ return state.workers.some(function(w){return w.type==='engineer';}) ? 0.10 : 0; }
function visitorMagnetActive(){
  var b = state.buildings;
  return !!(b && b.garden.built && b.pond.built && (b.coffee_shop.built || b.juice_bar.built));
}
function farmReputation(){
  var rep = 0;
  if (state.buildings){
    BUILDING_ORDER.forEach(function(key){
      var b = state.buildings[key];
      if (!b || !b.built) return;
      var bonus = BUILDING_TYPES[key].reputationBonus;
      if ((key==='garden' || key==='pond') && b.freshness!==undefined) bonus *= (0.4 + 0.6*(b.freshness/100));
      rep += bonus;
    });
  }
  if (state.roads){
    if (state.roads.garden_walk && state.roads.garden_walk.built) rep += 4;
    if (state.roads.market_promenade && state.roads.market_promenade.built) rep += 6;
  }
  if (state.storage && state.storage.built) rep += 4;
  var growing = state.plots.filter(function(p){return p.status==='growing' && p.health > 0;});
  if (growing.length){
    var avgHealth = growing.reduce(function(s,p){return s+p.health;},0)/growing.length;
    rep += Math.round(avgHealth*0.15);
  }
  var species = {};
  var deadPlotCount = 0;
  state.plots.forEach(function(p){
    if (p.status === 'dead') deadPlotCount++;
    else if (p.status === 'growing' && p.health > 20 && p.treeType) species[p.treeType] = true;
  });
  rep += Object.keys(species).length * 3;
  rep -= deadPlotCount * 4;
  if (visitorMagnetActive()) rep += 10;
  if (state.lawnOvergrowth && state.lawnOvergrowth >= 50) rep -= 5;
  rep -= state.demerits*2;
  return Math.max(0, Math.round(rep));
}
function workerOnPlot(plotId){
  var p = state.plots[plotId];
  if (!p.assignedWorker) return null;
  return state.workers.find(function(w){return w.id===p.assignedWorker;}) || null;
}
function workerOnBuilding(key){
  var b = state.buildings[key];
  if (!b || !b.assignedWorker) return null;
  return state.workers.find(function(w){return w.id===b.assignedWorker;}) || null;
}
function pushReport(text){
  state.reports.unshift({ id: Date.now()+Math.random(), gameHour: Math.round(state.gameHour*10)/10, text: text });
  if (state.reports.length>25) state.reports.length = 25;
}
function plotKpi(p){
  if (!p.ageHours) return 100;
  return Math.max(0, Math.round(100*(1 - (p.downtimeHours/p.ageHours))));
}

function advanceGame(dh){

      pushReport('🪨 Boulders and rock obstacles successfully cleared from road corridor! Paving unlocked.');

  }

  // Physical Visitor Spawning along Manhattan Road Network
  var curMaxVisitors = Math.min(6, 3 + Math.floor(farmReputation() / 20));
  if (farmReputation() >= (typeof VISITOR_MIN_REPUTATION !== 'undefined' ? VISITOR_MIN_REPUTATION : 10) && activeVisitorCount < curMaxVisitors){
    if (Math.random() < (typeof VISITOR_SPAWN_RATE !== 'undefined' ? VISITOR_SPAWN_RATE : 0.18)){

  }

  // Pop Quiz Trigger (10 Questions every 24-36 game hours)
  if (state.quiz){
    if (!state.quiz.pending && state.gameHour >= (state.quiz.nextDueHour || 18)){
      var qQuestions = generateQuizQuestions(QUIZ_QUESTION_COUNT);
      if (qQuestions && qQuestions.length){
        state.quiz.pending = {
          id: Date.now(),
          questions: qQuestions,
          answers: new Array(qQuestions.length).fill(null),
          revealIdx: null,
          region: devRegionPreview
        };
        state.quiz.nextDueHour = state.gameHour + QUIZ_INTERVAL_HOURS + (Math.random() * QUIZ_INTERVAL_JITTER - QUIZ_INTERVAL_JITTER/2);
        showNotification('📚', 'Botanical Pop Quiz is here! Test your ecological science knowledge.', 'bank', null);
        pushReport('📚 A new 10-Question Botanical Pop Quiz is ready for evaluation! Open from the Library or notifications.');
      }
    }
  }

  // Lawn overgrowth & mowing simulation
  if (state.lawnMowing){
    state.lawnMowHours += dh;
    if (state.lawnMowHours >= 1.5){
      state.lawnMowing = false;
      state.lawnOvergrowth = 0;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('achieve');

      if (state.lawnWorkerId !== undefined){

  } else {

  }

  // Block-wise road construction timers
  if (state.roads){
    ['subway','crew_trail','garden_walk','market_promenade'].forEach(function(rk){
      var seg = state.roads[rk]; var def = ROAD_SEGMENTS[rk];
      if (seg && seg.building && def){

          checkAchievements();
        }
      }
    });
  }

  // Village Visitor Foot-Traffic Economy:
  // When Main Road is open, Coffee House and Juice Bar serve strolling visitors, generating
  // authentic visitor revenue based on farm reputation and paved promenade walkways!
  // Stored harvest is preserved for manual player logistics dispatch and selling.
  if (state.buildings.road && state.buildings.road.built){
    var baseRep = farmReputation();
    var hasLivingPlots = state.plots.some(function(p){ return p.status === 'growing' && p.health > 20; });
    var magnetMult = visitorMagnetActive() ? 1.25 : 1.0;
    var promenadeBoost = (state.roads && state.roads.market_promenade && state.roads.market_promenade.built) ? 1.35 : 1.0;
    if (hasLivingPlots && baseRep > 0){
      ['coffee_shop','juice_bar'].forEach(function(key){

        var def = BUILDING_TYPES[key];

        state.money += visitorRev;

          else SoundTrackEngine.playSFX('pour');
        }
      });
    }
  }

  // Garden and Pond both need tending — freshness decays continuously once

  if (garden.built && garden.flowerType){
    garden.freshness = Math.max(0, garden.freshness - dh*GARDEN_FRESHNESS_DECAY);
    if (garden.freshness < FRESHNESS_WARN_THRESHOLD && !garden.warnedLow){

  }
  var pond = state.buildings.pond;
  if (pond.built && pond.specialization){

    if (pond.freshness < FRESHNESS_WARN_THRESHOLD && !pond.warnedLow){
      pond.warnedLow = true;
      var pondSpecName = POND_SPECIALIZATIONS[pond.specialization].label;
      pushReport('🐟 The '+pondSpecName+' needs feeding — production has slowed.');
      showNotification('🍽️',pondSpecName+' needs feeding.','building','pond');
    } else if (pond.freshness >= 60){ pond.warnedLow = false; }
    // Production requires an assigned Farmer, same pattern as tree harvesting — it
    // accumulates as pendingCollect and needs a manual Collect action, rather than
    // silently auto-filling storage on its own.
    var pondWorker = workerOnBuilding('pond');
    if (state.storage.built && pond.freshness > 0 && pondWorker && pondWorker.type==='farmer'){
      var spec = POND_SPECIALIZATIONS[pond.specialization];
      var freshMult = pond.freshness/100;

      pond.pendingCollect = Math.min(150, (pond.pendingCollect||0) + produced);
    }
  }

  state.plots.forEach(function(p){

    } else if (p.status==='clearing'){
      if (!(w && w.inTransit)){
        var clearMult = (w && w.type==='laborer') ? WORKER_TYPES.laborer.mult : (w ? 1.25 : 1);
        p.taskHours += dh * clearMult;
        if (p.taskHours >= CLEAR_DURATION_HOURS){
          p.status='barren'; p.weedHours=0; p.taskHours=0;
          if (w){

            }

      }
    } else if (p.status==='preparing'){
      if (!(w && w.inTransit)){

          p.status='barren'; p.treeType=null; p.treeId=null; p.growHours=0; p.taskHours=0; p.weedHours=0;
          p.health=100; p.ageHours=0; p.downtimeHours=0; p.zeroHealthStreakHours=0; p.pendingHarvest=0;
          checkAchievements();
          if (w){
            var retWorker3 = w; var retPlotId3 = p.id;
            p.assignedWorker = null; retWorker3.assignedPlot = null;
            if (typeof animateWorkerPathWalk === 'function'){
              animateWorkerPathWalk(retWorker3, 'crew_shed', retPlotId3);
            }
          }
        }
      }
    } else if (p.status==='growing'){
      var def = TREE_TYPES[p.treeType];
      p.ageHours += dh;
      p.health = Math.max(0, p.health - dh*HEALTH_DECAY[def.category]);
      if (p.health<=0){
        p.downtimeHours += dh; // stopped producing oxygen entirely
        p.zeroHealthStreakHours += dh;
        if (p.zeroHealthStreakHours >= TREE_DRY_THRESHOLD_HOURS){
          p.status = 'dead';
          pushReport('💀 The '+def.label+' on Plot '+(p.id+1)+' (#'+p.treeId+') has dried out completely and needs to be removed before you can replant.');
          showNotification('💀', 'A tree on Plot '+(p.id+1)+' dried out and needs removing.', 'plot', p.id);
        }
      } else {
        p.zeroHealthStreakHours = 0;
        var healthMult = p.health <= 20 ? 0 : (p.health - 20) / 80;
        var growMult = (w && (w.type==='farmer'||w.type==='botanist')) ? WORKER_TYPES[w.type].mult : 1;
        var irrMult = p.accessories.irrigation ? 1.15 : 1;
        var fertMult = p.accessories.fertilizer ? 1.20 : 1;
        var growDh = dh * season.growth * growMult * irrMult * healthMult;
        p.growHours += growDh;
        var stageIdx = stageIndexFor(def, p.growHours);
        var o2Rate = def.o2AtStage[stageIdx];

        state.totalO2 += o2Gain; state.totalO2AllTime += o2Gain; p.o2Produced += o2Gain;
        state.money += o2Gain * O2_RATE * totalMult;

        if (isFinalStage && def.lateBonus){
          var harvestAmt = def.lateBonus*dh*season.income*totalMult*healthMult;
          if (state.storage.built){ p.pendingHarvest = Math.min(150, p.pendingHarvest + harvestAmt); }
          else { p.pendingHarvest = Math.min(25, (p.pendingHarvest || 0) + harvestAmt * 0.2); } // unharvested crops rot without storage
        }
      }
    }

    if (p.animal && state.gameHour >= p.animal.expiresAtHour){
      var a = ANIMALS.find(function(x){return x.key===p.animal.key;});
      state.money -= ANIMAL_PENALTY; state.demerits += 1;
      if (p.status==='preparing' || p.status==='clearing'){ p.taskHours = Math.max(0, p.taskHours-1); }
      pushReport('🐾 A '+a.name+' passed through Plot '+(p.id+1)+' unnoticed — minor setback (-€'+ANIMAL_PENALTY+', +1 demerit). '+a.fact);
      p.animal = null;
    }
  });

  var anyActive = state.plots.some(function(p){return p.animal;});
  if (!anyActive){
    var prob = 1 - Math.pow(1-ANIMAL_SPAWN_RATE, dh);
    if (Math.random() < prob){
      var eligible = state.plots.filter(function(p){ return ['barren','overgrown','preparing','clearing','ready'].indexOf(p.status)>=0 && (!p.accessories || !p.accessories.boundary); });
      if (eligible.length){
        var target = eligible[Math.floor(Math.random()*eligible.length)];
        var animal = ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
        target.animal = { key:animal.key, expiresAtHour: state.gameHour + ANIMAL_WINDOW_HOURS };
        showNotification(animal.emoji, animal.name+' spotted on Plot '+(target.id+1)+'!', 'plot', target.id);
      }
    }
  }

  var newDay = Math.floor(state.gameHour/24);
  if (newDay > state.lastPaidDay){
    var days = newDay - state.lastPaidDay;
    if (state.workers.length){
      var dailyWage = state.workers.reduce(function(s,w){return s+WORKER_TYPES[w.type].wage;},0);
      state.money -= dailyWage * days;
    }
    var buildingUpkeep = 0;
    BUILDING_ORDER.forEach(function(key){
      var b = state.buildings[key]; var def = BUILDING_TYPES[key];
      if (b.built && def.upkeep) buildingUpkeep += def.upkeep;
    });
    if (buildingUpkeep) state.money -= buildingUpkeep * days;
    // Municipal plot upkeep & estate land tax (€2.00 per plot per day)
    state.money -= PLOT_COUNT * 2 * days;
    if (state.loan){
      for (var di=0; di<days && state.loan; di++){
        if (state.loan.remainingBalance <= 0.01){
          pushReport('🏦 Loan fully repaid! Your farm is debt-free.');
          state.loan = null; break;
        }

        if (state.money >= installment){
          state.money -= installment; state.loan.remainingBalance -= installment; state.loan.daysPaid += 1;
        } else {
          var paid = Math.max(0, state.money);
          var shortfall = installment - paid;
          var penalty = shortfall * LOAN_PENALTY_RATE;
          state.money = 0;
          state.loan.remainingBalance = Math.max(0, state.loan.remainingBalance - paid + penalty);
          state.loan.missedPayments = (state.loan.missedPayments||0) + 1;
          state.demerits += 1;
          pushReport('⚠️ Missed a loan payment (€'+installment.toFixed(2)+' due) — €'+penalty.toFixed(2)+' penalty added to what you still owe, +1 demerit.');
        }
      }
    }
    state.plots.forEach(function(p){
      if (p.status==='growing'){
        var w2 = workerOnPlot(p.id);
        if (w2 && w2.type==='botanist'){
          var def2 = TREE_TYPES[p.treeType];
          var rec = p.health<40 ? 'Urgent: water and consider pruning soon.' : (p.health<70 ? 'Recommend watering this plot.' : 'Looking healthy — no action needed.');
          pushReport('📋 Botanist report — Plot '+(p.id+1)+' ('+def2.label+', #'+p.treeId+'): health '+Math.round(p.health)+'%, KPI '+plotKpi(p)+'%, stage "'+def2.stages[stageIndexFor(def2,p.growHours)].n+'". '+rec);
        }
        if (p.health<=0){
          state.money -= DEMERIT_FINE * days; state.demerits += days;
          pushReport('⚠️ Plot '+(p.id+1)+' ('+TREE_TYPES[p.treeType].label+' #'+p.treeId+') produced no oxygen today — 0% health. -€'+(DEMERIT_FINE*days)+', +'+days+' demerit.');
        }
      }
      if (p.status==='dead'){
        state.money -= DEMERIT_FINE * days; state.demerits += days;
        pushReport('⚠️ Plot '+(p.id+1)+' has an untended dead tree. Environmental violation fine: -€'+(DEMERIT_FINE*days)+', +'+days+' demerit.');
      }
      if (p.status==='overgrown'){

        pushReport('⚠️ Plot '+(p.id+1)+' remains overgrown and uncleared. -€'+(DEMERIT_FINE*days)+', +'+days+' demerit.');
      }

}

function stageIndexFor(def, growHours){
  var acc=0;
  for (var i=0;i<def.stages.length;i++){ acc+=def.stages[i].h; if (growHours<acc) return i; }
  return def.stages.length-1;
}
function plotStageInfo(p){
  if (p.status!=='growing') return null;
  var def = TREE_TYPES[p.treeType];
  var idx = stageIndexFor(def, p.growHours);
  var acc=0; for (var i=0;i<idx;i++) acc+=def.stages[i].h;
  var into = p.growHours-acc, dur = def.stages[idx].h;
  var pct = dur>9000 ? 100 : Math.min(100, Math.round((into/dur)*100));
  return { def:def, idx:idx, name:def.stages[idx].n, pct:pct, isFinal: dur>9000 };
}

var activeAnimalEntities = {};

function syncWildAnimals(){
  var layer = document.getElementById('animalsLayer');
  if (!layer) return;

  var activePlotIds = {};
  if (state && state.plots){
    state.plots.forEach(function(p){
      if (p.animal){
        activePlotIds[p.id] = true;
        if (!activeAnimalEntities[p.id]){
          spawnWildAnimalEntity(p.id, p.animal.key);
        }
      }
    });
  }

  // Remove any entities that expired or were cleared
  for (var pid in activeAnimalEntities){
    if (!activePlotIds[pid] && activeAnimalEntities[pid] && !activeAnimalEntities[pid].fleeing){
      var el = document.getElementById('wildAnimal_' + pid);
      if (el && el.parentNode) el.parentNode.removeChild(el);
      if (activeAnimalEntities[pid].timer) clearInterval(activeAnimalEntities[pid].timer);
      delete activeAnimalEntities[pid];
    }
  }
}

function spawnWildAnimalEntity(plotId, animalKey){
  var layer = document.getElementById('animalsLayer');
  if (!layer) return;

  var p = PLOT_LAYOUT[plotId];
  if (!p) return;

  var startFromLeft = Math.random() < 0.5;
  var startX = startFromLeft ? -6 : 106;
  var startY = Math.max(12, Math.min(82, p.top + (Math.random() * 20 - 10)));

  var el = document.createElement('div');
  el.id = 'wildAnimal_' + plotId;
  el.className = 'wild-animal-entity';
  el.style.left = startX + '%';
  el.style.top = startY + '%';

  var facingLeft = !startFromLeft;
  var renderer = ANIMAL_RENDERERS[animalKey] || drawRabbitSvg;
  el.innerHTML = '<div class="animal-shoo-badge">🐾 Tap to Scare (€12)</div>' + renderer(facingLeft, false);

  el.onclick = el.ontouchend = function(e){
    e.stopPropagation();
    e.preventDefault();
    scareAnimal(plotId);
  };

  layer.appendChild(el);

  var targetBaseX = p.left + p.w / 2;
  var targetBaseY = p.top + p.h / 2;

  var record = {
    plotId: plotId,
    animalKey: animalKey,
    currX: startX,
    currY: startY,
    facingLeft: facingLeft,
    fleeing: false,
    timer: null
  };
  activeAnimalEntities[plotId] = record;

  // First step: enter the farm smoothly onto open ground
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var enterX = Math.max(10, Math.min(90, targetBaseX + (Math.random() * 8 - 4)));
      var enterY = Math.max(12, Math.min(84, targetBaseY + (Math.random() * 8 - 4)));
      el.style.left = enterX + '%';
      el.style.top = enterY + '%';
      record.currX = enterX;
      record.currY = enterY;
    });
  });

  // Roaming loop: animal wanders freely across open fields without grid or road restrictions
  record.timer = setInterval(function(){
    if (record.fleeing) return;
    var angle = Math.random() * Math.PI * 2;
    var dist = 3 + Math.random() * 8;
    var nextX = Math.max(4, Math.min(94, targetBaseX + Math.cos(angle) * dist));
    var nextY = Math.max(10, Math.min(86, targetBaseY + Math.sin(angle) * dist));
    var newFacingLeft = nextX < record.currX;

    record.currX = nextX;
    record.currY = nextY;
    record.facingLeft = newFacingLeft;

    el.style.left = nextX + '%';
    el.style.top = nextY + '%';
    el.innerHTML = '<div class="animal-shoo-badge">🐾 Tap to Scare (€12)</div>' + renderer(newFacingLeft, false);
  }, 3200 + Math.random() * 1800);
}

function triggerWorkerScareSequence(plotId, animalKey, animalDef){
  var layer = document.getElementById('animalsLayer');
  var animalRecord = activeAnimalEntities[plotId];
  var animalEl = document.getElementById('wildAnimal_' + plotId);

  // If entity exists, run the chase & flee animation
  if (animalRecord && animalEl){
    animalRecord.fleeing = true;
    if (animalRecord.timer) clearInterval(animalRecord.timer);

    var animalX = animalRecord.currX;
    var animalY = animalRecord.currY;

    // Worker starts from Crew Shed (left:8, top:66) or Gate (left:0, top:38)
    var workerStartX = animalX > 40 ? 12 : 88;
    var workerStartY = animalY > 50 ? 70 : 25;

    // Spawn running worker

    runner.style.top = workerStartY + '%';

      '<g class="running-legs">' +
        personSvg('laborer', true, 0, 0, false, 'shovel') +
      '</g>' +
    '</svg>';
    layer.appendChild(runner);

    // Worker sprints directly towards animal across open terrain!
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        // Approach within 6% of animal
        var approachX = animalX + (animalX > workerStartX ? -6 : 6);
        var approachY = animalY + 2;
        runner.style.left = approachX + '%';
        runner.style.top = approachY + '%';

        setTimeout(function(){
          // Worker shouts and waves
          var shout = document.createElement('div');
          shout.className = 'shoo-shout';
          shout.textContent = '📢 SHOO! GET OUT!';
          runner.appendChild(shout);

          // Animal panics and bolts across open ground towards nearest perimeter
          var fleeTargetX = animalX < 50 ? -12 : 112;
          var fleeTargetY = Math.max(5, Math.min(90, animalY + (Math.random() * 20 - 10)));
          var fleeFacingLeft = fleeTargetX < animalX;

          var renderer = ANIMAL_RENDERERS[animalKey] || drawRabbitSvg;
          animalEl.innerHTML = '<div style="position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:1.2rem;font-weight:900;color:#D32F2F;">❗</div>' +
            renderer(fleeFacingLeft, true);

          animalEl.style.transition = 'left 1.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), top 1.3s ease-in';
          animalEl.style.left = fleeTargetX + '%';
          animalEl.style.top = fleeTargetY + '%';

          // Clean up animal and runner
          setTimeout(function(){
            if (animalEl.parentNode) animalEl.parentNode.removeChild(animalEl);
            delete activeAnimalEntities[plotId];
            showNotification('🌾', animalDef.name + ' fled the farm into the wild!', 'plot', plotId);
          }, 1350);

          setTimeout(function(){
            runner.style.transition = 'opacity 0.6s ease';
            runner.style.opacity = '0';
            setTimeout(function(){
              if (runner.parentNode) runner.parentNode.removeChild(runner);
            }, 650);
          }, 1200);

        }, 850);
      });
    });
  } else {
    showNotification('✅', animalDef.name + ' was scared away!', 'plot', plotId);
  }
}

var storageSelectedMap = {};

function workerOnStorage(){
  if (!state.storage || !state.storage.assignedLaborerId) return null;
  return state.workers.find(function(w){ return w.id === state.storage.assignedLaborerId; }) || null;
}

function hasAvailableLaborer(){
  return hasAvailableFieldWorker();
}

function assignLaborerToStorage(workerId){
  var w = state.workers.find(function(x){ return x.id === workerId && x.type === 'laborer'; });
  if (!w) return;
  if (w.assignedPlot !== null){
    state.plots[w.assignedPlot].assignedWorker = null;
    w.assignedPlot = null;
  }
  if (w.assignedBuilding){
    state.buildings[w.assignedBuilding].assignedWorker = null;
    w.assignedBuilding = null;
  }
  state.storage.assignedLaborerId = w.id;
  pushReport('👷 Assigned Laborer ' + (w.name || ('#' + w.id)) + ' to Storage loading bay.');
  if (typeof animateWorkerPathWalk === 'function') animateWorkerPathWalk(w, 'storage');
  render(); requestSave();
}

function unassignLaborerFromStorage(){
  if (state.storage && state.storage.assignedLaborerId){
    unassignWorkerById(state.storage.assignedLaborerId);
  } else {
    render(); requestSave();
  }
}

function startBuildRoadSegment(segmentKey){
  if (segmentKey === 'main'){
    startBuildBuilding('road');
    return;
  }
  if (!state.rocksCleared){
    showNotification('🪨', 'Clear boulders and rock obstacles before paving roads!', 'tasks', 'rocks');
    return;
  }
  if (!state.roads){
    state.roads = {};
    ['main','subway','crew_trail','garden_walk','market_promenade'].forEach(function(rk){
      state.roads[rk] = {built:false,building:false,buildHours:0};
    });
  }
  var seg = state.roads[segmentKey];
  var def = ROAD_SEGMENTS[segmentKey];
  if (!seg || !def || seg.built || seg.building) return;
  if (!state.buildings.road.built){
    showNotification('⛩️', 'Pave the Main Arterial Road first before paving feeder paths.', 'building', 'road');
    return;
  }
  if (state.money < def.cost) return;
  state.money -= def.cost;
  seg.building = true;
  seg.buildHours = 0;
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');
  pushReport('🚧 Began paving ' + def.label + ' (€' + def.cost + ').');
  render(); requestSave();
}

function toggleStorageItem(id){
  if (storageSelectedMap[id] === false){
    storageSelectedMap[id] = true;
  } else if (storageSelectedMap[id] === true){
    storageSelectedMap[id] = false;
  } else {
    storageSelectedMap[id] = false;
  }
  render();
}

function selectAllStorageItems(mode){
  if (!state.storage.items) return;
  state.storage.items.forEach(function(it){
    if (mode === 'all') storageSelectedMap[it.id] = true;
    else if (mode === 'none') storageSelectedMap[it.id] = false;
    else if (mode === it.category) storageSelectedMap[it.id] = true;
    else storageSelectedMap[it.id] = false;
  });
  render();
}

function triggerSaleLogisticsSequence(){
  if (!state.storage.built) return;
  if (!state.storage.items || state.storage.items.length === 0){
    if (state.storage.stored > 0){
      state.storage.items = [{
        id: 'legacy_batch_' + Date.now(),
        cropKey: 'produce',
        name: 'Fresh Farm Produce Batch',
        category: 'produce',
        icon: '🍏',
        source: 'Farm Fields',
        value: state.storage.stored,
        qty: Math.max(1, Math.round(state.storage.stored / 8)),
        freshness: 98,
        harvestedHour: state.gameHour || 0
      }];
    } else {
      showNotification('📦', 'Storage is empty! Harvest crops first.', 'storage', null);
      return;
    }
  }

  // Filter selected items
  var itemsToSell = state.storage.items.filter(function(it){
    return storageSelectedMap[it.id] !== false; // default true
  });

  if (itemsToSell.length === 0){
    showNotification('📦', 'Please select at least one item to sell.', 'storage', null);
    return;
  }

  // Check Laborer requirement
  var laborer = workerOnStorage();
  if (!laborer){
    var idleLaborer = state.workers.find(function(w){ return w.type === 'laborer' && w.assignedPlot === null && !w.assignedBuilding; });
    if (idleLaborer){
      state.storage.assignedLaborerId = idleLaborer.id;
      laborer = idleLaborer;
      pushReport('👷 Assigned Laborer ' + (idleLaborer.name || ('#' + idleLaborer.id)) + ' to Storage loading bay.');
    } else {
      var anyLaborer = state.workers.find(function(w){ return w.type === 'laborer'; });
      if (anyLaborer){
        showNotification('👷', 'Assign an available Laborer to load transport cargo before selling.', 'storage', null);
        pushReport('⚠️ Shipment cannot depart without a Laborer assigned to load cargo at the storage dock.');
        return;
      } else {
        showNotification('👷', 'A Laborer is required to load cargo! Hire one in the Workers panel.', 'storage', null);
        pushReport('⚠️ No Laborer on staff. Hire a Laborer to handle storage cargo and transport loading.');
        return;
      }
    }
  }

  var totalRev = itemsToSell.reduce(function(sum, it){ return sum + (it.value || 0); }, 0);
  var hasTimber = itemsToSell.some(function(it){ return it.category === 'timber'; });
  var hasProduce = itemsToSell.some(function(it){ return it.category !== 'timber'; });
  var vehicleType = (hasTimber && !hasProduce) ? 'timber' : ((hasProduce && !hasTimber) ? 'produce' : 'mixed');

  // Remove sold items from inventory
  var soldMap = {};
  itemsToSell.forEach(function(it){ soldMap[it.id] = true; });
  state.storage.items = state.storage.items.filter(function(it){ return !soldMap[it.id]; });
  state.storage.stored = Math.max(0, state.storage.items.reduce(function(s, it){ return s + (it.value || 0); }, 0));
  state.storage.warnedFull = false;

  // Clear selections
  storageSelectedMap = {};

  // Close modal to let player view the road logistics animation
  if (activeModal && activeModal.type === 'storage'){
    activeModal = null;
  }
  render();

  // Run animated logistics sequence
  animateTransportLogistics(vehicleType, totalRev, itemsToSell.length, laborer);
}

function animateTransportLogistics(vehicleType, totalRevenue, itemCount, laborer){
  var scene = document.querySelector('.field-scene');
  if (!scene) {
    // Headless / test environment fallback
    state.money += totalRevenue;
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
    pushReport('💰 Transport departed: Sold ' + itemCount + ' items for €' + totalRevenue.toFixed(2) + '.');
    render(); requestSave();
    return;
  }

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    scene.appendChild(truckLayer);
  }
  truckLayer.innerHTML = '';

  var vehicleSvg = vehicleType === 'timber' ? drawTimberTruckSvg() : (vehicleType === 'produce' ? drawFoodContainerTruckSvg() : drawFoodContainerTruckSvg());
  var vehicleName = vehicleType === 'timber' ? 'Timber Logging Truck' : (vehicleType === 'produce' ? 'Refrigerated Food Container Van' : 'Farm Logistics Van');

  var truckEl = document.createElement('div');
  truckEl.className = 'logistics-truck-sprite';
  truckEl.style.cssText = 'position:absolute;width:84px;height:42px;margin-left:-42px;margin-top:-21px;z-index:26;left:-12%;top:47%;transform-origin:50% 50%;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.36));';
  truckEl.innerHTML = vehicleSvg;
  truckLayer.appendChild(truckEl);

  var laborerEl = document.createElement('div');
  laborerEl.className = 'logistics-laborer-sprite';
  laborerEl.style.cssText = 'position:absolute;z-index:27;opacity:0;transition:all 0.35s ease;';
  laborerEl.innerHTML = '<div style="font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));">👷</div>';
  truckLayer.appendChild(laborerEl);

  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');
  pushReport('🚛 ' + vehicleName + ' arrived through Farm Main Gate and navigating along Manhattan road grid to Storage loading apron.');

  // Manhattan Grid: Main Gate -> Main Road -> Avenue 2 Subway -> 50px cross-lane to Storage Apron
  var inRoute = [{ x: -12.0, y: 47.0 }].concat(getRoadNetworkWaypoints('main_gate', 'storage'));
  var sellDistIn = 0;
  for (var si = 1; si < inRoute.length; si++){ sellDistIn += Math.hypot(inRoute[si].x - inRoute[si-1].x, inRoute[si].y - inRoute[si-1].y); }
  var sellDurationIn = Math.max(3800, Math.round(sellDistIn * 70));

  animateAlongWaypoints(truckEl, inRoute, sellDurationIn, function(){
    // Step 2: Loading crates at Storage loading apron (x: 52.5%, y: 18%)
    laborerEl.style.opacity = '1';
    laborerEl.style.left = '49.5%';
    laborerEl.style.top = '16.5%';
    var passes = 0;
    var loadInterval = setInterval(function(){
      passes++;
      var isAtTruck = (passes % 2 === 1);
      laborerEl.style.left = isAtTruck ? '52.5%' : '49.5%';
      laborerEl.innerHTML = '<div style="font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));">' +
        (isAtTruck ? (vehicleType === 'timber' ? '🪵' : '📦') : '👷') + '</div>';
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
      if (passes >= 4){
        clearInterval(loadInterval);
        setTimeout(finishLoading, 400);
      }
    }, 550);
  });

  // Step 3: Departure along Storage cross-lane -> Avenue 2 -> Main Road -> Main Gate
  function finishLoading(){
    laborerEl.style.left = '49.5%';
    laborerEl.innerHTML = '<div style="font-size:22px;">👋</div>';
    setTimeout(function(){ laborerEl.style.opacity = '0'; }, 1000);

    pushReport('🚚 ' + vehicleName + ' fully loaded with ' + itemCount + ' items. Departing from Storage via Avenue 2 Subway and through Farm Main Gate!');
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');

    var outRoute = getRoadNetworkWaypoints('storage', 'main_gate').concat([{ x: -16.0, y: 47.0 }]);

    var sellDistOut = 0;
    for (var so = 1; so < outRoute.length; so++){ sellDistOut += Math.hypot(outRoute[so].x - outRoute[so-1].x, outRoute[so].y - outRoute[so-1].y); }
    var sellDurationOut = Math.max(4000, Math.round(sellDistOut * 70));
    animateAlongWaypoints(truckEl, outRoute, sellDurationOut, function(){
      state.money += totalRevenue;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
      pushReport('💰 Transport delivered! Earned €' + totalRevenue.toFixed(2) + ' from farm harvest sales.');
      showNotification('💰', 'Shipment complete: +€' + totalRevenue.toFixed(2), 'storage', null);

      var coinBadge = document.createElement('div');
      coinBadge.className = 'logistics-coin-burst';
      coinBadge.style.left = '52.5%';
      coinBadge.style.top = '18%';
      coinBadge.innerHTML = '🪙 +€' + totalRevenue.toFixed(2);
      scene.appendChild(coinBadge);
      setTimeout(function(){ if (coinBadge.parentNode) coinBadge.parentNode.removeChild(coinBadge); }, 2500);

      truckLayer.innerHTML = '';
      checkAchievements();
      render();
      requestSave();
    });
  }
}

function sellStorage(){
  triggerSaleLogisticsSequence();
}
function expandStorageCost(){ return STORAGE_EXPAND_BASE_COST * Math.max(1, state.storage.level); }
function startExpandStorage(){
  if (!state.storage.built || state.storage.expanding) return;
  var cost = expandStorageCost();
  if (state.money < cost) return;
  state.money -= cost; state.storage.expanding = true; state.storage.expandHours = 0;
  render(); requestSave();
}
function startBuildBuilding(key){
  var b = state.buildings[key]; var def = BUILDING_TYPES[key];
  if (!b || b.built || b.building) return;
  if (def.requiresRoad && !state.buildings.road.built) return;
  if (state.money < def.cost) return;
  state.money -= def.cost; b.building = true; b.buildHours = 0;
  if (key === 'road'){
    state.rocksCleared = true;
    state.rocksClearing = false;
  }
  render(); requestSave();
}
function setGardenFlower(flowerKey){
  var b = state.buildings.garden;
  if (!b.built || b.flowerType || !FLOWER_TYPES[flowerKey]) return;
  b.flowerType = flowerKey;
  pushReport('🌷 Planted '+FLOWER_TYPES[flowerKey].label+' in the garden.');
  render(); requestSave();
}
function setPondSpecialization(key){
  var b = state.buildings.pond;
  if (!b.built || b.specialization || !POND_SPECIALIZATIONS[key]) return;
  b.specialization = key;
  b.freshness = 100;
  pushReport(POND_SPECIALIZATIONS[key].icon+' Stocked the pond as a '+POND_SPECIALIZATIONS[key].label+'.');
  checkAchievements();
  render(); requestSave();
}
function tendGarden(){
  var b = state.buildings.garden;
  if (!b.built || !b.flowerType) return;
  if (state.money < TEND_GARDEN_COST) return;
  state.money -= TEND_GARDEN_COST;
  b.freshness = Math.min(100, b.freshness + TEND_GARDEN_RESTORE);
  b.warnedLow = false;
  b.careAnimUntil = Date.now() + 2200;
  render(); requestSave();
}
function feedPond(){
  var b = state.buildings.pond;
  if (!b.built || !b.specialization) return;
  var cost = POND_SPECIALIZATIONS[b.specialization].feedCost;
  if (state.money < cost) return;
  state.money -= cost;
  b.freshness = Math.min(100, b.freshness + POND_FEED_RESTORE);
  b.warnedLow = false;
  b.careAnimUntil = Date.now() + 2200;
  render(); requestSave();
}
function startCollectPond(){
  var b = state.buildings.pond;
  if (!b.built || !b.specialization) return;
  if (b.pendingCollect < 0.5 || b.collecting) return;
  var w = workerOnBuilding('pond');
  if (!w || w.type!=='farmer') return;
  b.collecting = true; b.collectStartReal = Date.now(); b.collectAmount = b.pendingCollect;
  render(); requestSave();
}

function openModal(type, plotId){
  if (typeof hideGameTooltip === 'function') hideGameTooltip();
  activeModal = {type:type, plotId:plotId};
  openPanel = null;
  render();
}
var _lastCloseModalTs = 0;
function closeModal(e){
  if (e) {
    if (typeof e.stopPropagation === 'function') e.stopPropagation();
    if (typeof e.preventDefault === 'function') e.preventDefault();
  }
  var now = Date.now();
  if (now - _lastCloseModalTs < 80 && !activeModal) return;
  _lastCloseModalTs = now;

  if (typeof hideGameTooltip === 'function') hideGameTooltip();
  if (activeModal && activeModal.type==='bank') bankruptcyDismissed = true;
  if (activeModal && activeModal.type==='quiz' && state && state.quiz && state.quiz.pending){
    forfeitQuiz();
  }
  activeModal = null;

  // 1. Instant 0ms visual DOM removal (Zero perceived latency)
  var ml = document.getElementById('modalLayer');
  if (ml) ml.innerHTML = '';
  var mo = document.getElementById('modalOverlay');
  if (mo) {
    mo.style.display = 'none';
    if (mo.parentNode) mo.parentNode.removeChild(mo);
  }
  var offm = document.getElementById('offlineModal');
  if (offm) {
    offm.style.display = 'none';
    if (offm.parentNode) offm.parentNode.removeChild(offm);
  }

  // 2. Synchronous state update and clean re-render
  render();
}

function closePanel(e){
  if (e) {
    if (typeof e.stopPropagation === 'function') e.stopPropagation();
    if (typeof e.preventDefault === 'function') e.preventDefault();
  }
  openPanel = null;
  var fp = document.getElementById('floatPanel');
  if (fp) fp.innerHTML = '';
  render();
}
var bankruptcyDismissed = false;
var resetConfirmPending = false;
function checkBankruptcy(){
  if (!state) return;
  if (state.money >= BANKRUPTCY_TRIGGER){ bankruptcyDismissed = false; return; }
  if (state.loan) return; // already dealing with it
  if (bankruptcyDismissed) return;
  if (activeModal && activeModal.type==='bank') return;
  activeModal = {type:'bank', plotId:null};
  openPanel = null;
}
function takeLoan(key){
  if (state.loan) return;
  var o = LOAN_OPTIONS.find(function(x){return x.key===key;});
  if (!o) return;
  var totalOwed = o.principal * (1+o.rate);
  state.money += o.principal;
  state.loan = { key:o.key, label:o.label, principal:o.principal, rate:o.rate, termDays:o.termDays,
    totalOwed: totalOwed, dailyInstallment: totalOwed/o.termDays, remainingBalance: totalOwed, daysPaid:0, missedPayments:0 };
  pushReport('🏦 Took a '+o.label+' of €'+o.principal+'. Total repayment: €'+totalOwed.toFixed(2)+' over '+o.termDays+' days (€'+(totalOwed-o.principal).toFixed(2)+' interest).');
  bankruptcyDismissed = false;
  closeModal(); requestSave();
}
function repayLoanEarly(){
  if (!state.loan) return;
  var bal = state.loan.remainingBalance;
  if (state.money < bal) return;
  state.money -= bal;
  pushReport('✅ Paid off the remaining €'+bal.toFixed(2)+' loan balance early. Your farm is debt-free.');
  state.loan = null;
  render(); requestSave();
}
function resetFarm(){
  state = freshState();
  nextWorkerId = 1;
  bankruptcyDismissed = false;
  resetConfirmPending = false;
  activeModal = null; openPanel = null;
  hintQueue = [];
  lastRealTs = Date.now();
  var speedSel = document.getElementById('speedSel'); if (speedSel) speedSel.value = state.speedFactor;
  render(); requestSave();
}
function togglePanel(name){ openPanel = (openPanel===name) ? null : name; activeModal=null; render(); }

// ================= LOOP =================
function startLoop(){
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    var now=Date.now(); var realDelta = now-lastRealTs; lastRealTs=now;
    var dh = gameHoursFromReal(realDelta, state.speedFactor);
    advanceGame(dh); checkAchievements(); processHarvests(); checkBankruptcy(); render();
  }, 1000);
  setInterval(requestSave, 20000);
}
function processHarvests(){
  state.plots.forEach(function(p){
    var hDur = hasTractor() ? 3500 : 10000;
    if (p.harvesting && Date.now() - p.harvestStartReal >= hDur){
      var amt = p.harvestAmount||0;
      var room = Math.max(0, state.storage.capacity - state.storage.stored);
      var accepted = Math.min(amt, room);
      var lost = amt - accepted;
      state.storage.stored += accepted;
      state.harvestCount = (state.harvestCount||0)+1;
      if (!state.storage.items) state.storage.items = [];
      var treeDef = TREE_TYPES[p.treeType];
      var isTimber = treeDef && treeDef.category === 'Timber Tree';
      state.storage.items.push({
        id: 'crop_' + Date.now() + '_' + Math.floor(Math.random()*10000),
        cropKey: p.treeType,
        name: treeDef ? (treeDef.label + (isTimber ? ' Timber Logs' : ' Harvest')) : 'Crop Harvest',
        category: isTimber ? 'timber' : 'produce',
        icon: isTimber ? '🪵' : (treeDef ? treeDef.icon : '🍎'),
        source: 'Plot ' + (p.id+1) + ' (' + (treeDef ? treeDef.label : 'Tree') + ')',
        value: accepted,
        qty: Math.max(1, Math.round(accepted / (isTimber ? 12 : 8))),
        freshness: 100,
        harvestedHour: state.gameHour || 0,
        harvestedAt: Date.now()
      });
      if (lost > 0.01){
        pushReport('⚠️ Storage was full — €'+lost.toFixed(2)+' worth of '+TREE_TYPES[p.treeType].label+' from Plot '+(p.id+1)+' spoiled. Sell stock or expand storage.');
      } else {
        pushReport('🧺 Harvested €'+amt.toFixed(2)+' worth of '+TREE_TYPES[p.treeType].label+' from Plot '+(p.id+1)+' and moved it into storage.');
      }
      p.pendingHarvest = Math.max(0, p.pendingHarvest-amt);
      p.harvesting=false; p.harvestAmount=0;
      if (!state.buildings.garage || !state.buildings.garage.built){
        spawnCarryAnimation(PLOT_LAYOUT[p.id], STORAGE_SPOT);
      }
      checkAchievements();
    }
  });
  var pondB = state.buildings.pond;
  if (pondB.collecting && Date.now()-pondB.collectStartReal >= 4000){
    var pamt = pondB.collectAmount||0;
    var proom = Math.max(0, state.storage.capacity - state.storage.stored);
    var paccepted = Math.min(pamt, proom);
    var plost = pamt - paccepted;
    state.storage.stored += paccepted;
    state.harvestCount = (state.harvestCount||0)+1;
    var pondLabel = POND_SPECIALIZATIONS[pondB.specialization].label;
    if (!state.storage.items) state.storage.items = [];
    state.storage.items.push({
      id: 'pond_' + Date.now() + '_' + Math.floor(Math.random()*10000),
      cropKey: pondB.specialization,
      name: pondB.specialization === 'fish' ? 'Fresh River Trout' : 'Heritage Duck Feathers & Eggs',
      category: 'pond',
      icon: POND_SPECIALIZATIONS[pondB.specialization].icon,
      source: 'Duck & Fish Pond (' + pondLabel + ')',
      value: paccepted,
      qty: Math.max(1, Math.round(paccepted / 6)),
      freshness: 100,
      harvestedHour: state.gameHour || 0,
      harvestedAt: Date.now()
    });
    if (plost > 0.01){
      pushReport('⚠️ Storage was full — €'+plost.toFixed(2)+' worth of '+pondLabel+' produce spoiled. Sell stock or expand storage.');
    } else {
      pushReport('🧺 Collected €'+pamt.toFixed(2)+' worth of '+pondLabel+' produce and moved it into storage.');
    }
    pondB.pendingCollect = Math.max(0, pondB.pendingCollect-pamt);
    pondB.collecting=false; pondB.collectAmount=0;
    spawnCarryAnimation(VILLAGE_LAYOUT.pond, STORAGE_SPOT);
    checkAchievements();
  }
  if (state.storage.built && state.storage.capacity>0){
    var ratio = state.storage.stored/state.storage.capacity;
    if (ratio >= STORAGE_WARN_RATIO && !state.storage.warnedFull){
      state.storage.warnedFull = true;
      pushReport('📦 Storage is over '+Math.round(STORAGE_WARN_RATIO*100)+'% full ('+Math.round(ratio*100)+'%). Sell some harvest or expand storage soon.');
      showNotification('📦','Storage is over '+Math.round(STORAGE_WARN_RATIO*100)+'% full — sell or expand.','storage',null);
    } else if (ratio < 0.6){ state.storage.warnedFull = false; }
  }
}

// educational hint toast
var hintQueue = [];
function refillHintQueue(){
  var facts = []; var seen = {};
  state.plots.forEach(function(p){ if (p.treeType && !seen[p.treeType]){ seen[p.treeType]=true; facts.push(TREE_TYPES[p.treeType].fact); } });
  facts = facts.concat(GENERIC_TIPS);
  for (var i=facts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=facts[i]; facts[i]=facts[j]; facts[j]=t; }
  hintQueue = facts;
}
function showNextHint(){
  if (!state) return;
  if (!hintQueue.length) refillHintQueue();
  var text = hintQueue.shift(); if (!text) return;
  var el = document.getElementById('hintToast'); if (!el) return;
  el.innerHTML = '<b>Did you know?</b><br>'+text;
  el.classList.add('show');
  clearTimeout(el._hideT);
  el._hideT = setTimeout(function(){ el.classList.remove('show'); }, 6500);
}
function startHintLoop(){ setTimeout(showNextHint, 2500); setInterval(showNextHint, 9000); }

// Enhanced Avian System with multiple bird species, scale layers, plumage colorways, and 3D flight trajectories
var BIRD_SPECIES = [
  {
    type: 'swallow',
    svg: function(color) {

  '#2C3E2D', // Deep Forest Charcoal
  '#3E4A3E', // Classic Slate Green
  '#FFFFFF', // Pure White (Dove / Egret)
  '#C25E2E', // European Robin Amber

function spawnBird(customConfig){
  var layer = document.getElementById('birdsLayer'); if (!layer) return;
  var species = (customConfig && customConfig.species) || BIRD_SPECIES[Math.floor(Math.random() * BIRD_SPECIES.length)];
  var color = (customConfig && customConfig.color) || BIRD_PALETTES[Math.floor(Math.random() * BIRD_PALETTES.length)];
  var sizeProfile = (customConfig && customConfig.sizeProfile) || (function(){
    var r = Math.random();
    if (r < 0.35) return { name: 'small', width: 22, height: 15, scale: 0.75, opacity: 0.85 };
    if (r < 0.80) return { name: 'medium', width: 32, height: 21, scale: 1.0, opacity: 0.95 };
    return { name: 'large', width: 44, height: 29, scale: 1.35, opacity: 1.0 };
  })();

  // Trajectory direction:
  // dir === 1: West -> East (left to right)
  // dir === -1: East -> West (right to left)
  var dir = (customConfig && customConfig.dir !== undefined) ? customConfig.dir : (Math.random() < 0.5 ? 1 : -1);

  // Flight patterns:
  // 'horizontal', 'climb', 'descend', 'swoop'
  var pattern = (customConfig && customConfig.pattern) || (function(){
    var r = Math.random();
    if (r < 0.40) return 'horizontal';
    if (r < 0.65) return dir === 1 ? 'climb' : 'descend';
    if (r < 0.85) return 'swoop';
    return dir === 1 ? 'descend' : 'climb';
  })();

  var startTop = 4 + Math.random() * 26;
  var endTop = startTop;
  if (pattern === 'climb') {
    startTop = 18 + Math.random() * 14;
    endTop = 3 + Math.random() * 8;
  } else if (pattern === 'descend') {
    startTop = 3 + Math.random() * 8;
    endTop = 18 + Math.random() * 14;
  } else if (pattern === 'swoop') {
    startTop = 8 + Math.random() * 10;
    endTop = 6 + Math.random() * 12;
  }

  var baseDur = 7 + Math.random() * 6;
  var dur = Math.max(5.5, baseDur / (species.speedMult || 1));

  var el = document.createElement('div');
  el.className = 'bird-entity';
  el.style.position = 'absolute';
  el.style.top = startTop + '%';
  el.style.left = dir === 1 ? '-8%' : '108%';
  el.style.width = sizeProfile.width + 'px';
  el.style.height = sizeProfile.height + 'px';
  el.style.opacity = sizeProfile.opacity;
  el.style.transform = dir === 1 ? 'scale(1)' : 'scaleX(-1)';
  el.style.transition = 'left ' + dur + 's linear, top ' + dur + 's ' + (pattern === 'swoop' ? 'cubic-bezier(0.45, 0.05, 0.55, 0.95)' : 'ease-in-out');

  // White birds get soft drop shadow
  if (color === '#FFFFFF') {
    el.style.filter = 'drop-shadow(0 2px 3px rgba(44, 74, 50, 0.35))';
  }

  el.innerHTML = species.svg(color);
  layer.appendChild(el);

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      el.style.left = dir === 1 ? '108%' : '-8%';
      el.style.top = Math.max(2, Math.min(38, endTop)) + '%';
    });
  });

  setTimeout(function(){
    if (el.parentNode) el.parentNode.removeChild(el);
  }, dur * 1000 + 400);
}

function scheduleBirds(){
  var isFlock = Math.random() < 0.25;
  if (!isFlock) {
    spawnBird();
  } else {
    // Spawn small flock (2 or 3 birds)
    var flockSize = Math.random() < 0.65 ? 2 : 3;
    var species = BIRD_SPECIES[Math.floor(Math.random() * BIRD_SPECIES.length)];
    var color = BIRD_PALETTES[Math.floor(Math.random() * BIRD_PALETTES.length)];
    var dir = Math.random() < 0.5 ? 1 : -1;
    var pattern = Math.random() < 0.5 ? 'horizontal' : (dir === 1 ? 'climb' : 'descend');
    var baseSize = Math.random() < 0.5 ? 
      { name: 'small', width: 22, height: 15, scale: 0.75, opacity: 0.85 } :
      { name: 'medium', width: 32, height: 21, scale: 1.0, opacity: 0.95 };

    for (var i = 0; i < flockSize; i++) {
      (function(idx){
        setTimeout(function(){
          spawnBird({
            species: species,
            color: color,
            dir: dir,
            pattern: pattern,
            sizeProfile: baseSize
          });
        }, idx * 420);
      })(i);
    }
  }
  setTimeout(scheduleBirds, 4500 + Math.random() * 5500);
}

// carry-to-storage basket animation, appended outside the render-replaced DOM
function spawnCarryAnimation(fromLayout, toLayout){
  var scene = document.querySelector('.field-scene'); if (!scene) return;
  var rect = scene.getBoundingClientRect();
  var fx = rect.left + rect.width*(fromLayout.left+fromLayout.w/2)/100;
  var fy = rect.top + rect.height*(fromLayout.top+fromLayout.h/2)/100;
  var tx = rect.left + rect.width*(toLayout.left+toLayout.w/2)/100;
  var ty = rect.top + rect.height*(toLayout.top+toLayout.h/2)/100;
  var el = document.createElement('div');
  el.style.position='fixed'; el.style.left=fx+'px'; el.style.top=fy+'px'; el.style.fontSize='22px'; el.style.zIndex='60';
  el.style.transition='left 1.6s ease-in-out, top 1.6s ease-in-out'; el.textContent='🧺';
  document.body.appendChild(el);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.left=tx+'px'; el.style.top=ty+'px'; }); });
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1800);
}
