  if (openPanel==='library') return libraryPanelHtml();
  if (openPanel==='tasks'){
    var rows=''; var any=false;
    if (!state.storage.built){
      any=true;
      if (state.storage.building){
        var spct = Math.round(Math.min(100,(state.storage.buildHours/STORAGE_BUILD_HOURS)*100));
        rows += '<div class="task-row"><div class="task-info"><div class="name">🏗 Building Storage Room</div><div class="meta">'+spct+'% done</div></div><button class="claim-btn" disabled>…</button></div>';
      } else {
        rows += '<div class="task-row"><div class="task-info"><div class="name">🏚 Build Storage Room</div><div class="meta">€'+STORAGE_COST+' · '+STORAGE_BUILD_HOURS+'h · stops harvest spoilage</div></div><button class="claim-btn" data-buildstorage="1" '+(state.money<STORAGE_COST?'disabled':'')+'>Build</button></div>';
      }
    } else if (state.storage.expanding){
      any=true;
      var epct = Math.round(Math.min(100,(state.storage.expandHours/STORAGE_EXPAND_HOURS)*100));
      rows += '<div class="task-row"><div class="task-info"><div class="name">📦 Expanding Storage</div><div class="meta">'+epct+'% done</div></div><button class="claim-btn" disabled>…</button></div>';
    } else {
      var ratio = state.storage.capacity>0 ? state.storage.stored/state.storage.capacity : 0;
      if (ratio >= STORAGE_WARN_RATIO){
        any=true;
        rows += '<div class="task-row"><div class="task-info"><div class="name">📦 Storage nearly full</div><div class="meta">€'+state.storage.stored.toFixed(0)+' / €'+state.storage.capacity+' — sell or expand</div></div><button class="claim-btn" data-sellstorage="1">Sell</button></div>';
      } else if (state.storage.stored > 0.5){
        any=true;
        rows += '<div class="task-row"><div class="task-info"><div class="name">🧺 Harvest waiting in storage</div><div class="meta">€'+state.storage.stored.toFixed(0)+' ready to sell</div></div><button class="claim-btn" data-sellstorage="1">Sell</button></div>';
      }
    }
    // Main Arterial Road & Grand Gate Task
    if (!state.buildings.road.built){
      any = true;
      if (state.buildings.road.building){
        var rdPct = Math.round(Math.min(100,(state.buildings.road.buildHours/BUILDING_TYPES.road.buildHours)*100));
        rows += '<div class="task-row" style="border-left:4px solid #F0AC3D;"><div class="task-info"><div class="name">⛩️ Paving Main Arterial Road…</div><div class="meta">'+rdPct+'% complete · paving cobblestone corridor</div></div><button class="claim-btn" disabled style="opacity:0.8;">'+rdPct+'%</button></div>';
      } else {
        rows += '<div class="task-row" style="border-left:4px solid #2E7D32;"><div class="task-info"><div class="name">⛩️ Pave Main Arterial Road & Grand Gate</div><div class="meta">€'+BUILDING_TYPES.road.cost+' · '+BUILDING_TYPES.road.buildHours+'h · connects Grand Gate to Storage · unlocks village shops</div></div><button class="claim-btn" onclick="startBuildRoadSegment(\'main\')" '+(state.money<BUILDING_TYPES.road.cost?'disabled':'')+'>Pave (€'+BUILDING_TYPES.road.cost+')</button></div>';
      }
    }

    // Rock Clearing Task
    if (!state.rocksCleared){
      any = true;
      if (state.rocksClearing){
        var rkPct = Math.round(Math.min(100,(state.rocksClearHours/2)*100));
        rows += '<div class="task-row" style="border-left:4px solid #F0AC3D;"><div class="task-info"><div class="name">🪨 Clearing Road Obstacles…</div><div class="meta">'+rkPct+'% complete · Laborer clearing corridor</div></div><button class="claim-btn" disabled style="opacity:0.8;">'+rkPct+'%</button></div>';
      } else {
        rows += '<div class="task-row" style="border-left:4px solid #78909C;"><div class="task-info"><div class="name">🪨 Clear Boulder Obstacles from Road Corridor</div><div class="meta">€50 · 2h · clears rocks for Main Road & Subways · needs Laborer</div></div><button class="claim-btn" onclick="startClearRocks()" '+(state.money<50?'disabled':'')+'>Clear Rocks (€50)</button></div>';
      }
    }

    // Lawn Mowing Task
    if ((state.lawnOvergrowth || 0) >= 40){
      any = true;
      if (state.lawnMowing){
        var mowPct = Math.round(Math.min(100,(state.lawnMowHours/1.5)*100));
        rows += '<div class="task-row" style="border-left:4px solid #66BB6A;"><div class="task-info"><div class="name">🌿 Mowing Estate Lawn…</div><div class="meta">'+mowPct+'% complete · manicuring grounds</div></div><button class="claim-btn" disabled style="opacity:0.8;">'+mowPct+'%</button></div>';
      } else {
        rows += '<div class="task-row" style="border-left:4px solid #81C784;"><div class="task-info"><div class="name">🌿 Mow Estate Lawn & Trim Weeds</div><div class="meta">€15 · 1.5h · manicures turf, restores +5 reputation · needs Laborer</div></div><button class="claim-btn" onclick="startMowLawn()" '+(state.money<15?'disabled':'')+'>Mow Lawn (€15)</button></div>';
      }
    }

    state.plots.forEach(function(p){
      if (!p.accessories || !p.accessories.boundary){
        any=true; rows+='<div class="task-row" style="border-left:4px solid #8D6E63;"><div class="task-info"><div class="name">⛩️ Plot '+(p.id+1)+' — Erect Boundary Fence & Gate</div><div class="meta">€'+ACCESSORIES.boundary.cost+' · timber estate fence · dynamic entrance gate</div></div><button class="claim-btn" data-buyacc="boundary" data-buyplot="'+p.id+'" '+(state.money<ACCESSORIES.boundary.cost?'disabled':'')+'>Build (€'+ACCESSORIES.boundary.cost+')</button></div>';
      }
      if (p.status==='barren'){
        any=true; rows+='<div class="task-row"><div class="task-info"><div class="name">Plot '+(p.id+1)+' — Dig Land</div><div class="meta">€'+LABOR_COST+' · 3h</div></div><button class="claim-btn" data-prep="'+p.id+'">Start</button></div>';
      } else if (p.status==='overgrown'){
        any=true; rows+='<div class="task-row"><div class="task-info"><div class="name">Plot '+(p.id+1)+' — Clear Overgrowth</div><div class="meta">€'+CLEAR_COST+' · 2h</div></div><button class="claim-btn" data-clear="'+p.id+'">Clear</button></div>';
      } else if (p.status==='preparing' || p.status==='clearing'){
        any=true; var dur=p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS; var pct=Math.round(Math.min(100,(p.taskHours/dur)*100));
        rows+='<div class="task-row"><div class="task-info"><div class="name">Plot '+(p.id+1)+' — '+(p.status==='preparing'?'Digging Soil':'Clearing Weeds')+'</div><div class="meta">'+pct+'% done · '+(p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS)+'h</div></div><button class="claim-btn" disabled style="opacity:0.8;font-weight:800;">'+pct+'%</button></div>';
      } else if (p.status==='ready'){
        any=true;
        rows+='<div class="task-row" style="background:#F1F8E9;border-left:4px solid #2E7D32;"><div class="task-info"><div class="name">✅ Plot '+(p.id+1)+' — Dig Complete</div><div class="meta">Soil ready · Select seed to plant</div></div><button class="claim-btn active" data-openplot="'+p.id+'" style="background:var(--forest,#2C4A32);color:#FFF;">Plant</button></div>';
      } else if (p.status==='growing' && p.pendingHarvest >= 0.5 && !p.harvesting){
        any=true; var defH = TREE_TYPES[p.treeType];
        rows+='<div class="task-row"><div class="task-info"><div class="name">🧺 Plot '+(p.id+1)+' — Harvest '+defH.label+'</div><div class="meta">€'+p.pendingHarvest.toFixed(2)+' ripe harvest waiting</div></div><button class="claim-btn" data-openplot="'+p.id+'" style="background:#5A8FBF;color:#FFF;">Harvest</button></div>';
      } else if (p.status==='growing' && p.health < 60){
        any=true; var defW = TREE_TYPES[p.treeType];
        rows+='<div class="task-row"><div class="task-info"><div class="name">💧 Plot '+(p.id+1)+' — Care for '+defW.label+'</div><div class="meta">Health at '+Math.round(p.health)+'% · Water needed</div></div><button class="claim-btn" data-openplot="'+p.id+'" style="background:#E8785A;color:#FFF;">Care</button></div>';
      } else if (p.status==='dead'){
        any=true; var deadDef=TREE_TYPES[p.treeType]; var remCfg3=REMOVE_CONFIG[deadDef.category];
        rows+='<div class="task-row"><div class="task-info"><div class="name">💀 Plot '+(p.id+1)+' — Remove Dead '+deadDef.label+'</div><div class="meta">€'+remCfg3.cost+' · '+remCfg3.hours+'h · needs a Laborer</div></div><button class="claim-btn" data-removetree="'+p.id+'" '+(state.money<remCfg3.cost?'disabled':'')+'>Remove</button></div>';
      } else if (p.status==='removing'){
        any=true; var remDef2=TREE_TYPES[p.treeType]; var remCfg4=REMOVE_CONFIG[remDef2.category]; var rpct=Math.round(Math.min(100,(p.taskHours/remCfg4.hours)*100));
        rows+='<div class="task-row"><div class="task-info"><div class="name">🪓 Plot '+(p.id+1)+' — Cutting down '+remDef2.label+'</div><div class="meta">'+rpct+'% done'+(p.assignedWorker!==null?' · 👷 assisted':' · assign a Laborer to speed up')+'</div></div><button class="claim-btn" disabled style="opacity:0.8;font-weight:800;">'+rpct+'%</button></div>';
      }
    });
    if (!any) rows = '<div class="empty-note">No pending tasks right now.</div>';
    return '<div class="float-panel"><h2><span>📋 Tasks</span><span class="close-x" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" title="Close Panel">✕</span></h2>'+rows+'<button class="modal-bottom-close" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" style="margin-top:12px;">✕ Close Tasks Panel</button></div>';
  }
  if (openPanel==='workers'){
    var dailyWage = state.workers.reduce(function(s,w){return s+WORKER_TYPES[w.type].wage;},0);
    var roster = state.workers.length ? state.workers.map(function(w){
      var loc = w.assignedPlot!==null ? 'Plot '+(w.assignedPlot+1) : 'Idle';
      return '<div class="roster-chip"><span>'+WORKER_TYPES[w.type].label+' · '+loc+'</span><button class="fire" data-fire="'+w.id+'">Let go</button></div>';
    }).join('') : '<div class="empty-note">No workers hired yet. Recruit personnel below or from the Crew drawer.</div>';
    var recruitBox = '<div class="recruit-box" style="margin-top:10px;background:#F1F8E9;padding:10px 12px;border-radius:12px;border:1.5px solid #C5E1A5;">' +
      '<div style="font-weight:800;font-size:0.8rem;color:#2E7D32;margin-bottom:8px;">Recruit Farm Personnel:</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
        '<button class="claim-btn" onclick="hireWorker(\'laborer\')">👷 Laborer (€15/d)</button>' +
        '<button class="claim-btn" onclick="hireWorker(\'farmer\')">🧑‍🌾 Farmer (€25/d)</button>' +
        '<button class="claim-btn" onclick="hireWorker(\'botanist\')">👩‍🔬 Botanist (€40/d)</button>' +
      '</div>' +
    '</div>';
    return '<div class="float-panel"><h2><span>👷 Workers</span><span class="close-x" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" title="Close Panel">✕</span></h2>'+
      (dailyWage?'<div class="empty-note" style="margin-bottom:8px;">Payroll: €'+dailyWage+'/day</div>':'')+'<div class="roster">'+roster+'</div>'+recruitBox+
      '<button class="modal-bottom-close" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" style="margin-top:12px;">✕ Close Workers Panel</button></div>';
  }
  if (openPanel==='achievements'){
    var ach = ACHIEVEMENTS.map(function(a){ return '<div class="ach'+(state.achUnlocked[a.id]?' unlocked':'')+'">'+a.label+'</div>'; }).join('');
    
    // Academic Standing & Leaderboard Card
    var qTotal = (state.quiz && state.quiz.totalCompleted) || 0;
    var qCorrect = (state.quiz && state.quiz.totalCorrect) || 0;
    var qSkipped = (state.quiz && state.quiz.skipped) || 0;
    var demerits = state.demerits || 0;
    var accuracy = (qTotal * 10 > 0) ? Math.round((qCorrect / (qTotal * 10)) * 100) : 0;
    
    var standingStatus = demerits === 0
      ? '<span style="color:#2E7D32;font-weight:800;">🌟 Exemplary Scholar (Zero Demerits)</span>'
      : (demerits < 3
        ? '<span style="color:#E65100;font-weight:800;">⚠️ Academic Warning (' + demerits + ' Demerit' + (demerits>1?'s':'') + ')</span>'
        : '<span style="color:#C62828;font-weight:900;">🚨 Academic Probation (' + demerits + ' Demerits · Reputation Impact)</span>');

    var historyRows = '';
    if (state.quiz && state.quiz.history && state.quiz.history.length > 0){
      historyRows = state.quiz.history.slice(0, 5).map(function(h, idx){
        var meta = DEV_REGION_META[h.region] || { flag:'🌐', label:'Botany' };
        var pct = Math.round((h.score / h.total) * 100);
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed #E0E0E0;font-size:0.75rem;">' +
          '<span>' + meta.flag + ' ' + meta.label + ' (Day ' + (Math.floor(h.gameHour/24)+1) + ')</span>' +
          '<b style="color:' + (pct>=70?'#2E7D32':'#E65100') + ';">' + h.score + '/' + h.total + ' (' + pct + '%)</b>' +
        '</div>';
      }).join('');
    } else {
      historyRows = '<div style="font-size:0.75rem;color:#777;padding:4px 0;">No completed quiz records yet. Take a pop quiz from the Botanical Library!</div>';
    }

    var academicCard = '<div style="background:#F9FBE7;border:1.5px solid #DCE775;border-radius:12px;padding:12px;margin-bottom:14px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
        '<b style="color:#33691E;font-size:0.92rem;">🎓 Academic Standing &amp; Quiz Leaderboard</b>' +
        '<button class="primary mini-btn" onclick="startPracticeQuiz()" style="font-size:0.72rem;padding:3px 8px;font-weight:800;background:#2E7D32;color:#FFF;border:none;border-radius:6px;cursor:pointer;">📚 Take 10-Q Quiz</button>' +
      '</div>' +
      '<div style="font-size:0.8rem;margin-bottom:8px;">Status: ' + standingStatus + '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#FFF;border-radius:8px;padding:8px;margin-bottom:10px;text-align:center;border:1px solid #E0E0E0;">' +
        '<div><div style="font-size:1.1rem;font-weight:900;color:var(--pine);">' + qTotal + '</div><div style="font-size:0.68rem;color:#666;">Quizzes Done</div></div>' +
        '<div><div style="font-size:1.1rem;font-weight:900;color:#2E7D32;">' + accuracy + '%</div><div style="font-size:0.68rem;color:#666;">Accuracy</div></div>' +
        '<div><div style="font-size:1.1rem;font-weight:900;color:' + (demerits>0?'#C62828':'#2E7D32') + ';">' + demerits + '</div><div style="font-size:0.68rem;color:#666;">Demerits</div></div>' +
      '</div>' +
      '<div style="font-size:0.75rem;font-weight:800;color:#33691E;margin-bottom:4px;">Recent Pop Quiz Transcripts:</div>' +
      historyRows +
    '</div>';

    return '<div class="float-panel"><h2><span>🏆 Achievements &amp; Eco-Transcript</span><span class="close-x" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" title="Close Panel">✕</span></h2>' +
      academicCard +
      '<div class="ach-grid">'+ach+'</div>' +
      '<button class="modal-bottom-close" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" style="margin-top:12px;">✕ Close Achievements Panel</button></div>';
  }
  if (openPanel==='reports'){
    var reps = state.reports.length ? state.reports.map(function(r){
      return '<div class="report-item"><span class="rtime">📅 Day '+(Math.floor(r.gameHour/24)+1)+'</span><div>'+r.text+'</div></div>';
    }).join('') : '<div class="empty-note">No reports yet. Hire a Botanist to generate plant health reports, and watch for wildlife.</div>';
    return '<div class="float-panel"><h2><span>📰 Reports & Notifications</span><span class="close-x" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" title="Close Panel">✕</span></h2>'+reps+'<button class="modal-bottom-close" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" style="margin-top:12px;">✕ Close Reports Panel</button></div>';
  }
  if (openPanel==='music'){
    var list = SoundTrackEngine.getArchiveList ? SoundTrackEngine.getArchiveList() : [];
    var curIdx = SoundTrackEngine.getArchiveCurrentIndex ? SoundTrackEngine.getArchiveCurrentIndex() : null;
    var isArchivePlaying = SoundTrackEngine.isArchivePlaying ? SoundTrackEngine.isArchivePlaying() : false;
    var cur = (curIdx !== null && list[curIdx]) ? list[curIdx] : null;

    if (!window.activeMusicFilter) window.activeMusicFilter = 'all';
    var filter = window.activeMusicFilter;

    var filtered = list.filter(function(t){
      if (filter === 'all') return true;
      if (filter === 'Rock') return t.genre === 'Rock';
      if (filter === 'Country') return t.genre === 'Country';
      if (filter === '60s') return t.year >= 1960 && t.year < 1970;
      if (filter === '70s') return t.year >= 1970 && t.year < 1980;
      if (filter === '80s') return t.year >= 1980 && t.year < 1990;
      return true;
    });

    var rows = '';
    filtered.forEach(function(t){
      var actualIdx = list.indexOf(t);
      var isThisPlaying = isArchivePlaying && curIdx === actualIdx;
      rows += '<div class="music-track-row ' + (isThisPlaying ? 'is-active' : '') + '">' +
        '<div class="m-track-num">#' + (actualIdx + 1) + '</div>' +
        '<div class="m-track-info">' +
          '<div class="m-track-title">' + t.title + '</div>' +
          '<div class="m-track-meta">' + t.artist + ' · ' + t.year + '<span class="m-genre-tag">' + t.subgenre + '</span></div>' +
        '</div>' +
        '<button class="claim-btn ' + (isThisPlaying ? 'active' : '') + '" onclick="SoundTrackEngine.playArchiveTrack(' + actualIdx + ')" style="' + (isThisPlaying ? 'background:#2E7D32;color:#FFF;' : '') + '">' +
          (isThisPlaying ? '⏸️ Playing' : '▶️ Play') +
        '</button>' +
      '</div>';
    });

    var banner = '<div class="music-archive-player-banner">' +
      '<div class="np-header-row">' +
        '<span class="np-badge">' + (isArchivePlaying ? '🟢 NOW PLAYING (BACKGROUND AUDIO ACTIVE)' : '⏸️ JUKEBOX STANDBY') + '</span>' +
        '<span style="font-size:0.7rem;color:#C8E6C9;">50 Billboard Chart Classics</span>' +
      '</div>' +
      '<div class="np-title">' + (cur ? (cur.title + ' — ' + cur.artist) : 'Select a Song to Listen While Farming') + '</div>' +
      '<div class="np-meta">' + (cur ? (cur.year + ' · ' + cur.genre + ' · ' + cur.subgenre) : 'Classic Rock &amp; Country Hits (1960-1989)') + '</div>' +
      '<div class="np-controls">' +
        '<button class="music-ctrl-btn" onclick="SoundTrackEngine.prevArchiveTrack()" title="Previous Song">⏮️</button>' +
        '<button class="music-ctrl-btn play-main" onclick="SoundTrackEngine.toggleArchivePlay()" title="Play / Pause">' + (isArchivePlaying ? '⏸️' : '▶️') + '</button>' +
        '<button class="music-ctrl-btn" onclick="SoundTrackEngine.nextArchiveTrack()" title="Next Song">⏭️</button>' +
        '<div class="np-vol-wrap">' +
          '<span>🔊</span>' +
          '<input type="range" min="0" max="100" value="' + Math.round((SoundTrackEngine.getVolume?SoundTrackEngine.getVolume():0.7)*100) + '" oninput="SoundTrackEngine.setVolume(this.value/100)" class="music-slider">' +
        '</div>' +
      '</div>' +
    '</div>';

    var filterTabs = '<div class="music-filter-tabs">' +
      '<button class="music-filter-chip ' + (filter==='all'?'active':'') + '" onclick="window.activeMusicFilter=\'all\';render();">All (50)</button>' +
      '<button class="music-filter-chip ' + (filter==='Rock'?'active':'') + '" onclick="window.activeMusicFilter=\'Rock\';render();">🎸 Classic Rock (25)</button>' +
      '<button class="music-filter-chip ' + (filter==='Country'?'active':'') + '" onclick="window.activeMusicFilter=\'Country\';render();">🤠 Country (25)</button>' +
      '<button class="music-filter-chip ' + (filter==='60s'?'active':'') + '" onclick="window.activeMusicFilter=\'60s\';render();">60s (10)</button>' +
      '<button class="music-filter-chip ' + (filter==='70s'?'active':'') + '" onclick="window.activeMusicFilter=\'70s\';render();">70s (25)</button>' +
      '<button class="music-filter-chip ' + (filter==='80s'?'active':'') + '" onclick="window.activeMusicFilter=\'80s\';render();">80s (15)</button>' +
    '</div>';

    return '<div class="float-panel"><h2><span>📻 Billboard Music Archive</span><span class="close-x" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" title="Close Music Archive">✕</span></h2>' +
      banner + filterTabs + '<div class="music-list-scroll">' + rows + '</div>' +
      '<button class="modal-bottom-close" data-closepanel="1" onclick="closePanel(event)" ontouchend="closePanel(event)" style="margin-top:14px;">✕ Close Music Archive</button></div>';
  }
  return '';
}

// ================= WHOLE GAME SCREEN UNIVERSAL TOOLTIP ENGINE =================
var activeTooltipTarget = null;
var tooltipTimeout = null;

function showGameTooltip(el, text){
  var tip = document.getElementById('toolTip');
  if (!tip || !text || !el) return;

  if (tooltipTimeout) clearTimeout(tooltipTimeout);
  activeTooltipTarget = el;
  tip.textContent = text;
  tip.classList.add('show');

  var screenW = window.innerWidth;
  var screenH = window.innerHeight;
  tip.style.maxWidth = Math.max(160, screenW - 24) + 'px';

  var r = el.getBoundingClientRect();
  var tipW = tip.offsetWidth || 180;
  var tipH = tip.offsetHeight || 40;

  // Horizontal clamping with 12px safe margin
  var centerX = r.left + r.width / 2;
  var left = Math.max(12, Math.min(screenW - tipW - 12, centerX - tipW / 2));
  var arrowX = Math.max(14, Math.min(tipW - 14, centerX - left));
  if (tip.style && tip.style.setProperty) tip.style.setProperty('--tip-arrow-x', arrowX + 'px');
  tip.style.left = left + 'px';

  // Vertical positioning: Above if space allows, otherwise Below, clamped safely inside screen
  if (r.top - tipH - 12 >= 8){
    tip.style.top = Math.max(8, r.top - tipH - 8) + 'px';
    tip.classList.add('tip-above');
    tip.classList.remove('tip-below');
  } else if (r.bottom + tipH + 12 <= screenH){
    tip.style.top = (r.bottom + 8) + 'px';
    tip.classList.add('tip-below');
    tip.classList.remove('tip-above');
  } else {
    tip.style.top = Math.max(8, Math.min(screenH - tipH - 8, r.top)) + 'px';
    tip.classList.remove('tip-above');
    tip.classList.remove('tip-below');
  }
}

function hideGameTooltip(){
  var tip = document.getElementById('toolTip');
  if (tip){
    tip.classList.remove('show');
    tip.classList.remove('tip-above');
    tip.classList.remove('tip-below');
  }
  activeTooltipTarget = null;
  if (tooltipTimeout) clearTimeout(tooltipTimeout);
}

function initGameTooltips(){
  function convertTitles(root){
    var targetRoot = root || document;
    if (!targetRoot || !targetRoot.querySelectorAll) return;
    var els = targetRoot.querySelectorAll('[title]:not([data-tip-converted])');
    els.forEach(function(el){
      var t = el.getAttribute('title');
      if (t && t.trim()){
        el.setAttribute('data-tip', t);
        el.setAttribute('data-tip-converted', '1');
        el.removeAttribute('title');
      }
    });
  }

  convertTitles();

  if (typeof MutationObserver !== 'undefined' && typeof document !== 'undefined' && document.body){
    var obs = new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if (n && n.nodeType === 1){
            if (n.hasAttribute && n.hasAttribute('title')) convertTitles(n);
            if (n.querySelectorAll) convertTitles(n);
          }
        });
      });
    });
    obs.observe(document.body, { childList: true, subtree: true });
  }

  if (typeof document !== 'undefined' && document && document.addEventListener){
    // Pointer hover for desktop
    document.addEventListener('pointerover', function(e){
      var target = (e.target && e.target.closest) ? e.target.closest('[data-tip]') : null;
      if (target){
        var tipText = target.getAttribute('data-tip');
        if (tipText) showGameTooltip(target, tipText);
      }
    }, true);

    document.addEventListener('pointerout', function(e){
      var target = (e.target && e.target.closest) ? e.target.closest('[data-tip]') : null;
      if (target && target === activeTooltipTarget){
        hideGameTooltip();
      }
    }, true);

    // Mobile / Touch support: Tap on item shows tooltip, tap elsewhere dismisses
    document.addEventListener('pointerdown', function(e){
      var target = (e.target && e.target.closest) ? e.target.closest('[data-tip]') : null;
      if (target){
        var tipText = target.getAttribute('data-tip');
        if (tipText){
          showGameTooltip(target, tipText);
          if (tooltipTimeout) clearTimeout(tooltipTimeout);
          tooltipTimeout = setTimeout(hideGameTooltip, 3500);
        }
      } else {
        hideGameTooltip();
      }
    }, true);
  }
}

// Scroll touch tracking to prevent interrupting active swipe gestures during ticks
var activeScrollTouch = { modalLayer: false, floatPanel: false };
var lastTouchTime = { modalLayer: 0, floatPanel: 0 };

if (typeof document !== 'undefined' && document && document.addEventListener){
  ['touchstart', 'touchmove'].forEach(function(evt){
    document.addEventListener(evt, function(e){
      if (e.target && e.target.closest){
        if (e.target.closest('#modalLayer')) {
          activeScrollTouch.modalLayer = true;
          lastTouchTime.modalLayer = Date.now();
        }
        if (e.target.closest('#floatPanel')) {
          activeScrollTouch.floatPanel = true;
          lastTouchTime.floatPanel = Date.now();
        }
      }
    }, { passive: true });
  });
  ['touchend', 'touchcancel'].forEach(function(evt){
    document.addEventListener(evt, function(e){
      if (e.target && e.target.closest){
        if (e.target.closest('#modalLayer')) {
          activeScrollTouch.modalLayer = false;
          lastTouchTime.modalLayer = Date.now();
        }
        if (e.target.closest('#floatPanel')) {
          activeScrollTouch.floatPanel = false;
          lastTouchTime.floatPanel = Date.now();
        }
      }
    }, { passive: true });
  });
}

// Replaces a container's HTML while preserving the scrollTop of all inner
// scrollable elements — prevents resetting to beginning during game loop ticks.
function replacePreservingScroll(containerId, innerSelector, newHtml){
  var container = document.getElementById(containerId);
  if (!container) return;

  // If user is currently touching/swiping inside this container, or touched within 400ms (momentum scroll),
  // skip replacing DOM this tick so the user's touch scroll gesture is never canceled or snapped!
  var isTouching = activeScrollTouch[containerId] || (Date.now() - (lastTouchTime[containerId] || 0) < 400);
  if (isTouching && container.innerHTML.trim().length > 0 && newHtml && newHtml.trim().length > 0){
    return;
  }

  // If newHtml is empty, clear container immediately
  if (!newHtml){
    container.innerHTML = '';
    return;
  }

  // If identical, avoid unnecessary DOM reflow
  if (container.innerHTML === newHtml) return;

  // Capture all scroll positions before replacement
  var savedScrolls = [];
  var scrollTargets = container.querySelectorAll('.modal-body-scroll, .float-panel, .music-list-scroll, ' + (innerSelector || '.modal'));
  scrollTargets.forEach(function(el){
    if (el.scrollTop > 0 || el.scrollLeft > 0){
      savedScrolls.push({
        className: el.className,
        tagName: el.tagName,
        scrollTop: el.scrollTop,
        scrollLeft: el.scrollLeft
      });
    }
  });

  var primaryScroller = container.querySelector('.modal-body-scroll') || container.querySelector(innerSelector);
  var primaryScrollTop = primaryScroller ? primaryScroller.scrollTop : 0;
  var primaryScrollLeft = primaryScroller ? primaryScroller.scrollLeft : 0;

  container.innerHTML = newHtml;

  // Restore primary scroller
  var newPrimary = container.querySelector('.modal-body-scroll') || container.querySelector(innerSelector);
  if (newPrimary && primaryScrollTop > 0){
    newPrimary.scrollTop = primaryScrollTop;
    if (primaryScrollLeft > 0) newPrimary.scrollLeft = primaryScrollLeft;
  }

  // Restore matched saved scrollers
  if (savedScrolls.length > 0){
    savedScrolls.forEach(function(item){
      var candidates = container.querySelectorAll(item.tagName);
      candidates.forEach(function(c){
        if (c.className === item.className){
          c.scrollTop = item.scrollTop;
          c.scrollLeft = item.scrollLeft;
        }
      });
    });
  }
}

function updateViewportScale(){
  var w = window.innerWidth;
  var h = window.innerHeight;
  var isPortrait = h > w;
  var isMobile = w <= 768;
  var isTablet = w > 768 && w <= 1024;

  var root = document.getElementById('gameRoot');
  if (root){
    root.classList.toggle('is-portrait-device', isPortrait);
    root.classList.toggle('is-landscape-device', !isPortrait);
    root.classList.toggle('is-mobile', isMobile);
    root.classList.toggle('is-tablet', isTablet);

    // On mobile and tablet, strictly enforce landscape mode
    if (isMobile || isTablet){
      uiCornersState.viewOrientation = 'landscape';
    }

    var mode = uiCornersState.viewOrientation || 'landscape';
    root.classList.toggle('view-auto', mode === 'auto');
    root.classList.toggle('view-portrait', false);
    root.classList.toggle('view-landscape', true);
  }

  updateViewInterchangeButton();
}

function updateViewInterchangeButton(){
  var mode = uiCornersState.viewOrientation || 'landscape';
  var icon = mode === 'landscape' ? '🖥️' : '🔄';

  btns.forEach(function(btn){

    var labelEl = btn.querySelector('.view-btn-label');

    if (labelEl) labelEl.textContent = text;

  });
}

function toggleViewOrientation(forcedMode){
  var modes = ['landscape', 'auto'];
  if (forcedMode && modes.indexOf(forcedMode) !== -1){
    uiCornersState.viewOrientation = forcedMode;
  } else {
    var curr = uiCornersState.viewOrientation || 'landscape';
    var nextIdx = (modes.indexOf(curr) + 1) % modes.length;

  try {
    localStorage.setItem('searchO2_view_orientation', uiCornersState.viewOrientation);

function updateFullscreenBtnState(){
  var isFull = isFullScreenActive();
  var btns = document.querySelectorAll('.fullscreen-btn');
  btns.forEach(function(btn){

    var labelEl = btn.querySelector('.fullscreen-btn-label');

function toggleFullscreenMode(){
  if (isFullScreenActive()){
    if (document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    } else if (document.webkitExitFullscreen){
      document.webkitExitFullscreen();
    } else if (document.mozCancelFullScreen){
      document.mozCancelFullScreen();
    } else if (document.msExitFullscreen){
      document.msExitFullscreen();
    }
  } else {
    var elem = document.documentElement || document.body;
    if (elem.requestFullscreen){
      elem.requestFullscreen().catch(function(){});
    } else if (elem.webkitRequestFullscreen){
      elem.webkitRequestFullscreen();
    } else if (elem.mozRequestFullScreen){
      elem.mozRequestFullScreen();
    } else if (elem.msRequestFullscreen){
      elem.msRequestFullscreen();
    }
  }
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('click');
}

function renderCornersUI(){
  if (typeof state === 'undefined' || !state) return;

  // 1. Top-Left Tray
  var tlTray = document.getElementById('topLeftTray');
  var tlChevron = document.getElementById('topLeftChevron');
  var tlBadge = document.getElementById('topLeftBadge');
  if (tlTray){
    tlTray.className = 'top-left-tray ' + (uiCornersState.topLeftExpanded ? 'is-expanded' : 'is-collapsed');
    if (tlChevron) tlChevron.textContent = uiCornersState.topLeftExpanded ? '▴' : '▾';
    if (tlBadge){
      var tCount = countPendingTasks() + (state.money < 0 ? 1 : 0);
      if (tCount > 0){
        tlBadge.textContent = tCount;
        tlBadge.className = 'corner-btn-badge show';
      } else {
        tlBadge.className = 'corner-btn-badge';
      }
    }
  }

  // 2. Top-Right Tray
  var trTray = document.getElementById('topRightTray');
  var trChevron = document.getElementById('topRightChevron');
  var trCapsule = document.getElementById('topRightCapsuleContent');
  if (trTray){
    trTray.className = 'top-right-tray ' + (uiCornersState.topRightExpanded ? 'is-expanded' : 'is-collapsed');
    if (trChevron) trChevron.textContent = uiCornersState.topRightExpanded ? '▴' : '▾';
    if (trCapsule){
      var gameDay = Math.floor(state.gameHour / 24) + 1;
      var moneyFmt = (state.money < 0 ? '⚠️ -€' + Math.abs(state.money).toFixed(0) : '🪙 €' + state.money.toFixed(2));
      trCapsule.innerHTML = moneyFmt + ' · 🌿 ' + state.totalO2.toFixed(1) + ' O₂ · Day ' + gameDay;
    }
  }

  // 3. Bottom-Right Tools Tray
  var btTray = document.getElementById('bottomToolsTray');
  var btChevron = document.getElementById('bottomToolsChevron');
  var btBadge = document.getElementById('bottomToolsBadge');
  if (btTray){
    btTray.className = 'bottom-tools-tray ' + (uiCornersState.bottomToolsExpanded ? 'is-expanded' : 'is-collapsed');
    if (btChevron) btChevron.textContent = uiCornersState.bottomToolsExpanded ? '▾' : '▴';
    if (btBadge){
      var idleCount = state.workers.filter(function(w){ return w.assignedPlot === null && !w.assignedBuilding; }).length;
      if (idleCount > 0){
        btBadge.textContent = idleCount + ' idle';
        btBadge.className = 'corner-btn-badge show';
        btBadge.style.background = '#4CAF50';
      } else {
        btBadge.className = 'corner-btn-badge';
      }
    }
  }

  // 4. Agricultural Marketplace Tray
  var mpTray = document.getElementById('marketplaceTray');
  var mpChevron = document.getElementById('marketplaceChevron');
  var mpBadge = document.getElementById('marketplaceBadge');
  if (mpTray){
    mpTray.className = 'bottom-tools-tray marketplace-tray ' + (uiCornersState.marketplaceExpanded ? 'is-expanded' : 'is-collapsed');
    if (mpChevron) mpChevron.textContent = uiCornersState.marketplaceExpanded ? '▾' : '▴';
    if (mpBadge){
      var allTimeO2 = Math.round(state.totalO2AllTime || 0);
      var unlockedCount = MARKETPLACE_CATALOG.filter(function(item){ return allTimeO2 >= item.milestoneO2; }).length;
      mpBadge.textContent = unlockedCount + '/' + MARKETPLACE_CATALOG.length;
    }
    if (uiCornersState.marketplaceExpanded){
      renderMarketplaceTray();
    }
  }

  // Position float panel cleanly relative to dock
  var fp = document.getElementById('floatPanel');
  if (fp){
    if (uiCornersState.topLeftExpanded){
      fp.classList.add('adjacent-dock');
    } else {
      fp.classList.remove('adjacent-dock');
    }
  }

  updateViewInterchangeButton();
}

function buyMarketplaceItem(itemId){
  var item = MARKETPLACE_CATALOG.find(function(x){ return x.id === itemId; });
  if (!item) return;
  var allTimeO2 = Math.round(state.totalO2AllTime || 0);
  if (allTimeO2 < item.milestoneO2){
    showNotification('🔒', 'Produce more oxygen to unlock this milestone! (' + allTimeO2 + '/' + item.milestoneO2 + ' O₂)', 'achievement');
    return;
  }
  if (state.money < item.cost){
    showNotification('💰', 'Insufficient funds to purchase ' + item.name + ' (€' + item.cost + ').', 'economy');
    return;
  }
  if (!state.marketplaceUnlocked) state.marketplaceUnlocked = {};
  if (state.marketplaceUnlocked[itemId]) return;

  state.money -= item.cost;
  state.marketplaceUnlocked[itemId] = true;
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('achieve');
  pushReport('🛒 Purchased ' + item.name + ' from the Marketplace (€' + item.cost + '). ' + item.bonus);
  showNotification(item.icon, 'Equipped ' + item.name + '!', 'achievement');
  render(); requestSave();
}

function renderMarketplaceTray(){
  var container = document.getElementById('marketplaceContent');
  if (!container) return;

  var allTimeO2 = Math.round(state.totalO2AllTime || 0);
  var unlockedMap = state.marketplaceUnlocked || {};

  // Find next milestone
  var nextItem = MARKETPLACE_CATALOG.filter(function(it){ return allTimeO2 < it.milestoneO2; })
                                    .sort(function(a,b){ return a.milestoneO2 - b.milestoneO2; })[0];

  var html = '<div class="marketplace-milestone-bar">' +
    '<div class="marketplace-milestone-header">' +
      '<span>🌿 All-Time Oxygen: <b>' + allTimeO2 + ' O₂</b></span>' +
      '<span>' + (nextItem ? ('Next: ' + nextItem.icon + ' ' + nextItem.milestoneO2 + ' O₂') : '🌟 All Milestones Unlocked!') + '</span>' +
    '</div>' +
    '<div class="marketplace-progress-track">' +
      '<div class="marketplace-progress-fill" style="width:' + (nextItem ? Math.min(100, Math.round((allTimeO2 / nextItem.milestoneO2) * 100)) : 100) + '%;"></div>' +
    '</div>' +
  '</div>';

  var categories = ['Soil Health & Bio-Stimulants', 'Hydration & Irrigation', 'Crop Care & Tools', 'Logistics & Mechanization'];
  categories.forEach(function(cat){
    var items = MARKETPLACE_CATALOG.filter(function(it){ return it.category === cat; });
    html += '<div class="marketplace-cat-title">' + cat + '</div><div class="marketplace-grid">';
    items.forEach(function(item){
      var isUnlocked = allTimeO2 >= item.milestoneO2;
      var isPurchased = unlockedMap[item.id];
      html += '<div class="market-card ' + (isUnlocked ? '' : 'is-locked') + '">' +
        '<div class="m-info">' +
          '<div class="m-title">' + item.icon + ' ' + item.name + '</div>' +
          '<div class="m-desc">' + item.desc + '</div>' +
          '<div class="m-bonus">✨ ' + item.bonus + '</div>' +
          (!isUnlocked ? ('<div class="m-lock-note">🔒 Unlocks at ' + item.milestoneO2 + ' O₂ (' + (item.milestoneO2 - allTimeO2) + ' O₂ needed)</div>') : '') +
        '</div>' +
        '<div>' +
          (isPurchased ? '<button class="purchased" disabled>✓ Active</button>' :
            (isUnlocked ? '<button onclick="buyMarketplaceItem(&apos;' + item.id + '&apos;)" ' + (state.money < item.cost ? 'disabled' : '') + '>Buy €' + item.cost + '</button>' :
              '<button disabled>🔒 Locked</button>')) +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  });

  html += '<button class="modal-bottom-close" onclick="toggleCorner(\'marketplaceExpanded\')" style="margin-top:14px;">✕ Close Marketplace</button>';
  container.innerHTML = html;
}

function render(){
  if (!state) return;
  updateAuthUIState();

  if (currentScreen === 'region_select'){
    var rScreen = document.getElementById('regionScreen');
    var fScreen = document.getElementById('farmScreen');
    if (rScreen) rScreen.style.display = 'block';
    if (fScreen) fScreen.style.display = 'none';
    renderRegionScreen();
  } else if (currentScreen === 'farm'){
    var rScreen = document.getElementById('regionScreen');
    var fScreen = document.getElementById('farmScreen');
    if (rScreen) rScreen.style.display = 'none';
    if (fScreen) fScreen.style.display = 'block';

    document.getElementById('topbarStats').innerHTML = topbarStatsHtml();
    var bonusSpan = document.getElementById('bonusTextSpan');
    if (bonusSpan) bonusSpan.textContent = bonusText();
    document.getElementById('iconDock').innerHTML = dockHtml();
    replacePreservingScroll('floatPanel', '.float-panel', panelHtml());
    document.getElementById('fieldPlots').innerHTML = farmRoadNetworkHtml() + state.plots.map(function(p,i){ return plotSpotHtml(p, PLOT_LAYOUT[i]); }).join('') + storageSpotHtml() + villageSpotsHtml();
    renderCornersUI();

    var bgEl = document.getElementById('fieldBg');
    if (bgEl){
      var bgKey = devRegionPreview + '_' + (state.rocksCleared ? '1' : '0') + '_' + (state.rocksClearing ? Math.floor((state.rocksClearHours||0)*10) : '0') + '_' + Math.floor((state.lawnOvergrowth||0)/10) + '_' + (state.lawnMowing ? Math.floor((state.lawnMowHours||0)*10) : '0');
      if (bgEl.dataset.bgKey !== bgKey){
        bgEl.innerHTML = devActiveBackgroundSvg();
        bgEl.dataset.bgKey = bgKey;
      }
    }
    var devBtn = document.getElementById('devRegionToggleBtn');
    if (devBtn){
      var isMobileView = window.innerWidth <= 1024 || window.innerHeight <= 520 || ('ontouchstart' in window && window.innerWidth <= 1200) || (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
      if (isMobileView){
        devBtn.style.setProperty('display', 'none', 'important');
      } else if (typeof DEV_REGION_META !== 'undefined' && DEV_REGION_META[devRegionPreview]){
        devBtn.style.removeProperty('display');
        devBtn.innerHTML = '🌍 Biome: ' + DEV_REGION_META[devRegionPreview].flag + ' ' + DEV_REGION_META[devRegionPreview].label + ' ▾';
      }
    }

    if (typeof updateToolStrip === 'function') updateToolStrip();
  }

  replacePreservingScroll('modalLayer', '.modal-body-scroll', modalHtml());
  wireEvents();
  syncWildAnimals();
}

function wireEvents(){
  // Main Road Canvas Click & Touch Listeners
  document.querySelectorAll('[data-open-road-modal], .main-road-click-zone, .main-road-canvas-badge').forEach(function(el){
    el.onclick = function(e){
      if (e) e.stopPropagation();
      openModal('building', 'road');
    };
    el.ontouchend = function(e){
      if (e) e.stopPropagation();
      openModal('building', 'road');
    };
  });
  // Background bare-field tap closes open corner menus for full unobstructed view
  var fieldBg = document.getElementById('fieldBg');
  if (fieldBg){
    fieldBg.onclick = function(e){
      if (uiCornersState.topLeftExpanded || uiCornersState.topRightExpanded || uiCornersState.bottomToolsExpanded || uiCornersState.marketplaceExpanded){
        closeAllCorners();
      }
      if (openPanel){
        openPanel = null;
        render();

  // 3 Corner Menus Toggles & Tray Click Protection
  var btnTL = document.getElementById('btnToggleTopLeft');
  if (btnTL){
    btnTL.onclick = function(e){
      e.stopPropagation();
      toggleCorner('topLeftExpanded');
    };
  }
  var btnTR = document.getElementById('btnToggleTopRight');

    btnTR.onclick = function(e){
      e.stopPropagation();
      toggleCorner('topRightExpanded');
    };
  }

      toggleCorner('bottomToolsExpanded');

      e.stopPropagation();
      toggleCorner('bottomToolsExpanded');

    btnMP.onclick = function(e){

      toggleCorner('marketplaceExpanded');

    btnCloseMP.onclick = function(e){
      e.stopPropagation();
      toggleCorner('marketplaceExpanded');

            switchScreen('farm');

          showNotification('🔒', reg.flag + ' ' + reg.title + ' (' + reg.country + ') requires ' + reg.unlockO2.toLocaleString() + ' O₂ to unlock.', 'bank', null);
          openModal('region_preview', reg.id);

      e.stopPropagation();

  document.querySelectorAll('[data-unassign-laborer-storage]').forEach(function(b){ b.onclick=function(){ unassignLaborerFromStorage(); }; });

  document.querySelectorAll('[data-setflower]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); setGardenFlower(b.getAttribute('data-setflower')); }; });
  document.querySelectorAll('[data-setpond]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); setPondSpecialization(b.getAttribute('data-setpond')); }; });

  document.querySelectorAll('[data-feedpond]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); feedPond(); }; });
  document.querySelectorAll('[data-collectpond]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); startCollectPond(); }; });
  document.querySelectorAll('[data-assignbuildingworker]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); assignWorkerToBuilding(parseInt(b.getAttribute('data-assignbuildingworker')), b.getAttribute('data-assignbuilding')); }; });
  document.querySelectorAll('[data-unassignbuilding]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); unassignWorkerFromBuilding(b.getAttribute('data-unassignbuilding')); }; });
  document.querySelectorAll('[data-openbank]').forEach(function(b){ b.onclick=function(){ bankruptcyDismissed=false; openModal('bank', null); }; });
  document.querySelectorAll('[data-takeloan]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); takeLoan(b.getAttribute('data-takeloan')); }; });
  document.querySelectorAll('[data-repayloan]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); repayLoanEarly(); }; });
  document.querySelectorAll('[data-resetask]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); resetConfirmPending=true; render(); }; });
  document.querySelectorAll('[data-resetconfirm]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); resetFarm(); }; });
  document.querySelectorAll('[data-resetcancel]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); resetConfirmPending=false; render(); }; });
  document.querySelectorAll('.plot-spot[data-plot]').forEach(function(el){
    el.addEventListener('click', function(){ openModal('plot', parseInt(el.getAttribute('data-plot'))); });
  });
  document.querySelectorAll('[data-closemodal]').forEach(function(b){
    b.onclick = function(e){ closeModal(e); };
    b.ontouchend = function(e){ closeModal(e); };
  });
  var overlay = document.getElementById('modalOverlay');
  if (overlay) {
    overlay.onclick = function(e){ if (e.target===overlay) closeModal(e); };
    overlay.ontouchend = function(e){ if (e.target===overlay) closeModal(e); };
  }
  document.querySelectorAll('[data-prep]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); startPrep(parseInt(b.getAttribute('data-prep'))); }; });
  document.querySelectorAll('[data-clear]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); startClear(parseInt(b.getAttribute('data-clear'))); }; });
  document.querySelectorAll('[data-removetree]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); startRemoveTree(parseInt(b.getAttribute('data-removetree'))); }; });
  document.querySelectorAll('[data-plant]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); plantTree(parseInt(b.getAttribute('data-plant')), b.getAttribute('data-type')); }; });
  document.querySelectorAll('[data-water]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); waterPlot(parseInt(b.getAttribute('data-water'))); }; });
  document.querySelectorAll('[data-prune]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); prunePlot(parseInt(b.getAttribute('data-prune'))); }; });

  document.querySelectorAll('[data-scare]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); scareAnimal(parseInt(b.getAttribute('data-scare'))); }; });

  document.querySelectorAll('[data-assign]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); assignWorker(parseInt(b.getAttribute('data-assign')), parseInt(b.getAttribute('data-assignplot'))); }; });
  document.querySelectorAll('[data-unassign]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); unassignWorker(parseInt(b.getAttribute('data-unassign'))); }; });
  document.querySelectorAll('[data-openauth]').forEach(function(b){ b.onclick=function(){ openModal('auth', null); }; });
  document.querySelectorAll('[data-authlogout]').forEach(function(b){ b.onclick=function(){ ApiClient.logout(); }; });
  document.querySelectorAll('[data-auth="google"]').forEach(function(b){ b.onclick=function(){ ApiClient.loginGoogle(); }; });
  document.querySelectorAll('[data-auth="guest"]').forEach(function(b){ b.onclick=function(){ ApiClient.loginGuest(); }; });
  document.querySelectorAll('[data-auth="login"]').forEach(function(b){
    b.onclick=function(){
      var em = (document.getElementById('authEmail') || {}).value || '';
      var pw = (document.getElementById('authPassword') || {}).value || '';
      if (!em || !pw) return alert('Please enter email and password');
      ApiClient.login(em, pw).catch(function(err){ alert('Login failed: ' + err.message); });
    };
  });
  document.querySelectorAll('[data-auth="register"]').forEach(function(b){
    b.onclick=function(){
      var em = (document.getElementById('authEmail') || {}).value || '';
      var pw = (document.getElementById('authPassword') || {}).value || '';
      var dn = (document.getElementById('authDisplayName') || {}).value || '';
      if (!em || !pw || !dn) return alert('Please enter email, password, and display name');
      ApiClient.register(em, pw, dn).catch(function(err){ alert('Registration failed: ' + err.message); });
    };
  });
  document.querySelectorAll('[data-upgrade="google"]').forEach(function(b){ b.onclick=function(){ ApiClient.upgrade('google', {}).catch(function(err){ alert('Upgrade failed: ' + err.message); }); }; });
  document.querySelectorAll('[data-upgrade="local"]').forEach(function(b){
    b.onclick=function(){
      var em = (document.getElementById('upgEmail') || {}).value || '';
      var pw = (document.getElementById('upgPassword') || {}).value || '';
      if (!em || !pw) return alert('Please enter email and password');
      ApiClient.upgrade('local', { email: em, password: pw }).catch(function(err){ alert('Upgrade failed: ' + err.message); });
    };
  });
  var dismissOffline = function(e){
    if (e) {
      if (typeof e.stopPropagation === 'function') e.stopPropagation();
      if (typeof e.preventDefault === 'function') e.preventDefault();
    }
    offlineSummary = null;
    var offm = document.getElementById('offlineModal');
    if (offm) {
      offm.style.display = 'none';
      if (offm.parentNode) offm.parentNode.removeChild(offm);
    }
    render();
  };
  var closeOffline = document.getElementById('closeOffline');
  if (closeOffline) { closeOffline.onclick = dismissOffline; closeOffline.ontouchend = dismissOffline; }
  var closeOfflineX = document.getElementById('closeOfflineX');
  if (closeOfflineX) { closeOfflineX.onclick = dismissOffline; closeOfflineX.ontouchend = dismissOffline; }
  var closeOfflineBottom = document.getElementById('closeOfflineBottom');
  if (closeOfflineBottom) { closeOfflineBottom.onclick = dismissOffline; closeOfflineBottom.ontouchend = dismissOffline; }
  var offlineOverlay = document.getElementById('offlineModal');
  if (offlineOverlay) {
    offlineOverlay.onclick = function(e){ if (e.target === offlineOverlay) dismissOffline(e); };
    offlineOverlay.ontouchend = function(e){ if (e.target === offlineOverlay) dismissOffline(e); };
  }

  // Responsive device orientation & window resize listeners
  window.addEventListener('resize', updateViewportScale);
  window.addEventListener('orientationchange', function(){
    setTimeout(updateViewportScale, 120);
  });

  // Restore saved view orientation preference (defaults to Full PC View on desktop)
  try {
    var isDesktopScreen = window.innerWidth > 768;
    var savedOrientation = localStorage.getItem('searchO2_view_orientation');
    if (isDesktopScreen) {
      // On PC / desktop monitors, always load into full-screen PC view by default
      uiCornersState.viewOrientation = (savedOrientation === 'landscape' || savedOrientation === 'auto') ? savedOrientation : 'auto';
    } else if (savedOrientation && ['auto', 'landscape'].indexOf(savedOrientation) !== -1) {
      uiCornersState.viewOrientation = savedOrientation;
    } else {
      uiCornersState.viewOrientation = 'auto';
    }
  } catch(e){
    uiCornersState.viewOrientation = 'auto';
  }
  updateViewportScale();
  initGameTooltips();
}

loadState();
ApiClient.init();
updateViewportScale();
initGameTooltips();
})();
</script>
