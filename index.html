// ================= STRICT MANHATTAN ROAD NETWORK PATHFINDING =================
// Computes exact paved road waypoints connecting any origin to any destination,
// strictly following Avenue subways, East-West spurs, and the 50px cross-lane L-turn into Storage Barn.

function getRoadNetworkWaypoints(origin, destination){
  var mainRoadY = 47.0;

  // Exact path from location to Main Road junction [loc -> ... -> Main Road]
  function toMainRoad(loc){
    if (typeof loc === 'object' && loc !== null && 'x' in loc && 'y' in loc){
      if (Math.abs(loc.y - mainRoadY) < 1) return [{ x: loc.x, y: mainRoadY }];
      return [{ x: loc.x, y: loc.y }, { x: loc.x, y: mainRoadY }];
    }
    if (loc === 'main_gate'){
      return [{ x: 1.0, y: mainRoadY }];
    }
    if (loc === 'countryside_west'){
      return [{ x: -8.0, y: mainRoadY }];
    }
    if (loc === 'east_overlook' || loc === 'main_road_east'){
      return [{ x: 96.0, y: mainRoadY }];
    }
    if (loc === 'crew_shed'){
      // Crew Shed Porch (x:12.7, y:66) up Crew Trail to Main Road (x:12.7, y:47)
      return [{ x: 12.7, y: 66.0 }, { x: 12.7, y: mainRoadY }];
    }
    if (loc === 'storage'){
      // Storage Apron (x:52.5, y:18) -> 50px cross-lane (x:52.5, y:21.7) -> L-Turn East to Avenue 2 (x:60.2, y:21.7) -> Avenue 2 South to Main Road (x:60.2, y:47)
      return [{ x: 52.5, y: 18.0 }, { x: 52.5, y: 21.7 }, { x: 60.2, y: 21.7 }, { x: 60.2, y: mainRoadY }];
    }
    var pId = (typeof loc === 'number' || (typeof loc === 'string' && /^[0-5]$/.test(loc))) ? parseInt(loc, 10) : null;
    if (pId !== null){
      if (pId === 0) return [{ x: 24.0, y: 31.4 }, { x: 31.0, y: 31.4 }, { x: 31.0, y: mainRoadY }];
      if (pId === 1) return [{ x: 52.0, y: 41.4 }, { x: 60.2, y: 41.4 }, { x: 60.2, y: mainRoadY }];
      if (pId === 2) return [{ x: 80.5, y: 31.4 }, { x: 73.8, y: 31.4 }, { x: 73.8, y: mainRoadY }];
      if (pId === 3) return [{ x: 24.0, y: 65.4 }, { x: 31.0, y: 65.4 }, { x: 31.0, y: mainRoadY }];
      if (pId === 4) return [{ x: 52.5, y: 66.0 }, { x: 52.5, y: mainRoadY }];
      if (pId === 5) return [{ x: 80.5, y: 65.4 }, { x: 73.8, y: 65.4 }, { x: 73.8, y: mainRoadY }];
    }
    if (loc === 'garage'){
      return [{ x: 93.5, y: 34.0 }, { x: 93.5, y: mainRoadY }];
    }
    if (loc === 'pond'){
      return [{ x: 38.0, y: 34.0 }, { x: 38.0, y: mainRoadY }];
    }
    if (loc === 'garden'){
      return [{ x: 38.0, y: 66.0 }, { x: 38.0, y: mainRoadY }];
    }
    if (loc === 'coffee_shop'){
      return [{ x: 67.0, y: 34.0 }, { x: 67.0, y: mainRoadY }];
    }
    if (loc === 'juice_bar'){
      return [{ x: 67.0, y: 66.0 }, { x: 67.0, y: mainRoadY }];
    }
    if (loc === 'rocks'){
      return [{ x: 47.0, y: 28.0 }, { x: 47.0, y: mainRoadY }];
    }
    if (loc === 'lawn'){
      return [{ x: 50.0, y: 56.0 }, { x: 50.0, y: mainRoadY }];
    }
    return [{ x: 24.0, y: mainRoadY }];
  }

  var originPts = toMainRoad(origin);
  var destPtsReversed = toMainRoad(destination);
  var destPts = destPtsReversed.slice().reverse();

  var originJunction = originPts[originPts.length - 1];
  var destJunction = destPts[0];

  var fullRoute = [];
  originPts.forEach(function(pt){ fullRoute.push(pt); });

  // Travel horizontally along Main Road if junctions differ
  if (Math.abs(originJunction.x - destJunction.x) > 0.5){
    fullRoute.push({ x: destJunction.x, y: mainRoadY });
  }

  destPts.forEach(function(pt, idx){
    if (idx > 0) fullRoute.push(pt);
  });

  // Deduplicate consecutive identical waypoints
  var cleanRoute = [];
  fullRoute.forEach(function(pt){
    if (!cleanRoute.length){
      cleanRoute.push(pt);
    } else {
      var last = cleanRoute[cleanRoute.length - 1];
      if (Math.hypot(last.x - pt.x, last.y - pt.y) > 0.3){
        cleanRoute.push(pt);
      }
    }
  });

  return cleanRoute;
}

function getPlotJunctionX(plotId){
  if (plotId === 0 || plotId === 3) return 31.0; // Avenue 1
  if (plotId === 1) return 60.2;                 // Avenue 2 North
  if (plotId === 4) return 52.5;                 // Avenue 2 South
  return 73.8;                                   // Avenue 3 (Plots 2 & 5)
}

function getPlotDestY(plotId){
  if (plotId === 0 || plotId === 2) return 31.4;
  if (plotId === 1) return 41.4;
  if (plotId === 3 || plotId === 5) return 65.4;
  if (plotId === 4) return 66.0;
  return 47.0;
}

function calculateGridRoute(startPoint, endPoint){
  return getRoadNetworkWaypoints(startPoint, endPoint);
}

// Enhanced multi-segment waypoint animator with smooth cornering curves and continuous rotational heading
function animateAlongWaypoints(el, rawWaypoints, totalDurationMs, onComplete){
  if (!rawWaypoints || rawWaypoints.length < 2){
    if (onComplete) onComplete();
    return;
  }

  var isPedestrian = el.classList.contains('human-walker-sprite');

  // For vehicles: insert smooth filleted cornering waypoints at sharp 90° intersections
  var waypoints = [];
  if (isPedestrian){
    waypoints = rawWaypoints;
  } else {
    for (var w = 0; w < rawWaypoints.length; w++){
      if (w > 0 && w < rawWaypoints.length - 1){
        var p0 = rawWaypoints[w - 1];
        var p1 = rawWaypoints[w];
        var p2 = rawWaypoints[w + 1];
        var d1 = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        var d2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        // If corner turn detected, fillet corner with curved entry, apex, and exit
        if (d1 > 3.5 && d2 > 3.5){
          var cut1 = Math.min(2.5, d1 * 0.25);
          var cut2 = Math.min(2.5, d2 * 0.25);
          var entry = { x: p1.x - (p1.x - p0.x) * (cut1 / d1), y: p1.y - (p1.y - p0.y) * (cut1 / d1) };
          var apex  = { x: (p1.x * 2 + entry.x + p2.x) / 4,   y: (p1.y * 2 + entry.y + p2.y) / 4 };
          var exit  = { x: p1.x + (p2.x - p1.x) * (cut2 / d2), y: p1.y + (p2.y - p1.y) * (cut2 / d2) };
          waypoints.push(entry);
          waypoints.push(apex);
          waypoints.push(exit);
          continue;
        }
      }
      waypoints.push(rawWaypoints[w]);
    }
  }

  // Calculate Euclidean distances for proportional velocities
  var legDists = [];
  var totalDist = 0;
  for (var i = 1; i < waypoints.length; i++){
    var d = Math.hypot(waypoints[i].x - waypoints[i-1].x, waypoints[i].y - waypoints[i-1].y);
    legDists.push(d);
    totalDist += d;
  }
  if (totalDist < 0.1) totalDist = 0.1;

  var currentIdx = 0;
  var currentAngle = 0;

  // Initialize starting position
  el.style.left = waypoints[0].x + '%';
  el.style.top = waypoints[0].y + '%';

  // For vehicles, determine initial heading from first leg
  if (!isPedestrian && waypoints.length > 1){
    var initDx = waypoints[1].x - waypoints[0].x;
    var initDy = waypoints[1].y - waypoints[0].y;
    currentAngle = Math.atan2(initDy, initDx) * 180 / Math.PI;
    el.style.transform = 'rotate(' + currentAngle + 'deg)';
  } else if (isPedestrian){
    el.classList.add('human-walker-bobbing');
  }

  function nextStep(){
    currentIdx++;
    if (currentIdx >= waypoints.length){
      if (isPedestrian) el.classList.remove('human-walker-bobbing');
      if (onComplete) onComplete();
      return;
    }
    var prev = waypoints[currentIdx - 1];
    var curr = waypoints[currentIdx];
    var legDist = legDists[currentIdx - 1] || 1;
    var stepDuration = Math.max(140, Math.round(totalDurationMs * (legDist / totalDist)));

    var dx = curr.x - prev.x;
    var dy = curr.y - prev.y;

    if (isPedestrian){
      // Pedestrians face walking direction horizontally without tilting or snapping
      if (dx > 0.3) el.style.transform = 'scaleX(1)';
      else if (dx < -0.3) el.style.transform = 'scaleX(-1)';
      el.style.transition = 'left ' + (stepDuration / 1000) + 's linear, top ' + (stepDuration / 1000) + 's linear';
    } else {
      // True continuous rotational steering for vehicles — zero flipping!
      if (Math.hypot(dx, dy) > 0.1){
        var targetAngle = Math.atan2(dy, dx) * 180 / Math.PI;
        var delta = targetAngle - currentAngle;
        while (delta < -180) delta += 360;
        while (delta > 180) delta -= 360;
        currentAngle += delta;
      }
      var turnEase = Math.min(0.36, Math.max(0.18, (stepDuration / 1000) * 0.8));
      el.style.transform = 'rotate(' + currentAngle + 'deg)';
      el.style.transition = 'left ' + (stepDuration / 1000) + 's linear, top ' + (stepDuration / 1000) + 's linear, transform ' + turnEase + 's cubic-bezier(0.4, 0.0, 0.2, 1)';
    }

    el.style.left = curr.x + '%';
    el.style.top = curr.y + '%';
    setTimeout(nextStep, stepDuration);
  }

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      nextStep();
    });
  });
}

// Tree Cutting / Wood Salvage Vehicle Animation — navigates along road grid
function spawnVehicleAnimation(fromLayoutOrId){
  var scene = document.querySelector('.field-scene');
  if (!scene) return;

  var plotId = 0;
  if (typeof fromLayoutOrId === 'number'){
    plotId = fromLayoutOrId;
  } else if (fromLayoutOrId && state.plots){
    for (var i = 0; i < PLOT_LAYOUT.length; i++){
      if (Math.abs(PLOT_LAYOUT[i].left - fromLayoutOrId.left) < 1 && Math.abs(PLOT_LAYOUT[i].top - fromLayoutOrId.top) < 1){
        plotId = i; break;
      }
    }
  }

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    truckLayer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:25;';
    scene.appendChild(truckLayer);
  }

  var truckEl = document.createElement('div');
  truckEl.className = 'logistics-truck-sprite';
  truckEl.style.cssText = 'position:absolute;width:84px;height:42px;margin-left:-42px;margin-top:-21px;z-index:26;left:-12%;top:47%;transform-origin:50% 50%;pointer-events:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.36));';
  truckEl.innerHTML = drawTimberTruckSvg();
  truckLayer.appendChild(truckEl);

  pushReport('🚛 Logging flatbed truck entered through Farm Main Gate and navigated along Manhattan road grid to Plot ' + (plotId + 1) + '.');
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');

  // Manhattan Grid: Enter Countryside (x:-12, y:47) -> Main Gate -> Main Road -> Avenue Feeder Subway -> Plot
  var inRoute = [{ x: -12.0, y: 47.0 }].concat(getRoadNetworkWaypoints('main_gate', plotId));
  var distIn = 0;
  for (var di = 1; di < inRoute.length; di++){ distIn += Math.hypot(inRoute[di].x - inRoute[di-1].x, inRoute[di].y - inRoute[di-1].y); }
  var durationIn = Math.max(3800, Math.round(distIn * 70));

  animateAlongWaypoints(truckEl, inRoute, durationIn, function(){
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
    pushReport('🪵 Timber logs loaded securely onto truck bolsters at Plot ' + (plotId + 1) + '.');

    setTimeout(function(){
      // Departure via reverse Manhattan road network back through Farm Main Gate to Countryside
      var outRoute = getRoadNetworkWaypoints(plotId, 'main_gate').concat([{ x: -16.0, y: 47.0 }]);
      var distOut = 0;
      for (var do_ = 1; do_ < outRoute.length; do_++){ distOut += Math.hypot(outRoute[do_].x - outRoute[do_-1].x, outRoute[do_].y - outRoute[do_-1].y); }
      var durationOut = Math.max(4000, Math.round(distOut * 70));

      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');
      animateAlongWaypoints(truckEl, outRoute, durationOut, function(){
        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
        pushReport('✓ Logging truck departed through Farm Main Gate.');
        if (truckEl.parentNode) truckEl.parentNode.removeChild(truckEl);
      });
    }, 1400);
  });
}

// Two-way Worker Walking Animation: Full-human walking model along strict Manhattan road network
function animateWorkerPathWalk(worker, destination, origin, onComplete){
  var scene = document.querySelector('.field-scene');
  if (!scene){
    if (typeof onComplete === 'function') onComplete();
    return;
  }

  var isReturnWalk = (destination === 'crew_shed');
  var fromKey = isReturnWalk ? (origin !== undefined ? origin : 0) : 'crew_shed';
  var toKey = isReturnWalk ? 'crew_shed' : destination;

  // Single consistent worker visuals: Set inTransit flag while pedestrian sprite walks
  if (worker){
    worker.inTransit = true;
    if (isReturnWalk) worker.isReturning = true;
    render();
  }

  var workerType = worker ? worker.type : 'farmer';
  var workerTool = WORKER_TYPES[workerType] ? WORKER_TYPES[workerType].tool : 'shovel';
  if (destination === 'rocks') workerTool = 'pickaxe';
  else if (destination === 'lawn') workerTool = 'mower';
  else if (typeof destination === 'number'){
    var p = state.plots[destination];
    if (p){
      if (p.status === 'preparing') workerTool = 'shovel';
      else if (p.status === 'clearing') workerTool = 'scythe';
      else if (p.status === 'removing') workerTool = 'axe';
      else if (p.harvesting) workerTool = 'basket';
    }
  }

  // Strictly follow paved road network waypoints (Crew Trail -> Main Road -> Avenue -> Spur -> Gate)
  var walkRoute = getRoadNetworkWaypoints(fromKey, toKey);
  if (!walkRoute || walkRoute.length < 2){
    if (typeof onComplete === 'function') onComplete();
    return;
  }

  var workerEl = document.createElement('div');
  workerEl.className = 'human-walker-sprite human-walker-bobbing';
  workerEl.style.position = 'absolute';
  // PRE-SET START POSITION BEFORE APPENDING TO DOM — ZERO FLASH OVER PLOT 0!
  workerEl.style.left = walkRoute[0].x + '%';
  workerEl.style.top = walkRoute[0].y + '%';
  workerEl.style.transition = 'none';
  workerEl.innerHTML = '<svg viewBox="-18 -20 36 65" width="38" height="60" style="overflow:visible;">' +
    drawHumanWorkerSvg(workerType, workerTool, true, false) +
  '</svg>';

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    truckLayer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:34;';
    scene.appendChild(truckLayer);
  }
  truckLayer.appendChild(workerEl);

  // Compute realistic human walking travel time along Manhattan avenues (never rushing or sliding)
  var totalDist = 0;
  for (var r = 1; r < walkRoute.length; r++){
    totalDist += Math.hypot(walkRoute[r].x - walkRoute[r-1].x, walkRoute[r].y - walkRoute[r-1].y);
  }
  var walkDuration = Math.max(2600, Math.round(totalDist * 95));

  animateAlongWaypoints(workerEl, walkRoute, walkDuration, function(){
    if (workerEl.parentNode) workerEl.parentNode.removeChild(workerEl);
    if (!isReturnWalk){
      if (worker) worker.inTransit = false;
      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
      // Mount on-site working figure seamlessly upon arrival
      render();
      if (typeof onComplete === 'function') onComplete();
    } else {
      if (worker){
        worker.inTransit = false;
        worker.isReturning = false;
        worker.assignedPlot = null;
        worker.assignedBuilding = null;
      }
      render();
      if (typeof onComplete === 'function') onComplete();
    }
  });
}

// 2-Wheel Harvest Cart Logistics Sequence:
// Farmer leaves Crew Shed -> Farm Garage (hitches 2-wheel cart) -> Plot (harvests) -> Storage Barn (unloads with currency burst) -> Farm Garage (returns cart)
function triggerHarvestCartSequence(plotId, onComplete){
  var scene = document.querySelector('.field-scene');
  if (!scene) return;

  var junctionX = getPlotJunctionX(plotId);
  var plotY = getPlotDestY(plotId);
  var tractorMode = typeof hasTractor === 'function' ? hasTractor() : false;

  var truckLayer = document.getElementById('logisticsTruckLayer');
  if (!truckLayer){
    truckLayer = document.createElement('div');
    truckLayer.id = 'logisticsTruckLayer';
    truckLayer.className = 'logistics-transport-layer';
    truckLayer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:32;';
    scene.appendChild(truckLayer);
  }

  // Pre-position sprite at East Farm Garage (x: 93.5%, y: 23%)
  var cartSprite = document.createElement('div');
  cartSprite.className = 'logistics-truck-sprite';
  cartSprite.style.cssText = 'position:absolute;width:84px;height:42px;margin-left:-42px;margin-top:-21px;z-index:33;left:93.5%;top:23%;pointer-events:none;transform-origin:50% 50%;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.32));';
  cartSprite.innerHTML = tractorMode ? drawHarvestTractorSvg(false) : drawHarvestHandcartSvg(false);
  truckLayer.appendChild(cartSprite);

  pushReport((tractorMode ? '🚜 Farm Utility Tractor' : '🧑‍🌾 Farmer with orchard cart') + ' dispatched from East Farm Garage to Plot ' + (plotId + 1) + '.');
  if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');

  // Leg 1: East Farm Garage (93.5, 23) -> Main Road (93.5, 47) -> Junction (junctionX, 47) -> Plot (junctionX, plotY)
  var legToPlot = [
    { x: 93.5, y: 23 },
    { x: 93.5, y: 47 },
    { x: junctionX, y: 47 },
    { x: junctionX, y: plotY }
  ];
  var dist1 = 0;
  for (var d = 1; d < legToPlot.length; d++){ dist1 += Math.hypot(legToPlot[d].x - legToPlot[d-1].x, legToPlot[d].y - legToPlot[d-1].y); }
  var legDuration1 = Math.max(3400, Math.round(dist1 * (tractorMode ? 65 : 120)));

  animateAlongWaypoints(cartSprite, legToPlot, legDuration1, function(){
    cartSprite.innerHTML = tractorMode ? drawHarvestTractorSvg(true, '🍎') : drawHarvestHandcartSvg(true, '🍎');
    if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('task');
    pushReport((tractorMode ? '🚜 Mechanized loading into tractor trailer at Plot ' : '🧺 Picking crops into orchard cart at Plot ') + (plotId + 1) + '...');

    setTimeout(function(){
      // Leg 2: Plot (junctionX, plotY) -> Main Road (junctionX, 47) -> Avenue 2 (60.2, 47) -> L-Turn (60.2, 21.7) -> Storage Apron (52.5, 18.0)
      var legToStorage = [
        { x: junctionX, y: plotY },
        { x: junctionX, y: 47 },
        { x: 60.2, y: 47 },
        { x: 60.2, y: 21.7 },
        { x: 52.5, y: 18.0 }
      ];
      var dist2 = 0;
      for (var d2 = 1; d2 < legToStorage.length; d2++){ dist2 += Math.hypot(legToStorage[d2].x - legToStorage[d2-1].x, legToStorage[d2].y - legToStorage[d2-1].y); }
      var legDuration2 = Math.max(3600, Math.round(dist2 * (tractorMode ? 65 : 120)));

      if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('pave');
      animateAlongWaypoints(cartSprite, legToStorage, legDuration2, function(){
        cartSprite.innerHTML = tractorMode ? drawHarvestTractorSvg(false) : drawHarvestHandcartSvg(false);
        if (typeof SoundTrackEngine !== 'undefined') SoundTrackEngine.playSFX('coin');
        pushReport('✓ Delivered harvested produce directly to Storage Barn loading bay.');
        
        var burst = document.createElement('div');
        burst.style.cssText = 'position:absolute;left:52.5%;top:10%;font-size:18px;font-weight:800;color:#2E7D32;z-index:40;transition:all 1.4s ease-out;pointer-events:none;';
        burst.textContent = tractorMode ? '🚜 +Mechanized Harvest Stored!' : '🧺 +Harvest Stored!';
        scene.appendChild(burst);
        requestAnimationFrame(function(){
          burst.style.top = '3%';
          burst.style.opacity = '0';
        });
        setTimeout(function(){ if (burst.parentNode) burst.parentNode.removeChild(burst); }, 1400);

        setTimeout(function(){
          // Leg 3: Return to Garage: Storage Apron (52.5, 18.0) -> Avenue 2 (60.2, 21.7) -> Main Road (60.2, 47) -> Garage Spur (93.5, 47) -> Garage (93.5, 23)
          var legToGarage = [
            { x: 52.5, y: 18.0 },
            { x: 60.2, y: 21.7 },
            { x: 60.2, y: 47 },
            { x: 93.5, y: 47 },
            { x: 93.5, y: 23 }
          ];
          var dist3 = 0;
          for (var d3 = 1; d3 < legToGarage.length; d3++){ dist3 += Math.hypot(legToGarage[d3].x - legToGarage[d3-1].x, legToGarage[d3].y - legToGarage[d3-1].y); }
          var legDuration3 = Math.max(3400, Math.round(dist3 * (tractorMode ? 65 : 120)));

          animateAlongWaypoints(cartSprite, legToGarage, legDuration3, function(){
            pushReport((tractorMode ? '🚜 Utility Tractor' : '🧑‍🌾 Orchard cart') + ' parked securely back at the Farm Garage.');
            if (cartSprite.parentNode) cartSprite.parentNode.removeChild(cartSprite);
            if (onComplete) onComplete();
          });
        }, 1000);
      });
    }, tractorMode ? 1400 : 2400);
  });
}

// Task notification toasts — separate from the ambient educational hint toast. These
// fire on newly-triggered actionable events (dead tree, overgrown plot, wildlife,
// storage full) and auto-dismiss after ~9s if ignored, with a "View" shortcut straight
// to the relevant modal. Managed as direct DOM nodes (not part of render()'s innerHTML
// replacement) so they survive the 1s game tick without flickering or losing timers.
function showNotification(icon, text, actionType, actionArg){
  var stack = document.getElementById('notifStack'); if (!stack) return;
  var el = document.createElement('div');
  el.className = 'notif-toast';
  el.innerHTML = '<span class="notif-toast-icon">'+icon+'</span>'+
    '<div class="notif-toast-content">'+
      '<div class="notif-toast-text">'+text+'</div>'+
      '<div class="notif-toast-actions">'+
        '<button class="notif-toast-btn-view" data-nv="1">View</button>'+
        '<button class="notif-toast-btn-dismiss" data-nx="1">Dismiss</button>'+
      '</div>'+
    '</div>';
  var timer = setTimeout(remove, 9000);
  function remove(){ clearTimeout(timer); if (el.parentNode) el.parentNode.removeChild(el); }
  el.querySelector('[data-nv]').onclick = function(){
    remove();
    if (actionType==='plot') openModal('plot', actionArg);
    else if (actionType==='bank') openModal('bank', null);
    else if (actionType==='storage') openModal('storage', null);
    else if (actionType==='building') openModal('building', actionArg);
  };
  el.querySelector('[data-nx]').onclick = remove;
  stack.appendChild(el);
  while (stack.children.length>3){ stack.removeChild(stack.firstChild); }
}

function drawSpeciesFlora(p, stageInfo, isDead) {

    '</g>';
  }

  // Stage 1: Species-tailored young tender sprout
  if (stageIdx === 1) {
    var sproutGreen = isDead ? '#8D6E63' : '#66BB6A';

    if (type === 'pine' || type === 'cedar') {
      return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
        '<line x1="100" y1="84" x2="100" y2="68" stroke="' + sproutStem + '" stroke-width="2.8" stroke-linecap="round"/>' +
        '<path d="M100,68 L92,58 M100,68 L96,54 M100,68 L104,54 M100,68 L108,58" stroke="' + sproutGreen + '" stroke-width="2" stroke-linecap="round"/>' +
      '</g>';
    }
    if (type === 'carrot') {
      return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
        '<line x1="100" y1="84" x2="100" y2="70" stroke="' + sproutStem + '" stroke-width="2"/>' +
        '<path d="M100,70 Q92,62 89,58 M100,70 Q108,62 111,58 M100,70 L100,56" stroke="' + sproutGreen + '" stroke-width="1.8" fill="none"/>' +
      '</g>';
    }
    if (type === 'onion') {
      return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
        '<path d="M98,84 Q99,68 97,56 M101,84 Q102,70 105,58" stroke="' + sproutGreen + '" stroke-width="2.2" stroke-linecap="round" fill="none"/>' +
      '</g>';
    }
    return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
      '<path d="M100,84 Q99,72 100,64" stroke="' + sproutStem + '" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="94" cy="62" rx="6" ry="3.5" transform="rotate(-25 94 62)" fill="' + sproutGreen + '"/>' +
      '<ellipse cx="106" cy="62" rx="6" ry="3.5" transform="rotate(25 106 62)" fill="' + sproutGreen + '"/>' +
    '</g>';
  }

  // Stage 2: Young sapling or growing vine
  if (stageIdx === 2) {
    if (type === 'tomato') {
      var tClr = isDead ? '#8D6E63' : '#388E3C';
      return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
        '<line x1="97" y1="84" x2="97" y2="52" stroke="#8D6E63" stroke-width="2.5"/>' +
        '<path d="M97,82 Q103,72 98,64 Q94,58 98,54" stroke="#4CAF50" stroke-width="2" fill="none"/>' +
        '<circle cx="92" cy="70" r="6" fill="' + tClr + '"/>' +
        '<circle cx="105" cy="65" r="7" fill="' + tClr + '"/>' +
        '<circle cx="98" cy="55" r="5" fill="' + tClr + '"/>' +
      '</g>';
    }
    if (type === 'potato') {
      var pClr = isDead ? '#8D6E63' : '#2E7D32';
      return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
        '<ellipse cx="100" cy="84" rx="20" ry="7" fill="#4E342E"/>' +
        '<ellipse cx="92" cy="74" rx="9" ry="7" fill="' + pClr + '"/>' +
        '<ellipse cx="108" cy="74" rx="9" ry="7" fill="' + pClr + '"/>' +
        '<ellipse cx="100" cy="68" rx="10" ry="8" fill="' + pClr + '"/>' +
      '</g>';
    }
    if (type === 'carrot') {
      var cClr = isDead ? '#8D6E63' : '#43A047';
      return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
        '<ellipse cx="100" cy="84" rx="16" ry="5" fill="#4E342E"/>' +
        '<path d="M100,84 Q92,72 88,64 M100,84 Q108,72 112,64 M100,84 L100,60" stroke="' + cClr + '" stroke-width="2.4" fill="none"/>' +
        '<circle cx="88" cy="64" r="3" fill="' + cClr + '"/>' +
        '<circle cx="112" cy="64" r="3" fill="' + cClr + '"/>' +
        '<circle cx="100" cy="60" r="3" fill="' + cClr + '"/>' +
      '</g>';
    }
    if (type === 'onion') {
      var oClr = isDead ? '#8D6E63' : '#4CAF50';
      return '<g class="' + swayClass + '" ' + swayOrigin + '>' +
        '<ellipse cx="100" cy="84" rx="16" ry="5" fill="#4E342E"/>' +
        '<path d="M96,84 L94,58 M98,84 L98,54 M102,84 L103,55 M104,84 L107,60" stroke="' + oClr + '" stroke-width="2.2" stroke-linecap="round"/>' +
      '</g>';
    }
    var tTrunk = isDead ? '#6D4C41' : (type === 'birch' ? '#ECEFF1' : (type === 'poplar' ? '#90A4AE' : '#7A5334'));

    return '<g class="' + swayClass + '" ' + swayOrigin + '>' +

      '<circle cx="108" cy="49" r="10" fill="' + tCanopy + '"/>' +
    '</g>';
  }

  // Stages 3 & 4: Species Specific Renderers
  var fn = SPECIES_RENDERERS[type];
  if (fn) {
    return fn(stageIdx, isDead);
  }

  // Dynamic Vector Renderer Fallback for New Regional Biomes (Nordic, Brazil, Spain)
  var def = TREE_TYPES[type];
  if (def) {
    if (isDead) {
      return drawDeadTreeShape(def);
    }
    var trunkH = def.shape === 'bush' ? 18 : 38;
    var canopyR = def.shape === 'bush' ? 24 : 32;
    var cy = 84 - trunkH - canopyR * 0.5;
    var trunkCol = def.trunk || '#6E5B45';
    var trunkSvg = def.shape === 'bush' ? '' :
      '<rect x="95" y="' + (84 - trunkH) + '" width="10" height="' + trunkH + '" rx="3" fill="' + trunkCol + '"/>';
    var canopySvg = drawCanopy(def, 100, cy, canopyR);

    if (def.dotColor && stageIdx >= 3) {
      decoSvg = '<circle cx="92" cy="' + (cy - 4) + '" r="3" fill="' + def.dotColor + '"/>' +
                '<circle cx="108" cy="' + (cy + 2) + '" r="3" fill="' + def.dotColor + '"/>' +
                '<circle cx="100" cy="' + (cy + 8) + '" r="3" fill="' + def.dotColor + '"/>';
    }
    return '<g class="' + swayClass + '" ' + swayOrigin + '>' + trunkSvg + canopySvg + decoSvg + '</g>';
  }

  // Fallback
  return '<circle cx="100" cy="50" r="30" fill="#4CAF50"/>';
}

function drawCanopy(def, cx, cy, canopyR){
  var shape = def.shape, color = def.canopy;
  if (shape==='conifer'){
    return '<g fill="'+color+'">'+
      '<polygon points="'+cx+','+(cy-canopyR*1.5)+' '+(cx-canopyR*0.8)+','+(cy-canopyR*0.5)+' '+(cx+canopyR*0.8)+','+(cy-canopyR*0.5)+'"/>'+
      '<polygon points="'+cx+','+(cy-canopyR*1.0)+' '+(cx-canopyR*0.95)+','+(cy+canopyR*0.15)+' '+(cx+canopyR*0.95)+','+(cy+canopyR*0.15)+'"/>'+
      '<polygon points="'+cx+','+(cy-canopyR*0.5)+' '+(cx-canopyR*1.05)+','+cy+' '+(cx+canopyR*1.05)+','+cy+'"/>'+
    '</g>';
  }
  if (shape==='umbrella'){
    return '<g fill="'+color+'">'+
      '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(canopyR*1.35)+'" ry="'+(canopyR*0.42)+'"/>'+
      '<ellipse cx="'+cx+'" cy="'+(cy-canopyR*0.28)+'" rx="'+(canopyR*1.1)+'" ry="'+(canopyR*0.32)+'"/>'+

    return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(canopyR*0.72)+'" ry="'+(canopyR*1.2)+'" fill="'+color+'"/>';
  }
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+canopyR+'" fill="'+color+'"/>';
}

function drawDeadTreeShape(def){
  // Check if def has a key in SPECIES_RENDERERS
  var matchedKey = null;
  if (typeof TREE_TYPES !== 'undefined') {
    for (var k in TREE_TYPES) {
      if (TREE_TYPES[k] === def || TREE_TYPES[k].label === def.label) {
        matchedKey = k;
        break;
      }
    }
  }
  if (matchedKey && SPECIES_RENDERERS[matchedKey]) {
    return SPECIES_RENDERERS[matchedKey](4, true);
  }
  if (def.shape==='bush'){
    return '<ellipse cx="86" cy="86" rx="16" ry="12" fill="#A69B7A"/><ellipse cx="114" cy="86" rx="16" ry="12" fill="#A69B7A"/><ellipse cx="100" cy="78" rx="18" ry="13" fill="#A69B7A"/>';

      '<rect x="-50" y="4" width="' + (100 * tPct / 100) + '" height="4" rx="2" fill="' + strokeClr + '"/>' +
      '<text x="0" y="-1" font-size="8" text-anchor="middle" font-weight="800" fill="' + textClr + '">' + (w && w.inTransit ? '🥾 Worker En Route…' : tLabel + ' ' + tPct + '%') + '</text>' +
    '</g>';
    // Single visual: only draw worker on-site once they have finished walking to plot!
    if (w && !w.inTransit){
      content += personSvg(w.type, true, 148, 52, false, toolUsed);
    }
  } else if (p.status==='dead'){
    var deadDefStatic = TREE_TYPES[p.treeType];
    content = drawDeadTreeShape(deadDefStatic) + '<text x="150" y="40" font-size="18">💀</text>';
  } else if (p.status==='removing'){
    var remTreeDef = TREE_TYPES[p.treeType]; var remCfg2 = REMOVE_CONFIG[remTreeDef.category];
    var rDur = remCfg2.hours;
    var rPct = Math.min(100, Math.round((p.taskHours / rDur) * 100));
    content = drawDeadTreeShape(remTreeDef);
    content += '<g transform="translate(100, 42)">' +
      '<rect x="-54" y="-12" width="108" height="24" rx="6" fill="rgba(38,50,56,0.94)" stroke="#E57373" stroke-width="1.3"/>' +
      '<rect x="-48" y="4" width="96" height="4" rx="2" fill="#263238"/>' +
      '<rect x="-48" y="4" width="' + (96 * rPct / 100) + '" height="4" rx="2" fill="#E57373"/>' +
      '<text x="0" y="-1" font-size="8.5" text-anchor="middle" font-weight="800" fill="#FFCDD2">' + (w && w.inTransit ? '🥾 En Route ' + rPct + '%' : '🪓 Felling Tree ' + rPct + '%') + '</text>' +
    '</g>';
    // Single visual: only draw woodcutter on-site once they have arrived at the tree!
    if (w && !w.inTransit){
      content += personSvg(w.type, true, 60, 52, false, remCfg2.tool || 'axe');
      content += '<g class="dust" style="transform-origin:75px 82px;"><rect x="75" y="82" width="4" height="4" fill="#8D6E63"/></g>'+
                 '<g class="dust" style="transform-origin:85px 78px; animation-delay:0.35s;"><rect x="85" y="78" width="3.5" height="3.5" fill="#D7CCC8"/></g>';
    }
  } else if (p.status==='growing'){
    var def = TREE_TYPES[p.treeType]; var idx = stageInfo.idx;
    var dead = p.health<=0;
    content = drawSpeciesFlora(p, stageInfo, dead);

    if (def.o2AtStage[idx]>0 && !dead){
      content += '<g class="rise"><circle cx="72" cy="40" r="3.5" fill="#F0AC3D" opacity="0.8"/></g>'+
                 '<g class="rise2"><circle cx="128" cy="46" r="2.8" fill="#F0AC3D" opacity="0.7"/></g>';
    }
    // Ripe Harvest Produce Basket indicator when crops/fruits are ready
    if (p.pendingHarvest > 0.5 && !p.harvesting && !dead) {
      content += '<g transform="translate(142, 68)" class="critter-bounce" style="cursor:pointer;" onclick="harvestCrop(' + p.id + ')">' +
        '<ellipse cx="0" cy="0" rx="14" ry="10" fill="#8D6E63" stroke="#5D4037" stroke-width="1.2"/>' +
        '<ellipse cx="0" cy="-3" rx="12" ry="7" fill="#BCAAA4"/>' +
        '<text x="0" y="0" font-size="13" text-anchor="middle">' + (def ? def.icon : '🧺') + '</text>' +
        '<circle cx="10" cy="-8" r="4.5" fill="#F0AC3D"/>' +
        '<text x="10" y="-6" font-size="7" font-weight="900" text-anchor="middle" fill="#2E7D32">✓</text>' +
      '</g>';
    }
    if (dead && idx>1){ content += '<text x="150" y="35" font-size="16">💤</text>'; }

    if (p.harvesting){
      var hpct = Math.min(100, Math.round((Date.now()-p.harvestStartReal)/4000*100));
      content += personSvg('farmer', true, 155, 60, true).replace('class="bob"','class="bob-fast"');
      content += '<g transform="translate(100,4)">'+
        '<circle r="14" fill="none" stroke="#00000022" stroke-width="5"/>'+
        '<circle r="14" fill="none" stroke="'+ 'var(--blue,#5A8FBF)' +'" stroke-width="5" stroke-dasharray="'+(2*Math.PI*14)+'" stroke-dashoffset="'+((2*Math.PI*14)-(2*Math.PI*14*hpct/100))+'" stroke-linecap="round" transform="rotate(-90)"/>'+
        '<text x="0" y="4" font-size="8" text-anchor="middle" fill="#2C4A32" font-weight="700">🧺'+hpct+'%</text></g>';
    } else if (w && !w.inTransit){
      content += personSvg(w.type, true, 158, 60);
    }

    if (careActive){
      if (p.careAnimType==='water'){
        content += '<g transform="translate(56,48)">'+personSvg(w ? w.type : 'farmer', true, 0, 0, false, 'water')+'</g>';
        content += '<g class="drop" style="transform-origin:78px 62px;"><circle cx="78" cy="62" r="2.6" fill="#42A5F5"/></g>'+
                   '<g class="drop" style="animation-delay:0.3s; transform-origin:84px 66px;"><circle cx="84" cy="66" r="2.4" fill="#29B6F6"/></g>';
        content += '<g transform="translate(100, 42)">' +
          '<rect x="-50" y="-12" width="100" height="22" rx="6" fill="rgba(38,50,56,0.92)" stroke="#64B5F6" stroke-width="1.2"/>' +
          '<text x="0" y="3" font-size="8.5" text-anchor="middle" font-weight="800" fill="#BBDEFB">💧 Irrigating Tree</text>' +
        '</g>';
      } else if (p.careAnimType==='prune'){
        content += '<g transform="translate(56,48)">'+personSvg(w ? w.type : 'farmer', true, 0, 0, false, 'pruner')+'</g>';
        content += '<g class="snip" style="transform-origin:82px 58px;"><path d="M78,54 L88,62 M88,54 L78,62" stroke="#B0BEC5" stroke-width="2.4" stroke-linecap="round"/></g>' +
                   '<g class="drop" style="animation-delay:0.25s; transform-origin:80px 70px;"><circle cx="80" cy="70" r="2.2" fill="#81C784"/></g>';
        content += '<g transform="translate(100, 42)">' +
          '<rect x="-50" y="-12" width="100" height="22" rx="6" fill="rgba(38,50,56,0.92)" stroke="#81C784" stroke-width="1.2"/>' +
          '<text x="0" y="3" font-size="8.5" text-anchor="middle" font-weight="800" fill="#C8E6C9">✂️ Pruning &amp; Shaping</text>' +
        '</g>';
      }
    }
  }

  if (p.accessories && p.accessories.irrigation) content += '<text x="22" y="145" font-size="15">💧</text>';
  if (p.accessories && p.accessories.fertilizer) content += '<text x="44" y="145" font-size="15">🌾</text>';

  if (p.harvesting){
    var hTotal = typeof hasTractor === 'function' && hasTractor() ? 3500 : 10000;
    var hPct = Math.min(100, Math.round(((Date.now() - p.harvestStartReal) / hTotal) * 100));
    var hLabel = typeof hasTractor === 'function' && hasTractor() ? '🚜 Tractor' : '🧺 Picking';
    content += '<g transform="translate(100, 44)">' +
      '<rect x="-52" y="-12" width="104" height="24" rx="6" fill="rgba(46,125,50,0.92)" stroke="#81C784" stroke-width="1.2"/>' +
      '<rect x="-46" y="4" width="92" height="4" rx="2" fill="#1B5E20"/>' +
      '<rect x="-46" y="4" width="' + (92 * hPct / 100) + '" height="4" rx="2" fill="#A5D6A7"/>' +
      '<text x="0" y="-1" font-size="8.5" text-anchor="middle" font-weight="800" fill="#FFFFFF">' + hLabel + ' ' + hPct + '%</text>' +
    '</g>';
  }
  if (p.animal){
    // Subtle ground footprint alert marker while free-roaming animal explores the farm
    content += '<g class="pulse" transform="translate(36,24)"><circle r="9" fill="#E8785A"/><text x="0" y="4" font-size="11" text-anchor="middle" fill="white" font-weight="800">!</text></g>';
  }

  var progressPct=0;
  if (p.status==='preparing' || p.status==='clearing'){ var dur = p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS; progressPct = Math.min(100, Math.round((p.taskHours/dur)*100)); }
  else if (p.status==='removing'){ var remDur = REMOVE_CONFIG[TREE_TYPES[p.treeType].category].hours; progressPct = Math.min(100, Math.round((p.taskHours/remDur)*100)); }
  else if (p.status==='growing' && !p.harvesting && !stageInfo.isFinal) progressPct = stageInfo.pct;

  var ring='';
  if (progressPct>0 && progressPct<100){
    ring = '<g transform="translate(100,4)">'+
      '<circle r="14" fill="none" stroke="#00000022" stroke-width="5"/>'+
      '<circle r="14" fill="none" stroke="#F0AC3D" stroke-width="5" stroke-dasharray="'+(2*Math.PI*14)+'" stroke-dashoffset="'+((2*Math.PI*14)-(2*Math.PI*14*progressPct/100))+'" stroke-linecap="round" transform="rotate(-90)"/>'+
      '<text x="0" y="4" font-size="9" text-anchor="middle" fill="#2C4A32" font-weight="700">'+progressPct+'%</text></g>';
  }
  // ================= ESTATE PERIMETER BOUNDARY & DYNAMIC ENTRANCE GATE =================
  var hasBoundary = p.accessories && p.accessories.boundary;
  var isNorthPlot = p.id < 3; // Plot 0, 1, 2 have entrance gate on South edge (y: 140)
  var isGateOpen = (p.assignedWorker !== null) || p.harvesting || (p.careAnimUntil && Date.now() < p.careAnimUntil) ||
                   (p.status === 'preparing' || p.status === 'clearing' || p.status === 'removing') || (p._vehicleActive);

  var boundarySvg = '';
  if (hasBoundary){
    // Post-and-Rail Timber Fence with Corner Stone Pillars
    boundarySvg += '<g class="plot-estate-boundary">' +
      // Left & Right boundary timber rails
      '<line x1="8" y1="10" x2="8" y2="140" stroke="#5D4037" stroke-width="2.5"/>' +
      '<line x1="8" y1="18" x2="8" y2="132" stroke="#8D6E63" stroke-width="1.5"/>' +
      '<line x1="192" y1="10" x2="192" y2="140" stroke="#5D4037" stroke-width="2.5"/>' +
      '<line x1="192" y1="18" x2="192" y2="132" stroke="#8D6E63" stroke-width="1.5"/>' +
      // Corner posts
      '<rect x="5" y="6" width="6" height="8" rx="1.5" fill="#6D4C41" stroke="#3E2723" stroke-width="1"/>' +
      '<rect x="189" y="6" width="6" height="8" rx="1.5" fill="#6D4C41" stroke="#3E2723" stroke-width="1"/>' +
      '<rect x="5" y="136" width="6" height="8" rx="1.5" fill="#6D4C41" stroke="#3E2723" stroke-width="1"/>' +
      '<rect x="189" y="136" width="6" height="8" rx="1.5" fill="#6D4C41" stroke="#3E2723" stroke-width="1"/>';

    if (isNorthPlot){
      // Full Top Fence
      boundarySvg += '<line x1="8" y1="10" x2="192" y2="10" stroke="#5D4037" stroke-width="2.5"/>' +
                     '<line x1="12" y1="14" x2="188" y2="14" stroke="#8D6E63" stroke-width="1.5"/>' +
                     '<rect x="70" y="7" width="5" height="6" rx="1" fill="#6D4C41"/>' +
                     '<rect x="125" y="7" width="5" height="6" rx="1" fill="#6D4C41"/>' +
                     // South Fence with Entrance Gate Opening (x: 78 to 122)
                     '<line x1="8" y1="140" x2="78" y2="140" stroke="#5D4037" stroke-width="2.5"/>' +
                     '<line x1="122" y1="140" x2="192" y2="140" stroke="#5D4037" stroke-width="2.5"/>' +
                     // Stone Gateposts with glowing golden lanterns
                     '<rect x="74" y="132" width="7" height="15" rx="2" fill="#B0BEC5" stroke="#455A64" stroke-width="1.2"/>' +
                     '<circle cx="77.5" cy="130" r="3" fill="#FFE082" stroke="#FFB300" stroke-width="0.8"/>' +
                     '<rect x="119" y="132" width="7" height="15" rx="2" fill="#B0BEC5" stroke="#455A64" stroke-width="1.2"/>' +
                     '<circle cx="122.5" cy="130" r="3" fill="#FFE082" stroke="#FFB300" stroke-width="0.8"/>' +
                     // Threshold stone walkway
                     '<rect x="80" y="136" width="40" height="9" rx="2" fill="#CFD8DC" opacity="0.8"/>' +
                     // Dynamic Swing Gate Leaves (hinged at x:79 and x:121)
                     (isGateOpen ?
                       '<g transform="translate(80, 140) rotate(-70)"><rect x="0" y="-3" width="18" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="4" y1="-3" x2="4" y2="3" stroke="#D7CCC8"/><line x1="12" y1="-3" x2="12" y2="3" stroke="#D7CCC8"/></g>' +
                       '<g transform="translate(120, 140) rotate(70)"><rect x="-18" y="-3" width="18" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="-4" y1="-3" x2="-4" y2="3" stroke="#D7CCC8"/><line x1="-12" y1="-3" x2="-12" y2="3" stroke="#D7CCC8"/></g>' :
                       '<g transform="translate(80, 140)"><rect x="0" y="-3" width="20" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="5" y1="-3" x2="5" y2="3" stroke="#D7CCC8"/><line x1="14" y1="-3" x2="14" y2="3" stroke="#D7CCC8"/></g>' +
                       '<g transform="translate(120, 140)"><rect x="-20" y="-3" width="20" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="-5" y1="-3" x2="-5" y2="3" stroke="#D7CCC8"/><line x1="-14" y1="-3" x2="-14" y2="3" stroke="#D7CCC8"/><circle cx="-20" cy="0" r="2" fill="#FFD54F"/></g>');
    } else {
      // Full Bottom Fence
      boundarySvg += '<line x1="8" y1="140" x2="192" y2="140" stroke="#5D4037" stroke-width="2.5"/>' +
                     '<line x1="12" y1="136" x2="188" y2="136" stroke="#8D6E63" stroke-width="1.5"/>' +
                     '<rect x="70" y="137" width="5" height="6" rx="1" fill="#6D4C41"/>' +
                     '<rect x="125" y="137" width="5" height="6" rx="1" fill="#6D4C41"/>' +
                     // North Fence with Entrance Gate Opening (x: 78 to 122)
                     '<line x1="8" y1="10" x2="78" y2="10" stroke="#5D4037" stroke-width="2.5"/>' +
                     '<line x1="122" y1="10" x2="192" y2="10" stroke="#5D4037" stroke-width="2.5"/>' +
                     // Stone Gateposts with lanterns
                     '<rect x="74" y="3" width="7" height="15" rx="2" fill="#B0BEC5" stroke="#455A64" stroke-width="1.2"/>' +
                     '<circle cx="77.5" cy="2" r="3" fill="#FFE082" stroke="#FFB300" stroke-width="0.8"/>' +
                     '<rect x="119" y="3" width="7" height="15" rx="2" fill="#B0BEC5" stroke="#455A64" stroke-width="1.2"/>' +
                     '<circle cx="122.5" cy="2" r="3" fill="#FFE082" stroke="#FFB300" stroke-width="0.8"/>' +
                     // Threshold stone walkway
                     '<rect x="80" y="6" width="40" height="9" rx="2" fill="#CFD8DC" opacity="0.8"/>' +
                     // Dynamic Swing Gate Leaves
                     (isGateOpen ?
                       '<g transform="translate(80, 10) rotate(-70)"><rect x="0" y="-3" width="18" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="4" y1="-3" x2="4" y2="3" stroke="#D7CCC8"/><line x1="12" y1="-3" x2="12" y2="3" stroke="#D7CCC8"/></g>' +
                       '<g transform="translate(120, 10) rotate(70)"><rect x="-18" y="-3" width="18" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="-4" y1="-3" x2="-4" y2="3" stroke="#D7CCC8"/><line x1="-12" y1="-3" x2="-12" y2="3" stroke="#D7CCC8"/></g>' :
                       '<g transform="translate(80, 10)"><rect x="0" y="-3" width="20" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="5" y1="-3" x2="5" y2="3" stroke="#D7CCC8"/><line x1="14" y1="-3" x2="14" y2="3" stroke="#D7CCC8"/></g>' +
                       '<g transform="translate(120, 10)"><rect x="-20" y="-3" width="20" height="6" rx="1.5" fill="#8D6E63" stroke="#4E342E" stroke-width="0.8"/><line x1="-5" y1="-3" x2="-5" y2="3" stroke="#D7CCC8"/><line x1="-14" y1="-3" x2="-14" y2="3" stroke="#D7CCC8"/><circle cx="-20" cy="0" r="2" fill="#FFD54F"/></g>');
    }
    boundarySvg += '</g>';
  } else {
    // Surveyor Stakes & Dashed Plot Perimeter inviting player to build boundary
    boundarySvg += '<g class="plot-unfenced-survey" opacity="0.45">' +
      '<circle cx="8" cy="10" r="2.5" fill="#8D6E63"/>' +
      '<circle cx="192" cy="10" r="2.5" fill="#8D6E63"/>' +
      '<circle cx="8" cy="140" r="2.5" fill="#8D6E63"/>' +
      '<circle cx="192" cy="140" r="2.5" fill="#8D6E63"/>' +
      '<rect x="8" y="10" width="184" height="130" fill="none" stroke="#8D6E63" stroke-width="1" stroke-dasharray="6,4"/>' +
    '</g>';
  }

  return '<svg viewBox="0 0 200 150">'+bed+content+ring+boundarySvg+'</svg>';
}

function plotSpotHtml(p, layout){
  var stageInfo = plotStageInfo(p);
  var def = p.treeType ? TREE_TYPES[p.treeType] : null;
  var labelText = p.status==='barren' ? 'Plot '+(p.id+1) :
    p.status==='overgrown' ? '⚠️ Overgrown' :
    p.status==='preparing' ? 'Preparing…' :
    p.status==='clearing' ? 'Clearing…' :
    p.status==='dead' ? '💀 Dead #'+p.treeId :
    p.status==='removing' ? 'Removing…' :
    p.status==='ready' ? 'Tap to plant' :
    (p.health<=0 ? '💤 Stalled #'+p.treeId : stageInfo.name+' #'+p.treeId);
  var healthBar='';
  if (p.status==='growing'){
    var hColor = p.health>=70 ? '#6FA85A' : (p.health>=40 ? '#F0AC3D' : '#E8785A');
    healthBar = '<div class="health-mini"><div class="fill" style="width:'+p.health+'%;background:'+hColor+';"></div></div>';
  }
  var tagPosClass = (layout && layout.top >= 48) ? 'tag-pos-south' : 'tag-pos-north';
  return '<div class="plot-spot '+tagPosClass+'" style="top:'+layout.top+'%;left:'+layout.left+'%;width:'+layout.w+'%;height:'+layout.h+'%;" data-plot="'+p.id+'">'+
    '<div class="plot-label">'+(def?def.icon+' ':'')+labelText+'</div>'+ plotSvg(p) + healthBar +
    '<div class="plot-sub">'+ (p.assignedWorker!==null?'👷':'') + ((p.accessories&&(p.accessories.irrigation||p.accessories.fertilizer))?'🧰':'') + (p.pendingHarvest>0.5?'🧺':'') +'</div>'+
  '</div>';
}
function storageSpotHtml(){
  var s = state.storage;
  var isBuilt = s && s.built;
  var isBuilding = s && s.building;

  // STRICT UNBUILT STATE: If unbuilt and not building, render pointer plaque like garden or coffee shop
  if (!isBuilt && !isBuilding){
    return '<div class="plot-spot village-building-card tag-pos-north" style="top:'+STORAGE_SPOT.top+'%;left:'+STORAGE_SPOT.left+'%;width:'+STORAGE_SPOT.w+'%;height:'+STORAGE_SPOT.h+'%;" data-storage="1">'+
      '<div class="plot-label">🏚️ Storage Barn</div>'+
      drawUnbuiltSpotMarker('storage', { icon:'🏚️', cost:STORAGE_COST, label:'Storage' }, false) +
    '</div>';
  }

  var label = s.building ? 'Storage ('+Math.round(Math.min(100,(s.buildHours/STORAGE_BUILD_HOURS)*100))+'%)' :
    (s.expanding ? 'Expanding ('+Math.round(Math.min(100,(s.expandHours/STORAGE_EXPAND_HOURS)*100))+'%)' :
    (s.built ? '€'+Math.round(s.stored)+' / €'+s.capacity : 'Storage Barn'));
  var fillPct = s.built ? Math.min(100, Math.round((s.stored/Math.max(1,s.capacity))*100)) : 0;
  var fillColor = fillPct>=85 ? '#E8785A' : (fillPct>=60 ? '#F0AC3D' : '#6FA85A');
  return '<div class="plot-spot village-building-card tag-pos-north '+(s.built?'is-built':'')+(s.building?'is-building':'')+'" style="top:'+STORAGE_SPOT.top+'%;left:'+STORAGE_SPOT.left+'%;width:'+STORAGE_SPOT.w+'%;height:'+STORAGE_SPOT.h+'%;" data-storage="1">'+
    '<div class="plot-label">🏚️ '+label+'</div>'+
    drawStorageScene(s) +
    (s.built ? '<div class="health-mini"><div class="fill" style="width:'+fillPct+'%;background:'+fillColor+';"></div></div>' : '')+
  '</div>';
}
// Buildings not yet built render as a faint "blueprint" so their village-row slot is
// visible and inviting before you've paid for them — an intuitive visual cue for
// what's ownable next, rather than empty unexplained ground.
function drawTendingFigure(x,y,kind){
  var body = kind==='garden'
    ? '<rect x="'+(x-3)+'" y="'+(y-7)+'" width="6" height="8" rx="2" fill="#8B5A3C"/>'+
      '<circle cx="'+x+'" cy="'+(y-9)+'" r="2.6" fill="#F2C79B"/>'+
      '<rect x="'+(x-1.6)+'" y="'+(y+1)+'" width="1.4" height="4" fill="#6E4429"/>'
    : (kind==='coffee'
      ? '<rect x="'+(x-3)+'" y="'+(y-7)+'" width="6" height="8" rx="2" fill="#6E4429"/>'+
        '<circle cx="'+x+'" cy="'+(y-9)+'" r="2.6" fill="#F2C79B"/>'+
        '<text x="'+(x+4)+'" y="'+(y-2)+'" font-size="8">☕</text>'
      : (kind==='juice'
        ? '<rect x="'+(x-3)+'" y="'+(y-7)+'" width="6" height="8" rx="2" fill="#2E7D32"/>'+
          '<circle cx="'+x+'" cy="'+(y-9)+'" r="2.6" fill="#F2C79B"/>'+
          '<text x="'+(x+4)+'" y="'+(y-2)+'" font-size="8">🧃</text>'
        : '<rect x="'+(x-3)+'" y="'+(y-10)+'" width="6" height="11" rx="2" fill="#4F8A45"/>'+
          '<circle cx="'+x+'" cy="'+(y-12)+'" r="2.6" fill="#F2C79B"/>'
      )
    );
  return '<g class="bob-fast"><ellipse cx="'+x+'" cy="'+(y+4)+'" rx="6" ry="2.4" fill="rgba(0,0,0,0.15)"/>'+body+'</g>';

function buildingSpotHtml(key){
  var b = state.buildings[key]; var def = BUILDING_TYPES[key]; var layout = VILLAGE_LAYOUT[key];
  var locked = def.requiresRoad && !state.buildings.road.built && !b.built && !b.building;
  var needsChoice = b.built && ((key==='garden' && !b.flowerType) || (key==='pond' && !b.specialization));
  var label = b.building ? def.label+' ('+Math.round(Math.min(100,(b.buildHours/def.buildHours)*100))+'%)' :
    (locked ? def.label+' 🔒' :
    (needsChoice ? def.label+' — Choose!' :
    (key==='garden' && b.built ? (FLOWER_TYPES[b.flowerType] ? FLOWER_TYPES[b.flowerType].label : (b.flowerType ? b.flowerType.charAt(0).toUpperCase()+b.flowerType.slice(1) : def.label)) :
    (key==='pond' && b.built ? (POND_SPECIALIZATIONS[b.specialization] ? POND_SPECIALIZATIONS[b.specialization].label : def.label) : def.label))));
  var tending = b.careAnimUntil && Date.now() < b.careAnimUntil;

  var inner;
  if (key === 'road'){
    inner = drawRoadScene(b);
  } else if (key === 'crew_shed'){
    inner = drawCrewShedScene(b);
  } else if (key === 'garage'){
    inner = drawGarageScene(b);
  } else if (key === 'coffee_shop'){
    inner = drawCoffeeShopScene(b, tending);
  } else if (key === 'juice_bar'){
    inner = drawJuiceBarScene(b, tending);
  } else if (key === 'pond'){
    inner = drawPondScene(b.specialization, b.freshness, tending, b.collecting, b.building);
  } else if (key === 'garden'){
    inner = drawGardenScene(b.flowerType, b.freshness, tending, b.building);
  }

  // Dynamic Identity Tag Positioning:
  // North-curb cards (top < 45) keep tags at top; South-curb cards (top >= 48) place tags cleanly at bottom!
  var tagPosClass = (layout && layout.top >= 48) ? 'tag-pos-south' : 'tag-pos-north';

  var freshBar = (b.built && ((key==='garden'&&b.flowerType)||(key==='pond'&&b.specialization))) ?
    '<div class="health-mini"><div class="fill" style="width:'+b.freshness+'%;background:'+(b.freshness>=60?'#6FA85A':(b.freshness>=35?'#F0AC3D':'#E8785A'))+';"></div></div>' : '';
  var sub = (key==='pond' && b.built && b.specialization) ?
    '<div class="plot-sub">'+(b.assignedWorker?'👷':'')+((b.pendingCollect||0)>0.5?'🧺':'')+'</div>' :
    (key==='crew_shed' && b.built ? '<div class="plot-sub">'+state.workers.length+' 👷</div>' : '');

  return '<div class="plot-spot village-building-card '+tagPosClass+' '+(locked?'is-locked':'')+(b.built?'is-built':'')+(b.building?'is-building':'')+'" style="top:'+layout.top+'%;left:'+layout.left+'%;width:'+layout.w+'%;height:'+layout.h+'%;" data-building="'+key+'">'+
    '<div class="plot-label">'+(def?def.icon+' ':'')+label+'</div>'+
    inner + freshBar + sub +
  '</div>';
}

function getPendingTasksList(){
  var tasks = [];
  if (state.buildings && state.buildings.road && !state.buildings.road.built && !state.buildings.road.building){
    tasks.push({ type: 'building', targetId: 'road', label: '⛩️ Pave Main Road (€' + BUILDING_TYPES.road.cost + ')', cost: BUILDING_TYPES.road.cost });
  }
  if (!state) return tasks;
  if (!state.rocksCleared && !state.rocksClearing){
    tasks.push({ type: 'rocks', targetId: null, label: '🪨 Clear Boulders (€50)', cost: 50 });
  }
  if ((state.lawnOvergrowth || 0) >= 30 && !state.lawnMowing){
    tasks.push({ type: 'lawn', targetId: null, label: '🌿 Mow Lawn (€15)', cost: 15 });
  }
  state.plots.forEach(function(p, idx){
    if (p.status === 'barren'){
      tasks.push({ type: 'dig', targetId: idx, label: '⛏️ Plot ' + (idx+1) + ' — Dig (€' + LABOR_COST + ')', cost: LABOR_COST });
    } else if (p.status === 'overgrown'){
      tasks.push({ type: 'clear', targetId: idx, label: '🌾 Plot ' + (idx+1) + ' — Clear Brush (€' + CLEAR_COST + ')', cost: CLEAR_COST });
    } else if (p.status === 'dead'){
      var def = TREE_TYPES[p.treeType]; var cfg = REMOVE_CONFIG[def.category];
      tasks.push({ type: 'removeTree', targetId: idx, label: '🪓 Plot ' + (idx+1) + ' — Cut ' + def.label + ' (€' + cfg.cost + ')', cost: cfg.cost });
    } else if (p.status === 'growing'){
      if (p.pendingHarvest >= 0.5 && !p.harvesting){
        tasks.push({ type: 'harvest', targetId: idx, label: '🧺 Plot ' + (idx+1) + ' — Harvest (€' + p.pendingHarvest.toFixed(2) + ')', cost: 0 });
      } else if (p.health < 60){
        tasks.push({ type: 'water', targetId: idx, label: '💧 Plot ' + (idx+1) + ' — Water', cost: 0 });
      } else if (p.assignedWorker === null){
        tasks.push({ type: 'plot', targetId: idx, label: '🌱 Plot ' + (idx+1) + ' — Tend Plant', cost: 0 });
      }
    }
  });
  if (state.storage && state.storage.built && !state.storage.assignedLaborerId){
    tasks.push({ type: 'storage', targetId: null, label: '📦 Storage Depot Loading', cost: 0 });
  }
  if (state.buildings && state.buildings.pond && state.buildings.pond.built && !state.buildings.pond.assignedWorker){
    tasks.push({ type: 'building', targetId: 'pond', label: '🏞️ Pond Aquaculture', cost: 0 });
  }
  return tasks;
}

function modalHtml(){
  if (activeModal){
    if (activeModal.type==='reset_farm') return resetFarmModalHtml();
    if (activeModal.type==='storage') return storageModalHtml();
    if (activeModal.type==='bank') return bankModalHtml();
    if (activeModal.type==='building') return buildingModalHtml(activeModal.plotId);
    if (activeModal.type==='auth') return authModalHtml();
    if (activeModal.type==='quiz') return quizModalHtml();
    if (activeModal.type==='library_detail') return libraryDetailModalHtml(activeModal.plotId);
    if (activeModal.type==='region_preview' || activeModal.type==='region-preview') return regionPreviewModalHtml(activeModal.plotId);
  }
  if (offlineSummary && currentScreen === 'farm'){
    return offlineModalHtml();
  }
  if (!activeModal) return '';
  var p = state.plots[activeModal.plotId];
  var def = p.treeType ? TREE_TYPES[p.treeType] : null;
  var stageInfo = plotStageInfo(p);
  var w = workerOnPlot(p.id);

  var html = '<div class="overlay" id="modalOverlay" onclick="if(event.target===this)closeModal(event)" ontouchend="if(event.target===this)closeModal(event)"><div class="modal">'+
    '<h2><span>' + (def ? def.icon + ' ' : '') + 'Plot ' + (p.id + 1) + (def ? ' — ' + def.label + ' <span style="font-size:0.7rem;color:var(--pine-soft);">#' + p.treeId + '</span>' : '') + '</span>' +
    '<button class="close-modal" data-closemodal="1" onclick="closeModal(event)" ontouchend="closeModal(event)" title="Close Plot Window">✕</button></h2>'+
    '<div class="modal-body-scroll">';

  if (p.animal){
    var an = ANIMALS.find(function(x){return x.key===p.animal.key;});
    html += '<div class="animal-alert"><span class="em">'+an.emoji+'</span> <b>'+an.name+' spotted!</b><br>'+an.fact+
      '<button class="primary" data-scare="'+p.id+'">Scare Away (€'+SCARE_COST+')</button></div>';
  }

  if (p.status==='barren'){
    var weedPct = Math.round(Math.min(100,p.weedHours/OVERGROWN_THRESHOLD*100));
    html += '<div class="plot-action-card">'+
      '<div class="plot-action-badge">🌱 Empty Plot Ready for Cultivation</div>'+
      '<div class="sub" style="margin-top:6px;margin-bottom:10px;">Dig the soil to prepare the plot for planting trees or vegetables. Weeds slowly accumulate if left idle.</div>'+
      '<div class="row" style="margin-bottom:4px;"><span>Weed accumulation</span><span class="v" style="color:'+(weedPct>=70?'#E8785A':'var(--pine)')+';font-weight:800;">'+weedPct+'%</span></div>'+
      '<div class="healthbar" style="margin-bottom:12px;"><div class="fill" style="width:'+weedPct+'%;background:'+(weedPct>=70?'#E8785A':'#8D6E63')+';"></div></div>'+
      '<button class="primary plot-main-action-btn" data-prep="'+p.id+'" '+(state.money<LABOR_COST?'disabled':'')+'>⛏️ Begin Digging Land (€'+LABOR_COST+' · 3h)</button>'+
    '</div>';
  } else if (p.status==='overgrown'){
    html += '<div class="plot-action-card overgrown">'+
      '<div class="plot-action-badge warn">🌿 Plot Overgrown with Weeds</div>'+
      '<div class="sub" style="margin-top:6px;margin-bottom:10px;">This plot became overgrown from neglect. Clear the dense wild overgrowth before you can prepare and plant here.</div>'+
      '<button class="primary plot-main-action-btn" data-clear="'+p.id+'" '+(state.money<CLEAR_COST?'disabled':'')+'>🌿 Begin Clearing Overgrowth (€'+CLEAR_COST+' · 2h)</button>'+
    '</div>';
  } else if (p.status==='preparing' || p.status==='clearing'){
    var dur = p.status==='preparing'?PREP_DURATION_HOURS:CLEAR_DURATION_HOURS;
    var pct = Math.round(Math.min(100,(p.taskHours/dur)*100));
    html += '<div class="plot-action-card">'+
      '<div class="plot-action-badge progress">'+(p.status==='preparing'?'⛏️ Digging Soil in Progress':'🌿 Clearing Overgrowth')+'</div>'+
      '<div class="sub" style="margin-top:6px;margin-bottom:8px;">'+(p.status==='preparing'?'Soil will be rich, leveled, and ready for planting once digging completes.':'Laborer clearing wild brush.')+'</div>'+
      '<div class="row"><span>Progress</span><span class="v" style="font-weight:800;color:#2E7D32;">'+pct+'%</span></div>'+
      '<div class="healthbar" style="margin-bottom:12px;"><div class="fill" style="width:'+pct+'%;background:#F0AC3D;"></div></div>'+
      (w ? ('<div class="row"><span>Assisted by</span><span class="v">'+WORKER_TYPES[w.type].label+' (#'+w.id+')</span></div>'+
            '<button class="secondary" onclick="unassignWorkerById('+w.id+')" style="margin-top:6px;">↩️ Recall Worker to Shed</button>')
         : (function(){
            var idleCrew = state.workers.filter(function(x){return x.assignedPlot===null && !x.assignedBuilding && (x.type==='laborer' || x.type==='farmer');});
            if (!idleCrew.length) return '<div class="empty-note">Tip: Recruit a Farmer or Laborer from the Crew Shed to assist with digging (+50% speed).</div>';
            return '<div class="section" style="margin-top:8px;"><h4>👷 Assign Field Worker</h4>'+
              idleCrew.map(function(iw){ return '<div class="worker-opt"><div class="worker-opt-info"><b>'+WORKER_TYPES[iw.type].label+' #'+iw.id+'</b><span class="worker-opt-status">(idle)</span></div><button class="worker-opt-btn" data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign Worker</button></div>'; }).join('')+'</div>';
          })())+
    '</div>';
  } else if (p.status==='dead'){
    var remCfg = REMOVE_CONFIG[def.category];
    html += '<div class="plot-action-card dead">'+
      '<div class="plot-action-badge warn">🥀 Dead Tree Needs Removal</div>'+
      '<div class="sub" style="margin-top:6px;margin-bottom:10px;">This '+def.label+' dried out after being neglected at 0% health. It must be cut down and hauled away before replanting.</div>'+
      '<div class="row"><span>Removal cost</span><span class="v">€'+remCfg.cost+'</span></div>'+
      '<div class="row"><span>Time needed</span><span class="v">'+remCfg.hours+'h'+(remCfg.vehicle?' + hauling':'')+'</span></div>'+
      (remCfg.salvagePct>0 ? '<div class="row"><span>Expected salvage</span><span class="v">≈€'+(remCfg.cost*remCfg.salvagePct).toFixed(2)+'</span></div>' : '')+
      '<button class="primary plot-main-action-btn" data-removetree="'+p.id+'" '+(state.money<remCfg.cost?'disabled':'')+'>🪓 Begin Cutting Down Dead Tree (€'+remCfg.cost+')</button>'+
      '<div class="empty-note" style="margin-top:6px;">Assign a Laborer once removal starts to speed it up ('+remCfg.tool+(remCfg.vehicle?' + truck':'')+').</div>'+
    '</div>';
  } else if (p.status==='removing'){
    var remCfg2 = REMOVE_CONFIG[def.category];
    var remPct = Math.round(Math.min(100,(p.taskHours/remCfg2.hours)*100));
    html += '<div class="plot-action-card">'+
      '<div class="plot-action-badge progress">🪓 Cutting Down Tree ('+remPct+'%)</div>'+
      '<div class="sub" style="margin-top:6px;margin-bottom:8px;">Cutting down dead '+def.label+' with a '+remCfg2.tool+(remCfg2.vehicle?', then hauling it away by truck.':'.')+'</div>'+
      '<div class="row"><span>Progress</span><span class="v">'+remPct+'%</span></div>'+
      '<div class="healthbar" style="margin-bottom:10px;"><div class="fill" style="width:'+remPct+'%;background:#E8785A;"></div></div>'+
      (w ? '<div class="row"><span>Assisted by</span><span class="v">'+WORKER_TYPES[w.type].label+'</span></div>'
         : '<div class="empty-note">No worker assigned — this takes '+remCfg2.hours+'h. Assign a Laborer below to speed it up.</div>');
    var idleCrew = state.workers.filter(function(x){return x.assignedPlot===null && !x.assignedBuilding && (x.type==='laborer' || x.type==='farmer');});
    if (!w && idleCrew.length){
      html += idleCrew.map(function(iw){ return '<div class="worker-opt"><div class="worker-opt-info"><b>'+WORKER_TYPES[iw.type].label+' #'+iw.id+'</b><span class="worker-opt-status">(idle)</span></div><button class="worker-opt-btn" data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign Worker</button></div>'; }).join('');
    } else if (w) {
      html += '<button class="secondary" onclick="unassignWorkerById('+w.id+')" style="margin-top:6px;">↩️ Recall Worker to Shed</button>';
    }
    html += '</div>';
  } else if (p.status==='ready'){
    var weedPctReady = Math.round(Math.min(100,p.weedHours/OVERGROWN_THRESHOLD*100));
    html += '<div class="plot-ready-banner">'+
      '<div style="font-weight:800;font-size:0.9rem;color:#1B5E20;display:flex;align-items:center;gap:6px;"><span>🌱</span> Soil Is Ready for Planting!</div>'+
      '<div class="sub" style="margin:4px 0 0;font-size:0.75rem;">Select any species below to begin planting. Weeds creep back if left idle ('+weedPctReady+'%).</div>'+
    '</div>';
    var activeCats = typeof devActiveCategoryOrder === 'function' ? devActiveCategoryOrder() : CATEGORY_ORDER;
    var activeKeys = typeof devActiveSpeciesKeys === 'function' ? devActiveSpeciesKeys() : Object.keys(TREE_TYPES);
    activeCats.forEach(function(cat){
      var matchingInCat = activeKeys.filter(function(k){ return TREE_TYPES[k] && TREE_TYPES[k].category === cat; });
      if (!matchingInCat.length) return;
      html += '<div class="cat-head">'+cat+'</div><div class="grid2">';
      matchingInCat.forEach(function(k){
        var d = TREE_TYPES[k];
        html += '<button class="plant-opt" data-plant="'+p.id+'" data-type="'+k+'" '+(state.money<d.cost?'disabled style="opacity:0.5;"':'')+'>'+
          '<span class="pn">'+d.icon+' '+d.label+'</span>'+
          '<span class="pc">€'+d.cost+'</span>'+
        '</button>';
      });
      html += '</div>';
    });
  } else if (p.status==='growing'){
    var hColor = p.health>=70 ? '#6FA85A' : (p.health>=40 ? '#F0AC3D' : '#E8785A');
    var kpi = plotKpi(p);

    // 1. COMPACT STATUS SUMMARY CARD
    html += '<div class="tree-status-summary-card">'+
      '<div class="tree-status-top">'+
        '<span class="tree-badge stage">' + stageInfo.name + '</span>' +
        '<span class="tree-badge cat">' + def.category + '</span>' +
        '<span class="tree-hp-val" style="color:' + hColor + ';">' + Math.round(p.health) + '% Health</span>' +
      '</div>'+
      '<div class="healthbar" style="margin:6px 0 8px;"><div class="fill" style="width:'+p.health+'%;background:'+hColor+';"></div></div>'+
      '<div class="tree-status-submetrics">'+
        '<span>🍃 <b>'+p.o2Produced.toFixed(1)+'</b> O₂</span>'+
        '<span>⚡ <b>'+kpi+'%</b> KPI</span>'+
        (p.health<=0 ? '<span style="color:#C62828;font-weight:800;">⚠️ Stalled (0% HP)</span>' : '<span style="color:var(--pine-soft);">Productive</span>')+
      '</div>'+
    '</div>';
    if (typeof TREE_LIBRARY !== 'undefined' && TREE_LIBRARY[p.treeType]){
      var libInfo = TREE_LIBRARY[p.treeType];
      html += '<div style="background:#F1F8E9;border:1px solid #C8E6C9;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:0.75rem;line-height:1.4;color:#2E7D32;">' +
        '<b>📖 Botanical Science:</b> ' + libInfo.firstFound + ' ' +
        '<a href="javascript:void(0)" onclick="openModal(\'library_detail\', \'' + p.treeType + '\')" style="color:#1B5E20;font-weight:800;text-decoration:underline;margin-left:4px;">Full Profile ➔</a>' +
      '</div>';
    }

    // 2. IMMEDIATE ACTIONS: HARVEST (TOP PRIORITY - NO SCROLLING NEEDED)
    if (def.lateBonus){
      var isRipe = p.pendingHarvest >= 0.5;
      html += '<div class="tree-harvest-card ' + (isRipe ? 'ripe' : '') + '">' +
        '<div class="harvest-card-row">' +
          '<span>🧺 <b>Harvest Yield</b></span>' +
          '<span class="harvest-amount" style="color:' + (isRipe ? '#2E7D32' : 'var(--pine-soft)') + ';">€' + p.pendingHarvest.toFixed(2) + '</span>' +
        '</div>' +
        (p.harvesting
          ? '<div class="harvest-picking-bar"><div class="fill" style="width:' + Math.min(100, Math.round((Date.now()-p.harvestStartReal)/4000*100)) + '%;"></div><span class="picking-lbl">🚜 Farmer is picking harvest…</span></div>'
          : (isRipe
            ? ('<button class="primary harvest-action-btn" data-harvest="' + p.id + '" ' + ((!w||w.type!=='farmer')?'disabled':'') + '>🧺 Collect Harvest (€' + p.pendingHarvest.toFixed(2) + ')</button>' +
               ((!w||w.type!=='farmer') ? '<div class="small-warn-note">Requires Farmer (assign below)</div>' : '') +
               (!state.storage.built ? '<div class="small-warn-note">⚠️ No Storage Room: 50% spoilage. Build Storage in Tasks.</div>' : ''))
            : '<div class="small-info-note">Crops ripening in progress. Harvest will be collectable once ripe.</div>')) +
      '</div>';
    }

    // 3. IMMEDIATE ACTIONS: CARE & WATERING BUTTONS (SIDE-BY-SIDE / 2-COL)
    html += '<div class="tree-care-actions-card">' +
      '<div class="care-buttons-grid' + (def.category==='Vegetable' ? ' single' : '') + '">' +
        '<button class="secondary care-btn" data-water="'+p.id+'" '+(state.money<CARE_COST.water[def.category]?'disabled':'')+'>' +
          '💧 Water Tree <span class="cost-tag">€'+CARE_COST.water[def.category]+' (+30 HP)</span>' +
        '</button>' +
        (def.category!=='Vegetable'
          ? '<button class="secondary care-btn" data-prune="'+p.id+'" '+(state.money<CARE_COST.prune[def.category]?'disabled':'')+'>' +
              '✂️ Prune Tree <span class="cost-tag">€'+CARE_COST.prune[def.category]+' (+40 HP)</span>' +
            '</button>'
          : '') +
      '</div>' +
    '</div>';

    // 4. ACCESSORIES & IRRIGATION GRID (3-COLUMN RESPONSIVE TILES)
    html += '<div class="section-title">🧰 Tree Upgrades &amp; Irrigation</div>' +
      '<div class="plot-acc-grid">' +
        Object.keys(ACCESSORIES).map(function(k){
          var acc = ACCESSORIES[k]; var owned = p.accessories && p.accessories[k];
          var benefit = k==='irrigation' ? 'Auto-water & -50% cost' : (k==='fertilizer' ? '+25% Oxygen boost' : 'Timber estate fence');
          return '<div class="plot-acc-tile ' + (owned ? 'installed' : '') + '">' +
            '<div class="acc-tile-icon">' + acc.emoji + '</div>' +
            '<div class="acc-tile-name">' + acc.label + '</div>' +
            '<div class="acc-tile-benefit">' + benefit + '</div>' +
            '<div class="acc-tile-action">' +
              (owned
                ? '<span class="acc-tile-installed">✓ Installed</span>'
                : '<button class="claim-btn acc-tile-btn" data-buyacc="'+k+'" data-buyplot="'+p.id+'" '+(state.money<acc.cost?'disabled':'')+'>€'+acc.cost+'</button>') +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';

    // 5. WORKER ASSIGNMENT
    html += '<div class="section-title" style="margin-top:12px;">👷 Field Worker</div>' +
      (w ? ('<div class="worker-opt assigned"><div class="worker-opt-info"><b>✓ '+WORKER_TYPES[w.type].label+' #'+w.id+'</b><span class="worker-opt-status">(assigned here)</span></div><button class="secondary worker-opt-btn" onclick="unassignWorkerById('+w.id+')">↩️ Recall to Shed</button></div>')
         : (function(){
            var idle = state.workers.filter(function(x){return x.assignedPlot===null && !x.assignedBuilding;});
            if (!idle.length) return '<div class="empty-note">No idle personnel available — recruit from the Crew Shed.</div>';
            return idle.map(function(iw){ return '<div class="worker-opt"><div class="worker-opt-info"><b>'+WORKER_TYPES[iw.type].label+' #'+iw.id+'</b><span class="worker-opt-status">(idle)</span></div><button class="worker-opt-btn" data-assign="'+iw.id+'" data-assignplot="'+p.id+'">Assign Worker</button></div>'; }).join('');
          })());

    // 6. SPECIES BOTANICAL INFO
    html += '<div class="tree-fact-box"><span class="fact-icon">💡</span> <span><b>About this species:</b> ' + def.fact + '</span></div>';
  }

  html += '</div>'; // close modal-body-scroll
  html += '<button class="modal-bottom-close" data-closemodal="1" onclick="closeModal(event)" ontouchend="closeModal(event)">✕ Close Plot Window</button>';
  html += '</div></div>';
  return html;
}

function panelHtml(){
